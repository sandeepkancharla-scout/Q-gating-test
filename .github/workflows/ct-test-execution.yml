name: CT TestGuide Jira Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  testguide:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      # ==========================================================
      # JIRA INPUTS
      # ==========================================================

      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}

      # ==========================================================
      # AUTOMATION CONFIGURATION
      # ==========================================================

      CONFIGURATION_FOLDER: 'SUBSYS1'

      # ==========================================================
      # ONE.CX
      # ==========================================================

      ONECX_URL: 'https://testguide-ssp.onecx.vwgroup.com'
      ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

      # ==========================================================
      # REPORTING
      #
      # Template 19:
      # Default Test Summary Report
      # ==========================================================

      ONECX_REPORT_TEMPLATE_ID: '19'
      ONECX_REPORT_TEMPLATE_TYPE: 'TEST_SUMMARY_REPORT'

    steps:

      # ==========================================================
      # 1. VALIDATE JIRA INPUTS
      # ==========================================================

      - name: Validate Jira request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredValues = @{
            JIRA_KEY = $env:JIRA_KEY
            BENCH_ID = $env:BENCH_ID
            BENCH_NAME = $env:BENCH_NAME
            TARGET_ECU = $env:TARGET_ECU
            TEST_CASES = $env:TEST_CASES
            PLAYBOOK_NAME = $env:PLAYBOOK_NAME
            ONECX_PROJECT_ID = $env:ONECX_PROJECT_ID
          }

          foreach ($entry in $requiredValues.GetEnumerator()) {

            if (
              [System.String]::IsNullOrWhiteSpace(
                [System.String]$entry.Value
              )
            ) {
              throw "Missing required value: $($entry.Key)"
            }
          }

          $projectId = 0

          if (
            -not [System.Int32]::TryParse(
              $env:ONECX_PROJECT_ID,
              [ref]$projectId
            )
          ) {
            throw 'ONECX_PROJECT_ID must be an integer.'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JIRA EXECUTION REQUEST'
          Write-Host '========================================'
          Write-Host "Jira       : $env:JIRA_KEY"
          Write-Host "Project ID : $env:ONECX_PROJECT_ID"
          Write-Host "Bench      : $env:BENCH_ID"
          Write-Host "Bench Name : $env:BENCH_NAME"
          Write-Host "ECU        : $env:TARGET_ECU"
          Write-Host "Test Cases : $env:TEST_CASES"
          Write-Host "Playbook   : $env:PLAYBOOK_NAME"
          Write-Host '========================================'


      # ==========================================================
      # 2. RESOLVE ONE.CX RESOURCE
      #
      # SysHIL1 uses the D drive.
      # All other resources use the C drive.
      # ==========================================================

      - name: Resolve TestGuide resource
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requestedBench = $env:BENCH_ID.Trim()
          $benchId = $requestedBench.ToUpperInvariant()

          switch ($benchId) {

            'SYSHIL1' {
              $resourceName = 'syshil1-labtest1'
              $workspaceRoot = 'D:\HIL\Testing\eeint-Test-Automation'
            }

            'SYSHIL2' {
              $resourceName = 'syshil2-labtest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'MICROBENCH' {
              $resourceName = 'microbenchinfo-microbenchhil1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'MICROBENCHINFO' {
              $resourceName = 'microbenchinfo-microbenchhil1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'CHARGING' {
              $resourceName = 'subsyscharging1-labtest6'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'SUBSYSCHARGING1' {
              $resourceName = 'subsyscharging1-labtest6'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'INFO1' {
              $resourceName = 'subsysinfo1-infotest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'SUBSYSINFO1' {
              $resourceName = 'subsysinfo1-infotest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'INFO2' {
              $resourceName = 'subsysinfo2-infotest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'SUBSYSINFO2' {
              $resourceName = 'subsysinfo2-infotest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'THERMAL' {
              $resourceName = 'subsysthermal1-thermaltest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'SUBSYSTHERMAL1' {
              $resourceName = 'subsysthermal1-thermaltest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'SYSHIL1-LABTEST1' {
              $resourceName = 'syshil1-labtest1'
              $workspaceRoot = 'D:\HIL\Testing\eeint-Test-Automation'
            }

            'SYSHIL2-LABTEST2' {
              $resourceName = 'syshil2-labtest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'MICROBENCHINFO-MICROBENCHHIL1' {
              $resourceName = 'microbenchinfo-microbenchhil1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'SUBSYSCHARGING1-LABTEST6' {
              $resourceName = 'subsyscharging1-labtest6'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'SUBSYSINFO1-INFOTEST1' {
              $resourceName = 'subsysinfo1-infotest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'SUBSYSINFO2-INFOTEST2' {
              $resourceName = 'subsysinfo2-infotest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'SUBSYSTHERMAL1-THERMALTEST1' {
              $resourceName = 'subsysthermal1-thermaltest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            default {
              throw "Unsupported bench/resource: $requestedBench"
            }
          }

          if (-not (Test-Path -LiteralPath $workspaceRoot)) {
            throw "Workspace does not exist: $workspaceRoot"
          }

          $location = 'novi_hq/1stfloor/ee_lab_novi'

          $xilIdentifier = (
            "$location/" +
            "$resourceName/TestLabPC1"
          )

          $stepName = "ecu.test $resourceName Start"

          "TESTGUIDE_RESOURCE=$resourceName" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_BENCH=$resourceName" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ROOT=$workspaceRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "ECUTEST_STEP_NAME=$stepName" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "XIL_IDENTIFIER=$xilIdentifier" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'ONE.CX RESOURCE'
          Write-Host '========================================'
          Write-Host "Requested Bench : $requestedBench"
          Write-Host "Resource        : $resourceName"
          Write-Host "Workspace       : $workspaceRoot"
          Write-Host "XIL Identifier  : $xilIdentifier"
          Write-Host "ecu.test Step   : $stepName"
          Write-Host '========================================'


      # ==========================================================
      # 3. RESOLVE BENCH PACKAGE
      # ==========================================================

      - name: Resolve bench package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packageRoot = Join-Path `
            $env:TESTGUIDE_ROOT `
            "Packages\$($env:BENCH_NAME.Trim())"

          if (-not (Test-Path -LiteralPath $packageRoot)) {
            throw "Bench package not found: $packageRoot"
          }

          "PACKAGE_ROOT=$packageRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Package: $packageRoot"


      # ==========================================================
      # 4. RESOLVE TBC AND TCF
      # ==========================================================

      - name: Resolve TBC and TCF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $configName = $env:CONFIGURATION_FOLDER.Trim()

          $configRoot = Join-Path `
            $env:TESTGUIDE_ROOT `
            "Configurations\$configName"

          if (-not (Test-Path -LiteralPath $configRoot)) {
            throw "Configuration folder not found: $configRoot"
          }

          $expectedTbc = Join-Path `
            $configRoot `
            "${configName}_TestBenchConfig.tbc"

          $expectedTcf = Join-Path `
            $configRoot `
            "${configName}_TestConfig.tcf"

          if (Test-Path -LiteralPath $expectedTbc) {

            $selectedTbc = Get-Item -LiteralPath $expectedTbc

          }
          else {

            $tbcFiles = @(
              Get-ChildItem `
                -LiteralPath $configRoot `
                -Filter '*.tbc' `
                -File `
                -Recurse
            )

            if ($tbcFiles.Count -ne 1) {
              throw "Expected exactly 1 TBC. Found $($tbcFiles.Count)."
            }

            $selectedTbc = $tbcFiles[0]
          }

          if (Test-Path -LiteralPath $expectedTcf) {

            $selectedTcf = Get-Item -LiteralPath $expectedTcf

          }
          else {

            $tcfFiles = @(
              Get-ChildItem `
                -LiteralPath $configRoot `
                -Filter '*.tcf' `
                -File `
                -Recurse
            )

            if ($tcfFiles.Count -ne 1) {
              throw "Expected exactly 1 TCF. Found $($tcfFiles.Count)."
            }

            $selectedTcf = $tcfFiles[0]
          }

          $tbcRelative = [System.IO.Path]::GetRelativePath(
            $env:TESTGUIDE_ROOT,
            $selectedTbc.FullName
          )

          $tcfRelative = [System.IO.Path]::GetRelativePath(
            $env:TESTGUIDE_ROOT,
            $selectedTcf.FullName
          )

          "TBC_RELATIVE_PATH=$tbcRelative" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TCF_RELATIVE_PATH=$tcfRelative" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "TBC: $tbcRelative"
          Write-Host "TCF: $tcfRelative"


      # ==========================================================
      # 5. RESOLVE ECU PROJECT
      # ==========================================================

      - name: Resolve target ECU project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $targetEcu = $env:TARGET_ECU.Trim()
          $expectedProject = "${targetEcu}_L2QualityGate.prj"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PROJECT RESOLUTION'
          Write-Host '========================================'
          Write-Host "Target ECU : $targetEcu"
          Write-Host "Expected   : $expectedProject"
          Write-Host "Package    : $env:PACKAGE_ROOT"
          Write-Host '========================================'

          $matches = @(
            Get-ChildItem `
              -LiteralPath $env:PACKAGE_ROOT `
              -Filter $expectedProject `
              -File `
              -Recurse
          )

          if ($matches.Count -eq 0) {

            Write-Host ''
            Write-Host 'Available L2 Quality Gate projects:'

            Get-ChildItem `
              -LiteralPath $env:PACKAGE_ROOT `
              -Filter '*_L2QualityGate.prj' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "  $($_.FullName)"
            }

            throw "Project not found: $expectedProject"
          }

          if ($matches.Count -gt 1) {
            throw "Multiple $expectedProject files found."
          }

          $selectedProject = $matches[0]

          $projectRelative = [System.IO.Path]::GetRelativePath(
            $env:TESTGUIDE_ROOT,
            $selectedProject.FullName
          )

          "PROJECT_RELATIVE_PATH=$projectRelative" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Selected PRJ: $projectRelative"


      # ==========================================================
      # 6. NORMALIZE TEST CASE IDS
      # ==========================================================

      - name: Parse Jira Test Cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ids = @(
            $env:TEST_CASES -split '[,;]' |
            ForEach-Object {
              $_.Trim()
            } |
            Where-Object {
              -not [System.String]::IsNullOrWhiteSpace($_)
            }
          )

          if ($ids.Count -eq 0) {
            throw 'No valid Jira Test Case IDs.'
          }

          $normalized = $ids -join ','

          "NORMALIZED_TEST_CASES=$normalized" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Test Cases: $normalized"


      # ==========================================================
      # 7. GENERATE PLAYBOOK JSON
      # ==========================================================

      - name: Generate TestGuide playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $playbook = [ordered]@{

            metadata = [ordered]@{
              name = $env:PLAYBOOK_NAME
              taskNameTemplate = '${playbook_name} (${playbook_datetime}) ${distribution_count}'
              labels = @()
            }

            workspace = [ordered]@{

              source = [ordered]@{
                path = $env:TESTGUIDE_ROOT
                sourceType = 'location'
              }

              dependencies = @()
            }

            setup = [ordered]@{

              steps = @(

                [ordered]@{
                  reuse = 'always'
                  keepConfiguration = $false
                  waitMinutesForLicense = 0
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'ecuTestStart'
                },

                [ordered]@{
                  tbcPath = $env:TBC_RELATIVE_PATH
                  tcfPath = $env:TCF_RELATIVE_PATH
                  stepName = 'Test Configuration Selection'
                  type = 'configuration'
                }
              )
            }

            execution = [ordered]@{

              testcases = @(

                [ordered]@{
                  relativePath = $env:PROJECT_RELATIVE_PATH
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'project'
                }
              )
            }

            teardown = [ordered]@{

              steps = @(

                [ordered]@{
                  type = 'ecuTestStop'
                }
              )
            }

            xilConfigRequirements = @(

              [ordered]@{
                label = 'Identifier'
                category = 'XIL'
                value = $env:XIL_IDENTIFIER
                type = 'configuration'
              }
            )

            parameters = @()
          }

          $json = $playbook |
            ConvertTo-Json -Depth 30

          $playbookFile = Join-Path `
            $env:RUNNER_TEMP `
            'testguide-playbook.json'

          $json |
            Set-Content `
              -LiteralPath $playbookFile `
              -Encoding utf8

          "TESTGUIDE_PLAYBOOK_FILE=$playbookFile" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'GENERATED PLAYBOOK'
          Write-Host '========================================'
          Write-Host $json
          Write-Host '========================================'


      # ==========================================================
      # 8. VALIDATE PLAYBOOK
      # ==========================================================

      - name: Validate generated playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE)) {
            throw 'Generated playbook JSON is missing.'
          }

          $playbook = Get-Content `
            -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
            -Raw |
            ConvertFrom-Json

          if ($playbook.setup.steps.Count -ne 2) {
            throw 'Expected exactly 2 setup steps.'
          }

          if ($playbook.execution.testcases.Count -ne 1) {
            throw 'Expected exactly 1 execution project.'
          }

          if ($playbook.xilConfigRequirements.Count -ne 1) {
            throw 'Expected exactly 1 XIL requirement.'
          }

          $actualIdentifier = (
            [System.String]$playbook.xilConfigRequirements[0].value
          )

          if ($actualIdentifier -ne $env:XIL_IDENTIFIER) {
            throw (
              'Playbook XIL identifier does not match the ' +
              'selected ONE.CX resource.'
            )
          }

          Write-Host 'Playbook validation successful.'
          Write-Host "XIL Identifier: $actualIdentifier"


      # ==========================================================
      # 9. UPLOAD PLAYBOOK
      # ==========================================================

      - name: Upload TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:ONECX_AUTH_KEY
            )
          ) {
            throw 'ONECX_AUTH_KEY secret is missing.'
          }

          $folder = [System.Uri]::EscapeDataString('/')

          $uploadUrl = (
            "$env:ONECX_URL/api/v2/execution/playbook" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&folder=$folder"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $body = Get-Content `
            -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
            -Raw

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'UPLOAD PLAYBOOK'
          Write-Host '========================================'
          Write-Host "URL      : $uploadUrl"
          Write-Host "Project  : $env:ONECX_PROJECT_ID"
          Write-Host "Playbook : $env:PLAYBOOK_NAME"
          Write-Host "Resource : $env:TESTGUIDE_RESOURCE"
          Write-Host '========================================'

          try {

            $response = Invoke-RestMethod `
              -Method POST `
              -Uri $uploadUrl `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $body `
              -ErrorAction Stop

          }
          catch {

            Write-Host ''
            Write-Host '========================================'
            Write-Host 'PLAYBOOK UPLOAD FAILED'
            Write-Host '========================================'
            Write-Host "URL       : $uploadUrl"
            Write-Host "Exception : $($_.Exception.Message)"

            if ($null -ne $_.Exception.Response) {
              try {
                Write-Host (
                  "HTTP Status: " +
                  [int]$_.Exception.Response.StatusCode
                )
              }
              catch {
                Write-Host 'HTTP status unavailable.'
              }
            }

            if ($null -ne $_.ErrorDetails) {
              Write-Host "Response body: $($_.ErrorDetails.Message)"
            }

            throw
          }

          if ($null -eq $response) {
            throw 'ONE.CX returned an empty upload response.'
          }

          $response |
            ConvertTo-Json -Depth 20 |
            Write-Host

          $playbookId = [System.String]$response.playbookId

          if ([System.String]::IsNullOrWhiteSpace($playbookId)) {
            throw 'ONE.CX upload did not return playbookId.'
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_PLAYBOOK_LINK=$($response.playbookLink)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host "Playbook ID   : $playbookId"
          Write-Host "Playbook Link : $($response.playbookLink)"


      # ==========================================================
      # 10. EXECUTE PLAYBOOK
      # ==========================================================

      - name: Execute TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:TESTGUIDE_PLAYBOOK_ID
            )
          ) {
            throw 'TESTGUIDE_PLAYBOOK_ID is missing.'
          }

          $executeUrl = (
            "$env:ONECX_URL/api/v2/execution/playbook/" +
            "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&checkLastExecution=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $jiraUrl = (
            'https://scoutmotors.atlassian.net/browse/' +
            $env:JIRA_KEY
          )

          $executeRequest = [ordered]@{

            name = "$env:JIRA_KEY - $env:TARGET_ECU L2 Quality Gate"

            priority = 42

            parameters = @()

            additionalSettings = [ordered]@{

              analysisExecutionMode = 'sequential'
              downstreamAnalysisPartitioning = 'analysis'
              expirationTimeInMinutes = 60

              issueTrackerTickets = @(
                $jiraUrl
              )

              remainingRetriesOnError = 0
            }
          }

          $executeJson = $executeRequest |
            ConvertTo-Json -Depth 20

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'EXECUTE PLAYBOOK'
          Write-Host '========================================'
          Write-Host "URL         : $executeUrl"
          Write-Host "Playbook ID : $env:TESTGUIDE_PLAYBOOK_ID"
          Write-Host "Project ID  : $env:ONECX_PROJECT_ID"
          Write-Host "Resource    : $env:TESTGUIDE_RESOURCE"
          Write-Host '========================================'

          try {

            $response = Invoke-RestMethod `
              -Method POST `
              -Uri $executeUrl `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $executeJson `
              -ErrorAction Stop

          }
          catch {

            Write-Host ''
            Write-Host '========================================'
            Write-Host 'PLAYBOOK EXECUTION FAILED'
            Write-Host '========================================'
            Write-Host "Exception: $($_.Exception.Message)"

            if ($null -ne $_.ErrorDetails) {
              Write-Host "Response body: $($_.ErrorDetails.Message)"
            }

            throw
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'EXECUTION RESPONSE'
          Write-Host '========================================'

          $response |
            ConvertTo-Json -Depth 30 |
            Write-Host

          $taskIds = @($response.taskIds)

          if ($taskIds.Count -eq 0) {
            throw 'Execution response did not contain taskIds.'
          }

          $taskId = [System.String]$taskIds[0]

          if ([System.String]::IsNullOrWhiteSpace($taskId)) {
            throw 'Returned taskId is empty.'
          }

          "TESTGUIDE_TASK_ID=$taskId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Execution Task ID: $taskId"


      # ==========================================================
      # 11. POLL EXECUTION TASK
      # ==========================================================

      - name: Poll TestGuide task until finished
        if: env.TESTGUIDE_TASK_ID != ''
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $taskUrl = (
            "$env:ONECX_URL/api/v2/execution/task/" +
            "$env:TESTGUIDE_TASK_ID" +
            "?projectId=$env:ONECX_PROJECT_ID"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $pollIntervalSeconds = 10
          $maximumPollingMinutes = 170

          $deadline = (Get-Date).AddMinutes(
            $maximumPollingMinutes
          )

          $successStates = @(
            'FINISHED',
            'COMPLETED',
            'SUCCESS',
            'SUCCEEDED'
          )

          $failureStates = @(
            'ERROR',
            'FAILED',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'POLL EXECUTION TASK'
          Write-Host '========================================'
          Write-Host "Task ID       : $env:TESTGUIDE_TASK_ID"
          Write-Host "Poll interval : $pollIntervalSeconds seconds"
          Write-Host "Maximum wait  : $maximumPollingMinutes minutes"
          Write-Host '========================================'

          $attempt = 0
          $completed = $false
          $task = $null

          while ((Get-Date) -lt $deadline) {

            $attempt++

            $task = Invoke-RestMethod `
              -Method GET `
              -Uri $taskUrl `
              -Headers $headers `
              -ErrorAction Stop

            $rawState = [System.String]$task.state

            $state = (
              $rawState.Trim().ToUpperInvariant()
            )

            $stateInfo = [System.String]$task.stateInfo
            $verdict = [System.String]$task.aggregatedVerdict

            Write-Host (
              "Attempt $attempt | " +
              "State=$rawState | " +
              "Verdict=$verdict"
            )

            if ($state -in $successStates) {

              $completed = $true

              Write-Host ''
              Write-Host '========================================'
              Write-Host 'EXECUTION TASK COMPLETED'
              Write-Host '========================================'

              $task |
                ConvertTo-Json -Depth 50 |
                Write-Host

              break
            }

            if ($state -in $failureStates) {

              $task |
                ConvertTo-Json -Depth 50 |
                Write-Host

              throw (
                "TestGuide execution failed. " +
                "State=$rawState " +
                "StateInfo=$stateInfo"
              )
            }

            Start-Sleep -Seconds $pollIntervalSeconds
          }

          if (-not $completed) {
            throw (
              "TestGuide execution timed out after " +
              "$maximumPollingMinutes minutes."
            )
          }

          $finalState = [System.String]$task.state
          $finalVerdict = [System.String]$task.aggregatedVerdict
          $finalStateInfo = [System.String]$task.stateInfo
          $taskStartDate = [System.String]$task.startDate
          $taskEndDate = [System.String]$task.endDate

          "FINAL_TASK_STATE=$finalState" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_STATE_INFO=$finalStateInfo" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_VERDICT=$finalVerdict" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_START_DATE=$taskStartDate" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_END_DATE=$taskEndDate" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 12. START TEST SUMMARY REPORT
      # ==========================================================

      - name: Start TestGuide PDF report generation
        if: env.TESTGUIDE_TASK_ID != ''
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $executionTaskId = 0

          if (
            -not [System.Int64]::TryParse(
              $env:TESTGUIDE_TASK_ID,
              [ref]$executionTaskId
            )
          ) {
            throw 'TESTGUIDE_TASK_ID must be numeric.'
          }

          $safeJiraKey = (
            $env:JIRA_KEY -replace '[^a-zA-Z0-9._-]', '_'
          )

          $safeEcu = (
            $env:TARGET_ECU -replace '[^a-zA-Z0-9._-]', '_'
          )

          $reportBaseName = (
            "${safeJiraKey}_${safeEcu}_TestSummary"
          )

          $encodedFileName = [System.Uri]::EscapeDataString(
            $reportBaseName
          )

          $exportUrl = (
            "$env:ONECX_URL/api/reporting/export" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&templateId=$env:ONECX_REPORT_TEMPLATE_ID" +
            "&fileName=$encodedFileName" +
            "&locale=ENGLISH" +
            "&keepDataSource=false" +
            "&requestTicketStatus=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $reportRequest = [ordered]@{
            parameters = @()
            type = $env:ONECX_REPORT_TEMPLATE_TYPE
            taskId = $executionTaskId
          }

          $reportJson = $reportRequest |
            ConvertTo-Json -Depth 20

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'START TEST SUMMARY REPORT'
          Write-Host '========================================'
          Write-Host "Execution Task ID : $executionTaskId"
          Write-Host "Project ID        : $env:ONECX_PROJECT_ID"
          Write-Host "Template ID       : $env:ONECX_REPORT_TEMPLATE_ID"
          Write-Host "Report Name       : $reportBaseName"
          Write-Host "URL               : $exportUrl"
          Write-Host '========================================'
          Write-Host $reportJson

          try {

            $response = Invoke-RestMethod `
              -Method POST `
              -Uri $exportUrl `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $reportJson `
              -ErrorAction Stop

          }
          catch {

            Write-Host ''
            Write-Host '========================================'
            Write-Host 'REPORT GENERATION REQUEST FAILED'
            Write-Host '========================================'
            Write-Host "Exception: $($_.Exception.Message)"

            if ($null -ne $_.ErrorDetails) {
              Write-Host 'Response body:'
              Write-Host $_.ErrorDetails.Message
            }

            throw
          }

          Write-Host ''
          Write-Host 'Report generation response:'

          if ($response -is [System.String]) {
            Write-Host $response
          }
          else {
            $response |
              ConvertTo-Json -Depth 30 |
              Write-Host
          }

          $reportTaskId = $null

          if ($response -is [System.String]) {
            $reportTaskId = [System.String]$response
          }
          elseif ($null -ne $response.taskId) {
            $reportTaskId = [System.String]$response.taskId
          }
          elseif ($null -ne $response.id) {
            $reportTaskId = [System.String]$response.id
          }
          elseif ($null -ne $response.exportTaskId) {
            $reportTaskId = [System.String]$response.exportTaskId
          }
          elseif ($null -ne $response.reportTaskId) {
            $reportTaskId = [System.String]$response.reportTaskId
          }

          if (
            [System.String]::IsNullOrWhiteSpace(
              $reportTaskId
            )
          ) {
            throw (
              'Reporting API did not return a ' +
              'report-generation task ID.'
            )
          }

          $reportTaskId = $reportTaskId.Trim().Trim('"')

          $reportFile = Join-Path `
            $env:RUNNER_TEMP `
            "$reportBaseName.pdf"

          "TESTGUIDE_REPORT_TASK_ID=$reportTaskId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_BASE_NAME=$reportBaseName" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_FILE=$reportFile" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host "Report Task ID: $reportTaskId"
          Write-Host "Report File   : $reportFile"


      # ==========================================================
      # 13. POLL REPORT GENERATION
      # ==========================================================

      - name: Poll TestGuide report generation
        if: env.TESTGUIDE_REPORT_TASK_ID != ''
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $encodedReportTaskId = [System.Uri]::EscapeDataString(
            $env:TESTGUIDE_REPORT_TASK_ID
          )

          $statusUrl = (
            "$env:ONECX_URL/api/reporting/export/" +
            "$encodedReportTaskId/status"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $successStates = @(
            'FINISHED',
            'COMPLETED',
            'COMPLETE',
            'SUCCESS',
            'SUCCEEDED',
            'READY',
            'DONE'
          )

          $failureStates = @(
            'FAILED',
            'FAILURE',
            'ERROR',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          $pollIntervalSeconds = 5
          $maximumPollingMinutes = 30

          $deadline = (Get-Date).AddMinutes(
            $maximumPollingMinutes
          )

          $attempt = 0
          $reportReady = $false
          $lastState = ''

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'POLL REPORT GENERATION'
          Write-Host '========================================'
          Write-Host "Report Task ID : $env:TESTGUIDE_REPORT_TASK_ID"
          Write-Host "Status URL     : $statusUrl"
          Write-Host '========================================'

          while ((Get-Date) -lt $deadline) {

            $attempt++

            $statusResponse = Invoke-RestMethod `
              -Method GET `
              -Uri $statusUrl `
              -Headers $headers `
              -ErrorAction Stop

            $rawState = ''

            if ($statusResponse -is [System.String]) {

              $rawState = [System.String]$statusResponse

            }
            elseif ($null -ne $statusResponse.state) {

              $rawState = [System.String]$statusResponse.state

            }
            elseif ($null -ne $statusResponse.status) {

              $rawState = [System.String]$statusResponse.status

            }
            elseif ($null -ne $statusResponse.statusKey) {

              $rawState = [System.String]$statusResponse.statusKey

            }
            elseif ($null -ne $statusResponse.key) {

              $rawState = [System.String]$statusResponse.key

            }
            elseif ($null -ne $statusResponse.finished) {

              if ([System.Boolean]$statusResponse.finished) {
                $rawState = 'FINISHED'
              }
              else {
                $rawState = 'RUNNING'
              }
            }

            $normalizedState = (
              $rawState.Trim().Trim('"').ToUpperInvariant()
            )

            $lastState = $normalizedState

            Write-Host (
              "Attempt $attempt | Report State=$rawState"
            )

            if ($statusResponse -isnot [System.String]) {
              $statusResponse |
                ConvertTo-Json -Depth 30 |
                Write-Host
            }

            if ($normalizedState -in $successStates) {
              $reportReady = $true
              break
            }

            if ($normalizedState -in $failureStates) {
              throw (
                "TestGuide report generation failed. " +
                "State=$rawState"
              )
            }

            Start-Sleep -Seconds $pollIntervalSeconds
          }

          if (-not $reportReady) {
            throw (
              "Report generation timed out after " +
              "$maximumPollingMinutes minutes. " +
              "Last state=$lastState"
            )
          }

          "TESTGUIDE_REPORT_STATE=$lastState" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host "Report State: $lastState"


      # ==========================================================
      # 14. DOWNLOAD PDF
      # ==========================================================

      - name: Download TestGuide PDF report
        if: env.TESTGUIDE_REPORT_STATE != ''
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $encodedReportTaskId = [System.Uri]::EscapeDataString(
            $env:TESTGUIDE_REPORT_TASK_ID
          )

          $downloadUrl = (
            "$env:ONECX_URL/api/reporting/export/" +
            "$encodedReportTaskId/download"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/pdf'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'DOWNLOAD TEST SUMMARY PDF'
          Write-Host '========================================'
          Write-Host "Report Task : $env:TESTGUIDE_REPORT_TASK_ID"
          Write-Host "Output      : $env:TESTGUIDE_REPORT_FILE"
          Write-Host "URL         : $downloadUrl"
          Write-Host '========================================'

          try {

            Invoke-WebRequest `
              -Method GET `
              -Uri $downloadUrl `
              -Headers $headers `
              -OutFile $env:TESTGUIDE_REPORT_FILE `
              -ErrorAction Stop

          }
          catch {

            Write-Host ''
            Write-Host '========================================'
            Write-Host 'REPORT DOWNLOAD FAILED'
            Write-Host '========================================'
            Write-Host "Exception: $($_.Exception.Message)"

            if ($null -ne $_.ErrorDetails) {
              Write-Host 'Response body:'
              Write-Host $_.ErrorDetails.Message
            }

            throw
          }

          if (
            -not (
              Test-Path -LiteralPath $env:TESTGUIDE_REPORT_FILE
            )
          ) {
            throw 'Downloaded report file was not created.'
          }

          $reportFileInfo = Get-Item `
            -LiteralPath $env:TESTGUIDE_REPORT_FILE

          if ($reportFileInfo.Length -le 0) {
            throw 'Downloaded report file is empty.'
          }

          $fileBytes = [System.IO.File]::ReadAllBytes(
            $reportFileInfo.FullName
          )

          if ($fileBytes.Length -lt 5) {
            throw 'Downloaded report is too small to be a PDF.'
          }

          $pdfSignature = (
            [System.Text.Encoding]::ASCII.GetString(
              $fileBytes,
              0,
              5
            )
          )

          if ($pdfSignature -ne '%PDF-') {

            $previewLength = [System.Math]::Min(
              500,
              $fileBytes.Length
            )

            $preview = [System.Text.Encoding]::UTF8.GetString(
              $fileBytes,
              0,
              $previewLength
            )

            Write-Host ''
            Write-Host 'Response preview:'
            Write-Host $preview

            throw 'Reporting API did not return a valid PDF.'
          }

          $reportSize = $reportFileInfo.Length

          "TESTGUIDE_REPORT_SIZE=$reportSize" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TEST SUMMARY PDF DOWNLOADED'
          Write-Host '========================================'
          Write-Host "File : $($reportFileInfo.FullName)"
          Write-Host "Size : $reportSize bytes"
          Write-Host '========================================'


      # ==========================================================
      # 15. UPLOAD PDF TO GITHUB ACTIONS
      # ==========================================================

      - name: Upload TestGuide PDF as workflow artifact
        if: env.TESTGUIDE_REPORT_SIZE != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TESTGUIDE_REPORT_BASE_NAME }}
          path: ${{ env.TESTGUIDE_REPORT_FILE }}
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 16. SUMMARY
      # ==========================================================

      - name: Publish execution summary
        if: always()
        shell: pwsh
        run: |
          $summary = @(
            '## TestGuide Jira Execution',
            '',
            '| Field | Value |',
            '|---|---|',
            "| Jira | $env:JIRA_KEY |",
            "| OneCX Project | $env:ONECX_PROJECT_ID |",
            "| Requested Bench | $env:BENCH_ID |",
            "| Selected Resource | $env:TESTGUIDE_RESOURCE |",
            "| Bench Name | $env:BENCH_NAME |",
            "| Target ECU | $env:TARGET_ECU |",
            "| Test Cases | $env:NORMALIZED_TEST_CASES |",
            "| Playbook | $env:PLAYBOOK_NAME |",
            "| Playbook ID | $env:TESTGUIDE_PLAYBOOK_ID |",
            "| Playbook Link | $env:TESTGUIDE_PLAYBOOK_LINK |",
            "| Execution Task ID | $env:TESTGUIDE_TASK_ID |",
            "| Execution State | $env:FINAL_TASK_STATE |",
            "| Execution State Info | $env:FINAL_TASK_STATE_INFO |",
            "| Verdict | $env:FINAL_TASK_VERDICT |",
            "| Task Start | $env:TASK_START_DATE |",
            "| Task End | $env:TASK_END_DATE |",
            "| Report Template | $env:ONECX_REPORT_TEMPLATE_ID |",
            "| Report Type | $env:ONECX_REPORT_TEMPLATE_TYPE |",
            "| Report Task ID | $env:TESTGUIDE_REPORT_TASK_ID |",
            "| Report State | $env:TESTGUIDE_REPORT_STATE |",
            "| Report File | $env:TESTGUIDE_REPORT_FILE |",
            "| Report Size | $env:TESTGUIDE_REPORT_SIZE bytes |",
            "| Workspace | $env:TESTGUIDE_ROOT |",
            "| TBC | $env:TBC_RELATIVE_PATH |",
            "| TCF | $env:TCF_RELATIVE_PATH |",
            "| PRJ | $env:PROJECT_RELATIVE_PATH |",
            "| XIL | $env:XIL_IDENTIFIER |",
            "| Workflow Status | ${{ job.status }} |"
          )

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
