name: CT Test Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}
  ONECX_PLAYBOOK_NAME: SandeepTestNewPlaybook

jobs:
  execute:
    runs-on:
      - self-hosted
      - Windows
      - X64

    env:
      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}

    steps:
      # Validate Jira and ONE.CX configuration.
      - name: Validate inputs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Jira Key         : $env:JIRA_KEY"
          Write-Host "Bench ID         : $env:BENCH_ID"
          Write-Host "Bench Name       : $env:BENCH_NAME"
          Write-Host "Target ECU       : $env:TARGET_ECU"
          Write-Host "Test Cases       : $env:TEST_CASES"
          Write-Host "ONE.CX Project   : $env:ONECX_PROJECT_ID"
          Write-Host "ONE.CX Playbook  : $env:ONECX_PLAYBOOK_NAME"

          if ([string]::IsNullOrWhiteSpace($env:JIRA_KEY)) {
            throw "Jira Key missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:BENCH_ID)) {
            throw "Bench ID missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:BENCH_NAME)) {
            throw "Bench Name missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:TARGET_ECU)) {
            throw "Target ECU missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:TEST_CASES)) {
            throw "Test Cases missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:ONECX_PROJECT_ID)) {
            throw "GitHub variable ONECX_PROJECT_ID is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:ONECX_PLAYBOOK_NAME)) {
            throw "ONECX_PLAYBOOK_NAME is missing"
          }

      # Verify Git availability.
      - name: Verify Git
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          git --version

          if ($LASTEXITCODE -ne 0) {
            throw "Git is not available on the runner PATH"
          }

          where.exe git

      # Checkout latest parent and all submodules.
      - name: Checkout eeint-Test-Automation
        uses: actions/checkout@v4
        with:
          repository: scout-motors/eeint-Test-Automation
          ref: main
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.HIL_REPO_PAT }}
          path: eeint-Test-Automation

      # Capture exact repository revision.
      - name: Get repository SHA
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $repoPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "eeint-Test-Automation"

          $parentSha = git -C "$repoPath" rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to determine parent repository SHA"
          }

          $parentSha = $parentSha.Trim()

          Write-Host "Parent SHA: $parentSha"

          "PARENT_SHA=$parentSha" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          git -C "$repoPath" submodule status --recursive

      # Resolve the ECU project.
      - name: Resolve ECU project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $repoPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "eeint-Test-Automation"

          $projectDir = Join-Path `
            $repoPath `
            "Packages\$env:BENCH_NAME\L2_Quality_Gate\$env:TARGET_ECU"

          Write-Host "Project directory: $projectDir"

          if (-not (Test-Path "$projectDir")) {
            throw "Project directory not found: $projectDir"
          }

          $projects = @(
            Get-ChildItem `
              -Path "$projectDir" `
              -Filter "*.prj" `
              -File
          )

          Write-Host "Found $($projects.Count) project file(s)"

          foreach ($project in $projects) {
            Write-Host "PRJ: $($project.FullName)"
          }

          if ($projects.Count -eq 0) {
            throw "No .prj file found under $projectDir"
          }

          if ($projects.Count -gt 1) {
            throw "Expected exactly one .prj file under $projectDir"
          }

          $absolutePath = $projects[0].FullName
          $relativePath = $absolutePath.Substring(
            $repoPath.Length + 1
          )

          Write-Host "Resolved project: $relativePath"

          "PROJECT_PATH=$relativePath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # Find latest ONE.CX Playbook revision.
      - name: Resolve latest ONE.CX Playbook
        shell: powershell
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:ONECX_AUTH_KEY)) {
            throw "ONECX_AUTH_KEY secret is missing"
          }

          $encodedName = [uri]::EscapeDataString(
            $env:ONECX_PLAYBOOK_NAME
          )

          $uri = "${env:ONECX_URL}/api/v2/execution/playbook?projectId=${env:ONECX_PROJECT_ID}&playbookName=${encodedName}&sort=NAME&ascending=ASC&offset=0&limit=100"

          $headers = @{
            "TestGuide-AuthKey" = $env:ONECX_AUTH_KEY
            "Accept" = "application/json"
          }

          Write-Host "Resolving Playbook: $env:ONECX_PLAYBOOK_NAME"
          Write-Host "ONE.CX Project   : $env:ONECX_PROJECT_ID"

          $playbooks = @(
            Invoke-RestMethod `
              -Method Get `
              -Uri $uri `
              -Headers $headers
          )

          $matchingPlaybooks = @(
            $playbooks |
              Where-Object {
                $_.metadata.name -eq $env:ONECX_PLAYBOOK_NAME
              }
          )

          if ($matchingPlaybooks.Count -eq 0) {
            throw "No Playbook named $env:ONECX_PLAYBOOK_NAME was found"
          }

          $latestPlaybook = $matchingPlaybooks |
            Sort-Object revision -Descending |
            Select-Object -First 1

          $playbookId = [string]$latestPlaybook.playbookId
          $playbookRevision = [string]$latestPlaybook.revision
          $playbookProjectId = [string]$latestPlaybook.projectId

          if ([string]::IsNullOrWhiteSpace($playbookId)) {
            throw "Resolved Playbook has no playbookId"
          }

          if ($playbookProjectId -ne $env:ONECX_PROJECT_ID) {
            throw "Resolved Playbook belongs to project $playbookProjectId instead of $env:ONECX_PROJECT_ID"
          }

          Write-Host "Playbook ID      : $playbookId"
          Write-Host "Playbook Revision: $playbookRevision"
          Write-Host "Playbook Project : $playbookProjectId"

          "ONECX_PLAYBOOK_ID=$playbookId" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "ONECX_PLAYBOOK_REVISION=$playbookRevision" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          $latestPlaybook |
            ConvertTo-Json -Depth 20 |
            Set-Content `
              -Path "$env:GITHUB_WORKSPACE\resolved-playbook.json" `
              -Encoding utf8

      # Verify repository project matches the Playbook project.
      - name: Verify Playbook project path
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $playbook = Get-Content `
            -Path "$env:GITHUB_WORKSPACE\resolved-playbook.json" `
            -Raw |
            ConvertFrom-Json

          $projectSteps = @(
            $playbook.execution.testcases |
              Where-Object {
                $_.type -eq "project"
              }
          )

          if ($projectSteps.Count -eq 0) {
            throw "Resolved Playbook contains no project testcase"
          }

          if ($projectSteps.Count -gt 1) {
            throw "Resolved Playbook contains more than one project testcase"
          }

          $playbookPath = [string]$projectSteps[0].relativePath
          $repositoryPath = [string]$env:PROJECT_PATH

          $normalizedPlaybookPath = $playbookPath.Replace("/", "\")
          $normalizedRepositoryPath = $repositoryPath.Replace("/", "\")

          Write-Host "Repository project: $normalizedRepositoryPath"
          Write-Host "Playbook project  : $normalizedPlaybookPath"

          if ($normalizedRepositoryPath -ne $normalizedPlaybookPath) {
            throw "Repository project does not match the latest Playbook revision"
          }

      # Build ONE.CX execution request.
      - name: Build ONE.CX request
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $request = @{
            name = "$env:JIRA_KEY - $env:TARGET_ECU L2 Quality Gate"
                  analysisExecutionMode = "sequential"
              downstreamAnalysisPartitioning = "analysis"
              expirationTimeInMinutes = 60
              issueTrackerTickets = @(
                "https://scoutmotors.atlassian.net/browse/$env:JIRA_KEY"
              )
              remainingRetriesOnError = 0
            }
          }

          $json = $request |
            ConvertTo-Json -Depth 10

          $json |
            Set-Content `
              -Path "$env:GITHUB_WORKSPACE\onecx-request.json" `
              -Encoding utf8

          Write-Host $json

      # Execute dynamically resolved Playbook.
      - name: Execute ONE.CX Playbook
        shell: powershell
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if (:IsNullOrWhiteSpace($env:ONECX_PLAYBOOK_ID)) {
            throw "ONECX_PLAYBOOK_ID was not resolved"
          }

          $uri = "${env:ONECX_URL}/api/v2/execution/playbook/${env:ONECX_PLAYBOOK_ID}/execute?projectId=${env:ONECX_PROJECT_ID}&checkLastExecution=false"

          $headers = @{
            "TestGuide-AuthKey" = $env:ONECX_AUTH_KEY
            "Accept" = "*/*"
          }

          Write-Host "ONE.CX Project  : $env:ONECX_PROJECT_ID"
          Write-Host "Playbook Name   : $env:ONECX_PLAYBOOK_NAME"
          Write-Host "Playbook ID     : $env:ONECX_PLAYBOOK_ID"
          Write-Host "Playbook Revision: $env:ONECX_PLAYBOOK_REVISION"

          $body = Get-Content `
            -Path "$env:GITHUB_WORKSPACE\onecx-request.json" `
            -Raw

          $response = Invoke-RestMethod `
            -Method Post `
            -Uri $uri `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $body

          $taskId = $response.taskIds |
            Select-Object -First 1

          if (-not $taskId) {
            throw "ONE.CX returned no taskId"
          }

          Write-Host "ONE.CX Task ID: $taskId"

          "TASK_ID=$taskId" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # Poll ONE.CX execution.
      - name: Wait for ONE.CX task
        shell: powershell
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if (:IsNullOrWhiteSpace($env:TASK_ID)) {
            throw "TASK_ID is missing"
          }

          $headers = @{
            "TestGuide-AuthKey" = $env:ONECX_AUTH_KEY
            "Accept" = "application/json"
          }

          $uri = "${env:ONECX_URL}/api/v2/execution/task/${env:TASK_ID}?projectId=${env:ONECX_PROJECT_ID}"

          Write-Host "Task ID : $env:TASK_ID"
          Write-Host "Task URL: $uri"

          for ($attempt = 1; $attempt -le 60; $attempt++) {
            $task = Invoke-RestMethod `
              -Method Get `
              -Uri $uri `
              -Headers $headers

            $state = [string]$task.state

            Write-Host "Attempt ${attempt}: $state"

            if ($state -in @(
              "FINISHED",
              "COMPLETED",
              "SUCCESS",
              "SUCCEEDED"
            )) {
              Write-Host "ONE.CX execution completed"
              exit 0
            }

            if ($state -in @(
              "ERROR",
              "FAILED",
              "ABORTED",
              "CANCELLED",
              "CANCELED"
            )) {
              Write-Host "ONE.CX execution failed"

              if ($task.stateInfo.errorMessage) {
                Write-Host "Error: $($task.stateInfo.errorMessage)"
              }

              $task |
                ConvertTo-Json -Depth 20 |
                Set-Content `
                  -Path "$env:GITHUB_WORKSPACE\onecx-task-final.json" `
                  -Encoding utf8

              exit 1
            }

            Start-Sleep -Seconds 10
          }

          throw "ONE.CX execution timed out after 10 minutes"

      # Publish execution summary.
      - name: Summary
        if: always()
        shell: powershell
        run: |
          $parentSha = if ($env:PARENT_SHA) {
            $env:PARENT_SHA
          } else {
            "Unavailable"
          }

          $projectPath = if ($env:PROJECT_PATH) {
            $env:PROJECT_PATH
          } else {
            "Unavailable"
          }

          $playbookId = if ($env:ONECX_PLAYBOOK_ID) {
            $env:ONECX_PLAYBOOK_ID
          } else {
            "Unavailable"
          }

          $revision = if ($env:ONECX_PLAYBOOK_REVISION) {
            $env:ONECX_PLAYBOOK_REVISION
          } else {
            "Unavailable"
          }

          $taskId = if ($env:TASK_ID) {
            $env:TASK_ID
          } else {
            "Unavailable"
          }

          @"
          ## CT Execution

          | Field | Value |
          |---|---|
          | Jira | $env:JIRA_KEY |
          | Bench ID | $env:BENCH_ID |
          | Bench Name | $env:BENCH_NAME |
          | Target ECU | $env:TARGET_ECU |
          | Test Cases | $env:TEST_CASES |
          | Parent SHA | $parentSha |
          | Project | $projectPath |
          | ONE.CX Project | $env:ONECX_PROJECT_ID |
          | Playbook Name | $env:ONECX_PLAYBOOK_NAME |
          | Playbook ID | $playbookId |
          | Playbook Revision | $revision |
          | ONE.CX Task | $taskId |
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
