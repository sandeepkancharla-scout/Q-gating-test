name: CT TestGuide Jira Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  testguide:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      # Jira
      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}

      # Existing local repository
      LOCAL_ROOT: 'C:\HIL\Testing\eeint-Test-Automation'

      # Current configuration folder
      CONFIGURATION_FOLDER: 'SUBSYS1'

      # OneCX/TestGuide
      ONECX_PROJECT_ID: ${{ secrets.ONECX_PROJECT_ID }}

      # Replace only if your Swagger API base differs
      TESTGUIDE_BASE_URL: 'https://testguide-ssp.onecx.vwgroup.com'

    steps:

      # ==========================================================
      # 1. VALIDATE JIRA
      # ==========================================================

      - name: Validate Jira request
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @{
              JIRA_KEY      = $env:JIRA_KEY
              BENCH_ID      = $env:BENCH_ID
              BENCH_NAME    = $env:BENCH_NAME
              TARGET_ECU    = $env:TARGET_ECU
              TEST_CASES    = $env:TEST_CASES
              PLAYBOOK_NAME = $env:PLAYBOOK_NAME
          }

          foreach ($item in $required.GetEnumerator()) {
              if ([string]::IsNullOrWhiteSpace([string]$item.Value)) {
                  throw "Missing Jira input: $($item.Key)"
              }
          }

          if (-not (Test-Path $env:LOCAL_ROOT)) {
              throw "Local automation repository missing: $env:LOCAL_ROOT"
          }

          Write-Host "========================================"
          Write-Host "JIRA EXECUTION"
          Write-Host "========================================"
          Write-Host "Jira       : $env:JIRA_KEY"
          Write-Host "Bench      : $env:BENCH_ID"
          Write-Host "Bench Name : $env:BENCH_NAME"
          Write-Host "ECU        : $env:TARGET_ECU"
          Write-Host "Test Cases : $env:TEST_CASES"
          Write-Host "Playbook   : $env:PLAYBOOK_NAME"


      # ==========================================================
      # 2. RESOLVE BENCH / WORKSPACE / XIL
      # ==========================================================

      - name: Resolve TestGuide bench
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          switch ($env:BENCH_ID.Trim().ToUpperInvariant()) {

              "SYSHIL1" {
                  $tgBench = "SysHIL1"
                  $workspace = "D:\HIL\Testing\eeint-Test-Automation"
              }

              "SYSHIL2" {
                  $tgBench = "SysHIL2"
                  $workspace = "C:\HIL\Testing\eeint-Test-Automation"
              }

              "SYSHIL5" {
                  $tgBench = "SysHIL5"
                  $workspace = "C:\HIL\Testing\eeint-Test-Automation"
              }

              default {
                  $tgBench = $env:BENCH_ID.Trim()
                  $workspace = "C:\HIL\Testing\eeint-Test-Automation"
              }
          }

          $stepName = "ecu.test $tgBench Start"

          $xilIdentifier =
              "novi_hq/1stfloor/EE_Lab_novi/$tgBench/TestLabPC1"

          "TESTGUIDE_BENCH=$tgBench" >> $env:GITHUB_ENV
          "TESTGUIDE_ROOT=$workspace" >> $env:GITHUB_ENV
          "ECUTEST_STEP_NAME=$stepName" >> $env:GITHUB_ENV
          "XIL_IDENTIFIER=$xilIdentifier" >> $env:GITHUB_ENV

          Write-Host "TestGuide Bench : $tgBench"
          Write-Host "Workspace       : $workspace"
          Write-Host "XIL             : $xilIdentifier"


      # ==========================================================
      # 3. RESOLVE PACKAGE FROM JIRA BENCH_NAME
      # ==========================================================

      - name: Resolve bench package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packageRoot = Join-Path `
              $env:LOCAL_ROOT `
              "Packages\$env:BENCH_NAME"

          if (-not (Test-Path $packageRoot)) {
              throw "Package not found: $packageRoot"
          }

          "PACKAGE_ROOT=$packageRoot" >> $env:GITHUB_ENV

          Write-Host "Package: $packageRoot"


      # ==========================================================
      # 4. RESOLVE TBC + TCF
      #
      # Current known-good setup:
      # Configurations\SUBSYS1
      # ==========================================================

      - name: Resolve TBC and TCF
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $configRoot = Join-Path `
              $env:LOCAL_ROOT `
              "Configurations\$env:CONFIGURATION_FOLDER"

          if (-not (Test-Path $configRoot)) {
              throw "Configuration directory missing: $configRoot"
          }

          $tbc = @(
              Get-ChildItem `
                  -Path $configRoot `
                  -Filter "*.tbc" `
                  -File `
                  -Recurse
          )

          $tcf = @(
              Get-ChildItem `
                  -Path $configRoot `
                  -Filter "*.tcf" `
                  -File `
                  -Recurse
          )

          if ($tbc.Count -ne 1) {
              throw "Expected exactly 1 TBC under $configRoot. Found $($tbc.Count)."
          }

          if ($tcf.Count -ne 1) {
              throw "Expected exactly 1 TCF under $configRoot. Found $($tcf.Count)."
          }

          $tbcRelative =
              [IO.Path]::GetRelativePath(
                  $env:LOCAL_ROOT,
                  $tbc[0].FullName
              )

          $tcfRelative =
              [IO.Path]::GetRelativePath(
                  $env:LOCAL_ROOT,
                  $tcf[0].FullName
              )

          "TBC_RELATIVE_PATH=$tbcRelative" >> $env:GITHUB_ENV
          "TCF_RELATIVE_PATH=$tcfRelative" >> $env:GITHUB_ENV

          Write-Host "TBC: $tbcRelative"
          Write-Host "TCF: $tcfRelative"


      # ==========================================================
      # 5. RESOLVE PRJ USING JIRA TARGET ECU
      # ==========================================================

      - name: Resolve target ECU project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projects = @(
              Get-ChildItem `
                  -Path $env:PACKAGE_ROOT `
                  -Filter "*.prj" `
                  -File `
                  -Recurse
          )

          if ($projects.Count -eq 0) {
              throw "No PRJ files found under $env:PACKAGE_ROOT"
          }

          Write-Host "Available PRJs:"

          foreach ($project in $projects) {
              Write-Host "  $($project.FullName)"
          }

          $matches = @(
              $projects |
              Where-Object {
                  $_.FullName.IndexOf(
                      $env:TARGET_ECU,
                      [StringComparison]::OrdinalIgnoreCase
                  ) -ge 0
              }
          )

          if ($matches.Count -eq 1) {
              $selected = $matches[0]
          }
          elseif (
              $matches.Count -eq 0 -and
              $projects.Count -eq 1
          ) {
              $selected = $projects[0]
          }
          else {
              throw "Unable to uniquely resolve PRJ for ECU '$env:TARGET_ECU'."
          }

          $relative =
              [IO.Path]::GetRelativePath(
                  $env:LOCAL_ROOT,
                  $selected.FullName
              )

          "PROJECT_RELATIVE_PATH=$relative" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Selected PRJ:"
          Write-Host "$relative"


      # ==========================================================
      # 6. PARSE TEST CASES FROM JIRA
      # ==========================================================

      - name: Parse Jira Test Cases
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ids = @(
              $env:TEST_CASES -split '[,;]' |
              ForEach-Object { $_.Trim() } |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              }
          )

          if ($ids.Count -eq 0) {
              throw "No valid Jira Test Case IDs."
          }

          $normalized = $ids -join ","

          "NORMALIZED_TEST_CASES=$normalized" >> $env:GITHUB_ENV

          Write-Host "Test Cases: $normalized"


      # ==========================================================
      # 7. GENERATE EXACT TESTGUIDE PLAYBOOK
      # ==========================================================

      - name: Generate TestGuide playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $playbook = [ordered]@{

              metadata = [ordered]@{
                  name = $env:PLAYBOOK_NAME

                  taskNameTemplate =
                      '${playbook_name} (${playbook_datetime}) ${distribution_count}'

                  labels = @()
              }

              workspace = [ordered]@{
                  source = [ordered]@{
                      path = $env:TESTGUIDE_ROOT
                      sourceType = "location"
                  }

                  dependencies = @()
              }

              setup = [ordered]@{
                  steps = @(

                      [ordered]@{
                          reuse = "always"
                          keepConfiguration = $false
                          waitMinutesForLicense = 0
                          stepName = $env:ECUTEST_STEP_NAME
                          type = "ecuTestStart"
                      },

                      [ordered]@{
                          tbcPath = $env:TBC_RELATIVE_PATH
                          tcfPath = $env:TCF_RELATIVE_PATH
                          stepName = "Test Configuration Selection"
                          type = "configuration"
                      }
                  )
              }

              execution = [ordered]@{
                  testcases = @(

                      [ordered]@{
                          relativePath = $env:PROJECT_RELATIVE_PATH
                          stepName = $env:ECUTEST_STEP_NAME
                          type = "project"
                      }
                  )
              }

              teardown = [ordered]@{
                  steps = @(

                      [ordered]@{
                          type = "ecuTestStop"
                      }
                  )
              }

              xilConfigRequirements = @(

                  [ordered]@{
                      label = "Identifier"
                      category = "XIL"
                      value = $env:XIL_IDENTIFIER
                      type = "configuration"
                  }
              )
          }

          $json =
              $playbook |
              ConvertTo-Json -Depth 30

          $file = Join-Path `
              $env:RUNNER_TEMP `
              "testguide-playbook.json"

          $json |
              Set-Content `
                  -Path $file `
                  -Encoding utf8

          "TESTGUIDE_PLAYBOOK_FILE=$file" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host====="
          Write-Host "GENERATED PLAYBOOK"
          Write-Host "========================================"
          Write-Host $json


      # ==========================================================
      # 8. VALIDATE GENERATED PLAYBOOK
      # ==========================================================

      - name: Validate generated playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $playbook =
              Get-Content `
                  $env:TESTGUIDE_PLAYBOOK_FILE `
                  -Raw |
              ConvertFrom-Json

          if ($null -eq $playbook.metadata) {
              throw "metadata missing"
          }

          if ($null -eq $playbook.workspace) {
              throw "workspace missing"
          }

          if ($playbook.setup.steps.Count -ne 2) {
              throw "Expected 2 setup steps."
          }

          if ($playbook.execution.testcases.Count -ne 1) {
              throw "Expected 1 execution project."
          }

          if ($playbook.teardown.steps.Count -ne 1) {
              throw "Expected 1 teardown step."
          }

          if ($playbook.xilConfigRequirements.Count -ne 1) {
              throw "Expected 1 XIL requirement."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "PLAYBOOK READY"
          Write-Host "========================================"
          Write-Host "Name      : $($playbook.metadata.name)"
          Write-Host "Workspace : $($playbook.workspace.source.path)"
          Write-Host "TBC       : $($playbook.setup.steps[1].tbcPath)"
          Write-Host "TCF       : $($playbook.setup.steps[1].tcfPath)"
          Write-Host "PRJ       : $($playbook.execution.testcases[0].relativePath)"
          Write-Host "XIL       : $($playbook.xilConfigRequirements[0].value)"
          Write-Host "========================================"


      # ==========================================================
      # 9. SUMMARY
      #
      # Upload/execute gets added after POST /playbook schema
      # is confirmed.
      # ==========================================================

      - name: Publish execution summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Jira-driven TestGuide playbook

          | Field | Value |
          |---|---|
          | Jira | $env:JIRA_KEY |
          | Bench | $env:TESTGUIDE_BENCH |
          | Bench Name | $env:BENCH_NAME |
          | ECU | $env:TARGET_ECU |
          | Test Cases | $env:NORMALIZED_TEST_CASES |
          | Playbook | $env:PLAYBOOK_NAME |
          | Workspace | $env:TESTGUIDE_ROOT |
          | TBC | $env:TBC_RELATIVE_PATH |
          | TCF | $env:TCF_RELATIVE_PATH |
          | PRJ | $env:PROJECT_RELATIVE_PATH |
          | XIL | $env:XIL_IDENTIFIER |
          | JSON | $env:TESTGUIDE_PLAYBOOK_FILE |
          | Status | ${{ job.status }} |
          "@ |
              Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY `
                  -Encoding utf8 `
                  -Append
