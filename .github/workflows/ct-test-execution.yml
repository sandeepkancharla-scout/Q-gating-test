name: CT Test Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: "10"
  ONECX_PLAYBOOK_ID: "8632"

jobs:
  execute:
    runs-on:
      - self-hosted
      - Windows
      - X64

    env:
      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}

    steps:
      # Validate Jira payload.
      - name: Validate Jira payload
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Jira Key   : $env:JIRA_KEY"
          Write-Host "Bench ID   : $env:BENCH_ID"
          Write-Host "Bench Name : $env:BENCH_NAME"
          Write-Host "Target ECU : $env:TARGET_ECU"
          Write-Host "Test Cases : $env:TEST_CASES"

          if ([string]::IsNullOrWhiteSpace($env:JIRA_KEY)) {
            throw "Jira Key missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:BENCH_ID)) {
            throw "Bench ID missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:BENCH_NAME)) {
            throw "Bench Name missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:TARGET_ECU)) {
            throw "Target ECU missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:TEST_CASES)) {
            throw "Test Cases missing"
          }

      # Verify Git is available on the runner.
      - name: Verify Git
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          git --version

          if ($LASTEXITCODE -ne 0) {
            throw "Git is not available on the runner PATH"
          }

          where.exe git

      # Checkout parent repository and all HIL submodules.
      - name: Checkout eeint-Test-Automation
        uses: actions/checkout@v4
        with:
          repository: scout-motors/eeint-Test-Automation
          ref: main
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.HIL_REPO_PAT }}
          path: eeint-Test-Automation

      # Capture exact repository revision.
      - name: Get repository SHA
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $repoPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "eeint-Test-Automation"

          $parentSha = git -C "$repoPath" rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to determine parent repository SHA"
          }

          $parentSha = $parentSha.Trim()

          Write-Host "Parent SHA: $parentSha"

          "PARENT_SHA=$parentSha" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          git -C "$repoPath" submodule status --recursive

      # Resolve ECU project.
      - name: Resolve ECU project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $repoPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "eeint-Test-Automation"

          $projectDir = Join-Path `
            $repoPath `
            "Packages\$env:BENCH_NAME\L2_Quality_Gate\$env:TARGET_ECU"

          Write-Host "Project directory: $projectDir"

          if (-not (Test-Path "$projectDir")) {
            throw "Project directory not found: $projectDir"
          }

          $projects = @(
            Get-ChildItem `
              -Path "$projectDir" `
              -Filter "*.prj" `
              -File
          )

          Write-Host "Found $($projects.Count) .prj file(s)"

          foreach ($project in $projects) {
            Write-Host "PRJ: $($project.FullName)"
          }

          if ($projects.Count -eq 0) {
            throw "No .prj file found"
          }

          if ($projects.Count -gt 1) {
            throw "Expected exactly one .prj file"
          }

          $projectPath = $projects[0].FullName
          $relativePath = $projectPath.Substring(
            $repoPath.Length + 1
          )

          Write-Host "Resolved project: $relativePath"

          "PROJECT_PATH=$relativePath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # Verify repository and Playbook project match.
      - name: Verify Playbook project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $expected = "Packages\system-hil\L2_Quality_Gate\CI_Disp\CI_Disp_L2QualityGate.prj"

          Write-Host "Repository project: $env:PROJECT_PATH"
          Write-Host "Playbook project  : $expected"

          if ($env:PROJECT_PATH -ne $expected) {
            throw "Repository project does not match Playbook 8632"
          }

      # Build ONE.CX request.
      - name: Build ONE.CX request
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $request = @{
            name = "$env:JIRA_KEY - $env:TARGET_ECU L2 Quality Gate"
            priority = 42
            parameters = @()
            additionalSettings = @{
              analysisExecutionMode = "sequential"
              downstreamAnalysisPartitioning = "analysis"
              expirationTimeInMinutes = 60
              issueTrackerTickets = @(
                "https://scoutmotors.atlassian.net/browse/$env:JIRA_KEY"
              )
              remainingRetriesOnError = 0
            }
          }

          $json = $request | ConvertTo-Json -Depth 10

          $json |
            Set-Content `
              -Path "$env:GITHUB_WORKSPACE\onecx-request.json" `
              -Encoding utf8

          Write-Host $json

      # Execute existing ONE.CX Playbook.
      - name: Execute ONE.CX Playbook
        shell: powershell
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:ONECX_AUTH_KEY)) {
            throw "ONECX_AUTH_KEY secret is missing"
          }

          $uri = "${env:ONECX_URL}/api/v2/execution/playbook/${env:ONECX_PLAYBOOK_ID}/execute?projectId=${env:ONECX_PROJECT_ID}&checkLastExecution=false"

          Write-Host "ONE.CX Project : $env:ONECX_PROJECT_ID"
          Write-Host "ONE.CX Playbook: $env:ONECX_PLAYBOOK_ID"
          Write-Host "ONE.CX URL     : $uri"

          $headers = @{
            "TestGuide-AuthKey" = $env:ONECX_AUTH_KEY
            "Accept" = "*/*"
          }

          $body = Get-Content `
            -Path "$env:GITHUB_WORKSPACE\onecx-request.json" `
            -Raw

          $response = Invoke-RestMethod `
            -Method Post `
            -Uri $uri `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $body

          Write-Host "ONE.CX response:"
          $response | ConvertTo-Json -Depth 10

          $taskId = $response.taskIds |
            Select-Object -First 1

          if (-not $taskId) {
            throw "ONE.CX returned no taskId"
          }

          Write-Host "ONE.CX Task ID: $taskId"

          "TASK_ID=$taskId" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # Poll ONE.CX task status.
      - name: Wait for ONE.CX task
        shell: powershell
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TASK_ID)) {
            throw "TASK_ID is missing"
          }

          $headers = @{
            "TestGuide-AuthKey" = $env:ONECX_AUTH_KEY
            "Accept" = "application/json"
          }

          $uri = "${env:ONECX_URL}/api/v2/execution/task/${env:TASK_ID}?projectId=${env:ONECX_PROJECT_ID}"

          Write-Host "Task ID : $env:TASK_ID"
          Write-Host "Task URL: $uri"

          for ($attempt = 1; $attempt -le 60; $attempt++) {

            $task = Invoke-RestMethod `
              -Method Get `
              -Uri $uri `
              -Headers $headers

            $state = $task.state

            Write-Host "Attempt ${attempt}: $state"

            if ($state -in @(
              "FINISHED",
              "COMPLETED",
              "SUCCESS",
              "SUCCEEDED"
            )) {
              Write-Host "ONE.CX execution completed"
              exit 0
            }

            if ($state -in @(
              "ERROR",
              "FAILED",
              "ABORTED",
              "CANCELLED",
              "CANCELED"
            )) {
              Write-Host "ONE.CX execution failed"

              if ($task.stateInfo.errorMessage) {
                Write-Host "Error: $($task.stateInfo.errorMessage)"
              }

              Write-Host "Task response:"
              $task | ConvertTo-Json -Depth 20

              exit 1
            }

            Start-Sleep -Seconds 10
          }

          throw "ONE.CX execution timed out after 10 minutes"

      # Publish workflow ll: powershell
        run: |
          $parentSha = if ($env:PARENT_SHA) {
            $env:PARENT_SHA
          } else {
            "Unavailable"
          }

          $projectPath = if ($env:PROJECT_PATH) {
            $env:PROJECT_PATH
          } else {
            "Unavailable"
          }

          $taskId = if ($env:TASK_ID) {
            $env:TASK_ID
          } else {
            "Unavailable"
          }

          @"
          ## CT Execution

          | Field | Value |
          |---|---|
          | Jira | $env:JIRA_KEY |
          | Bench ID | $env:BENCH_ID |
          | Bench Name | $env:BENCH_NAME |
          | Target ECU | $env:TARGET_ECU |
          | Test Cases | $env:TEST_CASES |
          | Parent SHA | $parentSha |
          | Project | $projectPath |
          | ONE.CX Project | $env:ONECX_PROJECT_ID |
          | ONE.CX Playbook | $env:ONECX_PLAYBOOK_ID |
          | ONE.CX Task | $taskId |
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
