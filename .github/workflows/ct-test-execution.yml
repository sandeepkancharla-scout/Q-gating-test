name: CT TestGuide Jira ATX Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  testguide:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      # ==========================================================
      # JIRA INPUTS
      # ==========================================================

      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}

      # ==========================================================
      # CONFIGURATION
      # ==========================================================

      CONFIGURATION_FOLDER: 'SUBSYS1'

      # ==========================================================
      # ONE.CX
      # ==========================================================

      ONECX_URL: 'https://testguide-ssp.onecx.vwgroup.com'
      ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

    steps:

      # ==========================================================
      # 1. VALIDATE REQUEST
      # ==========================================================

      - name: Validate request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredValues = @{
            JIRA_KEY = $env:JIRA_KEY
            BENCH_ID = $env:BENCH_ID
            BENCH_NAME = $env:BENCH_NAME
            TARGET_ECU = $env:TARGET_ECU
            TEST_CASES = $env:TEST_CASES
            PLAYBOOK_NAME = $env:PLAYBOOK_NAME
            ONECX_PROJECT_ID = $env:ONECX_PROJECT_ID
          }

          foreach ($item in $requiredValues.GetEnumerator()) {

            if (
              [System.String]::IsNullOrWhiteSpace(
                [System.String]$item.Value
              )
            ) {
              throw "Missing required value: $($item.Key)"
            }
          }

          $projectId = 0

          if (
            -not [System.Int32]::TryParse(
              $env:ONECX_PROJECT_ID,
              [ref]$projectId
            )
          ) {
            throw 'ONECX_PROJECT_ID must be an integer.'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JIRA EXECUTION REQUEST'
          Write-Host '========================================'
          Write-Host "Jira       : $env:JIRA_KEY"
          Write-Host "Bench      : $env:BENCH_ID"
          Write-Host "Bench Name : $env:BENCH_NAME"
          Write-Host "ECU        : $env:TARGET_ECU"
          Write-Host "Test Cases : $env:TEST_CASES"
          Write-Host "Playbook   : $env:PLAYBOOK_NAME"
          Write-Host "Project ID : $env:ONECX_PROJECT_ID"
          Write-Host '========================================'


      # ==========================================================
      # 2. RESOLVE RESOURCE AND PATHS
      # ==========================================================

      - name: Resolve ONE.CX resource and paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requestedBench = $env:BENCH_ID.Trim()
          $bench = $requestedBench.ToUpperInvariant()

          switch ($bench) {

            { $_ -in @('SYSHIL1', 'SYSHIL1-LABTEST1') } {
              $resourceName = 'syshil1-labtest1'
              $workspaceRoot = 'D:\HIL\Testing\eeint-Test-Automation'
              break
            }

            { $_ -in @('SYSHIL2', 'SYSHIL2-LABTEST2') } {
              $resourceName = 'syshil2-labtest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'MICROBENCH',
                'MICROBENCHINFO',
                'MICROBENCHINFO-MICROBENCHHIL1'
              )
            } {
              $resourceName = 'microbenchinfo-microbenchhil1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'CHARGING',
                'SUBSYSCHARGING1',
                'SUBSYSCHARGING1-LABTEST6'
              )
            } {
              $resourceName = 'subsyscharging1-labtest6'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'INFO1',
                'SUBSYSINFO1',
                'SUBSYSINFO1-INFOTEST1'
              )
            } {
              $resourceName = 'subsysinfo1-infotest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'INFO2',
                'SUBSYSINFO2',
                'SUBSYSINFO2-INFOTEST2'
              )
            } {
              $resourceName = 'subsysinfo2-infotest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'THERMAL',
                'SUBSYSTHERMAL1',
                'SUBSYSTHERMAL1-THERMALTEST1'
              )
            } {
              $resourceName = 'subsysthermal1-thermaltest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            default {
              throw "Unsupported bench/resource: $requestedBench"
            }
          }

          $configurationFolder = $env:CONFIGURATION_FOLDER.Trim()
          $benchPackage = $env:BENCH_NAME.Trim()
          $targetEcu = $env:TARGET_ECU.Trim()

          $xilIdentifier = (
            'novi_hq/1stfloor/ee_lab_novi/' +
            "$resourceName/ControlComputer"
          )

          $ecuTestStepName = "ecu.test $resourceName Start"

          $tbcRelativePath = (
            "Configurations\$configurationFolder\" +
            "${configurationFolder}_TestBenchConfig.tbc"
          )

          $tcfRelativePath = (
            "Configurations\$configurationFolder\" +
            "${configurationFolder}_TestConfig.tcf"
          )

          $projectRelativePath = (
            "Packages\$benchPackage\L2_Quality_Gate\" +
            "$targetEcu\" +
            "${targetEcu}_L2QualityGate.prj"
          )

          "TESTGUIDE_RESOURCE=$resourceName" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ROOT=$workspaceRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "XIL_IDENTIFIER=$xilIdentifier" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "ECUTEST_STEP_NAME=$ecuTestStepName" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TBC_RELATIVE_PATH=$tbcRelativePath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TCF_RELATIVE_PATH=$tcfRelativePath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "PROJECT_RELATIVE_PATH=$projectRelativePath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'RESOURCE RESOLUTION'
          Write-Host '========================================'
          Write-Host "Resource   : $resourceName"
          Write-Host "Workspace  : $workspaceRoot"
          Write-Host "Identifier : $xilIdentifier"
          Write-Host "TBC        : $tbcRelativePath"
          Write-Host "TCF        : $tcfRelativePath"
          Write-Host "PRJ        : $projectRelativePath"
          Write-Host '========================================'


      # ==========================================================
      # 3. PARSE TEST CASES
      # ==========================================================

      - name: Parse Jira test cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ids = @(
            $env:TEST_CASES -split '[,;]' |
            ForEach-Object {
              $_.Trim()
            } |
            Where-Object {
              -not [System.String]::IsNullOrWhiteSpace($_)
            }
          )

          if ($ids.Count -eq 0) {
            throw 'No valid Jira test case IDs.'
          }

          $normalized = $ids -join ','

          "NORMALIZED_TEST_CASES=$normalized" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Test Cases: $normalized"


      # ==========================================================
      # 4. GENERATE PLAYBOOK
      # ==========================================================

      - name: Generate TestGuide playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $playbook = [ordered]@{

            metadata = [ordered]@{
              name = $env:PLAYBOOK_NAME
              taskNameTemplate = '${playbook_name} (${playbook_datetime}) ${distribution_count}'
              labels = @()
            }

            workspace = [ordered]@{

              source = [ordered]@{
                path = $env:TESTGUIDE_ROOT
                sourceType = 'location'
              }

              dependencies = @()
            }

            setup = [ordered]@{

              steps = @(

                [ordered]@{
                  reuse = 'always'
                  keepConfiguration = $false
                  waitMinutesForLicense = 0
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'ecuTestStart'
                },

                [ordered]@{
                  tbcPath = $env:TBC_RELATIVE_PATH
                  tcfPath = $env:TCF_RELATIVE_PATH
                  stepName = 'Test Configuration Selection'
                  type = 'configuration'
                }
              )
            }

            execution = [ordered]@{

              testcases = @(

                [ordered]@{
                  relativePath = $env:PROJECT_RELATIVE_PATH
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'project'
                }
              )
            }

            teardown = [ordered]@{

              steps = @(
                [ordered]@{
                  type = 'ecuTestStop'
                }
              )
            }

            xilConfigRequirements = @(

              [ordered]@{
                label = 'Identifier'
                category = 'XIL'
                value = $env:XIL_IDENTIFIER
                type = 'configuration'
              }
            )

            parameters = @()
          }

          $playbookFile = Join-Path `
            $env:RUNNER_TEMP `
            'testguide-playbook.json'

          $playbookJson = $playbook |
            ConvertTo-Json -Depth 30

          $playbookJson |
            Set-Content `
              -LiteralPath $playbookFile `
              -Encoding utf8

          if (-not (Test-Path -LiteralPath $playbookFile)) {
            throw 'Generated Playbook file is missing.'
          }

          $generatedPlaybook = Get-Content `
            -LiteralPath $playbookFile `
            -Raw |
            ConvertFrom-Json

          $actualIdentifier = [System.Convert]::ToString(
            $generatedPlaybook.xilConfigRequirements[0].value
          )

          $actualProjectPath = [System.Convert]::ToString(
            $generatedPlaybook.execution.testcases[0].relativePath
          )

          if ($actualIdentifier -ne $env:XIL_IDENTIFIER) {
            throw 'Generated XIL identifier does not match.'
          }

          if ($actualProjectPath -ne $env:PROJECT_RELATIVE_PATH) {
            throw 'Generated project path does not match.'
          }

          "TESTGUIDE_PLAYBOOK_FILE=$playbookFile" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'GENERATED PLAYBOOK'
          Write-Host '========================================'
          Write-Host $playbookJson
          Write-Host '========================================'


      # ==========================================================
      # 5. UPLOAD PLAYBOOK
      # ==========================================================

      - name: Upload TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:ONECX_AUTH_KEY
            )
          ) {
            throw 'ONECX_AUTH_KEY is missing.'
          }

          $folder = [System.Uri]::EscapeDataString('/')

          $uploadUrl = (
            "$env:ONECX_URL/api/v2/execution/playbook" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&folder=$folder"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $body = Get-Content `
            -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
            -Raw

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $uploadUrl `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $body `
            -ErrorAction Stop

          $playbookId = (
            [System.Convert]::ToString(
              $response.playbookId
            )
          ).Trim()

          if (
            [System.String]::IsNullOrWhiteSpace(
              $playbookId
            )
          ) {
            throw 'Upload did not return playbookId.'
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_PLAYBOOK_LINK=$($response.playbookLink)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Playbook ID: $playbookId"


      # ==========================================================
      # 6. EXECUTE PLAYBOOK
      # ==========================================================

      - name: Execute TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $executeUrl = (
            "$env:ONECX_URL/api/v2/execution/playbook/" +
            "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&checkLastExecution=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $jiraUrl = (
            'https://scoutmotors.atlassian.net/browse/' +
            $env:JIRA_KEY
          )

          $executeRequest = [ordered]@{

            name = (
              "$env:JIRA_KEY - " +
              "$env:TARGET_ECU L2 Quality Gate"
            )

            priority = 42

            parameters = @()

            additionalSettings = [ordered]@{
              analysisExecutionMode = 'sequential'
              downstreamAnalysisPartitioning = 'analysis'
              expirationTimeInMinutes = 60
              issueTrackerTickets = @($jiraUrl)
              remainingRetriesOnError = 0
            }
          }

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $executeUrl `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body (
              $executeRequest |
              ConvertTo-Json -Depth 20
            ) `
            -ErrorAction Stop

          $taskIds = @($response.taskIds)

          if ($taskIds.Count -eq 0) {
            throw 'Execution did not return taskIds.'
          }

          $taskId = (
            [System.Convert]::ToString(
              $taskIds[0]
            )
          ).Trim()

          if (
            [System.String]::IsNullOrWhiteSpace(
              $taskId
            )
          ) {
            throw 'Execution returned an empty taskId.'
          }

          "TESTGUIDE_TASK_ID=$taskId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Execution Task ID: $taskId"


      # ==========================================================
      # 7. POLL EXECUTION
      # ==========================================================

      - name: Poll TestGuide execution
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $taskUrl = (
            "$env:ONECX_URL/api/v2/execution/task/" +
            "$env:TESTGUIDE_TASK_ID" +
            "?projectId=$env:ONECX_PROJECT_ID"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $deadline = (Get-Date).AddMinutes(170)

          $successStates = @(
            'FINISHED',
            'COMPLETED',
            'SUCCESS',
            'SUCCEEDED'
          )

          $failureStates = @(
            'ERROR',
            'FAILED',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          $task = $null
          $attempt = 0
          $blockedSince = $null

          while ((Get-Date) -lt $deadline) {

            $attempt++

            $task = Invoke-RestMethod `
              -Method GET `
              -Uri $taskUrl `
              -Headers $headers `
              -ErrorAction Stop

            $state = (
              [System.Convert]::ToString(
                $task.state
              )
            ).Trim().ToUpperInvariant()

            $stateInfo = [System.Convert]::ToString(
              $task.stateInfo
            )

            $verdict = [System.Convert]::ToString(
              $task.aggregatedVerdict
            )

            Write-Host (
              "Attempt $attempt | " +
              "State=$state | " +
              "Verdict=$verdict | " +
              "StateInfo=$stateInfo"
            )

            if ($state -in $successStates) {
              break
            }

            if ($state -in $failureStates) {
              throw (
                "Execution failed. " +
                "State=$state. " +
                "StateInfo=$stateInfo"
              )
            }

            if ($state -eq 'BLOCKED') {

              if ($null -eq $blockedSince) {
                $blockedSince = Get-Date
              }

              if (
                (
                  (Get-Date) - $blockedSince
                ).TotalMinutes -ge 5
              ) {
                throw 'Execution remained BLOCKED for 5 minutes.'
              }

            }
            else {
              $blockedSince = $null
            }

            Start-Sleep -Seconds 10
          }

          if ($null -eq $task) {
            throw 'No execution task response was received.'
          }

          $finalState = (
            [System.Convert]::ToString(
              $task.state
            )
          ).Trim().ToUpperInvariant()

          if ($finalState -notin $successStates) {
            throw (
              "Execution timed out. Last state: $finalState"
            )
          }

          $startDate = [System.Convert]::ToString(
            $task.startDate
          )

          $endDate = [System.Convert]::ToString(
            $task.endDate
          )

          if (
            [System.String]::IsNullOrWhiteSpace(
              $startDate
            )
          ) {
            throw 'Completed task has no startDate.'
          }

          if (
            [System.String]::IsNullOrWhiteSpace(
              $endDate
            )
          ) {
            throw 'Completed task has no endDate.'
          }

          "FINAL_TASK_STATE=$($task.state)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_STATE_INFO=$($task.stateInfo)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_VERDICT=$($task.aggregatedVerdict)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_START_DATE=$startDate" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_END_DATE=$endDate" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 8. FIND CURRENT IMPORTED REPORT
      #
      # Correct endpoint:
      # /api/report/reports/history
      #
      # No ToUniversalTime() conversion.
      # ==========================================================

      - name: Find imported TestGuide report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $taskStart = [System.DateTime]::Parse(
            $env:TASK_START_DATE,
            [System.Globalization.CultureInfo]::InvariantCulture
          )

          $taskEnd = [System.DateTime]::Parse(
            $env:TASK_END_DATE,
            [System.Globalization.CultureInfo]::InvariantCulture
          )

          $windowStart = $taskStart.AddMinutes(-2)
          $windowEnd = $taskEnd.AddMinutes(20)

          $expectedPlan = (
            "$($env:TARGET_ECU.Trim())_L2QualityGate"
          )

          $deadline = (Get-Date).AddMinutes(15)
          $attempt = 0
          $selectedReport = $null

          while ((Get-Date) -lt $deadline) {

            $attempt++

            $startDate = $windowStart.ToString(
              'yyyy-MM-ddTHH:mm:ss.fffZ'
            )

            $endDate = $windowEnd.ToString(
              'yyyy-MM-ddTHH:mm:ss.fffZ'
            )

            $encodedStart = [System.Uri]::EscapeDataString(
              $startDate
            )

            $encodedEnd = [System.Uri]::EscapeDataString(
              $endDate
            )

            $historyUrl = (
              "$env:ONECX_URL/api/report/reports/history" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&startDate=$encodedStart" +
              "&endDate=$encodedEnd" +
              "&offset=0" +
              "&limit=100"
            )

            Write-Host ''
            Write-Host '========================================'
            Write-Host "REPORT HISTORY ATTEMPT $attempt"
            Write-Host '========================================'
            Write-Host "Expected Plan : $expectedPlan"
            Write-Host "Task Start    : $env:TASK_START_DATE"
            Write-Host "Task End      : $env:TASK_END_DATE"
            Write-Host "Search Start  : $startDate"
            Write-Host "Search End    : $endDate"
            Write-Host "URL           : $historyUrl"
            Write-Host '========================================'

            $response = Invoke-RestMethod `
              -Method GET `
              -Uri $historyUrl `
              -Headers $headers `
              -ErrorAction Stop

            $reports = @($response)

            Write-Host "Reports returned: $($reports.Count)"

            if ($reports.Count -gt 0) {

              foreach ($report in $reports) {

                Write-Host (
                  "ID=$($report.reportId) | " +
                  "Plan=$($report.testPlanName) | " +
                  "Status=$($report.status) | " +
                  "Execution=$($report.executionDate) | " +
                  "Upload=$($report.uploadDate)"
                )
              }
            }

            $matches = @(
              $reports |
              Where-Object {

                $name = (
                  [System.Convert]::ToString(
                    $_.testPlanName
                  )
                ).Trim()

                $status = (
                  [System.Convert]::ToString(
                    $_.status
                  )
                ).Trim().ToUpperInvariant()

                $executionText = (
                  [System.Convert]::ToString(
                    $_.executionDate
                  )
                ).Trim()

                if (
                  [System.String]::IsNullOrWhiteSpace(
                    $executionText
                  )
                ) {
                  return $false
                }

                $executionDate = [System.DateTime]::Parse(
                  $executionText,
                  [System.Globalization.CultureInfo]::InvariantCulture
                )

                return (
                  $name -ieq $expectedPlan -and
                  $status -eq 'COMPLETE' -and
                  $executionDate -ge $windowStart -and
                  $executionDate -le $windowEnd
                )
              } |
              Sort-Object {

                [System.DateTime]::Parse(
                  [System.Convert]::ToString(
                    $_.uploadDate
                  ),
                  [System.Globalization.CultureInfo]::InvariantCulture
                )

              } -Descending
            )

            if ($matches.Count -gt 0) {

              $selectedReport = $matches[0]

              Write-Host ''
              Write-Host (
                "Matching Report ID: " +
                "$($selectedReport.reportId)"
              )

              break
            }

            Write-Host (
              "No matching COMPLETE report for " +
              "$expectedPlan yet."
            )

            Start-Sleep -Seconds 15
          }

          if ($null -eq $selectedReport) {
            throw (
              'No COMPLETE TestGuide report found for ' +
              "$expectedPlan in the current execution window."
            )
          }

          $reportId = (
            [System.Convert]::ToString(
              $selectedReport.reportId
            )
          ).Trim()

          $numericReportId = 0

          if (
            -not [System.Int64]::TryParse(
              $reportId,
              [ref]$numericReportId
            )
          ) {
            throw "Matched reportId is not numeric: $reportId"
          }

          "TESTGUIDE_REPORT_ID=$numericReportId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_PLAN=$($selectedReport.testPlanName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_UPLOAD_DATE=$($selectedReport.uploadDate)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_EXECUTION_DATE=$($selectedReport.executionDate)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TESTGUIDE REPORT SELECTED'
          Write-Host '========================================'
          Write-Host "Report ID      : $numericReportId"
          Write-Host "Test Plan      : $($selectedReport.testPlanName)"
          Write-Host "Status         : $($selectedReport.status)"
          Write-Host "Execution Date : $($selectedReport.executionDate)"
          Write-Host "Upload Date    : $($selectedReport.uploadDate)"
          Write-Host "File Size      : $($selectedReport.fileSize)"
          Write-Host '========================================'


      # ==========================================================
      # 9. START ATX EXPORT
      #
      # Correct endpoint:
      # POST /api/report/export/atx/{reportId}
      # ==========================================================

      - name: Start ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:TESTGUIDE_REPORT_ID
            )
          ) {
            throw 'TESTGUIDE_REPORT_ID is missing.'
          }

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $reportId = [System.Uri]::EscapeDataString(
            $env:TESTGUIDE_REPORT_ID
          )

          $exportUrl = (
            "$env:ONECX_URL/api/report/export/atx/" +
            "$reportId" +
            "?useExportStorage=false"
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'START ATX EXPORT'
          Write-Host '========================================'
          Write-Host "Report ID : $env:TESTGUIDE_REPORT_ID"
          Write-Host "URL       : $exportUrl"
          Write-Host '========================================'

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $exportUrl `
            -Headers $headers `
            -ErrorAction Stop

          Write-Host 'ATX export response:'

          $response |
            ConvertTo-Json -Depth 20 |
            Write-Host

          $atxTaskId = (
            [System.Convert]::ToString(
              $response.taskId
            )
          ).Trim()

          if (
            [System.String]::IsNullOrWhiteSpace(
              $atxTaskId
            )
          ) {
            throw 'ATX export did not return taskId.'
          }

          "ATX_EXPORT_TASK_ID=$atxTaskId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "ATX Export Task UUID: $atxTaskId"


      # ==========================================================
      # 10. POLL ATX EXPORT
      #
      # Correct endpoint:
      # GET /api/report/export/atx/{taskId}/status
      # ==========================================================

      - name: Poll ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $taskId = [System.Uri]::EscapeDataString(
            $env:ATX_EXPORT_TASK_ID
          )

          $statusUrl = (
            "$env:ONECX_URL/api/report/export/atx/" +
            "$taskId/status"
          )

          $deadline = (Get-Date).AddMinutes(30)

          $successStates = @(
            'FINISHED',
            'COMPLETED',
            'COMPLETE',
            'SUCCESS',
            'SUCCEEDED',
            'READY',
            'DONE'
          )

          $failureStates = @(
            'FAILED',
            'FAILURE',
            'ERROR',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          $ready = $false
          $attempt = 0

          while ((Get-Date) -lt $deadline) {

            $attempt++

            $status = Invoke-RestMethod `
              -Method GET `
              -Uri $statusUrl `
              -Headers $headers `
              -ErrorAction Stop

            Write-Host ''
            Write-Host "ATX Export Attempt: $attempt"

            $status |
              ConvertTo-Json -Depth 20 |
              Write-Host

            if (
              $null -ne $status.done -and
              [System.Boolean]$status.done
            ) {
              $ready = $true
              break
            }

            $state = ''

            if ($null -ne $status.state) {

              $state = (
                [System.Convert]::ToString(
                  $status.state
                )
              ).Trim().ToUpperInvariant()

            }
            elseif ($null -ne $status.status) {

              $state = (
                [System.Convert]::ToString(
                  $status.status
                )
              ).Trim().ToUpperInvariant()

            }
            elseif ($status -is [System.String]) {

              $state = (
                [System.String]$status
              ).Trim().Trim('"').ToUpperInvariant()
            }

            if ($state -in $successStates) {
              $ready = $true
              break
            }

            if ($state -in $failureStates) {
              throw "ATX export failed: $state"
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ready) {
            throw 'ATX export timed out after 30 minutes.'
          }

          "ATX_EXPORT_STATE=COMPLETED" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 11. DOWNLOAD ATX EXPORT
      #
      # Correct endpoint:
      # GET /api/report/export/atx/{taskId}/download
      #
      # IMPORTANT:
      # Do NOT force Accept application/octet-stream.
      # ONE.CX chooses its native media type.
      # ==========================================================

      - name: Download ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:ATX_EXPORT_STATE -ne 'COMPLETED') {
            throw 'ATX export has not completed.'
          }

          $safeJiraKey = (
            $env:JIRA_KEY -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $safeEcu = (
            $env:TARGET_ECU -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $temporaryFile = Join-Path `
            $env:RUNNER_TEMP `
            "${safeJiraKey}_${safeEcu}_ATX_Export.bin"

          $taskId = [System.Uri]::EscapeDataString(
            $env:ATX_EXPORT_TASK_ID
          )

          $downloadUrl = (
            "$env:ONECX_URL/api/report/export/atx/" +
            "$taskId/download"
          )

          # IMPORTANT:
          # No Accept header here.
          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'DOWNLOAD ATX EXPORT'
          Write-Host '========================================'
          Write-Host "Report ID : $env:TESTGUIDE_REPORT_ID"
          Write-Host "Task UUID : $env:ATX_EXPORT_TASK_ID"
          Write-Host "URL       : $downloadUrl"
          Write-Host "Temp File : $temporaryFile"
          Write-Host '========================================'

          try {

            $response = Invoke-WebRequest `
              -Method GET `
              -Uri $downloadUrl `
              -Headers $headers `
              -OutFile $temporaryFile `
              -PassThru `
              -ErrorAction Stop

          }
          catch {

            Write-Host ''
            Write-Host '========================================'
            Write-Host 'ATX DOWNLOAD FAILED'
            Write-Host '========================================'
            Write-Host "Exception: $($_.Exception.Message)"

            if ($null -ne $_.Exception.Response) {

              try {
                Write-Host (
                  "HTTP Status: " +
                  [int]$_.Exception.Response.StatusCode
                )
              }
              catch {
                Write-Host 'HTTP status unavailable.'
              }

              try {
                Write-Host (
                  "Content-Type: " +
                  $_.Exception.Response.Content.Headers.ContentType
                )
              }
              catch {
                Write-Host 'Content-Type unavailable.'
              }
            }

            if ($null -ne $_.ErrorDetails) {
              Write-Host 'Response body:'
              Write-Host $_.ErrorDetails.Message
            }

            throw
          }

          if (
            -not (
              Test-Path -LiteralPath $temporaryFile
            )
          ) {
            throw 'ATX export was not downloaded.'
          }

          $fileInfo = Get-Item `
            -LiteralPath $temporaryFile

          if ($fileInfo.Length -eq 0) {
            throw 'ATX export is empty.'
          }

          Write-Host ''
          Write-Host "HTTP Status : $($response.StatusCode)"

          try {
            Write-Host (
              "Content-Type: " +
              $response.Headers.'Content-Type'
            )
          }
          catch {
            Write-Host 'Content-Type unavailable.'
          }

          Write-Host "Size        : $($fileInfo.Length) bytes"

          $bytes = [System.IO.File]::ReadAllBytes(
            $temporaryFile
          )

          $signatureLength = [System.Math]::Min(
            4,
            $bytes.Length
          )

          $signature = [System.Text.Encoding]::ASCII.GetString(
            $bytes,
            0,
            $signatureLength
          )

          Write-Host "Signature   : $signature"

          if ($signature.StartsWith('PK')) {

            $finalFile = Join-Path `
              $env:RUNNER_TEMP `
              "${safeJiraKey}_${safeEcu}_ATX_Export.zip"

            $exportType = 'ZIP'

          }
          else {

            $previewLength = [System.Math]::Min(
              500,
              $bytes.Length
            )

            $preview = [System.Text.Encoding]::UTF8.GetString(
              $bytes,
              0,
              $previewLength
            )

            if (
              $preview.TrimStart().StartsWith('{') -or
              $preview.TrimStart().StartsWith('<html') -or
              $preview.TrimStart().StartsWith('<!DOCTYPE html')
            ) {

              Write-Host ''
              Write-Host 'Unexpected response:'
              Write-Host $preview

              throw (
                'ATX download returned JSON or HTML ' +
                'instead of the exported report.'
              )
            }

            $finalFile = Join-Path `
              $env:RUNNER_TEMP `
              "${safeJiraKey}_${safeEcu}_ATX_Export.atx"

            $exportType = 'ATX'
          }

          Move-Item `
            -LiteralPath $temporaryFile `
            -Destination $finalFile `
            -Force

          $finalInfo = Get-Item `
            -LiteralPath $finalFile

          "TESTGUIDE_ATX_EXPORT_TYPE=$exportType" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ATX_EXPORT_FILE=$finalFile" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ATX_EXPORT_SIZE=$($finalInfo.Length)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'ATX EXPORT DOWNLOADED'
          Write-Host '========================================'
          Write-Host "Type : $exportType"
          Write-Host "File : $finalFile"
          Write-Host "Size : $($finalInfo.Length) bytes"
          Write-Host '========================================'


      # ==========================================================
      # 12. UPLOAD ATX TO GITHUB ACTIONS
      # ==========================================================

      - name: Upload ATX export to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JIRA_KEY }}_${{ env.TARGET_ECU }}_ATX
          path: ${{ env.TESTGUIDE_ATX_EXPORT_FILE }}
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 13. SUMMARY
      # ==========================================================

      - name: Publish execution summary
        if: always()
        shell: pwsh
        run: |
          $summary = @(
            '## TestGuide ATX Execution',
            '',
            '| Field | Value |',
            '|---|---|',
            "| Jira | $env:JIRA_KEY |",
            "| Bench | $env:BENCH_ID |",
            "| Resource | $env:TESTGUIDE_RESOURCE |",
            "| ECU | $env:TARGET_ECU |",
            "| XIL | $env:XIL_IDENTIFIER |",
            "| Workspace | $env:TESTGUIDE_ROOT |",
            "| TBC | $env:TBC_RELATIVE_PATH |",
            "| TCF | $env:TCF_RELATIVE_PATH |",
            "| PRJ | $env:PROJECT_RELATIVE_PATH |",
            "| Playbook ID | $env:TESTGUIDE_PLAYBOOK_ID |",
            "| Playbook Link | $env:TESTGUIDE_PLAYBOOK_LINK |",
            "| Execution Task | $env:TESTGUIDE_TASK_ID |",
            "| Execution State | $env:FINAL_TASK_STATE |",
            "| State Info | $env:FINAL_TASK_STATE_INFO |",
            "| Verdict | $env:FINAL_TASK_VERDICT |",
            "| Task Start | $env:TASK_START_DATE |",
            "| Task End | $env:TASK_END_DATE |",
            "| TestGuide Report ID | $env:TESTGUIDE_REPORT_ID |",
            "| Report Test Plan | $env:TESTGUIDE_REPORT_PLAN |",
            "| Report Execution Date | $env:TESTGUIDE_REPORT_EXECUTION_DATE |",
            "| Report Upload Date | $env:TESTGUIDE_REPORT_UPLOAD_DATE |",
            "| ATX Export Task UUID | $env:ATX_EXPORT_TASK_ID |",
            "| ATX Export State | $env:ATX_EXPORT_STATE |",
            "| ATX Export Type | $env:TESTGUIDE_ATX_EXPORT_TYPE |",
            "| ATX Export File | $env:TESTGUIDE_ATX_EXPORT_FILE |",
            "| ATX Export Size | $env:TESTGUIDE_ATX_EXPORT_SIZE bytes |",
            "| Workflow Status | ${{ job.status }} |"
          )

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
