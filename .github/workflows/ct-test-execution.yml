name: CT TestGuide Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:

  testguide-execution:

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    env:

      # ==========================================================
      # ALL TEST INPUTS COME FROM JIRA
      # ==========================================================

      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK: ${{ github.event.client_payload.playbook_name }}

      # ==========================================================
      # STATIC MACHINE CONFIGURATION
      # ==========================================================

      # Repository replica available on GitHub runner
      LOCAL_ROOT: 'C:\HIL\Testing\eeint-Test-Automation'

      # Path TestGuide should receive
      TESTGUIDE_ROOT: 'D:\HIL\Testing\eeint-Test-Automation'


    steps:

      # ==========================================================
      # PHASE 1
      # Validate Jira payload
      # ==========================================================

      - name: Validate Jira execution request
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "CT TESTGUIDE EXECUTION"
          Write-Host "============================================"
          Write-Host "Jira Key    : $env:JIRA_KEY"
          Write-Host "Bench ID    : $env:BENCH_ID"
          Write-Host "Bench Name  : $env:BENCH_NAME"
          Write-Host "Target ECU  : $env:TARGET_ECU"
          Write-Host "Test Cases  : $env:TEST_CASES"
          Write-Host "Playbook    : $env:PLAYBOOK"
          Write-Host "============================================"

          $required = @{
              JIRA_KEY    = $env:JIRA_KEY
              BENCH_ID    = $env:BENCH_ID
              BENCH_NAME  = $env:BENCH_NAME
              TARGET_ECU  = $env:TARGET_ECU
              TEST_CASES  = $env:TEST_CASES
              PLAYBOOK    = $env:PLAYBOOK
          }

          foreach ($item in $required.GetEnumerator()) {

              if ([string]::IsNullOrWhiteSpace(
                  [string]$item.Value
              )) {

                  throw "Required Jira input '$($item.Key)' is missing."

              }
          }


      # ==========================================================
      # PHASE 2
      # Validate local repository replica
      # ==========================================================

      - name: Validate local project repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "LOCAL REPOSITORY"
          Write-Host "============================================"

          Write-Host "Runner:"
          hostname

          Write-Host ""

          Write-Host "Local repository:"
          Write-Host "$env:LOCAL_ROOT"

          if (-not (Test-Path $env:LOCAL_ROOT)) {

              throw @"
          Local repository does not exist.

          Expected:
          $env:LOCAL_ROOT
          "@
          }

          Write-Host ""
          Write-Host "Local repository exists."


      # ==========================================================
      # PHASE 3
      # Parse Jira Test Case IDs
      # ==========================================================

      - name: Parse Jira Test Cases
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $testCases = @(

              $env:TEST_CASES -split '[,;]' |

              ForEach-Object {
                  $_.Trim()
              } |

              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              }
          )

          if ($testCases.Count -eq 0) {

              throw "No valid Test Case IDs were received from Jira."

          }

          $normalized = $testCases -join ","

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TEST CASES"
          Write-Host "============================================"

          foreach ($tc in $testCases) {
              Write-Host "TC: $tc"
          }

          Write-Host "============================================"

          "NORMALIZED_TEST_CASES=$normalized" >> $env:GITHUB_ENV


      # ==========================================================
      # PHASE 4
      # Locate PRJ using Jira bench_name
      # ==========================================================

      - name: Resolve PRJ from Bench Name
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:LOCAL_ROOT
          $benchName = $env:BENCH_NAME

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PROJECT RESOLUTION"
          Write-Host "============================================"

          Write-Host "Repository:"
          Write-Host "$root"

          Write-Host ""

          Write-Host "Jira Bench Name:"
          Write-Host "$benchName"

          Write-Host ""

          $projects = @(
              Get-ChildItem `
                  -Path $root `
                  -Filter "*.prj" `
                  -File `
                  -Recurse `
                  -ErrorAction Stop
          )

          if ($projects.Count -eq 0) {

              throw "No .prj files were found under $root"

          }

          Write-Host "Available PRJ files:"

          foreach ($project in $projects) {
              Write-Host "  $($project.FullName)"
          }

          Write-Host ""

          # ------------------------------------------------------
          # bench_name determines the applicable project.
          #
          # Example:
          #
          # bench_name = system-hil
          #
          # Local:
          # C:\HIL\Testing\eeint-Test-Automation\
          #     system-hil\...\project.prj
          #
          # ------------------------------------------------------

          $matches = @(
              $projects |

              Where-Object {

                  $_.FullName.IndexOf(
                      $benchName,
                      [System.StringComparison]::OrdinalIgnoreCase
                  ) -ge 0

              }
          )

          if ($matches.Count -eq 0) {

              throw @"
          No PRJ file matched the Jira bench name.

          Bench Name:
          $benchName
          "@
          }

          if ($matches.Count -gt 1) {

              Write-Host ""
              Write-Host "Multiple matching PRJ files:"

              foreach ($match in $matches) {

                  Write-Host "  $($match.FullName)"

              }

              throw @"
          Multiple PRJ files matched bench '$benchName'.

          Refusing to select a project automatically.
          "@
          }

          $project = $matches[0]

          Write-Host ""
          Write-Host "============================================"
          Write-Host "LOCAL PROJECT FOUND"
          Write-Host "============================================"

          Write-Host "$($project.FullName)"

          Write-Host "============================================"

          "LOCAL_PROJECT_PATH=$($project.FullName)" >> $env:GITHUB_ENV


      # ==========================================================
      # PHASE 5
      # Convert local C:\ path into TestGuide D:\ path
      #
      # IMPORTANT:
      # We preserve everything beneath the repository root.
      # ==========================================================

      - name: Create TestGuide PRJ Path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $localRoot = $env:LOCAL_ROOT

          $testGuideRoot = $env:TESTGUIDE_ROOT

          $localProject = $env:LOCAL_PROJECT_PATH


          if (-not (Test-Path $localProject)) {

              throw "Resolved local PRJ no longer exists: $localProject"

          }


          $relativePath = [System.IO.Path]::GetRelativePath(
              $localRoot,
              $localProject
          )


          $testGuidePath = Join-Path `
              $testGuideRoot `
              $relativePath


          Write-Host ""
          Write-Host "============================================"
          Write-Host "PROJECT PATH MAPPING"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "LOCAL:"
          Write-Host "$localProject"

          Write-Host ""
          Write-Host "RELATIVE:"
          Write-Host "$relativePath"

          Write-Host ""
          Write-Host "TESTGUIDE:"
          Write-Host "$testGuidePath"

          Write-Host ""
          Write-Host "============================================"


          "PROJECT_RELATIVE_PATH=$relativePath" >> $env:GITHUB_ENV

          "TESTGUIDE_PROJECT_PATH=$testGuidePath" >> $env:GITHUB_ENV


      # ==========================================================
      # PHASE 6
      # Prepare final TestGuide execution task
      # ==========================================================

      - name: Prepare TestGuide Task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TESTGUIDE EXECUTION TASK"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "Jira:"
          Write-Host "  $env:JIRA_KEY"

          Write-Host ""
          Write-Host "Bench ID:"
          Write-Host "  $env:BENCH_ID"

          Write-Host ""
          Write-Host "Bench Name:"
          Write-Host "  $env:BENCH_NAME"

          Write-Host ""
          Write-Host "Target ECU:"
          Write-Host "  $env:TARGET_ECU"

          Write-Host ""
          Write-Host "Test Cases:"
          Write-Host "  $env:NORMALIZED_TEST_CASES"

          Write-Host ""
          Write-Host "Playbook:"
          Write-Host "  $env:PLAYBOOK"

          Write-Host ""
          Write-Host "Local PRJ:"
          Write-Host "  $env:LOCAL_PROJECT_PATH"

          Write-Host ""
          Write-Host "TestGuide PRJ:"
          Write-Host "  $env:TESTGUIDE_PROJECT_PATH"

          Write-Host ""
          Write-Host "============================================"


      # ==========================================================
      # PHASE 7
      # TESTGUIDE API
      # ==========================================================
      #
      # We deliberately stop before making an unverified API call.
      #
      # At this point these values are ready:
      #
      #   $env:JIRA_KEY
      #   $env:BENCH_ID
      #   $env:BENCH_NAME
      #   $env:TARGET_ECU
      #   $env:NORMALIZED_TEST_CASES
      #   $env:PLAYBOOK
      #   $env:TESTGUIDE  #
      # Once the real TestGuide execution endpoint/request schema
      # is verified, the Invoke-RestMethod call goes here.
      # ==========================================================

      - name: Ready for TestGuide API
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "READY FOR TESTGUIDE API"
          Write-Host "============================================"

          Write-Host "Jira     : $env:JIRA_KEY"
          Write-Host "Bench    : $env:BENCH_ID"
          Write-Host "Playbook : $env:PLAYBOOK"
          Write-Host "Project  : $env:TESTGUIDE_PROJECT_PATH"
          Write-Host "ECU      : $env:TARGET_ECU"
          Write-Host "TCs      : $env:NORMALIZED_TEST_CASES"

          Write-Host "============================================"
