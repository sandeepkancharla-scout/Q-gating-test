name: CT TestGuide Jira Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  generate-testguide-playbook:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 60

    concurrency:
      group: testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      # ==========================================================
      # INPUTS FROM JIRA
      # ==========================================================

      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}

      # ==========================================================
      # EXISTING LOCAL REPOSITORY
      #
      # No checkout, Git, submodule update, or file copy is done.
      # ==========================================================

      LOCAL_ROOT: 'C:\HIL\Testing\eeint-Test-Automation'

      # ==========================================================
      # CURRENT CONFIGURATION MAPPING
      #
      # TBC and TCF are selected from:
      # Configurations\SUBSYS1
      # ==========================================================

      CONFIGURATION_FOLDER: 'SUBSYS1'

      # Existing repository secret.
      ONECX_PROJECT_ID: ${{ secrets.ONECX_PROJECT_ID }}

    steps:

      # ==========================================================
      # 1. VALIDATE JIRA INPUTS
      # ==========================================================

      - name: Validate Jira request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredValues = @{
            JIRA_KEY = $env:JIRA_KEY
            BENCH_ID = $env:BENCH_ID
            BENCH_NAME = $env:BENCH_NAME
            TARGET_ECU = $env:TARGET_ECU
            TEST_CASES = $env:TEST_CASES
            PLAYBOOK_NAME = $env:PLAYBOOK_NAME
            ONECX_PROJECT_ID = $env:ONECX_PROJECT_ID
          }

          foreach ($entry in $requiredValues.GetEnumerator()) {
            if (
              [System.String]::IsNullOrWhiteSpace(
                [System.String]$entry.Value
              )
            ) {
              throw "Missing required value: $($entry.Key)"
            }
          }

          if (-not (Test-Path -LiteralPath $env:LOCAL_ROOT)) {
            throw "Local repository does not exist: $env:LOCAL_ROOT"
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JIRA EXECUTION REQUEST'
          Write-Host '========================================'
          Write-Host "Jira Key      : $env:JIRA_KEY"
          Write-Host "Bench ID      : $env:BENCH_ID"
          Write-Host "Bench Name    : $env:BENCH_NAME"
          Write-Host "Target ECU    : $env:TARGET_ECU"
          Write-Host "Test Cases    : $env:TEST_CASES"
          Write-Host "Playbook Name : $env:PLAYBOOK_NAME"
          Write-Host "OneCX Project : $env:ONECX_PROJECT_ID"
          Write-Host '========================================'


      # ==========================================================
      # 2. VALIDATE LOCAL REPOSITORY STRUCTURE
      # ==========================================================

      - name: Validate local repository structure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $configurationRoot = Join-Path `
            $env:LOCAL_ROOT `
            'Configurations'

          $packagesRoot = Join-Path `
            $env:LOCAL_ROOT `
            'Packages'

          if (-not (Test-Path -LiteralPath $configurationRoot)) {
            throw "Configurations folder is missing: $configurationRoot"
          }

          if (-not (Test-Path -LiteralPath $packagesRoot)) {
            throw "Packages folder is missing: $packagesRoot"
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'LOCAL REPOSITORY'
          Write-Host '========================================'
          Write-Host "Repository     : $env:LOCAL_ROOT"
          Write-Host "Configurations : $configurationRoot"
          Write-Host "Packages       : $packagesRoot"
          Write-Host '========================================'


      # ==========================================================
      # 3. RESOLVE TESTGUIDE BENCH
      #
      # Jira convention:
      # SYSHIL1
      #
      # TestGuide convention:
      # SysHIL1
      #
      # SYSHIL1 uses D:
      # Other benches currently use C:
      # ==========================================================

      - name: Resolve TestGuide bench
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $normalizedBenchId = $env:BENCH_ID.Trim().ToUpperInvariant()

          switch ($normalizedBenchId) {
            'SYSHIL1' {
              $testGuideBench = 'SysHIL1'
              $workspaceRoot = 'D:\HIL\Testing\eeint-Test-Automation'
            }

            'SYSHIL2' {
              $testGuideBench = 'SysHIL2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'SYSHIL5' {
              $testGuideBench = 'SysHIL5'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            default {
              $testGuideBench = $env:BENCH_ID.Trim()
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }
          }

          $ecuTestStepName = "ecu.test $testGuideBench Start"

          $xilIdentifier = (
            "novi_hq/1stfloor/EE_Lab_novi/" +
            "$testGuideBench/TestLabPC1"
          )

          "TESTGUIDE_BENCH=$testGuideBench" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "TESTGUIDE_ROOT=$workspaceRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "ECUTEST_STEP_NAME=$ecuTestStepName" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "XIL_IDENTIFIER=$xilIdentifier" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TESTGUIDE BENCH'
          Write-Host '========================================'
          Write-Host "Jira Bench ID   : $env:BENCH_ID"
          Write-Host "TestGuide Bench : $testGuideBench"
          Write-Host "Workspace       : $workspaceRoot"
          Write-Host "Start Step      : $ecuTestStepName"
          Write-Host "XIL Identifier  : $xilIdentifier"
          Write-Host '========================================'


      # ==========================================================
      # 4. RESOLVE BENCH PACKAGE
      #
      # Example:
      # bench_name = system-hil
      #
      # Packages\system-hil
      # ==========================================================

      - name: Resolve bench package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $normalizedBenchName = $env:BENCH_NAME.Trim()

          $packageRoot = Join-Path `
            $env:LOCAL_ROOT `
            "Packages\$normalizedBenchName"

          if (-not (Test-Path -LiteralPath $packageRoot)) {
            throw "Bench package does not exist: $packageRoot"
          }

          "PACKAGE_ROOT=$packageRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'BENCH PACKAGE'
          Write-Host '========================================'
          Write-Host "Bench Name : $normalizedBenchName"
          Write-Host "Path       : $packageRoot"
          Write-Host '========================================'


      # ==========================================================
      # 5. RESOLVE TBC AND TCF
      #
      # Current expected folder:
      # Configurations\SUBSYS1
      #
      # Current expected filenames:
      # SUBSYS1_TestBenchConfig.tbc
      # SUBSYS1_TestConfig.tcf
      #
      # Exact expected files are preferred.
      # Recursive discovery is used only as a fallback.
      # ==========================================================

      - name: Resolve TBC and TCF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $configurationFolder = $env:CONFIGURATION_FOLDER.Trim()

          $configurationRoot = Join-Path `
            $env:LOCAL_ROOT `
            "Configurations\$configurationFolder"

          if (-not (Test-Path -LiteralPath $configurationRoot)) {
            throw "Configuration folder does not exist: $configurationRoot"
          }

          $expectedTbcName = (
            "${configurationFolder}_TestBenchConfig.tbc"
          )

          $expectedTcfName = (
            "${configurationFolder}_TestConfig.tcf"
          )

          $expectedTbcPath = Join-Path `
            $configurationRoot `
            $expectedTbcName

          $expectedTcfPath = Join-Path `
            $configurationRoot `
            $expectedTcfName

          if (Test-Path -LiteralPath $expectedTbcPath) {
            $selectedTbc = Get-Item -LiteralPath $expectedTbcPath
          }
          else {
            $tbcCandidates = @(
              Get-ChildItem `
                -LiteralPath $configurationRoot `
                -Filter '*.tbc' `
                -File `
                -Recurse `
                -ErrorAction Stop
            )

            if ($tbcCandidates.Count -ne 1) {
              Write-Host ''
              Write-Host 'TBC candidates:'

              $tbcCandidates |
                ForEach-Object {
                  Write-Host "  $($_.FullName)"
                }

              throw (
                "Expected exactly one TBC under " +
                "$configurationRoot. Found " +
                "$($tbcCandidates.Count)."
              )
            }

            $selectedTbc = $tbcCandidates[0]
          }

          if (Test-Path -LiteralPath $expectedTcfPath) {
            $selectedTcf = Get-Item -LiteralPath $expectedTcfPath
          }
          else {
            $tcfCandidates = @(
              Get-ChildItem `
                -LiteralPath $configurationRoot `
                -Filter '*.tcf' `
                -File `
                -Recurse `
                -ErrorAction Stop
            )

            if ($tcfCandidates.Count -ne 1) {
              Write-Host ''
              Write-Host 'TCF candidates:'

              $tcfCandidates |
                ForEach-Object {
                  Write-Host "  $($_.FullName)"
                }

              throw (
                "Expected exactly one TCF under " +
                "$configurationRoot. Found " +
                "$($tcfCandidates.Count)."
              )
            }

            $selectedTcf = $tcfCandidates[0]
          }

          $tbcRelativePath = (
            [System.IO.Path]::GetRelativePath(
              $env:LOCAL_ROOT,
              $selectedTbc.FullName
            )
          )

          $tcfRelativePath = (
            [System.IO.Path]::GetRelativePath(
              $env:LOCAL_ROOT,
              $selectedTcf.FullName
            )
          )

          "TBC_RELATIVE_PATH=$tbcRelativePath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "TCF_RELATIVE_PATH=$tcfRelativePath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TEST CONFIGURATION'
          Write-Host '========================================'
          Write-Host "Configuration : $configurationFolder"
          Write-Host "TBC           : $tbcRelativePath"
          Write-Host "TCF           : $tcfRelativePath"
          Write-Host '========================================'


      # ==========================================================
      # 6. RESOLVE ECU PROJECT
      #
      # Naming convention:
      #
      # <TARGET_ECU>_L2QualityGate.prj
      #
      # Example:
      #
      # TARGET_ECU = VAS_FL
      #
      # Expected:
      #
      # VAS_FL_L2QualityGate.prj
      # ==========================================================

      - name: Resolve target ECU project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $targetEcu = $env:TARGET_ECU.Trim()

          $expectedProjectName = (
            "${targetEcu}_L2QualityGate.prj"
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'ECU PROJECT RESOLUTION'
          Write-Host '========================================'
          Write-Host "Target ECU   : $targetEcu"
          Write-Host "Expected PRJ : $expectedProjectName"
          Write-Host "Package Root : $env:PACKAGE_ROOT"
          Write-Host '========================================'

          $projectMatches = @(
            Get-ChildItem `
              -LiteralPath $env:PACKAGE_ROOT `
              -Filter $expectedProjectName `
              -File `
              -Recurse `
              -ErrorAction Stop
          )

          if ($projectMatches.Count -eq 0) {
            Write-Host ''
            Write-Host 'Available L2 Quality Gate projects:'

            Get-ChildItem `
              -LiteralPath $env:PACKAGE_ROOT `
              -Filter '*_L2QualityGate.prj' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "  $($_.FullName)"
            }

            throw "Project not found: $expectedProjectName"
          }

          if ($projectMatches.Count -gt 1) {
            Write-Host ''
            Write-Host 'Multiple matching projects:'

            $projectMatches |
              ForEach-Object {
                Write-Host "  $($_.FullName)"
              }

            throw (
              "Multiple instances of " +
              "$expectedProjectName were found."
            )
          }

          $selectedProject = $projectMatches[0]

          $projectRelativePath = (
            [System.IO.Path]::GetRelativePath(
              $env:LOCAL_ROOT,
              $selectedProject.FullName
            )
          )

          "PROJECT_RELATIVE_PATH=$projectRelativePath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "LOCAL_PROJECT_PATH=$($selectedProject.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PROJECT SELECTED'
          Write-Host '========================================'
          Write-Host "ECU      : $targetEcu"
          Write-Host "File     : $($selectedProject.Name)"
          Write-Host "Full     : $($selectedProject.FullName)"
          Write-Host "Relative : $projectRelativePath"
          Write-Host '========================================'


      # ==========================================================
      # 7. PARSE JIRA TEST CASE IDS
      #
      # Stored for later execute-request parameters.
      # The full PRJ remains the execution entry in this playbook.
      # ==========================================================

      - name: Parse Jira Test Cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $testCaseIds = @(
            $env:TEST_CASES -split '[,;]' |
            ForEach-Object {
              $_.Trim()
            } |
            Where-Object {
              -not [System.String]::IsNullOrWhiteSpace($_)
            }
          )

          if ($testCaseIds.Count -eq 0) {
            throw 'No valid Jira Test Case IDs were supplied.'
          }

          $normalizedTestCases = $testCaseIds -join ','

          "NORMALIZED_TEST_CASES=$normalizedTestCases" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TEST CASE IDS'
          Write-Host '========================================'

          $testCaseIds |
            ForEach-Object {
              Write-Host "  $_"
            }

          Write-Host '========================================'


      # ==========================================================
      # 8. GENERATE EXACT TESTGUIDE PLAYBOOK STRUCTURE
      # ==========================================================

      - name: Generate TestGuide playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $playbook = [ordered]@{

            metadata = [ordered]@{
              name = $env:PLAYBOOK_NAME

              taskNameTemplate = (
                '${playbook_name} ' +
                '(${playbook_datetime}) ' +
                '${distribution_count}'
              )

              labels = @()
            }


            workspace = [ordered]@{
              source = [ordered]@{
                path = $env:TESTGUIDE_ROOT
                sourceType = 'location'
              }

              dependencies = @()
            }


            setup = [ordered]@{
              steps = @(

                [ordered]@{
                  reuse = 'always'
                  keepConfiguration = $false
                  waitMinutesForLicense = 0
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'ecuTestStart'
                },

                [ordered]@{
                  tbcPath = $env:TBC_RELATIVE_PATH
                  tcfPath = $env:TCF_RELATIVE_PATH
                  stepName = 'Test Configuration Selection'
                  type = 'configuration'
                }
              )
            }


            execution = [ordered]@{
              testcases = @(

                [ordered]@{
                  relativePath = $env:PROJECT_RELATIVE_PATH
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'project'
                }
              )
            }


            teardown = [ordered]@{
              steps = @(

                [ordered]@{
                  type = 'ecuTestStop'
                }
              )
            }


            xilConfigRequirements = @(

              [ordered]@{
                label = 'Identifier'
                category = 'XIL'
                value = $env:XIL_IDENTIFIER
                type = 'configuration'
              }
            )
          }

          $playbookJson = (
            $playbook |
            ConvertTo-Json -Depth 30
          )

          $playbookFile = Join-Path `
            $env:RUNNER_TEMP `
            'testguide-playbook.json'

          $playbookJson |
            Set-Content `
              -LiteralPath $playbookFile `
              -Encoding utf8

          "TESTGUIDE_PLAYBOOK_FILE=$playbookFile" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'GENERATED TESTGUIDE PLAYBOOK'
          Write-Host '========================================'
          Write-Host $playbookJson
          Write-Host '========================================'


      # ==========================================================
      # 9. VALIDATE GENERATED PLAYBOOK
      # ==========================================================

      - name: Validate generated playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            -not (
              Test-Path `
                -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE
            )
          ) {
            throw 'Generated playbook JSON does not exist.'
          }

          $playbook = (
            Get-Content `
              -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
              -Raw |
            ConvertFrom-Json
          )

          $requiredProperties = @(
            'metadata',
            'workspace',
            'setup',
            'execution',
            'teardown',
            'xilConfigRequirements'
          )

          foreach ($property in $requiredProperties) {
            if ($null -eq $playbook.$property) {
              throw "Generated playbook is missing '$property'."
            }
          }

          if ($playbook.setup.steps.Count -ne 2) {
            throw 'Expected exactly 2 setup steps.'
          }

          if ($playbook.execution.testcases.Count -ne 1) {
            throw 'Expected exactly 1 project execution entry.'
          }

          if ($playbook.teardown.steps.Count -ne 1) {
            throw 'Expected exactly 1 teardown step.'
          }

          if ($playbook.xilConfigRequirements.Count -ne 1) {
            throw 'Expected exactly 1 XIL requirement.'
          }

          if (
            $playbook.execution.testcases[0].relativePath -ne
            $env:PROJECT_RELATIVE_PATH
          ) {
            throw 'Generated project path does not match the selected PRJ.'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PLAYBOOK VALIDATION SUCCESSFUL'
          Write-Host '========================================'
          Write-Host "Name      : $($playbook.metadata.name)"
          Write-Host "Workspace : $($playbook.workspace.source.path)"
          Write-Host "TBC       : $($playbook.setup.steps[1].tbcPath)"
          Write-Host "TCF       : $($playbook.setup.steps[1].tcfPath)"
          Write-Host "PRJ       : $($playbook.execution.testcases[0].relativePath)"
          Write-Host "XIL       : $($playbook.xilConfigRequirements[0].value)"
          Write-Host '========================================'


      # ==========================================================
      # 10. PUBLISH SUMMARY
      #
      # This version validates Jira-driven playbook generation.
      # It does not upload or execute the playbook yet.
      # ==========================================================

      - name: Publish execution summary
        if: always()
        shell: pwsh
        run: |
          $summary = @(
            '## Jira-driven TestGuide playbook',
            '',
            '| Field | Value |',
            '|---|---|',
            "| Jira | $env:JIRA_KEY |",
            "| Bench | $env:TESTGUIDE_BENCH |",
            "| Bench Name | $env:BENCH_NAME |",
            "| Target ECU | $env:TARGET_ECU |",
            "| Expected PRJ | $($env:TARGET_ECU)_L2QualityGate.prj |",
            "| Test Cases | $env:NORMALIZED_TEST_CASES |",
            "| Playbook | $env:PLAYBOOK_NAME |",
            "| Workspace | $env:TESTGUIDE_ROOT |",
            "| TBC | $env:TBC_RELATIVE_PATH |",
            "| TCF | $env:TCF_RELATIVE_PATH |",
            "| PRJ | $env:PROJECT_RELATIVE_PATH |",
            "| XIL | $env:XIL_IDENTIFIER |",
            "| JSON | $env:TESTGUIDE_PLAYBOOK_FILE |",
            "| Status | ${{ job.status }} |"
          )

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
