name: CT TestGuide Jira Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  testguide:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}

      CONFIGURATION_FOLDER: 'SUBSYS1'

      ONECX_URL: 'https://testguide-ssp.onecx.vwgroup.com'
      ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

      ONECX_REPORT_TEMPLATE_ID: '19'
      ONECX_REPORT_TEMPLATE_TYPE: 'TEST_SUMMARY_REPORT'

    steps:

      # ==========================================================
      # 1. VALIDATE INPUTS
      # ==========================================================

      - name: Validate request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredValues = @{
            JIRA_KEY = $env:JIRA_KEY
            BENCH_ID = $env:BENCH_ID
            BENCH_NAME = $env:BENCH_NAME
            TARGET_ECU = $env:TARGET_ECU
            TEST_CASES = $env:TEST_CASES
            PLAYBOOK_NAME = $env:PLAYBOOK_NAME
            ONECX_PROJECT_ID = $env:ONECX_PROJECT_ID
          }

          foreach ($item in $requiredValues.GetEnumerator()) {
            if (
              [System.String]::IsNullOrWhiteSpace(
                [System.String]$item.Value
              )
            ) {
              throw "Missing required value: $($item.Key)"
            }
          }

          $projectId = 0

          if (
            -not [System.Int32]::TryParse(
              $env:ONECX_PROJECT_ID,
              [ref]$projectId
            )
          ) {
            throw 'ONECX_PROJECT_ID must be an integer.'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JIRA EXECUTION REQUEST'
          Write-Host '========================================'
          Write-Host "Jira       : $env:JIRA_KEY"
          Write-Host "Bench      : $env:BENCH_ID"
          Write-Host "Bench Name : $env:BENCH_NAME"
          Write-Host "ECU        : $env:TARGET_ECU"
          Write-Host "Test Cases : $env:TEST_CASES"
          Write-Host "Playbook   : $env:PLAYBOOK_NAME"
          Write-Host "Project ID : $env:ONECX_PROJECT_ID"
          Write-Host '========================================'


      # ==========================================================
      # 2. RESOLVE ONE.CX RESOURCE AND PATHS
      # ==========================================================

      - name: Resolve ONE.CX resource and paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requestedBench = $env:BENCH_ID.Trim()
          $bench = $requestedBench.ToUpperInvariant()

          switch ($bench) {

            { $_ -in @('SYSHIL1', 'SYSHIL1-LABTEST1') } {
              $resourceName = 'syshil1-labtest1'
              $workspaceRoot = 'D:\HIL\Testing\eeint-Test-Automation'
              break
            }

            { $_ -in @('SYSHIL2', 'SYSHIL2-LABTEST2') } {
              $resourceName = 'syshil2-labtest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'MICROBENCH',
                'MICROBENCHINFO',
                'MICROBENCHINFO-MICROBENCHHIL1'
              )
            } {
              $resourceName = 'microbenchinfo-microbenchhil1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'CHARGING',
                'SUBSYSCHARGING1',
                'SUBSYSCHARGING1-LABTEST6'
              )
            } {
              $resourceName = 'subsyscharging1-labtest6'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'INFO1',
                'SUBSYSINFO1',
                'SUBSYSINFO1-INFOTEST1'
              )
            } {
              $resourceName = 'subsysinfo1-infotest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'INFO2',
                'SUBSYSINFO2',
                'SUBSYSINFO2-INFOTEST2'
              )
            } {
              $resourceName = 'subsysinfo2-infotest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'THERMAL',
                'SUBSYSTHERMAL1',
                'SUBSYSTHERMAL1-THERMALTEST1'
              )
            } {
              $resourceName = 'subsysthermal1-thermaltest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            default {
              throw "Unsupported bench/resource: $requestedBench"
            }
          }

          $xilIdentifier = (
            'novi_hq/1stfloor/ee_lab_novi/' +
            "$resourceName/ControlComputer"
          )

          $ecuTestStepName = "ecu.test $resourceName Start"

          $configurationFolder = $env:CONFIGURATION_FOLDER.Trim()
          $benchPackage = $env:BENCH_NAME.Trim()
          $targetEcu = $env:TARGET_ECU.Trim()

          $tbcRelativePath = (
            "Configurations\$configurationFolder\" +
            "${configurationFolder}_TestBenchConfig.tbc"
          )

          $tcfRelativePath = (
            "Configurations\$configurationFolder\" +
            "${configurationFolder}_TestConfig.tcf"
          )

          # Example:
          # Packages\system-hil\L2_Quality_Gate\
          # VAS_FL\VAS_FL_L2QualityGate.prj

          $projectRelativePath = (
            "Packages\$benchPackage\L2_Quality_Gate\" +
            "$targetEcu\" +
            "${targetEcu}_L2QualityGate.prj"
          )

          "TESTGUIDE_RESOURCE=$resourceName" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ROOT=$workspaceRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "XIL_IDENTIFIER=$xilIdentifier" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "ECUTEST_STEP_NAME=$ecuTestStepName" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TBC_RELATIVE_PATH=$tbcRelativePath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TCF_RELATIVE_PATH=$tcfRelativePath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "PROJECT_RELATIVE_PATH=$projectRelativePath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $fullProjectPath = Join-Path `
            $workspaceRoot `
            $projectRelativePath

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'ONE.CX RESOURCE RESOLUTION'
          Write-Host '========================================'
          Write-Host "Requested   : $requestedBench"
          Write-Host "Resource    : $resourceName"
          Write-Host "Workspace   : $workspaceRoot"
          Write-Host "Identifier  : $xilIdentifier"
          Write-Host "ecu.test    : $ecuTestStepName"
          Write-Host "TBC         : $tbcRelativePath"
          Write-Host "TCF         : $tcfRelativePath"
          Write-Host "PRJ         : $projectRelativePath"
          Write-Host "Full PRJ    : $fullProjectPath"
          Write-Host '========================================'


      # ==========================================================
      # 3. PARSE TEST CASES
      # ==========================================================

      - name: Parse Jira test cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ids = @(
            $env:TEST_CASES -split '[,;]' |
            ForEach-Object {
              $_.Trim()
            } |
            Where-Object {
              -not [System.String]::IsNullOrWhiteSpace($_)
            }
          )

          if ($ids.Count -eq 0) {
            throw 'No valid Jira test case IDs.'
          }

          $normalized = $ids -join ','

          "NORMALIZED_TEST_CASES=$normalized" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Test Cases: $normalized"


      # ==========================================================
      # 4. GENERATE AND VALIDATE PLAYBOOK
      # ==========================================================

      - name: Generate and validate playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $playbook = [ordered]@{

            metadata = [ordered]@{
              name = $env:PLAYBOOK_NAME
              taskNameTemplate = '${playbook_name} (${playbook_datetime}) ${distribution_count}'
              labels = @()
            }

            workspace = [ordered]@{
              source = [ordered]@{
                path = $env:TESTGUIDE_ROOT
                sourceType = 'location'
              }

              dependencies = @()
            }

            setup = [ordered]@{
              steps = @(

                [ordered]@{
                  reuse = 'always'
                  keepConfiguration = $false
                  waitMinutesForLicense = 0
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'ecuTestStart'
                },

                [ordered]@{
                  tbcPath = $env:TBC_RELATIVE_PATH
                  tcfPath = $env:TCF_RELATIVE_PATH
                  stepName = 'Test Configuration Selection'
                  type = 'configuration'
                }
              )
            }

            execution = [ordered]@{
              testcases = @(

                [ordered]@{
                  relativePath = $env:PROJECT_RELATIVE_PATH
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'project'
                }
              )
            }

            teardown = [ordered]@{
              steps = @(
                [ordered]@{
                  type = 'ecuTestStop'
                }
              )
            }

            xilConfigRequirements = @(
              [ordered]@{
                label = 'Identifier'
                category = 'XIL'
                value = $env:XIL_IDENTIFIER
                type = 'configuration'
              }
            )

            parameters = @()
          }

          $playbookFile = Join-Path `
            $env:RUNNER_TEMP `
            'testguide-playbook.json'

          $playbookJson = $playbook |
            ConvertTo-Json -Depth 30

          $playbookJson |
            Set-Content `
              -LiteralPath $playbookFile `
              -Encoding utf8

          if (-not (Test-Path -LiteralPath $playbookFile)) {
            throw 'Generated playbook file is missing.'
          }

          $generatedPlaybook = Get-Content `
            -LiteralPath $playbookFile `
            -Raw |
            ConvertFrom-Json

          $actualIdentifier = [System.Convert]::ToString(
            $generatedPlaybook.xilConfigRequirements[0].value
          )

          $actualProjectPath = [System.Convert]::ToString(
            $generatedPlaybook.execution.testcases[0].relativePath
          )

          if (
            [System.String]::IsNullOrWhiteSpace(
              $actualIdentifier
            )
          ) {
            throw 'Generated playbook XIL identifier is empty.'
          }

          if ($actualIdentifier -ne $env:XIL_IDENTIFIER) {
            throw (
              'Generated playbook XIL identifier does not match. ' +
              "Expected: $env:XIL_IDENTIFIER. " +
              "Actual: $actualIdentifier."
            )
          }

          if ($actualProjectPath -ne $env:PROJECT_RELATIVE_PATH) {
            throw (
              'Generated playbook project path does not match. ' +
              "Expected: $env:PROJECT_RELATIVE_PATH. " +
              "Actual: $actualProjectPath."
            )
          }

          "TESTGUIDE_PLAYBOOK_FILE=$playbookFile" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'GENERATED PLAYBOOK'
          Write-Host '========================================'
          Write-Host "Workspace  : $env:TESTGUIDE_ROOT"
          Write-Host "Resource   : $env:TESTGUIDE_RESOURCE"
          Write-Host "Identifier : $actualIdentifier"
          Write-Host "TBC        : $env:TBC_RELATIVE_PATH"
          Write-Host "TCF        : $env:TCF_RELATIVE_PATH"
          Write-Host "PRJ        : $actualProjectPath"
          Write-Host '========================================'
          Write-Host $playbookJson
          Write-Host '========================================'


      # ==========================================================
      # 5. UPLOAD PLAYBOOK
      # ==========================================================

      - name: Upload playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:ONECX_AUTH_KEY
            )
          ) {
            throw 'ONECX_AUTH_KEY is missing.'
          }

          $folder = [System.Uri]::EscapeDataString('/')

          $uploadUrl = (
            "$env:ONECX_URL/api/v2/execution/playbook" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&folder=$folder"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $body = Get-Content `
            -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
            -Raw

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'UPLOAD PLAYBOOK'
          Write-Host '========================================'
          Write-Host "URL        : $uploadUrl"
          Write-Host "Project    : $env:ONECX_PROJECT_ID"
          Write-Host "Resource   : $env:TESTGUIDE_RESOURCE"
          Write-Host "Identifier : $env:XIL_IDENTIFIER"
          Write-Host "PRJ        : $env:PROJECT_RELATIVE_PATH"
          Write-Host '========================================'

          try {

            $response = Invoke-RestMethod `
              -Method POST `
              -Uri $uploadUrl `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $body `
              -ErrorAction Stop

          }
          catch {

            Write-Host ''
            Write-Host '========================================'
            Write-Host 'PLAYBOOK UPLOAD FAILED'
            Write-Host '========================================'
            Write-Host "Exception: $($_.Exception.Message)"

            if ($null -ne $_.Exception.Response) {
              try {
                Write-Host (
                  "HTTP Status: " +
                  [int]$_.Exception.Response.StatusCode
                )
              }
              catch {
                Write-Host 'HTTP status unavailable.'
              }
            }

            if ($null -ne $_.ErrorDetails) {
              Write-Host "Response body: $($_.ErrorDetails.Message)"
            }

            throw
          }

          if ($null -eq $response) {
            throw 'ONE.CX returned an empty upload response.'
          }

          $playbookId = [System.Convert]::ToString(
            $response.playbookId
          )

          if (
            [System.String]::IsNullOrWhiteSpace(
              $playbookId
            )
          ) {
            throw 'Upload did not return playbookId.'
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_PLAYBOOK_LINK=$($response.playbookLink)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host "Playbook ID   : $playbookId"
          Write-Host "Playbook Link : $($response.playbookLink)"


      # ==========================================================
      # 6. EXECUTE PLAYBOOK
      # ==========================================================

      - name: Execute playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:TESTGUIDE_PLAYBOOK_ID
            )
          ) {
            throw 'TESTGUIDE_PLAYBOOK_ID is missing.'
          }

          $executeUrl = (
            "$env:ONECX_URL/api/v2/execution/playbook/" +
            "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&checkLastExecution=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $jiraUrl = (
            'https://scoutmotors.atlassian.net/browse/' +
            $env:JIRA_KEY
          )

          $executeRequest = [ordered]@{
            name = "$env:JIRA_KEY - $env:TARGET_ECU L2 Quality Gate"

            priority = 42

            parameters = @()

            additionalSettings = [ordered]@{
              analysisExecutionMode = 'sequential'
              downstreamAnalysisPartitioning = 'analysis'
              expirationTimeInMinutes = 60

              issueTrackerTickets = @(
                $jiraUrl
              )

              remainingRetriesOnError = 0
            }
          }

          $executeJson = $executeRequest |
            ConvertTo-Json -Depth 20

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'EXECUTE PLAYBOOK'
          Write-Host '========================================'
          Write-Host "URL         : $executeUrl"
          Write-Host "Playbook ID : $env:TESTGUIDE_PLAYBOOK_ID"
          Write-Host "Resource    : $env:TESTGUIDE_RESOURCE"
          Write-Host "Identifier  : $env:XIL_IDENTIFIER"
          Write-Host "PRJ         : $env:PROJECT_RELATIVE_PATH"
          Write-Host '========================================'

          try {

            $response = Invoke-RestMethod `
              -Method POST `
              -Uri $executeUrl `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $executeJson `
              -ErrorAction Stop

          }
          catch {

            Write-Host ''
            Write-Host '========================================'
            Write-Host 'PLAYBOOK EXECUTION FAILED'
            Write-Host '========================================'
            Write-Host "Exception: $($_.Exception.Message)"

            if ($null -ne $_.Exception.Response) {
              try {
                Write-Host (
                  "HTTP Status: " +
                  [int]$_.Exception.Response.StatusCode
                )
              }
              catch {
                Write-Host 'HTTP status unavailable.'
              }
            }

            if ($null -ne $_.ErrorDetails) {
              Write-Host "Response body: $($_.ErrorDetails.Message)"
            }

            throw
          }

          $response |
            ConvertTo-Json -Depth 30 |
            Write-Host

          $taskIds = @($response.taskIds)

          if ($taskIds.Count -eq 0) {
            throw 'Execution did not return taskIds.'
          }

          $taskId = [System.Convert]::ToString(
            $taskIds[0]
          )

          if (
            [System.String]::IsNullOrWhiteSpace(
              $taskId
            )
          ) {
            throw 'Execution returned an empty taskId.'
          }

          "TESTGUIDE_TASK_ID=$taskId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Execution Task ID: $taskId"


      # ==========================================================
      # 7. POLL EXECUTION
      # ==========================================================

      - name: Poll execution task
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $taskUrl = (
            "$env:ONECX_URL/api/v2/execution/task/" +
            "$env:TESTGUIDE_TASK_ID" +
            "?projectId=$env:ONECX_PROJECT_ID"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $deadline = (Get-Date).AddMinutes(170)

          $successfulStates = @(
            'FINISHED',
            'COMPLETED',
            'SUCCESS',
            'SUCCEEDED'
          )

          $failedStates = @(
            'ERROR',
            'FAILED',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          $blockedSince = $null
          $attempt = 0
          $task = $null

          while ((Get-Date) -lt $deadline) {

            $attempt++

            $task = Invoke-RestMethod `
              -Method GET `
              -Uri $taskUrl `
              -Headers $headers `
              -ErrorAction Stop

            $state = (
              [System.Convert]::ToString(
                $task.state
              )
            ).Trim().ToUpperInvariant()

            $stateInfo = [System.Convert]::ToString(
              $task.stateInfo
            )

            $verdict = [System.Convert]::ToString(
              $task.aggregatedVerdict
            )

            Write-Host (
              "Attempt $attempt | " +
              "State=$state | " +
              "Verdict=$verdict | " +
              "StateInfo=$stateInfo"
            )

            if ($state -in $successfulStates) {
              break
            }

            if ($state -in $failedStates) {
              throw (
                "Execution failed. " +
                "State=$state. " +
                "StateInfo=$stateInfo"
              )
            }

            if ($state -eq 'BLOCKED') {

              if ($null -eq $blockedSince) {

                $blockedSince = Get-Date

                Write-Warning (
                  'Execution is BLOCKED. Waiting up to ' +
                  '5 minutes for a matching resource.'
                )
              }

              $blockedMinutes = (
                (Get-Date) - $blockedSince
              ).TotalMinutes

              if ($blockedMinutes -ge 5) {
                throw (
                  'Execution remained BLOCKED for 5 minutes. ' +
                  'Check ONE.CX resource identifier: ' +
                  $env:XIL_IDENTIFIER
                )
              }

            }
            else {

              $blockedSince = $null
            }

            Start-Sleep -Seconds 10
          }

          if ($null -eq $task) {
            throw 'No task response was received.'
          }

          $finalState = (
            [System.Convert]::ToString(
              $task.state
            )
          ).Trim().ToUpperInvariant()

          if ($finalState -notin $successfulStates) {
            throw (
              "Execution polling timed out. " +
              "Last state: $finalState"
            )
          }

          "FINAL_TASK_STATE=$($task.state)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_STATE_INFO=$($task.stateInfo)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_VERDICT=$($task.aggregatedVerdict)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_START_DATE=$($task.startDate)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_END_DATE=$($task.endDate)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 8. START PDF REPORT
      # ==========================================================

      - name: Start PDF report generation
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          [long]$executionTaskId = 0

          if (
            -not [System.Int64]::TryParse(
              $env:TESTGUIDE_TASK_ID,
              [ref]$executionTaskId
            )
          ) {
            throw 'Execution task ID must be numeric.'
          }

          $safeJiraKey = (
            $env:JIRA_KEY -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $safeEcu = (
            $env:TARGET_ECU -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $reportBaseName = (
            "${safeJiraKey}_${safeEcu}_TestSummary"
          )

          $encodedFileName = [System.Uri]::EscapeDataString(
            $reportBaseName
          )

          $exportUrl = (
            "$env:ONECX_URL/api/reporting/export" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&templateId=$env:ONECX_REPORT_TEMPLATE_ID" +
            "&fileName=$encodedFileName" +
            "&locale=ENGLISH" +
            "&keepDataSource=false" +
            "&requestTicketStatus=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $reportRequest = [ordered]@{
            parameters = @()
            type = $env:ONECX_REPORT_TEMPLATE_TYPE
            taskId = $executionTaskId
          }

          $reportJson = $reportRequest |
            ConvertTo-Json -Depth 10

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'GENERATE TEST SUMMARY REPORT'
          Write-Host '========================================'
          Write-Host "Execution Task : $executionTaskId"
          Write-Host "Template       : $env:ONECX_REPORT_TEMPLATE_ID"
          Write-Host "Report         : $reportBaseName"
          Write-Host "URL            : $exportUrl"
          Write-Host '========================================'

          try {

            $response = Invoke-RestMethod `
              -Method POST `
              -Uri $exportUrl `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $reportJson `
              -ErrorAction Stop

          }
          catch {

            Write-Host ''
            Write-Host '========================================'
            Write-Host 'REPORT GENERATION REQUEST FAILED'
            Write-Host '========================================'
            Write-Host "Exception: $($_.Exception.Message)"

            if ($null -ne $_.Exception.Response) {
              try {
                Write-Host (
                  "HTTP Status: " +
                  [int]$_.Exception.Response.StatusCode
                )
              }
              catch {
                Write-Host 'HTTP status unavailable.'
              }
            }

            if ($null -ne $_.ErrorDetails) {
              Write-Host "Response body: $($_.ErrorDetails.Message)"
            }

            throw
          }

          $reportTaskId = $null

          if ($response -is [System.String]) {

            $reportTaskId = [System.String]$response

          }
          elseif ($null -ne $response.taskId) {

            $reportTaskId = [System.Convert]::ToString(
              $response.taskId
            )

          }
          elseif ($null -ne $response.id) {

            $reportTaskId = [System.Convert]::ToString(
              $response.id
            )

          }
          elseif ($null -ne $response.exportTaskId) {

            $reportTaskId = [System.Convert]::ToString(
              $response.exportTaskId
            )

          }
          elseif ($null -ne $response.reportTaskId) {

            $reportTaskId = [System.Convert]::ToString(
              $response.reportTaskId
            )
          }

          if (
            [System.String]::IsNullOrWhiteSpace(
              $reportTaskId
            )
          ) {
            throw (
              'Reporting API did not return a ' +
              'report task ID.'
            )
          }

          $reportTaskId = $reportTaskId.Trim().Trim('"')

          $reportFile = Join-Path `
            $env:RUNNER_TEMP `
            "$reportBaseName.pdf"

          "TESTGUIDE_REPORT_TASK_ID=$reportTaskId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_BASE_NAME=$reportBaseName" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_FILE=$reportFile" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Report Task ID: $reportTaskId"
          Write-Host "Report File   : $reportFile"


      # ==========================================================
      # 9. POLL REPORT GENERATION
      # ==========================================================

      - name: Poll report generation
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $encodedReportTaskId = [System.Uri]::EscapeDataString(
            $env:TESTGUIDE_REPORT_TASK_ID
          )

          $statusUrl = (
            "$env:ONECX_URL/api/reporting/export/" +
            "$encodedReportTaskId/status"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $deadline = (Get-Date).AddMinutes(30)

          $successfulStates = @(
            'FINISHED',
            'COMPLETED',
            'COMPLETE',
            'SUCCESS',
            'SUCCEEDED',
            'READY',
            'DONE'
          )

          $failedStates = @(
            'FAILED',
            'FAILURE',
            'ERROR',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          $state = ''
          $attempt = 0

          while ((Get-Date) -lt $deadline) {

            $attempt++

            $response = Invoke-RestMethod `
              -Method GET `
              -Uri $statusUrl `
              -Headers $headers `
              -ErrorAction Stop

            $rawState = ''

            if ($response -is [System.String]) {

              $rawState = [System.String]$response

            }
            elseif ($null -ne $response.state) {

              $rawState = [System.Convert]::ToString(
                $response.state
              )

            }
            elseif ($null -ne $response.status) {

              $rawState = [System.Convert]::ToString(
                $response.status
              )

            }
            elseif ($null -ne $response.statusKey) {

              $rawState = [System.Convert]::ToString(
                $response.statusKey
              )

            }
            elseif ($null -ne $response.key) {

              $rawState = [System.Convert]::ToString(
                $response.key
              )

            }
            elseif ($null -ne $response.finished) {

              if ([System.Boolean]$response.finished) {
                $rawState = 'FINISHED'
              }
              else {
                $rawState = 'RUNNING'
              }
            }

            $state = (
              $rawState.Trim().Trim('"')
            ).ToUpperInvariant()

            Write-Host (
              "Attempt $attempt | " +
              "Report State=$state"
            )

            if ($state -in $successfulStates) {
              break
            }

            if ($state -in $failedStates) {
              throw "Report generation failed: $state"
            }

            Start-Sleep -Seconds 5
          }

          if ($state -notin $successfulStates) {
            throw (
              "Report generation timed out. " +
              "Last state: $state"
            )
          }

          "TESTGUIDE_REPORT_STATE=$state" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 10. DOWNLOAD PDF
      # ==========================================================

      - name: Download PDF report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $encodedReportTaskId = [System.Uri]::EscapeDataString(
            $env:TESTGUIDE_REPORT_TASK_ID
          )

          $downloadUrl = (
            "$env:ONECX_URL/api/reporting/export/" +
            "$encodedReportTaskId/download"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/pdf'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'DOWNLOAD TEST SUMMARY REPORT'
          Write-Host '========================================'
          Write-Host "URL  : $downloadUrl"
          Write-Host "File : $env:TESTGUIDE_REPORT_FILE"
          Write-Host '========================================'

          try {

            Invoke-WebRequest `
              -Method GET `
              -Uri $downloadUrl `
              -Headers $headers `
              -OutFile $env:TESTGUIDE_REPORT_FILE `
              -ErrorAction Stop

          }
          catch {

            Write-Host ''
            Write-Host '========================================'
            Write-Host 'REPORT DOWNLOAD FAILED'
            Write-Host '========================================'
            Write-Host "Exception: $($_.Exception.Message)"

            if ($null -ne $_.Exception.Response) {
              try {
                Write-Host (
                  "HTTP Status: " +
                  [int]$_.Exception.Response.StatusCode
                )
              }
              catch {
                Write-Host 'HTTP status unavailable.'
              }
            }

            if ($null -ne $_.ErrorDetails) {
              Write-Host "Response body: $($_.ErrorDetails.Message)"
            }

            throw
          }

          if (
            -not (
              Test-Path -LiteralPath $env:TESTGUIDE_REPORT_FILE
            )
          ) {
            throw 'Downloaded report file was not created.'
          }

          $reportInfo = Get-Item `
            -LiteralPath $env:TESTGUIDE_REPORT_FILE

          if ($reportInfo.Length -lt 5) {
            throw 'Downloaded report is empty.'
          }

          $bytes = [System.IO.File]::ReadAllBytes(
            $reportInfo.FullName
          )

          $signature = [System.Text.Encoding]::ASCII.GetString(
            $bytes,
            0,
            5
          )

          if ($signature -ne '%PDF-') {
            throw 'Downloaded report is not a valid PDF.'
          }

          "TESTGUIDE_REPORT_SIZE=$($reportInfo.Length)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'REPORT DOWNLOADED'
          Write-Host '========================================'
          Write-Host "File : $($reportInfo.FullName)"
          Write-Host "Size : $($reportInfo.Length) bytes"
          Write-Host '========================================'


      # ==========================================================
      # 11. UPLOAD PDF TO GITHUB ACTIONS
      # ==========================================================

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TESTGUIDE_REPORT_BASE_NAME }}
          path: ${{ env.TESTGUIDE_REPORT_FILE }}
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 12. SUMMARY
      # ==========================================================

      - name: Publish summary
        if: always()
        shell: pwsh
        run: |
          $summary = @(
            '## TestGuide Jira Execution',
            '',
            '| Field | Value |',
            '|---|---|',
            "| Jira | $env:JIRA_KEY |",
            "| Requested Bench | $env:BENCH_ID |",
            "| Selected Resource | $env:TESTGUIDE_RESOURCE |",
            "| XIL Identifier | $env:XIL_IDENTIFIER |",
            "| Workspace | $env:TESTGUIDE_ROOT |",
            "| TBC | $env:TBC_RELATIVE_PATH |",
            "| TCF | $env:TCF_RELATIVE_PATH |",
            "| PRJ | $env:PROJECT_RELATIVE_PATH |",
            "| Playbook ID | $env:TESTGUIDE_PLAYBOOK_ID |",
            "| Playbook Link | $env:TESTGUIDE_PLAYBOOK_LINK |",
            "| Execution Task | $env:TESTGUIDE_TASK_ID |",
            "| Execution State | $env:FINAL_TASK_STATE |",
            "| State Info | $env:FINAL_TASK_STATE_INFO |",
            "| Verdict | $env:FINAL_TASK_VERDICT |",
            "| Report Task | $env:TESTGUIDE_REPORT_TASK_ID |",
            "| Report State | $env:TESTGUIDE_REPORT_STATE |",
            "| Report File | $env:TESTGUIDE_REPORT_FILE |",
            "| Report Size | $env:TESTGUIDE_REPORT_SIZE bytes |",
            "| Workflow Status | ${{ job.status }} |"
          )

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
