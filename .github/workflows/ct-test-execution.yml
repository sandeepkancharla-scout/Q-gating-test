name: CT TestGuide JFrog ATX Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  testguide:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}
      RESOURCE_NAME: ${{ github.event.client_payload.resource_name }}

      CONFIGURATION_FOLDER: SUBSYS1

      ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
      ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

      JIRA_URL: https://scoutmotors.atlassian.net

      JFROG_URL: https://artifactory.sctmtrs.xyz/artifactory
      JFROG_REPOSITORY: eeint-build-info

    steps:

      - name: Validate request
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @{
            JIRA_KEY = $env:JIRA_KEY
            BENCH_ID = $env:BENCH_ID
            BENCH_NAME = $env:BENCH_NAME
            TARGET_ECU = $env:TARGET_ECU
            TEST_CASES = $env:TEST_CASES
            PLAYBOOK_NAME = $env:PLAYBOOK_NAME
            ONECX_PROJECT_ID = $env:ONECX_PROJECT_ID
            ONECX_AUTH_KEY = $env:ONECX_AUTH_KEY
            JFROG_TOKEN = $env:JFROG_TOKEN
          }

          foreach ($item in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace([string]$item.Value)) {
              throw "Missing required value: $($item.Key)"
            }
          }

          [int]$projectId = 0

          if (
            -not [int]::TryParse(
              $env:ONECX_PROJECT_ID,
              [ref]$projectId
            )
          ) {
            throw 'ONECX_PROJECT_ID must be an integer.'
          }

          Write-Host "Jira=$env:JIRA_KEY"
          Write-Host "Bench=$env:BENCH_ID"
          Write-Host "ECU=$env:TARGET_ECU"
          Write-Host "Project=$projectId"


      - name: Resolve resource and paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bench = $env:BENCH_ID.Trim().ToUpperInvariant()

          $resourceName = ''
          $workspaceRoot = ''

          switch ($bench) {

            {
              $_ -in @(
                'SYSHIL1',
                'SYSHIL1-LABTEST1'
              )
            } {
              $resourceName = 'syshil1-labtest1'
              $workspaceRoot = 'D:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'SYSHIL2',
                'SYSHIL2-LABTEST2'
              )
            } {
              $resourceName = 'syshil2-labtest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'INFO1',
                'SUBSYSINFO1',
                'SUBSYSINFO1-INFOTEST1'
              )
            } {
              $resourceName = 'subsysinfo1-infotest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'INFO2',
                'SUBSYSINFO2',
                'SUBSYSINFO2-INFOTEST2'
              )
            } {
              $resourceName = 'subsysinfo2-infotest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'THERMAL',
                'SUBSYSTHERMAL1',
                'SUBSYSTHERMAL1-THERMALTEST1'
              )
            } {
              $resourceName = 'subsysthermal1-thermaltest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'CHARGING',
                'SUBSYSCHARGING1',
                'SUBSYSCHARGING1-LABTEST6'
              )
            } {
              $resourceName = 'subsyscharging1-labtest6'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'MICROBENCH',
                'MICROBENCHINFO',
                'MICROBENCHINFO-MICROBENCHHIL1'
              )
            } {
              $resourceName = 'microbenchinfo-microbenchhil1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            default {

              $resourceName = (
                [string]$env:RESOURCE_NAME
              ).Trim()

              if (
                [string]::IsNullOrWhiteSpace(
                  $resourceName
                )
              ) {
                throw (
                  "No ONE.CX resource mapping exists " +
                  "for BENCH_ID=$bench."
                )
              }

              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }
          }

          $configurationFolder = (
            $env:CONFIGURATION_FOLDER.Trim()
          )

          $ecu = $env:TARGET_ECU.Trim()
          $benchPackage = $env:BENCH_NAME.Trim()

          $xilIdentifier = (
            "novi_hq/1stfloor/ee_lab_novi/" +
            "$resourceName/ControlComputer"
          )

          $ecuTestStepName = (
            "ecu.test $resourceName Start"
          )

          $tbcPath = (
            "Configurations\$configurationFolder\" +
            "${configurationFolder}_TestBenchConfig.tbc"
          )

          $tcfPath = (
            "Configurations\$configurationFolder\" +
            "${configurationFolder}_TestConfig.tcf"
          )

          $projectPath = (
            "Packages\$benchPackage\L2_Quality_Gate\" +
            "$ecu\" +
            "${ecu}_L2QualityGate.prj"
          )

          @(
            "TESTGUIDE_RESOURCE=$resourceName"
            "TESTGUIDE_ROOT=$workspaceRoot"
            "XIL_IDENTIFIER=$xilIdentifier"
            "ECUTEST_STEP_NAME=$ecuTestStepName"
            "TBC_RELATIVE_PATH=$tbcPath"
            "TCF_RELATIVE_PATH=$tcfPath"
            "PROJECT_RELATIVE_PATH=$projectPath"
          ) |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host '========================================'
          Write-Host 'RESOURCE'
          Write-Host '========================================'
          Write-Host "Bench      : $bench"
          Write-Host "Resource   : $resourceName"
          Write-Host "Workspace  : $workspaceRoot"
          Write-Host "Config     : $configurationFolder"
          Write-Host "Identifier : $xilIdentifier"
          Write-Host "TBC        : $tbcPath"
          Write-Host "TCF        : $tcfPath"
          Write-Host "Project    : $projectPath"
          Write-Host '========================================'


      - name: Generate TestGuide playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $playbook = [ordered]@{

            metadata = [ordered]@{
              name = $env:PLAYBOOK_NAME
              taskNameTemplate = '${playbook_name} (${playbook_datetime}) ${distribution_count}'
              labels = @()
            }

            workspace = [ordered]@{

              source = [ordered]@{
                path = $env:TESTGUIDE_ROOT
                sourceType = 'location'
              }

              dependencies = @()
            }

            setup = [ordered]@{

              steps = @(

                [ordered]@{
                  reuse = 'always'
                  keepConfiguration = $false
                  waitMinutesForLicense = 0
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'ecuTestStart'
                },

                [ordered]@{
                  tbcPath = $env:TBC_RELATIVE_PATH
                  tcfPath = $env:TCF_RELATIVE_PATH
                  stepName = 'Test Configuration Selection'
                  type = 'configuration'
                }
              )
            }

            execution = [ordered]@{

              testcases = @(
                [ordered]@{
                  relativePath = $env:PROJECT_RELATIVE_PATH
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'project'
                }
              )
            }

            teardown = [ordered]@{

              steps = @(
                [ordered]@{
                  type = 'ecuTestStop'
                }
              )
            }

            xilConfigRequirements = @(

              [ordered]@{
                label = 'Identifier'
                category = 'XIL'
                value = $env:XIL_IDENTIFIER
                type = 'configuration'
              }
            )

            parameters = @()
          }

          $playbookFile = Join-Path `
            $env:RUNNER_TEMP `
            'testguide-playbook.json'

          $playbook |
            ConvertTo-Json -Depth 30 |
            Set-Content `
              -LiteralPath $playbookFile `
              -Encoding utf8

          if (
            -not (
              Test-Path -LiteralPath $playbookFile
            )
          ) {
            throw 'Playbook file was not created.'
          }

          "TESTGUIDE_PLAYBOOK_FILE=$playbookFile" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      - name: Upload TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $folder = [uri]::EscapeDataString('/')

          $url = (
            "$env:ONECX_URL/api/v2/execution/playbook" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&folder=$folder"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $body = Get-Content `
            -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
            -Raw

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $url `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $body `
            -ErrorAction Stop

          $playbookId = (
            [convert]::ToString(
              $response.playbookId
            )
          ).Trim()

          if (
            [string]::IsNullOrWhiteSpace(
              $playbookId
            )
          ) {
            throw 'Upload did not return playbookId.'
          }

          @(
            "TESTGUIDE_PLAYBOOK_ID=$playbookId"
            "TESTGUIDE_PLAYBOOK_LINK=$($response.playbookLink)"
          ) |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Playbook ID=$playbookId"


      - name: Execute TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $url = (
            "$env:ONECX_URL/api/v2/execution/playbook/" +
            "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&checkLastExecution=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $request = [ordered]@{

            name = (
              "$env:JIRA_KEY - " +
              "$env:TARGET_ECU L2 Quality Gate"
            )

            priority = 42
            parameters = @()

            additionalSettings = [ordered]@{
              analysisExecutionMode = 'sequential'
              downstreamAnalysisPartitioning = 'analysis'
              expirationTimeInMinutes = 60

              issueTrackerTickets = @(
                "$env:JIRA_URL/browse/$env:JIRA_KEY"
              )

              remainingRetriesOnError = 0
            }
          }

          $requestJson = (
            $request |
            ConvertTo-Json -Depth 20
          )

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $url `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $requestJson `
            -ErrorAction Stop

          $taskIds = @($response.taskIds)

          if ($taskIds.Count -eq 0) {
            throw 'Execution did not return taskIds.'
          }

          $taskId = (
            [convert]::ToString(
              $taskIds[0]
            )
          ).Trim()

          if (
            [string]::IsNullOrWhiteSpace(
              $taskId
            )
          ) {
            throw 'Execution returned an empty taskId.'
          }

          "TESTGUIDE_TASK_ID=$taskId" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Execution Task ID=$taskId"


      - name: Poll TestGuide execution
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $taskId = $env:TESTGUIDE_TASK_ID.Trim()

          $url = (
            "$env:ONECX_URL/api/v2/execution/task/" +
            "$taskId" +
            "?projectId=$env:ONECX_PROJECT_ID"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $deadline = (Get-Date).AddMinutes(170)

          $successStates = @(
            'FINISHED'
            'COMPLETED'
            'SUCCESS'
            'SUCCEEDED'
          )

          $failureStates = @(
            'ERROR'
            'FAILED'
            'ABORTED'
            'CANCELLED'
            'CANCELED'
          )

          $task = $null
          $completed = $false
          $attempt = 0

          while ((Get-Date) -lt $deadline) {

            $attempt++

            try {

              $task = Invoke-RestMethod `
                -Method GET `
                -Uri $url `
                -Headers $headers `
                -ErrorAction Stop

            }
            catch {

              $statusCode = 0

              if ($null -ne $_.Exception.Response) {

                try {
                  $statusCode = [int]$_.Exception.Response.StatusCode
                }
                catch {
                  $statusCode = 0
                }
              }

              if (
                $statusCode -eq 404 -and
                $attempt -le 12
              ) {

                Write-Host (
                  "Task not available yet. " +
                  "Retrying in 5 seconds."
                )

                Start-Sleep -Seconds 5
                continue
              }

              throw
            }

            $state = (
              [convert]::ToString(
                $task.state
              )
            ).Trim().ToUpperInvariant()

            Write-Host (
              "Attempt=$attempt " +
              "State=$state " +
              "Verdict=$($task.aggregatedVerdict)"
            )

            if ($state -in $successStates) {
              $completed = $true
              break
            }

            if ($state -in $failureStates) {
              throw (
                "Execution failed. " +
                "State=$state " +
                "StateInfo=$($task.stateInfo)"
              )
            }

            Start-Sleep -Seconds 10
          }

          if (
            -not $completed -or
            $null -eq $task
          ) {
            throw 'Execution polling timed out.'
          }

          $startDate = (
            [convert]::ToString(
              $task.startDate
            )
          ).Trim()

          $endDate = (
            [convert]::ToString(
              $task.endDate
            )
          ).Trim()

          if (
            [string]::IsNullOrWhiteSpace($startDate) -or
            [string]::IsNullOrWhiteSpace($endDate)
          ) {
            throw 'Completed task has no startDate or endDate.'
          }

          @(
            "FINAL_TASK_STATE=$($task.state)"
            "FINAL_TASK_STATE_INFO=$($task.stateInfo)"
            "FINAL_TASK_VERDICT=$($task.aggregatedVerdict)"
            "TASK_START_DATE=$startDate"
            "TASK_END_DATE=$endDate"
          ) |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      - name: Find current TestGuide report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $culture = (
            [globalization.CultureInfo]::InvariantCulture
          )

          $taskStart = (
            [datetime]::Parse(
              $env:TASK_START_DATE,
              $culture
            )
          )

          $taskEnd = (
            [datetime]::Parse(
              $env:TASK_END_DATE,
              $culture
            )
          )

          $windowStart = $taskStart.AddMinutes(-2)
          $windowEnd = $taskEnd.AddMinutes(20)

          $expectedPlan = (
            "$($env:TARGET_ECU.Trim())_L2QualityGate"
          )

          $deadline = (Get-Date).AddMinutes(15)

          $selected = $null

          while ((Get-Date) -lt $deadline) {

            $startText = (
              $windowStart.ToString(
                'yyyy-MM-ddTHH:mm:ss.fffZ'
              )
            )

            $endText = (
              $windowEnd.ToString(
                'yyyy-MM-ddTHH:mm:ss.fffZ'
              )
            )

            $startEncoded = (
              [uri]::EscapeDataString(
                $startText
              )
            )

            $endEncoded = (
              [uri]::EscapeDataString(
                $endText
              )
            )

            $url = (
              "$env:ONECX_URL/api/report/reports/history" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&startDate=$startEncoded" +
              "&endDate=$endEncoded" +
              "&offset=0" +
              "&limit=100"
            )

            $response = Invoke-RestMethod `
              -Method GET `
              -Uri $url `
              -Headers $headers `
              -ErrorAction Stop

            $reports = @($response)

            $matches = @(
              $reports |
                Where-Object {

                  $name = (
                    [convert]::ToString(
                      $_.testPlanName
                    )
                  ).Trim()

                  $status = (
                    [convert]::ToString(
                      $_.status
                    )
                  ).Trim().ToUpperInvariant()

                  $executionText = (
                    [convert]::ToString(
                      $_.executionDate
                    )
                  ).Trim()

                  if (
                    [string]::IsNullOrWhiteSpace(
                      $executionText
                    )
                  ) {
                    return $false
                  }

                  $executionDate = (
                    [datetime]::Parse(
                      $executionText,
                      $culture
                    )
                  )

                  return (
                    $name -ieq $expectedPlan -and
                    $status -eq 'COMPLETE' -and
                    $executionDate -ge $windowStart -and
                    $executionDate -le $windowEnd
                  )
                } |
                Sort-Object {
                  [datetime]::Parse(
                    [convert]::ToString(
                      $_.uploadDate
                    ),
                    $culture
                  )
                } -Descending
            )

            if ($matches.Count -gt 0) {
              $selected = $matches[0]
              break
            }

            Write-Host 'Waiting for TestGuide report.'

            Start-Sleep -Seconds 15
          }

          if ($null -eq $selected) {
            throw (
              "No TestGuide report found for $expectedPlan."
            )
          }

          $reportId = (
            [convert]::ToString(
              $selected.reportId
            )
          ).Trim()

          if (
            [string]::IsNullOrWhiteSpace(
              $reportId
            )
          ) {
            throw 'Selected TestGuide report has no reportId.'
          }

          @(
            "TESTGUIDE_REPORT_ID=$reportId"
            "TESTGUIDE_REPORT_PLAN=$($selected.testPlanName)"
            "TESTGUIDE_REPORT_EXECUTION_DATE=$($selected.executionDate)"
            "TESTGUIDE_REPORT_UPLOAD_DATE=$($selected.uploadDate)"
          ) |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Report ID=$reportId"


      - name: Start ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $reportId = (
            [uri]::EscapeDataString(
              $env:TESTGUIDE_REPORT_ID
            )
          )

          $url = (
            "$env:ONECX_URL/api/report/export/atx/" +
            "$reportId" +
            "?useExportStorage=false"
          )

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $url `
            -Headers $headers `
            -ErrorAction Stop

          $taskId = (
            [convert]::ToString(
              $response.taskId
            )
          ).Trim()

          if (
            [string]::IsNullOrWhiteSpace(
              $taskId
            )
          ) {
            throw 'ATX export did not return taskId.'
          }

          "ATX_EXPORT_TASK_ID=$taskId" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "ATX Export Task=$taskId"


      - name: Poll ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $taskId = (
            [uri]::EscapeDataString(
              $env:ATX_EXPORT_TASK_ID
            )
          )

          $url = (
            "$env:ONECX_URL/api/report/export/atx/" +
            "$taskId/status"
          )

          $deadline = (Get-Date).AddMinutes(30)

          $successStates = @(
            'FINISHED'
            'COMPLETED'
            'COMPLETE'
            'SUCCESS'
            'SUCCEEDED'
            'READY'
            'DONE'
          )

          $failureStates = @(
            'FAILED'
            'FAILURE'
            'ERROR'
            'ABORTED'
            'CANCELLED'
            'CANCELED'
          )

          $ready = $false

          while ((Get-Date) -lt $deadline) {

            $status = Invoke-RestMethod `
              -Method GET `
              -Uri $url `
              -Headers $headers `
              -ErrorAction Stop

            if (
              $null -ne $status.done -and
              [bool]$status.done
            ) {
              $ready = $true
              break
            }

            $state = ''

            if ($null -ne $status.state) {

              $state = (
                [convert]::ToString(
                  $status.state
                )
              ).Trim().ToUpperInvariant()

            }
            elseif ($null -ne $status.status) {

              $state = (
                [convert]::ToString(
                  $status.status
                )
              ).Trim().ToUpperInvariant()

            }
            elseif ($status -is [string]) {

              $state = (
                $status.Trim().Trim('"')
              ).ToUpperInvariant()
            }

            if ($state -in $successStates) {
              $ready = $true
              break
            }

            if ($state -in $failureStates) {
              throw "ATX export failed: $state"
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ready:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:ATX_EXPORT_STATE -ne 'COMPLETED') {
            throw 'ATX export is not complete.'
          }

          if (
            :IsNullOrWhiteSpace(
              $env:ATX_EXPORT_TASK_ID
            )
          ) {
            throw 'ATX_EXPORT_TASK_ID is missing.'
          }

          $safeJira = (
            $env:JIRA_KEY -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $safeEcu = (
            $env:TARGET_ECU -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $reportFile = Join-Path `
            $env:RUNNER_TEMP `
            "${safeJira}_${safeEcu}_ATX_Export.zip"

          $taskId = (
            :EscapeDataString(
              $env:ATX_EXPORT_TASK_ID
            )
          )

          $downloadUrl = (
            "$env:ONECX_URL/api/report/export/atx/" +
            "$taskId/download"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
          }

          Write-Host '========================================'
          Write-Host 'DOWNLOAD TESTGUIDE REPORT'
          Write-Host '========================================'
          Write-Host "Report ID : $env:TESTGUIDE_REPORT_ID"
          Write-Host "Task ID   : $env:ATX_EXPORT_TASK_ID"
          Write-Host "URL       : $downloadUrl"
          Write-Host "File      : $reportFile"
          Write-Host '========================================'

          Invoke-WebRequest `
            -Method GET `
            -Uri $downloadUrl `
            -Headers $headers `
            -OutFile $reportFile `
            -ErrorAction Stop

          if (
            -not (
              Test-Path -LiteralPath $reportFile
            )
          ) {
            throw 'TestGuide report was not downloaded.'
          }

          $fileInfo = Get-Item `
            -LiteralPath $reportFile

          if ($fileInfo.Length -eq 0) {
            throw 'Downloaded TestGuide report is empty.'
          }

          @(
            "TESTGUIDE_ATX_FILE=$reportFile"
            "TESTGUIDE_ATX_EXPORT_TYPE=ZIP"
            "TESTGUIDE_ATX_SIZE=$($fileInfo.Length)"
          ) |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Report=$reportFile"
          Write-Host "Size=$($fileInfo.Length)"


      - name: Upload TestGuide report to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JIRA_KEY }}_${{ env.TARGET_ECU }}_TestGuideReport
          path: ${{ env.TESTGUIDE_ATX_FILE }}
          if-no-files-found: error
          retention-days: 30


      - name: Upload TestGuide report to JFrog
        shell: pwsh
        env:
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            :IsNullOrWhiteSpace(
              $env:JFROG_TOKEN
            )
          ) {
            throw 'JFROG_TOKEN secret is missing.'
          }

          if (
            -not (
              Test-Path -LiteralPath $env:TESTGUIDE_ATX_FILE
            )
          ) {
            throw (
              "TestGuide report does not exist: " +
              "$env:TESTGUIDE_ATX_FILE"
            )
          }

          $fileInfo = Get-Item `
            -LiteralPath $env:TESTGUIDE_ATX_FILE

          if ($fileInfo.Length -eq 0) {
            throw 'TestGuide report is empty.'
          }

          $safeJira = (
            $env:JIRA_KEY -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $safeEcu = (
            $env:TARGET_ECU -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $artifactPath = (
            "quality-gate-reports/" +
            "$safeJira/" +
            "$env:TESTGUIDE_TASK_ID/" +
            "$safeEcu/" +
            "$($fileInfo.Name)"
          )

          $uploadUrl = (
            "$env:JFROG_URL/" +
            "$env:JFROG_REPOSITORY/" +
            "$artifactPath"
          )

          $headers = @{
            'Authorization' = (
              "Bearer $env:JFROG_TOKEN"
            )
          }

          Write-Host '========================================'
          Write-Host 'UPLOAD TO JFROG'
          Write-Host '========================================'
          Write-Host "File : $($fileInfo.FullName)"
          Write-Host "Path : $artifactPath"
          Write-Host "URL  : $uploadUrl"
          Write-Host '========================================'

          $response = Invoke-WebRequest `
            -Method PUT `
            -Uri $uploadUrl `
            -Headers $headers `
            -InFile $fileInfo.FullName `
            -ContentType 'application/octet-stream' `
            -ErrorAction Stop

          $statusCode = [int]$response.StatusCode

          if (
            $statusCode -lt 200 -or
            $statusCode -ge 300
          ) {
            throw (
              "JFrog upload failed. HTTP=$statusCode"
            )
          }

          @(
            "JFROG_REPORT_PATH=$artifactPath"
            "JFROG_REPORT_URL=$uploadUrl"
            "JFROG_UPLOAD_STATUS=$statusCode"
          ) |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "JFrog upload successful."
          Write-Host "HTTP=$statusCode"
          Write-Host "URL=$uploadUrl"


      - name: Publish execution summary
        if: always()
        shell: pwsh
        run: |
          @(
            '## TestGuide Execution'
            ''
            '| Field | Value |'
            '|---|---|'
            "| Jira | $env:JIRA_KEY |"
            "| Bench | $env:BENCH_ID |"
            "| Resource | $env:TESTGUIDE_RESOURCE |"
            "| Configuration | $env:CONFIGURATION_FOLDER |"
            "| ECU | $env:TARGET_ECU |"
            "| Playbook ID | $env:TESTGUIDE_PLAYBOOK_ID |"
            "| Execution Task | $env:TESTGUIDE_TASK_ID |"
            "| Execution State | $env:FINAL_TASK_STATE |"
            "| Verdict | $env:FINAL_TASK_VERDICT |"
            "| TestGuide Report ID | $env:TESTGUIDE_REPORT_ID |"
            "| TestGuide Plan | $env:TESTGUIDE_REPORT_PLAN |"
            "| ATX Export Task | $env:ATX_EXPORT_TASK_ID |"
            "| Export File | $env:TESTGUIDE_ATX_FILE |"
            "| Export Size | $env:TESTGUIDE_ATX_SIZE bytes |"
            "| JFrog Path | $env:JFROG_REPORT_PATH |"
            "| JFrog URL | $env:JFROG_REPORT_URL |"
            "| JFrog Status | $env:JFROG_UPLOAD_STATUS |"
            "| Workflow Status | ${{ job.status }} |"
          ) |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
