name: CT Test Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  receive-jira:
    runs-on: ubuntu-latest

    steps:
      # Read and validate the Jira request.
      - name: Read Jira payload
        shell: bash
        env:
          JIRA_KEY: ${{ github.event.client_payload.jira_key }}
          BENCH_ID: ${{ github.event.client_payload.bench_id }}
          BENCH_NAME: ${{ github.event.client_payload.bench_name }}
          TEST_CASES: ${{ github.event.client_payload.test_cases }}
          TARGET_ECU: ${{github.event.client_payload.target_ECU }}
        run: |
          set -euo pipefail

          echo "Jira Key   : $JIRA_KEY"
          echo "Bench ID   : $BENCH_ID"
          echo "Bench Name : $BENCH_NAME"
          echo "Test Cases : $TEST_CASES"
          echo "Target ECU : $TARGET_ECU"
          
          if [ -z "$TARGET_ECU" ]; then
            echo "ERROR: Target ECU missing"
            exit 1
          fi
          
          if [ -z "$JIRA_KEY" ]; then
            echo "ERROR: Jira Key missing"
            exit 1
          fi

          if [ -z "$BENCH_ID" ]; then
            echo "ERROR: Bench ID missing"
            exit 1
          fi

          if [ -z "$BENCH_NAME" ]; then
            echo "ERROR: Bench Name missing"
            exit 1
          fi

          if [ -z "$TEST_CASES" ]; then
            echo "ERROR: Test Cases missing"
            exit 1
          fi
