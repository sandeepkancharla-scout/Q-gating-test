          # if ($null -eq $response) {
          #     throw "TestGuide returned an empty task response."
          # }
          #
          # $taskId = $response.taskId
          #
          # if (:IsNullOrWhiteSpace([string]$taskId)) {
          #     throw "TestGuide response did not contain taskId."
          # }
