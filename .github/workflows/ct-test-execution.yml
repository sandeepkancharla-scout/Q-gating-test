name: CT TestGuide Jira Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  testguide:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      # ==========================================================
      # JIRA INPUTS
      # ==========================================================

      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}

      # ==========================================================
      # EXISTING LOCAL AUTOMATION TREE
      # ==========================================================

      LOCAL_ROOT: 'C:\HIL\Testing\eeint-Test-Automation'
      CONFIGURATION_FOLDER: 'SUBSYS1'

      # ==========================================================
      # ONE.CX PROJECT
      # ==========================================================

      ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

      # ==========================================================
      # ONE.CX
      # ==========================================================

      ONECX_URL: 'https://testguide-ssp.onecx.vwgroup.com'

    steps:

      # ==========================================================
      # 1. VALIDATE INPUTS
      # ==========================================================

      - name: Validate Jira request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredValues = @{
            JIRA_KEY = $env:JIRA_KEY
            BENCH_ID = $env:BENCH_ID
            BENCH_NAME = $env:BENCH_NAME
            TARGET_ECU = $env:TARGET_ECU
            TEST_CASES = $env:TEST_CASES
            PLAYBOOK_NAME = $env:PLAYBOOK_NAME
            ONECX_PROJECT_ID = $env:ONECX_PROJECT_ID
          }

          foreach ($entry in $requiredValues.GetEnumerator()) {
            if (
              [System.String]::IsNullOrWhiteSpace(
                [System.String]$entry.Value
              )
            ) {
              throw "Missing required value: $($entry.Key)"
            }
          }

          if (-not (Test-Path -LiteralPath $env:LOCAL_ROOT)) {
            throw "Local automation repository missing: $env:LOCAL_ROOT"
          }

          $projectId = 0

          if (
            -not [System.Int32]::TryParse(
              $env:ONECX_PROJECT_ID,
              [ref]$projectId
            )
          ) {
            throw 'ONECX_PROJECT_ID must be an integer.'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JIRA EXECUTION REQUEST'
          Write-Host '========================================'
          Write-Host "Jira       : $env:JIRA_KEY"
          Write-Host "Project ID : $env:ONECX_PROJECT_ID"
          Write-Host "Bench      : $env:BENCH_ID"
          Write-Host "Bench Name : $env:BENCH_NAME"
          Write-Host "ECU        : $env:TARGET_ECU"
          Write-Host "Test Cases : $env:TEST_CASES"
          Write-Host "Playbook   : $env:PLAYBOOK_NAME"
          Write-Host '========================================'


      # ==========================================================
      # 2. RESOLVE BENCH
      # ==========================================================

      - name: Resolve TestGuide bench
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $benchId = $env:BENCH_ID.Trim().ToUpperInvariant()

          switch ($benchId) {

            'SYSHIL1' {
              $testGuideBench = 'SysHIL1'
              $workspaceRoot = 'D:\HIL\Testing\eeint-Test-Automation'
            }

            'SYSHIL2' {
              $testGuideBench = 'SysHIL2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            'SYSHIL5' {
              $testGuideBench = 'SysHIL5'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }

            default {
              $testGuideBench = $env:BENCH_ID.Trim()
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }
          }

          $stepName = "ecu.test $testGuideBench Start"

          $xilIdentifier = (
            'novi_hq/1stfloor/EE_Lab_novi/' +
            "$testGuideBench/TestLabPC1"
          )

          "TESTGUIDE_BENCH=$testGuideBench" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ROOT=$workspaceRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "ECUTEST_STEP_NAME=$stepName" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "XIL_IDENTIFIER=$xilIdentifier" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Bench     : $testGuideBench"
          Write-Host "Workspace : $workspaceRoot"
          Write-Host "Step      : $stepName"
          Write-Host "XIL       : $xilIdentifier"


      # ==========================================================
      # 3. RESOLVE BENCH PACKAGE
      # ==========================================================

      - name: Resolve bench package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packageRoot = Join-Path `
            $env:LOCAL_ROOT `
            "Packages\$($env:BENCH_NAME.Trim())"

          if (-not (Test-Path -LiteralPath $packageRoot)) {
            throw "Bench package not found: $packageRoot"
          }

          "PACKAGE_ROOT=$packageRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Package: $packageRoot"


      # ==========================================================
      # 4. RESOLVE TBC + TCF
      # ==========================================================

      - name: Resolve TBC and TCF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $configName = $env:CONFIGURATION_FOLDER.Trim()

          $configRoot = Join-Path `
            $env:LOCAL_ROOT `
            "Configurations\$configName"

          if (-not (Test-Path -LiteralPath $configRoot)) {
            throw "Configuration folder not found: $configRoot"
          }

          $expectedTbc = Join-Path `
            $configRoot `
            "${configName}_TestBenchConfig.tbc"

          $expectedTcf = Join-Path `
            $configRoot `
            "${configName}_TestConfig.tcf"

          if (Test-Path -LiteralPath $expectedTbc) {
            $selectedTbc = Get-Item -LiteralPath $expectedTbc
          }
          else {
            $tbcFiles = @(
              Get-ChildItem `
                -LiteralPath $configRoot `
                -Filter '*.tbc' `
                -File `
                -Recurse
            )

            if ($tbcFiles.Count -ne 1) {
              throw "Expected exactly 1 TBC. Found $($tbcFiles.Count)."
            }

            $selectedTbc = $tbcFiles[0]
          }

          if (Test-Path -LiteralPath $expectedTcf) {
            $selectedTcf = Get-Item -LiteralPath $expectedTcf
          }
          else {
            $tcfFiles = @(
              Get-ChildItem `
                -LiteralPath $configRoot `
                -Filter '*.tcf' `
                -File `
                -Recurse
            )

            if ($tcfFiles.Count -ne 1) {
              throw "Expected exactly 1 TCF. Found $($tcfFiles.Count)."
            }

            $selectedTcf = $tcfFiles[0]
          }

          $tbcRelative = [System.IO.Path]::GetRelativePath(
            $env:LOCAL_ROOT,
            $selectedTbc.FullName
          )

          $tcfRelative = [System.IO.Path]::GetRelativePath(
            $env:LOCAL_ROOT,
            $selectedTcf.FullName
          )

          "TBC_RELATIVE_PATH=$tbcRelative" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TCF_RELATIVE_PATH=$tcfRelative" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "TBC : $tbcRelative"
          Write-Host "TCF : $tcfRelative"


      # ==========================================================
      # 5. RESOLVE EXACT ECU PRJ
      # ==========================================================

      - name: Resolve target ECU project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $targetEcu = $env:TARGET_ECU.Trim()
          $expectedProject = "${targetEcu}_L2QualityGate.prj"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PROJECT RESOLUTION'
          Write-Host '========================================'
          Write-Host "Target ECU : $targetEcu"
          Write-Host "Expected   : $expectedProject"
          Write-Host "Package    : $env:PACKAGE_ROOT"
          Write-Host '========================================'

          $matches = @(
            Get-ChildItem `
              -LiteralPath $env:PACKAGE_ROOT `
              -Filter $expectedProject `
              -File `
              -Recurse
          )

          if ($matches.Count -eq 0) {

            Write-Host ''
            Write-Host 'Available L2 Quality Gate projects:'

            Get-ChildItem `
              -LiteralPath $env:PACKAGE_ROOT `
              -Filter '*_L2QualityGate.prj' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "  $($_.FullName)"
            }

            throw "Project not found: $expectedProject"
          }

          if ($matches.Count -gt 1) {
            throw "Multiple $expectedProject files found."
          }

          $selected = $matches[0]

          $relative = [System.IO.Path]::GetRelativePath(
            $env:LOCAL_ROOT,
            $selected.FullName
          )

          "PROJECT_RELATIVE_PATH=$relative" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Selected PRJ: $relative"


      # ==========================================================
      # 6. NORMALIZE TEST CASE IDS
      # ==========================================================

      - name: Parse Jira Test Cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ids = @(
            $env:TEST_CASES -split '[,;]' |
            ForEach-Object {
              $_.Trim()
            } |
            Where-Object {
              -not [System.String]::IsNullOrWhiteSpace($_)
            }
          )

          if ($ids.Count -eq 0) {
            throw 'No valid Jira Test Case IDs.'
          }

          $normalized = $ids -join ','

          "NORMALIZED_TEST_CASES=$normalized" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Test Cases: $normalized"


      # ==========================================================
      # 7. GENERATE PLAYBOOK JSON
      # ==========================================================

      - name: Generate TestGuide playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $playbook = [ordered]@{

            metadata = [ordered]@{
              name = $env:PLAYBOOK_NAME
              taskNameTemplate = '${playbook_name} (${playbook_datetime}) ${distribution_count}'
              labels = @()
            }

            workspace = [ordered]@{
              source = [ordered]@{
                path = $env:TESTGUIDE_ROOT
                sourceType = 'location'
              }

              dependencies = @()
            }

            setup = [ordered]@{
              steps = @(

                [ordered]@{
                  reuse = 'always'
                  keepConfiguration = $false
                  waitMinutesForLicense = 0
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'ecuTestStart'
                },

                [ordered]@{
                  tbcPath = $env:TBC_RELATIVE_PATH
                  tcfPath = $env:TCF_RELATIVE_PATH
                  stepName = 'Test Configuration Selection'
                  type = 'configuration'
                }
              )
            }

            execution = [ordered]@{
              testcases = @(

                [ordered]@{
                  relativePath = $env:PROJECT_RELATIVE_PATH
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'project'
                }
              )
            }

            teardown = [ordered]@{
              steps = @(
                [ordered]@{
                  type = 'ecuTestStop'
                }
              )
            }

            xilConfigRequirements = @(
              [ordered]@{
                label = 'Identifier'
                category = 'XIL'
                value = $env:XIL_IDENTIFIER
                type = 'configuration'
              }
            )
          }

          $json = $playbook |
            ConvertTo-Json -Depth 30

          $file = Join-Path `
            $env:RUNNER_TEMP `
            'testguide-playbook.json'

          $json |
            Set-Content `
              -LiteralPath $file `
              -Encoding utf8

          "TESTGUIDE_PLAYBOOK_FILE=$file" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'GENERATED PLAYBOOK'
          Write-Host '========================================'
          Write-Host $json
          Write-Host '========================================'


      # ==========================================================
      # 8. VALIDATE GENERATED PLAYBOOK
      # ==========================================================

      - name: Validate generated playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE)) {
            throw 'Generated playbook JSON is missing.'
          }

          $playbook = Get-Content `
            -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
            -Raw |
            ConvertFrom-Json

          if ($playbook.setup.steps.Count -ne 2) {
            throw 'Expected exactly 2 setup steps.'
          }

          if ($playbook.execution.testcases.Count -ne 1) {
            throw 'Expected exactly 1 execution project.'
          }

          if ($playbook.xilConfigRequirements.Count -ne 1) {
            throw 'Expected exactly 1 XIL requirement.'
          }

          Write-Host 'Playbook validation successful.'


      # ==========================================================
      # 9. UPLOAD PLAYBOOK
      # ==========================================================

      - name: Upload TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:ONECX_AUTH_KEY
            )
          ) {
            throw 'ONECX_AUTH_KEY secret is missing.'
          }

          $folder = [System.Uri]::EscapeDataString('/')

          $uploadUrl = (
            "$env:ONECX_URL/api/v2/execution/playbook" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&folder=$folder"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $body = Get-Content `
            -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
            -Raw

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'UPLOAD PLAYBOOK'
          Write-Host '========================================'
          Write-Host "URL      : $uploadUrl"
          Write-Host "Project  : $env:ONECX_PROJECT_ID"
          Write-Host "Playbook : $env:PLAYBOOK_NAME"
          Write-Host '========================================'

          try {

            $response = Invoke-RestMethod `
              -Method POST `
              -Uri $uploadUrl `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $body `
              -ErrorAction Stop

          }
          catch {

            Write-Host ''
            Write-Host '========================================'
            Write-Host 'PLAYBOOK UPLOAD FAILED'
            Write-Host '========================================'
            Write-Host "URL: $uploadUrl"
            Write-Host "Exception: $($_.Exception.Message)"

            if ($null -ne $_.Exception.Response) {
              try {
                Write-Host "HTTP Status: $([int]$_.Exception.Response.StatusCode)"
              }
              catch {
                Write-Host 'HTTP status unavailable.'
              }
            }

            if ($null -ne $_.ErrorDetails) {
              Write-Host "Response body: $($_.ErrorDetails.Message)"
            }

            throw
          }

          if ($null -eq $response) {
            throw 'ONE.CX returned an empty upload response.'
          }

          $response |
            ConvertTo-Json -Depth 20 |
            Write-Host

          $playbookId = [System.String]$response.playbookId

          if ([System.String]::IsNullOrWhiteSpace($playbookId)) {
            throw 'ONE.CX upload did not return playbookId.'
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_PLAYBOOK_LINK=$($response.playbookLink)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host "Playbook ID   : $playbookId"
          Write-Host "Playbook Link : $($response.playbookLink)"


      # ==========================================================
      # 10. EXECUTE PLAYBOOK
      # ==========================================================

      - name: Execute TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:TESTGUIDE_PLAYBOOK_ID
            )
          ) {
            throw 'TESTGUIDE_PLAYBOOK_ID is missing.'
          }

          $executeUrl = (
            "$env:ONECX_URL/api/v2/execution/playbook/" +
            "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&checkLastExecution=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $jiraUrl = (
            'https://scoutmotors.atlassian.net/browse/' +
            $env:JIRA_KEY
          )

          $executeRequest = [ordered]@{
            name = "$env:JIRA_KEY - $env:TARGET_ECU L2 Quality Gate"

            priority = 42

            parameters = @()

            additionalSettings = [ordered]@{
              analysisExecutionMode = 'sequential'
              downstreamAnalysisPartitioning = 'analysis'
              expirationTimeInMinutes = 60

              issueTrackerTickets = @(
                $jiraUrl
              )

              remainingRetriesOnError = 0
            }
          }

          $executeJson = $executeRequest |
            ConvertTo-Json -Depth 20

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'EXECUTE PLAYBOOK'
          Write-Host '========================================'
          Write-Host "URL         : $executeUrl"
          Write-Host "Playbook ID : $env:TESTGUIDE_PLAYBOOK_ID"
          Write-Host "Project ID  : $env:ONECX_PROJECT_ID"
          Write-Host '========================================'

          try {

            $response = Invoke-RestMethod `
              -Method POST `
              -Uri $executeUrl `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $executeJson `
              -ErrorAction Stop

          }
          catch {

            Write-Host ''
            Write-Host '========================================'
            Write-Host 'PLAYBOOK EXECUTION FAILED'
            Write-Host '========================================'
            Write-Host "URL: $executeUrl"
            Write-Host "Exception: $($_.Exception.Message)"

            if ($null -ne $_.Exception.Response) {
              try {
                Write-Host "HTTP Status: $([int]$_.Exception.Response.StatusCode)"
              }
              catch {
                Write-Host 'HTTP status unavailable.'
              }
            }

            if ($null -ne $_.ErrorDetails) {
              Write-Host "Response body: $($_.ErrorDetails.Message)"
            }

            throw
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'EXECUTION RESPONSE'
          Write-Host '========================================'

          $response |
            ConvertTo-Json -Depth 30 |
            Write-Host

          $taskIds = @($response.taskIds)

          if ($taskIds.Count -eq 0) {
            throw 'Execution response did not contain taskIds.'
          }

          $taskId = [System.String]$taskIds[0]

          if ([System.String]::IsNullOrWhiteSpace($taskId)) {
            throw 'Returned taskId is empty.'
          }

          "TESTGUIDE_TASK_ID=$taskId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Task ID: $taskId"


      # ==========================================================
      # 11. POLL TASK UNTIL FINISHED
      # ==========================================================

      - name: Poll TestGuide task until finished
        if: env.TESTGUIDE_TASK_ID != ''
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $taskUrl = (
            "$env:ONECX_URL/api/v2/execution/task/" +
            "$env:TESTGUIDE_TASK_ID" +
            "?projectId=$env:ONECX_PROJECT_ID"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $pollIntervalSeconds = 10
          $maximumPollingMinutes = 170
          $deadline = (Get-Date).AddMinutes($maximumPollingMinutes)

          $successStates = @(
            'FINISHED',
            'COMPLETED',
            'SUCCESS',
            'SUCCEEDED'
          )

          $failureStates = @(
            'ERROR',
            'FAILED',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'POLL TESTGUIDE TASK'
          Write-Host '========================================'
          Write-Host "Task ID       : $env:TESTGUIDE_TASK_ID"
          Write-Host "Project ID    : $env:ONECX_PROJECT_ID"
          Write-Host "Poll interval : $pollIntervalSeconds seconds"
          Write-Host "Maximum wait  : $maximumPollingMinutes minutes"
          Write-Host '========================================'

          $attempt = 0
          $completed = $false
          $task = $null

          while ((Get-Date) -lt $deadline) {

            $attempt++

            $task = Invoke-RestMethod `
              -Method GET `
              -Uri $taskUrl `
              -Headers $headers `
              -ErrorAction Stop

            $rawState = [System.String]$task.state
            $state = $rawState.Trim().ToUpperInvariant()

            $stateInfo = [System.String]$task.stateInfo
            $verdict = [System.String]$task.aggregatedVerdict

            Write-Host ''
            Write-Host (
              "Attempt $attempt | " +
              "State: $rawState | " +
              "Verdict: $verdict"
            )

            if (
              -not [System.String]::IsNullOrWhiteSpace(
                $stateInfo
              )
            ) {
              Write-Host "State Info: $stateInfo"
            }

            if ($state -in $successStates) {

              $completed = $true

              Write-Host ''
              Write-Host '========================================'
              Write-Host 'TESTGUIDE TASK COMPLETED'
              Write-Host '========================================'

              $task |
                ConvertTo-Json -Depth 50 |
                Write-Host

              break
            }

            if ($state -in $failureStates) {

              $task |
                ConvertTo-Json -Depth 50 |
                Write-Host

              throw (
                "TestGuide task failed. State: $rawState. " +
                "StateInfo: $stateInfo"
              )
            }

            Start-Sleep -Seconds $pollIntervalSeconds
          }

          if (-not $completed) {
            throw (
              "TestGuide polling timed out after " +
              "$maximumPollingMinutes minutes."
            )
          }

          $finalState = [System.String]$task.state
          $finalVerdict = [System.String]$task.aggregatedVerdict
          $finalStateInfo = [System.String]$task.stateInfo
          $taskStartDate = [System.String]$task.startDate
          $taskEndDate = [System.String]$task.endDate

          "FINAL_TASK_STATE=$finalState" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_STATE_INFO=$finalStateInfo" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_VERDICT=$finalVerdict" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_START_DATE=$taskStartDate" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_END_DATE=$taskEndDate" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $taskResultFile = Join-Path `
            $env:RUNNER_TEMP `
            'testguide-task-result.json'

          $task |
            ConvertTo-Json -Depth 50 |
            Set-Content `
              -LiteralPath $taskResultFile `
              -Encoding utf8

          "TESTGUIDE_TASK_RESULT_FILE=$taskResultFile" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host "Final state   : $finalState"
          Write-Host "Final verdict : $finalVerdict"
          Write-Host "Start date    : $taskStartDate"
          Write-Host "End date      : $taskEndDate"


      # ==========================================================
      # 12. DISCOVER REPORT DEPOSITORY
      # ==========================================================

      - name: Discover TestGuide report depository
        if: env.TESTGUIDE_TASK_ID != ''
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $depositoriesUrl = (
            "$env:ONECX_URL/api/artifact/depositories" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&shared=false"
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'DISCOVER ARTIFACT DEPOSITORIES'
          Write-Host '========================================'

          $response = Invoke-RestMethod `
            -Method GET `
            -Uri $depositoriesUrl `
            -Headers $headers `
            -ErrorAction Stop

          $depositories = @($response)

          Write-Host ''
          Write-Host 'Available depositories:'

          foreach ($depository in $depositories) {

            Write-Host (
              "ID=$($depository.id) | " +
              "Name=$($depository.name) | " +
              "Project=$($depository.projectId)"
            )
          }

          $reportDepository = $null

          foreach ($depository in $depositories) {

            $depositoryName = [System.String]$depository.name

            if ($depositoryName.Trim() -eq 'Report Artifacts') {

              $reportDepository = $depository
              break
            }
          }

          if ($null -eq $reportDepository) {

            foreach ($depository in $depositories) {

              $depositoryName = [System.String]$depository.name

              if ($depositoryName -match '(?i)report') {

                $reportDepository = $depository
                break
              }
            }
          }

          if ($null -eq $reportDepository) {
            throw (
              "No Report Artifacts depository found for project " +
              "$env:ONECX_PROJECT_ID."
            )
          }

          $depositoryId = [System.String]$reportDepository.id
          $depositoryName = [System.String]$reportDepository.name

          if (
            [System.String]::IsNullOrWhiteSpace(
              $depositoryId
            )
          ) {
            throw 'Report depository ID is empty.'
          }

          if ($depositoryId -notmatch '^[a-zA-Z0-9]{3,15}$') {
            throw "Invalid report depository ID: $depositoryId"
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'REPORT DEPOSITORY SELECTED'
          Write-Host '========================================'
          Write-Host "ID   : $depositoryId"
          Write-Host "Name : $depositoryName"
          Write-Host '========================================'

          "REPORT_DEPOSITORY_ID=$depositoryId" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "REPORT_DEPOSITORY_NAME=$depositoryName" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 13. FIND REPORT ARTIFACT CANDIDATES
      #
      # IMPORTANT:
      # Preserve the TestGuide task clock values.
      # Do NOT convert these values using UtcDateTime.
      # ==========================================================

      - name: Find matching report artifact candidates
        if: env.REPORT_DEPOSITORY_ID != ''
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:REPORT_DEPOSITORY_ID
            )
          ) {
            throw 'REPORT_DEPOSITORY_ID is missing.'
          }

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:TASK_START_DATE
            )
          ) {
            throw 'TASK_START_DATE is missing.'
          }

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:TASK_END_DATE
            )
          ) {
            throw 'TASK_END_DATE is missing.'
          }

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          try {

            $taskStart = [System.DateTime]::Parse(
              $env:TASK_START_DATE,
              [System.Globalization.CultureInfo]::InvariantCulture
            )

            $taskEnd = [System.DateTime]::Parse(
              $env:TASK_END_DATE,
              [System.Globalization.CultureInfo]::InvariantCulture
            )

          }
          catch {

            throw (
              "Unable to parse task dates. " +
              "Start=$env:TASK_START_DATE " +
              "End=$env:TASK_END_DATE"
            )
          }

          # ------------------------------------------------------
          # TIMESTAMP FIX
          #
          # TestGuide returned for example:
          #
          #   11/08/2026 16:42:30
          #
          # Keep that as 16:42.
          #
          # Do NOT convert to:
          #
          #   21:42Z
          # ------------------------------------------------------

          $searchStart = $taskStart.AddMinutes(-1)
          $searchEnd = $taskEnd.AddMinutes(5)

          $startText = $searchStart.ToString(
            'yyyy-MM-ddTHH:mm:ss.fff'
          )

          $endText = $searchEnd.ToString(
            'yyyy-MM-ddTHH:mm:ss.fff'
          )

          $encodedDepository = [System.Uri]::EscapeDataString(
            $env:REPORT_DEPOSITORY_ID
          )

          $encodedStart = [System.Uri]::EscapeDataString(
            $startText
          )

          $encodedEnd = [System.Uri]::EscapeDataString(
            $endText
          )

          $artifactsUrl = (
            "$env:ONECX_URL/api/artifact/artifacts" +
            "?depositoryId=$encodedDepository" +
            "&startDate=$encodedStart" +
            "&endDate=$encodedEnd"
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'SEARCH REPORT ARTIFACTS'
          Write-Host '========================================'
          Write-Host "Depository : $env:REPORT_DEPOSITORY_ID"
          Write-Host "Task ID    : $env:TESTGUIDE_TASK_ID"
          Write-Host "Task start : $env:TASK_START_DATE"
          Write-Host "Task end   : $env:TASK_END_DATE"
          Write-Host "Search from: $startText"
          Write-Host "Search to  : $endText"
          Write-Host "URL        : $artifactsUrl"
          Write-Host '========================================'

          $response = Invoke-RestMethod `
            -Method GET `
            -Uri $artifactsUrl `
            -Headers $headers `
            -ErrorAction Stop

          $artifacts = @($response)

          $artifactResultFile = Join-Path `
            $env:RUNNER_TEMP `
            'testguide-report-artifact-candidates.json'

          $artifacts |
            ConvertTo-Json -Depth 50 |
            Set-Content `
              -LiteralPath $artifactResultFile `
              -Encoding utf8

          "TESTGUIDE_ARTIFACT_CANDIDATES_FILE=$artifactResultFile" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "REPORT_ARTIFACT_CANDIDATE_COUNT=$($artifacts.Count)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'REPORT ARTIFACT CANDIDATES'
          Write-Host '========================================'
          Write-Host "Candidate count: $($artifacts.Count)"

          if ($artifacts.Count -eq 0) {

            Write-Warning (
              'No report artifacts found for the execution window.'
            )

          }
          else {

            foreach ($artifact in $artifacts) {

              Write-Host ''
              Write-Host '----------------------------------------'
              Write-Host "ID          : $($artifact.id)"
              Write-Host "File Name   : $($artifact.fileName)"
              Write-Host "Extension   : $($artifact.extension)"
              Write-Host "File Size   : $($artifact.fileSize)"
              Write-Host "Upload Date : $($artifact.uploadDate)"
              Write-Host "Uploader    : $($artifact.uploader)"

              foreach ($attribute in @($artifact.attributeList)) {

                $values = @($attribute.values) -join ', '

                Write-Host (
                  "Attribute   : " +
                  "$($attribute.key) = $values"
                )
              }

              foreach ($share in @($artifact.shares)) {

                if (
                  -not [System.String]::IsNullOrWhiteSpace(
                    [System.String]$share.link
                  )
                ) {
                  Write-Host "Share Link  : $($share.link)"
                }
              }
            }
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host "Candidate JSON: $artifactResultFile"
          Write-Host '========================================'


      # ==========================================================
      # 14. SUMMARY
      # ==========================================================

      - name: Publish execution summary
        if: always()
        shell: pwsh
        run: |
          $summary = @(
            '## TestGuide execution',
            '',
            '| Field | Value |',
            '|---|---|',
            "| Jira | $env:JIRA_KEY |",
            "| OneCX Project | $env:ONECX_PROJECT_ID |",
            "| Bench | $env:TESTGUIDE_BENCH |",
            "| Bench Name | $env:BENCH_NAME |",
            "| Target ECU | $env:TARGET_ECU |",
            "| Test Cases | $env:NORMALIZED_TEST_CASES |",
            "| Playbook | $env:PLAYBOOK_NAME |",
            "| Playbook ID | $env:TESTGUIDE_PLAYBOOK_ID |",
            "| Playbook Link | $env:TESTGUIDE_PLAYBOOK_LINK |",
            "| Task ID | $env:TESTGUIDE_TASK_ID |",
            "| Task State | $env:FINAL_TASK_STATE |",
            "| Task State Info | $env:FINAL_TASK_STATE_INFO |",
            "| Verdict | $env:FINAL_TASK_VERDICT |",
            "| Task Start | $env:TASK_START_DATE |",
            "| Task End | $env:TASK_END_DATE |",
            "| Report Depository | $env:REPORT_DEPOSITORY_ID |",
            "| Report Depository Name | $env:REPORT_DEPOSITORY_NAME |",
            "| Artifact Candidates | $env:REPORT_ARTIFACT_CANDIDATE_COUNT |",
            "| Workspace | $env:TESTGUIDE_ROOT |",
            "| TBC | $env:TBC_RELATIVE_PATH |",
            "| TCF | $env:TCF_RELATIVE_PATH |",
            "| PRJ | $env:PROJECT_RELATIVE_PATH |",
            "| XIL | $env:XIL_IDENTIFIER |",
            "| Status | ${{ job.status }} |"
          )

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
