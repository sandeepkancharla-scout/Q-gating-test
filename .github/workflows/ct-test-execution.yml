name: CT TestGuide Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

permissions:
  contents: read

jobs:
  testguide-execution:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 5

    concurrency:
      group: ct-testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      # ==========================================================
      # EXECUTION INPUTS FROM JIRA
      # ==========================================================

      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK: ${{ github.event.client_payload.playbook_name }}

      # ==========================================================
      # REPOSITORY CONFIGURATION
      # ==========================================================

      AUTOMATION_REPO_URL: 'https://github.com/scout-motors/eeint-Test-Automation.git'
      AUTOMATION_BRANCH: 'main'

      # Repository copy on the GitHub self-hosted runner.
      LOCAL_ROOT: 'C:\HIL\Testing\eeint-Test-Automation'

      # Equivalent path expected by TestGuide.
      TESTGUIDE_ROOT: 'D:\HIL\Testing\eeint-Test-Automation'

    steps:
      # ==========================================================
      # PHASE 1
      # VALIDATE JIRA PAYLOAD
      # ==========================================================

      - name: Validate Jira execution request
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "CT TESTGUIDE EXECUTION"
          Write-Host "============================================"
          Write-Host "Jira Key    : $env:JIRA_KEY"
          Write-Host "Bench ID    : $env:BENCH_ID"
          Write-Host "Bench Name  : $env:BENCH_NAME"
          Write-Host "Target ECU  : $env:TARGET_ECU"
          Write-Host "Test Cases  : $env:TEST_CASES"
          Write-Host "Playbook    : $env:PLAYBOOK"
          Write-Host "============================================"

          $requiredInputs = @{
              JIRA_KEY   = $env:JIRA_KEY
              BENCH_ID   = $env:BENCH_ID
              BENCH_NAME = $env:BENCH_NAME
              TARGET_ECU = $env:TARGET_ECU
              TEST_CASES = $env:TEST_CASES
              PLAYBOOK   = $env:PLAYBOOK
          }

          foreach ($inputEntry in $requiredInputs.GetEnumerator()) {
              if ([string]::IsNullOrWhiteSpace([string]$inputEntry.Value)) {
                  throw "Required Jira input '$($inputEntry.Key)' is missing."
              }
          }

          Write-Host ""
          Write-Host "Jira payload validation successful."

      # ==========================================================
      # PHASE 2
      # VALIDATE SELF-HOSTED RUNNER
      # ==========================================================

      - name: Validate self-hosted runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "SELF-HOSTED RUNNER"
          Write-Host "============================================"

          Write-Host "Machine:"
          hostname

          Write-Host ""
          Write-Host "PowerShell:"
          Write-Host $PSVersionTable.PSVersion

          Write-Host ""
          Write-Host "Git:"

          git --version

          if ($LASTEXITCODE -ne 0) {
              throw "Git is not available on the self-hosted runner."
          }

          Write-Host ""
          Write-Host "Local repository root:"
          Write-Host "$env:LOCAL_ROOT"

          Write-Host ""
          Write-Host "TestGuide repository root:"
          Write-Host "$env:TESTGUIDE_ROOT"

      # ==========================================================
      # PHASE 3
      # CLONE OR UPDATE COMPLETE AUTOMATION REPOSITORY
      # ==========================================================

      - name: Checkout complete automation repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $repoPath = $env:LOCAL_ROOT
          $repoUrl  = $env:AUTOMATION_REPO_URL
          $branch   = $env:AUTOMATION_BRANCH

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PREPARE AUTOMATION REPOSITORY"
          Write-Host "============================================"
          Write-Host "Repository URL:"
          Write-Host "$repoUrl"
          Write-Host ""
          Write-Host "Local repository:"
          Write-Host "$repoPath"
          Write-Host ""
          Write-Host "Branch:"
          Write-Host "$branch"

          if ([string]::IsNullOrWhiteSpace($repoUrl)) {
              throw "AUTOMATION_REPO_URL is empty."
          }

          if ([string]::IsNullOrWhiteSpace($branch)) {
              throw "AUTOMATION_BRANCH is empty."
          }

          $gitDirectory = Join-Path $repoPath ".git"

          # ------------------------------------------------------
          # CLONE WHEN REPOSITORY IS MISSING
          # ------------------------------------------------------

          if (-not (Test-Path $gitDirectory)) {
              Write-Host ""
              Write-Host "Repository is not currently cloned."

              $parentDirectory = Split-Path $repoPath -Parent

              if (-not (Test-Path $parentDirectory)) {
                  Write-Host ""
                  Write-Host "Creating parent directory:"
                  Write-Host "$parentDirectory"

                  New-Item `
                      -ItemType Directory `
                      -Path $parentDirectory `
                      -Force |
                  Out-Null
              }

              if (Test-Path $repoPath) {
                  $existingItems = @(
                      Get-ChildItem `
                          -Path $repoPath `
                          -Force `
                          -ErrorAction SilentlyContinue
                  )

                  if ($existingItems.Count -gt 0) {
                      Write-Host ""
                      Write-Host "Existing non-Git contents:"

                      foreach ($existingItem in $existingItems) {
                          Write-Host "  $($existingItem.FullName)"
                      }

                      throw @"
          The target directory exists but is not a Git repository:

          $repoPath

          The workflow will not delete or overwrite existing files.
          Move or remove the existing contents, then rerun the workflow.
          "@
                  }
              }

              Write-Host ""
              Write-Host "Cloning repository and recursive submodules..."

              git clone `
                  --branch $branch `
                  --recurse-submodules `
                  $repoUrl `
                  $repoPath

              if ($LASTEXITCODE -ne 0) {
                  throw @"
          Repository clone failed.

          Repository:
          $repoUrl

          If the repository is private, confirm that the Windows account
          running the GitHub runner has permission to clone the repository.
          "@
              }
          }

          # ------------------------------------------------------
          # UPDATE WHEN REPOSITORY ALREADY EXISTS
          # ------------------------------------------------------

          else {
              Write-Host ""
              Write-Host "Existing Git repository found."

              Write-Host ""
              Write-Host "Configuring origin URL..."

              git -C $repoPath remote set-url origin $repoUrl

              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to configure the origin repository URL."
              }

              Write-Host ""
              Write-Host "Fetching origin/$branch..."

              git -C $repoPath fetch `
                  --prune `
                  origin `
                  $branch

              if ($LASTEXITCODE -ne 0) {
                  throw "git fetch failed."
              }

              Write-Host ""
              Write-Host "Checking out $branch..."

              git -C $repoPath checkout $branch

              if ($LASTEXITCODE -ne 0) {
                  throw "git checkout $branch failed."
              }

              Write-Host ""
              Write-Host "Resetting local branch to origin/$branch..."

              git -C $repoPath reset `
                  --hard `
                  "origin/$branch"

              if ($LASTEXITCODE -ne 0) {
                  throw "git reset to origin/$branch failed."
              }

              Write-Host ""
              Write-Host "Cleaning untracked repository files..."

              git -C $repoPath clean `
                  -fd

              if ($LASTEXITCODE -ne 0) {
                  throw "git clean failed."
              }
          }

          # ------------------------------------------------------
          # SYNCHRONIZE AND UPDATE SUBMODULES
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "============================================"
          Write-Host "SUBMODULE SYNCHRONIZATION"
          Write-Host "============================================"

          git -C $repoPath submodule sync --recursive

          if ($LASTEXITCODE -ne 0) {
              throw "git submodule sync failed."
          }

          Write-Host ""
          Write-Host "Initializing and updating recursive submodules..."

          git -C $repoPath submodule update `
              --init `
              --recursive `
              --force

          if ($LASTEXITCODE -ne 0) {
              throw @"
          Recursive submodule checkout failedhe GitHub runner account has access to every
          repository referenced by .gitmodules.
          "@
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "CURRENT REPOSITORY COMMIT"
          Write-Host "============================================"

          git -C $repoPath log `
              -1 `
              --pretty=format:"%H %cd %s" `
              --date=iso

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to read the current repository commit."
          }

          Write-Host ""
          Write-Host ""
          Write-Host "============================================"
          Write-Host "SUBMODULE STATUS"
          Write-Host "============================================"

          git -C $repoPath submodule status --recursive

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to read recursive submodule status."
          }

      # ==========================================================
      # PHASE 4
      # VERIFY PROJECT FILES
      # ==========================================================

      - name: Verify project files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $repositoryRoot = $env:LOCAL_ROOT

          if (-not (Test-Path $repositoryRoot)) {
              throw "Local repository does not exist: $repositoryRoot"
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PROJECT FILE DISCOVERY"
          Write-Host "============================================"

          $projects = @(
              Get-ChildItem `
                  -Path $repositoryRoot `
                  -Filter "*.prj" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue
          )

          Write-Host "PRJ files found: $($projects.Count)"
          Write-Host ""

          foreach ($project in $projects) {
              Write-Host "  $($project.FullName)"
          }

          if ($projects.Count -eq 0) {
              throw @"
          The repository and recursive submodules were populated, but no
          .prj files were found under:

          $repositoryRoot

          Check whether the project file has a different extension or
          belongs to a submodule that the runner cannot access.
          "@
          }

      # ==========================================================
      # PHASE 5
      # NORMALIZE JIRA TEST CASE IDS
      # ==========================================================

      - name: Parse Jira Test Cases
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $testCases = @(
              $env:TEST_CASES -split '[,;]' |
              ForEach-Object {
                  $_.Trim()
              } |
              Where-Object {
                  -not :IsNullOrWhiteSpace($_)
              }
          )

          if ($testCases.Count -eq 0) {
              throw "No valid Test Case IDs were received from Jira."
          }

          $normalizedTestCases = $testCases -join ","

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TEST CASES"
          Write-Host "============================================"

          foreach ($testCase in $testCases) {
              Write-Host "TC: $testCase"
          }

          Write-Host "============================================"

          "NORMALIZED_TEST_CASES=$normalizedTestCases" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # PHASE 6
      # RESOLVE PRJ USING JIRA BENCH_NAME
      # ==========================================================

      - name: Resolve PRJ from Bench Name
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $repositoryRoot = $env:LOCAL_ROOT
          $benchName      = $env:BENCH_NAME

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PROJECT RESOLUTION"
          Write-Host "============================================"
          Write-Host "Repository:"
          Write-Host "$repositoryRoot"
          Write-Host ""
          Write-Host "Jira Bench Name:"
          Write-Host "$benchName"
          Write-Host ""

          $projects = @(
              Get-ChildItem `
                  -Path $repositoryRoot `
                  -Filter "*.prj" `
                  -File `
                  -Recurse `
                  -ErrorAction Stop
          )

          if ($projects.Count -eq 0) {
              throw "No .prj files were found under $repositoryRoot"
          }

          $matches = @(
              $projects |
              Where-Object {
                  $_.FullName.IndexOf(
                      $benchName,
                      [System.StringComparison]::OrdinalIgnoreCase
                  ) -ge 0
              }
          )

          if ($matches.Count -eq 0) {
              Write-Host ""
              Write-Host "Available PRJ files:"

              foreach ($project in $projects) {
                  Write-Host "  $($project.FullName)"
              }

              throw @"
          No PRJ file path matched the Jira bench name:

          $benchName

          The workflow currently expects bench_name to appear somewhere
          in the PRJ directory or filename.
          "@
          }

          if ($matches.Count -gt 1) {
              Write-Host ""
              Write-Host "Multiple projects matched bench '$benchName':"

              foreach ($match in $matches) {
                  Write-Host "  $($match.FullName)"
              }

              throw @"
          Multiple PRJ files matched bench '$benchName'.

          The workflow refuses to choose a project automatically.
          Add a more specific Jira bench_name or introduce an explicit
          project mapping before enabling production execution.
          "@
          }

          $selectedProject = $matches[0]

          Write-Host ""
          Write-Host "============================================"
          Write-Host "LOCAL PRJ FOUND"
          Write-Host "============================================"
          Write-Host "$($selectedProject.FullName)"
          Write-Host "============================================"

          "LOCAL_PROJECT_PATH=$($selectedProject.FullName)" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # PHASE 7
      # MAP LOCAL C: PATH TO TESTGUIDE D: PATH
      # ==========================================================

      - name: Create TestGuide PRJ Path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $localRoot = [System.IO.Path]::GetFullPath(
              $env:LOCAL_ROOT
          )

          $testGuideRoot = [System.IO.Path]::GetFullPath(
              $env:TESTGUIDE_ROOT
          )

          $localProject = [System.IO.Path]::GetFullPath(
              $env:LOCAL_PROJECT_PATH
          )

          if (-not (Test-Path $localProject)) {
              throw "Resolved local PRJ does not exist: $localProject"
          }

          $relativePath = [System.IO.Path]::GetRelativePath(
              $localRoot,
              $localProject
          )

          if (
              $relativePath.StartsWith("..") -or
              [System.IO.Path]::IsPathRooted($relativePath)
          ) {
              throw "Resolved PRJ is outside the configured LOCAL_ROOT."
          }

          $testGuideProjectPath = Join-Path `
              $testGuideRoot `
              $relativePath

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PROJECT PATH MAPPING"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "LOCAL PRJ:"
          Write-Host "$localProject"
          Write-Host ""
          Write-Host "RELATIVE PATH:"
          Write-Host "$relativePath"
          Write-Host ""
          Write-Host "TESTGUIDE PRJ:"
          Write-Host "$testGuideProjectPath"
          Write-Host ""
          Write-Host "============================================"

          "PROJECT_RELATIVE_PATH=$relativePath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "TESTGUIDE_PROJECT_PATH=$testGuideProjectPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # PHASE 8
      # PREPARE TASK-BASED TESTGUIDE REQUEST
      #
      # Property names remain placeholders until the real
      # TestGuide task request schema is confirmed.
      # ==========================================================

      - name: Prepare TestGuide Task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $testCaseIds = @(
              $env:NORMALIZED_TEST_CASES -split "," |
              ForEach-Object {
                  $_.Trim()
              } |
              Where-Object {
                  -not :IsNullOrWhiteSpace($_)
              }
          )

          if ($testCaseIds.Count -eq 0) {
              throw "No normalized Test Case IDs are available."
          }

          $taskRequest = [ordered]@{
              externalId = $env:JIRA_KEY

              bench = [ordered]@{
                  id   = $env:BENCH_ID
                  name = $env:BENCH_NAME
              }

              playbookName = $env:PLAYBOOK
              projectPath  = $env:TESTGUIDE_PROJECT_PATH
              targetEcu    = $env:TARGET_ECU
              testCaseIds  = $testCaseIds
          }

          $taskJson = $taskRequest |
              ConvertTo-Json -Depth 20

          $taskFile = Join-Path `
              $env:RUNNER_TEMP `
              "testguide-task-request.json"

          $taskJson |
              Set-Content `
                  -Path $taskFile `
                  -Encoding utf8

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TESTGUIDE TASK REQUEST PLACEHOLDER"
          Write-Host "============================================"
          Write-Host $taskJson
          Write-Host "============================================"

          "TESTGUIDE_TASK_FILE=$taskFile" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # PHASE 9
      # SHOW FINAL EXECUTION CONTEXT
      # ==========================================================

      - name: Show final TestGuide execution context
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TESTGUIDE EXECUTION READY"
          Write-Host "============================================"
          Write-Host "Jira Key      : $env:JIRA_KEY"
          Write-Host "Bench ID      : $env:BENCH_ID"
          Write-Host "Bench Name    : $env:BENCH_NAME"
          Write-Host "Playbook      : $env:PLAYBOOK"
          Write-Host "Target ECU    : $env:TARGET_ECU"
          Write-Host "Test Cases    : $env:NORMALIZED_TEST_CASES"
          Write-Host "Local PRJ     : $env:LOCAL_PROJECT_PATH"
          Write-Host "TestGuide PRJ : $env:TESTGUIDE_PROJECT_PATH"
          Write-Host "Task JSON     : $env:TESTGUIDE_TASK_FILE"
          Write-Host "============================================"

      # ==========================================================
      # PHASE 10
      # TESTGUIDE TASK EXECUTION PLACEHOLDER
      #
      # The workflow does not call an unverified production API.
      # When the real endpoint/body is confirmed:
      #
      # 1. Configure TESTGUIDE_TASK_URL
      # 2. Configure TESTGUIDE_API_TOKEN if required
      # 3. Confirm the request property names from Phase 8
      # 4. Enable the Invoke-RestMethod section
      # ==========================================================

      - name: TestGuide Task Execution Placeholder
        shell: pwsh
        env:
          TESTGUIDE_TASK_URL: ${{ secrets.TESTGUIDE_TASK_URL }}
          TESTGUIDE_API_TOKEN: ${{ secrets.TESTGUIDE_API_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TESTGUIDE TASK EXECUTION PLACEHOLDER"
          Write-Host "============================================"
          Write-Host "Playbook : $env:PLAYBOOK"
          Write-Host "Project  : $env:TESTGUIDE_PROJECT_PATH"
          Write-Host "ECU      : $env:TARGET_ECU"
          Write-Host "TCs      : $env:NORMALIZED_TEST_CASES"
          Write-Host "============================================"

          if (-not (Test-Path $env:TESTGUIDE_TASK_FILE)) {
              throw "TestGuide task JSON file does not exist."
          }

          if (:IsNullOrWhiteSpace($env:TESTGUIDE_TASK_URL)) {
              Write-Warning @"
          TESTGUIDE_TASK_URL is not configured.

          Repository checkout, submodule checkout, PRJ resolution,
          C-to-D path mapping and task JSON generation completed.

          The workflow is stopping before the unverified TestGuide
          production API call.
          "@

              exit 0
          }

          if (:IsNullOrWhiteSpace($env:TESTGUIDE_API_TOKEN)) {
              throw "TESTGUIDE_API_TOKEN is missing."
          }

          $headers = @{
              Authorization = "Bearer $env:TESTGUIDE_API_TOKEN"
              Accept        = "application/json"
          }

          $requestBody = Get-Content `
              -Path $env:TESTGUIDE_TASK_FILE `
              -Raw

          Write-Host ""
          Write-Host "TestGuide URL is configured."
          Write-Host "Task request is prepared."
          Write-Host ""
          Write-Host "The POST remains disabled until the endpoint and"
          Write-Host "request schema are verified."

          # ======================================================
          # ENABLE ONLY AFTER VERIFYING TESTGUIDE API
          # ======================================================
          #
          # $response = Invoke-RestMethod `
          #     -Method POST `
          #     -Uri $env:TESTGUIDE_TASK_URL `
          #     -Headers $headers `
          #     -ContentType "application/json" `
          #     -Body $requestBody
          #
          # if ($null -eq $response) {
          #     throw "TestGuide returned an empty response."
          # }
          #
          # Write-Host ""
          # Write-Host "TestGuide response:"
          #
          # $response |
          #     ConvertTo-Json -Depth 20 |
          #     Write-Host
          #
          # $taskId = [string]$response.taskId
          #
          # if (:IsNullOrWhiteSpace($taskId)) {
          #     throw "TestGuide response did not contain taskId."
          # }
          #
          # "TESTGUIDE_TASK_ID=$taskId" |
          #     Out-File `
          #         -FilePath $env:GITHUB_ENV `
          #         -Encoding utf8 `
          #         -Append
          #
          # Write-Host ""
          # Write-Host "TestGuide task created: $taskId"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PREPARATION COMPLETE"
          Write-Host "============================================"

      # ==========================================================
      # PHASE 11
      # GITHUB EXECUTION SUMMARY
      # ==========================================================

      - name: Publish workflow summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## CT TestGuide execution

          | Field | Value |
          |---|---|
          | Jira | $env:JIRA_KEY |
          | Bench ID | $env:BENCH_ID |
          | Bench Name | $env:BENCH_NAME |
          | Playbook | $env:PLAYBOOK |
          | ECU | $env:TARGET_ECU |
          | Test Cases | $env:NORMALIZED_TEST_CASES |
          | Local PRJ | $env:LOCAL_PROJECT_PATH |
          | TestGuide PRJ | $env:TESTGUIDE_PROJECT_PATH |
          | Job status | ${{ job.status }} |

          The TestGuide API POST remains disabled until the endpoint
          and task request schema are verified.
          "@ |
              Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY `
                  -Encoding utf8 `
                  -Append
