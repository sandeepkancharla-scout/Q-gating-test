name: CT TestGuide Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

permissions:
  contents: read

jobs:
  testguide-execution:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: ct-testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      # ==========================================================
      # EXECUTION INPUTS FROM JIRA
      # ==========================================================

      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK: ${{ github.event.client_payload.playbook_name }}

      # ==========================================================
      # STATIC INFRASTRUCTURE CONFIGURATION
      # ==========================================================

      AUTOMATION_REPOSITORY: 'scout-motors/eeint-Test-Automation'
      AUTOMATION_REF: 'main'

      # actions/checkout downloads here, relative to GITHUB_WORKSPACE.
      CHECKOUT_FOLDER: 'automation-source'

      # Local replicated repository on the Cloud PC.
      LOCAL_ROOT: 'C:\HIL\Testing\eeint-Test-Automation'

      # Equivalent location visible to TestGuide.
      TESTGUIDE_ROOT: 'D:\HIL\Testing\eeint-Test-Automation'

    steps:
      # ==========================================================
      # PHASE 1
      # VALIDATE JIRA PAYLOAD
      # ==========================================================

      - name: Validate Jira execution request
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "CT TESTGUIDE EXECUTION"
          Write-Host "============================================"
          Write-Host "Jira Key    : $env:JIRA_KEY"
          Write-Host "Bench ID    : $env:BENCH_ID"
          Write-Host "Bench Name  : $env:BENCH_NAME"
          Write-Host "Target ECU  : $env:TARGET_ECU"
          Write-Host "Test Cases  : $env:TEST_CASES"
          Write-Host "Playbook    : $env:PLAYBOOK"
          Write-Host "============================================"

          $requiredInputs = @{
              JIRA_KEY   = $env:JIRA_KEY
              BENCH_ID   = $env:BENCH_ID
              BENCH_NAME = $env:BENCH_NAME
              TARGET_ECU = $env:TARGET_ECU
              TEST_CASES = $env:TEST_CASES
              PLAYBOOK   = $env:PLAYBOOK
          }

          foreach ($inputEntry in $requiredInputs.GetEnumerator()) {
              if ([System.String]::IsNullOrWhiteSpace(
                  [System.String]$inputEntry.Value
              )) {
                  throw "Required Jira input '$($inputEntry.Key)' is missing."
              }
          }

          Write-Host ""
          Write-Host "Jira payload validation successful."

      # ==========================================================
      # PHASE 2
      # VALIDATE WINDOWS RUNNER
      #
      # Git CLI is intentionally not required.
      # ==========================================================

      - name: Validate Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "WINDOWS SELF-HOSTED RUNNER"
          Write-Host "============================================"
          Write-Host "Machine       : $env:COMPUTERNAME"
          Write-Host "Workspace     : $env:GITHUB_WORKSPACE"
          Write-Host "Runner temp   : $env:RUNNER_TEMP"
          Write-Host "Local root    : $env:LOCAL_ROOT"
          Write-Host "TestGuide root: $env:TESTGUIDE_ROOT"
          Write-Host "============================================"

          if ([System.String]::IsNullOrWhiteSpace(
              $env:GITHUB_WORKSPACE
          )) {
              throw "GITHUB_WORKSPACE is missing."
          }

          if ([System.String]::IsNullOrWhiteSpace(
              $env:RUNNER_TEMP
          )) {
              throw "RUNNER_TEMP is missing."
          }

      # ==========================================================
      # PHASE 3
      # DOWNLOAD AUTOMATION REPOSITORY WITHOUT GIT COMMANDS
      #
      # If Git is unavailable, actions/checkout can use the GitHub
      # REST archive fallback.
      #
      # SUBMODULES ARE DISABLED:
      # REST archive fallback does not recursively download them.
      # ==========================================================

      - name: Download automation repository
        uses: actions/checkout@v4
        with:
          repository: scout-motors/eeint-Test-Automation
          ref: main
          path: automation-source
          token: ${{ secrets.HIL_REPO_PAT }}
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false
          clean: true

      # ==========================================================
      # PHASE 4
      # VERIFY DOWNLOADED REPOSITORY
      # ==========================================================

      - name: Verify downloaded repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourcePath = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:CHECKOUT_FOLDER

          Write-Host ""
          Write-Host "============================================"
          Write-Host "DOWNLOADED AUTOMATION REPOSITORY"
          Write-Host "============================================"
          Write-Host "Source:"
          Write-Host "$sourcePath"
          Write-Host "============================================"

          if (-not (Test-Path $sourcePath)) {
              throw "actions/checkout output is missing: $sourcePath"
          }

          $sourceItems = @(
              Get-ChildItem `
                  -Path $sourcePath `
                  -Force `
                  -ErrorAction Stop
          )

          if ($sourceItems.Count -eq 0) {
              throw "Downloaded repository is empty: $sourcePath"
          }

          Write-Host ""
          Write-Host "Top-level downloaded items:"

          foreach ($sourceItem in $sourceItems) {
              Write-Host "  $($sourceItem.FullName)"
          }

          $gitModulesPath = Join-Path `
              $sourcePath `
              ".gitmodules"

          if (Test-Path $gitModulesPath) {
              Write-Warning @"
          The downloaded repository contains a .gitmodules file.

          Git CLI is unavailable, so recursive submodules were not
          downloaded by actions/checkout REST fallback.

          If the required PRJ is inside a submodule, add that repository
          as a separate actions/checkout step.
          "@

              Write-Host ""
              Write-Host ".gitmodules content:"
              Get-Content $gitModulesPath |
                  ForEach-Object {
                      Write-Host $_
                  }
          }

      # ==========================================================
      # PHASE 5
      # MIRROR DOWNLOADED FILES TO C:\HIL\Testing\...
      #
      # ROBOCOPY:
      # exit codes 0-7 are successful/non-fatal.
      # exit codes 8+ indicate failure.
      # ==========================================================

      - name: Replicate repository to local C drive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourcePath = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:CHECKOUT_FOLDER

          $destinationPath = $env:LOCAL_ROOT

          Write-Host ""
          Write-Host "============================================"
          Write-Host "LOCAL REPOSITORY REPLICATION"
          Write-Host "============================================"
          Write-Host "Source:"
          Write-Host "$sourcePath"
          Write-Host ""
          Write-Host "Destination:"
          Write-Host "$destinationPath"
          Write-Host "============================================"

          if (-not (Test-Path $sourcePath)) {
              throw "Checkout source does not exist: $sourcePath"
          }

          $destinationParent = Split-Path `
              $destinationPath `
              -Parent

          if (-not (Test-Path $destinationParent)) {
              New-Item `
                  -ItemType Directory `
                  -Path $destinationParent `
                  -Force |
              Out-Null
          }

          if (-not (Test-Path $destinationPath)) {
              New-Item `
                  -ItemType Directory `
                  -Path $destinationPath `
                  -Force |
              Out-Null
          }

          # /MIR recreates the downloaded repository exactly.
          # /R and /W prevent long retries on locked files.
          # /XD excludes checkout metadata if present.

          & robocopy `
              $sourcePath `
              $destinationPath `
              /MIR `
              /R:2 `
              /W:2 `
              /COPY:DAT `
              /DCOPY:DAT `
              /NP `
              /NJH `
              /NJS `
              /XD ".git"

          $robocopyExitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Robocopy exit code: $robocopyExitCode"

          if ($robocopyExitCode -ge 8) {
              throw "Repository replication failed with Robocopy exit code $robocopyExitCode."
          }

          if (-not (Test-Path $destinationPath)) {
              throw "Local repository destination is missing after replication."
          }

          $localItems = @(
              Get-ChildItem `
                  -Path $destinationPath `
                  -Force `
                  -ErrorAction Stop
          )

          if ($localItems.Count -eq 0) {
              throw "Local repository is empty after replication."
          }

          Write-Host ""
          Write-Host "Repository replicated successfully."

      # ==========================================================
      # PHASE 6
      # DISCOVER PRJ FILES
      # ==========================================================

      - name: Discover project files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $repositoryRoot = $env:LOCAL_ROOT

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PROJECT FILE DISCOVERY"
          Write-Host "============================================"
          Write-Host "Repository:"
          Write-Host "$repositoryRoot"
          Write-Host "============================================"

          if (-not (Test-Path $repositoryRoot)) {
              throw "Local repository does not exist: $repositoryRoot"
          }

          $projects = @(
              Get-ChildItem `
                  -Path $repositoryRoot `
                  -Filter "*.prj" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue
          )

          Write-Host ""
          Write-Host "PRJ files found: $($projects.Count)"

          foreach ($project in $projects) {
              Write-Host "  $($project.FullName)"
          }

          if ($projects.Count -eq 0) {
              $gitModulesPath = Join-Path `
                  $repositoryRoot `
                  ".gitmodules"

              if (Test-Path $gitModulesPath) {
                  throw @"
          No PRJ files were found in the downloaded main repository.

          The repository contains .gitmodules, but actions/checkout REST
          fallback cannot recursively retrieve submodules without Git CLI.

          Add the project-containing submodule repository as another
          actions/checkout step.
          "@
              }

              throw @"
          No PRJ files were found under:

          $repositoryRoot

          Confirm that the PRJ files are committed directly to
          scout-motors/eeint-Test-Automation.
          "@
          }

      # ==========================================================
      # PHASE 7
      # NORMALIZE TEST CASE IDS FROM JIRA
      # ==========================================================

      - name: Parse Jira Test Cases
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $testCases = @(
              $env:TEST_CASES -split '[,;]' |
              ForEach-Object {
                  $_.Trim()
              } |
              Where-Object {
                  -not [System.String]::IsNullOrWhiteSpace($_)
              }
          )

          if ($testCases.Count -eq 0) {
              throw "No valid Test Case IDs were received from Jira."
          }

          $normalizedTestCases = $testCases -join ","

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TEST CASES"
          Write-Host "============================================"

          foreach ($testCase in $testCases) {
              Write-Host "TC: $testCase"
          }

          Write-Host "============================================"

          "NORMALIZED_TEST_CASES=$normalizedTestCases" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # PHASE 8
      # RESOLVE PRJ USING JIRA BENCH_NAME
      # ==========================================================

      - name: Resolve PRJ from Bench Name
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $repositoryRoot = $env:LOCAL_ROOT
          $benchName = $env:BENCH_NAME

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PROJECT RESOLUTION"
          Write-Host "============================================"
          Write-Host "Repository:"
          Write-Host "$repositoryRoot"
          Write-Host ""
          Write-Host "Jira Bench Name:"
          Write-Host "$benchName"
          Write-Host "============================================"

          $projects = @(
              Get-ChildItem `
                  -Path $repositoryRoot `
                  -Filter "*.prj" `
                  -File `
                  -Recurse `
                  -ErrorAction Stop
          )

          if ($projects.Count -eq 0) {
              throw "No PRJ files are available under $repositoryRoot"
          }

          $matches = @(
              $projects |
              Where-Object {
                  $_.FullName.IndexOf(
                      $benchName,
                      [System.StringComparison]::OrdinalIgnoreCase
                  ) -ge 0
              }
          )

          if ($matches.Count -eq 0) {
              Write-Host ""
              Write-Host "Available PRJ files:"

              foreach ($project in $projects) {
                  Write-Host "  $($project.FullName)"
              }

              throw @"
          No PRJ file path matched Jira bench_name:

          $benchName

          The current selection rule expects bench_name to appear
          somewhere in the PRJ directory path or filename.
          "@
          }

          if ($matches.Count -gt 1) {
              Write-Host ""
              Write-Host "Matching PRJ files:"

              foreach ($match in $matches) {
                  Write-Host "  $($match.FullName)"
              }

              throw @"
          More than one PRJ file matched bench_name '$benchName'.

          The workflow refuses to choose a project automatically.
          "@
          }

          $selectedProject = $matches[0]

          Write-Host ""
          Write-Host "============================================"
          Write-Host "LOCAL PRJ SELECTED"
          Write-Host "============================================"
          Write-Host "$($selectedProject.FullName)"
          Write-Host "============================================"

          "LOCAL_PROJECT_PATH=$($selectedProject.FullName)" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # PHASE 9
      # MAP LOCAL C PATH TO TESTGUIDE D PATH
      # ==========================================================

      - name: Create TestGuide PRJ Path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $localRoot = [System.IO.Path]::GetFullPath(
              $env:LOCAL_ROOT
          )

          $testGuideRoot = [System.IO.Path]::GetFullPath(
              $env:TESTGUIDE_ROOT
          )

          $localProject = [System.IO.Path]::GetFullPath(
              $env:LOCAL_PROJECT_PATH
          )

          if (-not (Test-Path $localProject)) {
              throw "Resolved local PRJ does not exist: $localProject"
          }

          $relativePath = [System.IO.Path]::GetRelativePath(
              $localRoot,
              $localProject
          )

          if (
              $relativePath.StartsWith("..") -or
              [System.IO.Path]::IsPathRooted($relativePath)
          ) {
              throw "Resolved PRJ is outside LOCAL_ROOT."
          }

          $testGuideProjectPath = Join-Path `
              $testGuideRoot `
              $relativePath

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PROJECT PATH MAPPING"
          Write-Host "============================================"
          Write-Host "Local PRJ:"
          Write-Host "$localProject"
          Write-Host ""
          Write-Host "Relative path:"
          Write-Host "$relativePath"
          Write-Host ""
          Write-Host "TestGuide PRJ:"
          Write-Host "$testGuideProjectPath"
          Write-Host "============================================"

          "PROJECT_RELATIVE_PATH=$relativePath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "TESTGUIDE_PROJECT_PATH=$testGuideProjectPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # PHASE 10
      # PREPARE TASK-BASED REQUEST
      #
      # The field names are placeholders until the real TestGuide
      # task request schema is confirmed.
      # ==========================================================

      - name: Prepare TestGuide Task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $testCaseIds = @(
              $env:NORMALIZED_TEST_CASES -split "," |
              ForEach-Object {
                  $_.Trim()
              } |
              Where-Object {
                  -not [System.String]::IsNullOrWhiteSpace($_)
              }
          )

          if ($testCaseIds.Count -eq 0) {
              throw "No normalized Test Case IDs are available."
          }

          $taskRequest = [ordered]@{
              externalId = $env:JIRA_KEY

              bench = [ordered]@{
                  id   = $env:BENCH_ID
                  name = $env:BENCH_NAME
              }

              playbookName = $env:PLAYBOOK
              projectPath  = $env:TESTGUIDE_PROJECT_PATH
              targetEcu    = $env:TARGET_ECU
              testCaseIds  = $testCaseIds
          }

          $taskJson = $taskRequest |
              ConvertTo-Json -Depth 20

          $taskFile = Join-Path `
              $env:RUNNER_TEMP `
              "testguide-task-request.json"

          $taskJson |
              Set-Content `
                  -Path $taskFile `
                  -Encoding utf8

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TESTGUIDE TASK REQUEST PLACEHOLDER"
          Write-Host "============================================"
          Write-Host $taskJson
          Write-Host "============================================"

          "TESTGUIDE_TASK_FILE=$taskFile" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # PHASE 11
      # FINAL EXECUTION CONTEXT
      # ==========================================================

      - name: Show final TestGuide execution context
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TESTGUIDE EXECUTION READY"
          Write-Host "============================================"
          Write-Host "Jira Key      : $env:JIRA_KEY"
          Write-Host "Bench ID      : $env:BENCH_ID"
          Write-Host "Bench Name    : $env:BENCH_NAME"
          Write-Host "Playbook      : $env:PLAYBOOK"
          Write-Host "Target ECU    : $env:TARGET_ECU"
          Write-Host "Test Cases    : $env:NORMALIZED_TEST_CASES"
          Write-Host "Local PRJ     : $env:LOCAL_PROJECT_PATH"
          Write-Host "TestGuide PRJ : $env:TESTGUIDE_PROJECT_PATH"
          Write-Host "Task JSON     : $env:TESTGUIDE_TASK_FILE"
          Write-Host "============================================"

      # ==========================================================
      # PHASE 12
      # TESTGUIDE POST/RUN PLACEHOLDER
      #
      # Replace this phase after confirming:
      # 1. Task creation endpoint
      # 2. Task run endpoint
      # 3. Request schema
      # 4. Authentication method
      # ==========================================================

      - name: TestGuide Task Execution Placeholder
        shell: pwsh
        env:
          TESTGUIDE_CREATE_TASK_URL: ${{ secrets.TESTGUIDE_CREATE_TASK_URL }}
          TESTGUIDE_RUN_TASK_URL: ${{ secrets.TESTGUIDE_RUN_TASK_URL }}
          TESTGUIDE_API_TOKEN: ${{ secrets.TESTGUIDE_API_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TESTGUIDE TASK EXECUTION PLACEHOLDER"
          Write-Host "============================================"
          Write-Host "Playbook : $env:PLAYBOOK"
          Write-Host "Project  : $env:TESTGUIDE_PROJECT_PATH"
          Write-Host "ECU      : $env:TARGET_ECU"
          Write-Host "TCs      : $env:NORMALIZED_TEST_CASES"
          Write-Host "============================================"

          if (-not (Test-Path $env:TESTGUIDE_TASK_FILE)) {
              throw "TestGuide task JSON file is missing."
          }

          if ([System.String]::IsNullOrWhiteSpace(
              $env:TESTGUIDE_CREATE_TASK_URL
          )) {
              Write-Warning @"
          TESTGUIDE_CREATE_TASK_URL is not configured.

          Repository download, C-drive replication, PRJ resolution,
          C-to-D mapping, and task JSON preparation succeeded.

          The workflow will stop before calling the unverified
          TestGuide task API.
          "@

              exit 0
          }

          if ([System.String]::IsNullOrWhiteSpace(
              $env:TESTGUIDE_RUN_TASK_URL
          )) {
              throw "TESTGUIDE_RUN_TASK_URL is missing."
          }

          if ([System.String]::IsNullOrWhiteSpace(
              $env:TESTGUIDE_API_TOKEN
          )) {
              throw "TESTGUIDE_API_TOKEN is missing."
          }

          $requestBody = Get-Content `
              -Path $env:TESTGUIDE_TASK_FILE `
              -Raw

          $headers = @{
              Authorization = "Bearer $env:TESTGUIDE_API_TOKEN"
              Accept        = "application/json"
          }

          Write-Host ""
          Write-Host "Task request and API configuration are ready."
          Write-Host "The create/run calls remain disabled until the"
          Write-Host "TestGuide endpoint schemas are confirmed."

          # ======================================================
          # CREATE TASK PLACEHOLDER
          # ======================================================
          #
          # $createResponse = Invoke-RestMethod `
          #     -Method POST `
          #     -Uri $env:TESTGUIDE_CREATE_TASK_URL `
          #     -Headers $headers `
          #     -ContentType "application/json" `
          #     -Body $requestBody
          #
          # $taskId = [System.String]$createResponse.taskId
          #
          # if ([System.String]::IsNullOrWhiteSpace($taskId)) {
          #     throw "Create-task response did not contain taskId."
          # }
          #
          # Write-Host "Task created: $taskId"
          #
          # $runUrl = $env:TESTGUIDE_RUN_TASK_URL.Replace(
          #     "{taskId}",
          #     $taskId
          # )
          #
          # $runResponse = Invoke-RestMethod `
          #     -Method POST `
          #     -Uri $runUrl `
          #     -Headers $headers `
          #     -ContentType "application/json"
          #
          # Write-Host "Task started: $taskId"
          #
          # $runResponse |
          #     ConvertTo-Json -Depth 20 |
          #     Write-Host

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PREPARATION COMPLETE"
          Write-Host "============================================"

      # ==========================================================
      # PHASE 13
      # GITHUB SUMMARY
      # ==========================================================

      - name: Publish workflow summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## CT TestGuide execution

          | Field | Value |
          |---|---|
          | Jira | $env:JIRA_KEY |
          | Bench ID | $env:BENCH_ID |
          | Bench Name | $env:BENCH_NAME |
          | Playbook | $env:PLAYBOOK |
          | ECU | $env:TARGET_ECU |
          | Test Cases | $env:NORMALIZED_TEST_CASES |
          | Local PRJ | $env:LOCAL_PROJECT_PATH |
          | TestGuide PRJ | $env:TESTGUIDE_PROJECT_PATH |
          | Job status | ${{ job.status }} |

          Repository content was retrieved with actions/checkout and
          replicated to C:\ without invoking Git CLI.

          TestGuide task creation and execution remain disabled until
          the verified API endpoints and request schema are supplied.
          "@ |
              Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY `
                  -Encoding utf8 `
                  -Append
