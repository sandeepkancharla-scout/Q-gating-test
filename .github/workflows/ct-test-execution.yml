name: CT Test Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: "10"
  ONECX_PLAYBOOK_ID: "8632"

jobs:
  execute:
    runs-on: 
      - self-hosted
      - Windows
      - X64
      

    env:
      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}

    steps:
      # Validate Jira payload.
      - name: Validate Jira payload
        shell: bash
        run: |
          set -euo pipefail

          echo "Jira Key   : $JIRA_KEY"
          echo "Bench ID   : $BENCH_ID"
          echo "Bench Name : $BENCH_NAME"
          echo "Target ECU : $TARGET_ECU"
          echo "Test Cases : $TEST_CASES"

          [ -n "$JIRA_KEY" ] || exit 1
          [ -n "$BENCH_ID" ] || exit 1
          [ -n "$BENCH_NAME" ] || exit 1
          [ -n "$TARGET_ECU" ] || exit 1
          [ -n "$TEST_CASES" ] || exit 1

      # Checkout parent repository with all submodules.
      - name: Checkout eeint-Test-Automation
        uses: actions/checkout@v4
        with:
          repository: scout-motors/eeint-Test-Automation
          ref: main
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.HIL_REPO_PAT }}
          path: eeint-Test-Automation

      # Record exact parent SHA.
      - name: Get repository SHA
        shell: bash
        run: |
          set -euo pipefail

          PARENT_SHA="$(git -C eeint-Test-Automation rev-parse HEAD)"

          echo "PARENT_SHA=$PARENT_SHA" >> "$GITHUB_ENV"
          echo "Parent SHA: $PARENT_SHA"

          git -C eeint-Test-Automation submodule status --recursive

      # Resolve CI_Disp project.
      - name: Resolve ECU project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="eeint-Test-Automation/Packages/${BENCH_NAME}/L2_Quality_Gate/${TARGET_ECU}"

          echo "Project directory: $PROJECT_DIR"

          [ -d "$PROJECT_DIR" ] || {
            echo "ERROR: Project directory not found."
            exit 1
          }

          mapfile -t PROJECTS < <(
            find "$PROJECT_DIR" \
              -maxdepth 1 \
              -type f \
              -iname "*.prj" \
              -print
          )

          [ "${#PROJECTS[@]}" -gt 0 ] || {
            echo "ERROR: No .prj found."
            exit 1
          }

          [ "${#PROJECTS[@]}" -eq 1 ] || {
            echo "ERROR: Multiple .prj files found."
            printf '%s\n' "${PROJECTS[@]}"
            exit 1
          }

          PROJECT_PATH="${PROJECTS[0]}"
          RELATIVE_PROJECT_PATH="${PROJECT_PATH#eeint-Test-Automation/}"

          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "RELATIVE_PROJECT_PATH=$RELATIVE_PROJECT_PATH" >> "$GITHUB_ENV"

          echo "Project: $RELATIVE_PROJECT_PATH"

      # Verify expected ONE.CX project.
      - name: Verify Playbook project
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="Packages/system-hil/L2_Quality_Gate/CI_Disp/CI_Disp_L2QualityGate.prj"

          ACTUAL="$(printf '%s' "$RELATIVE_PROJECT_PATH" | tr '\\' '/')"

          echo "Expected: $EXPECTED"
          echo "Actual  : $ACTUAL"

          [ "$ACTUAL" = "$EXPECTED" ] || {
            echo "ERROR: Playbook project and repository project do not match."
            exit 1
          }

      # Build ONE.CX execution request.
      - name: Build ONE.CX request
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg name "${JIRA_KEY} - ${TARGET_ECU} L2 Quality Gate" \
            --arg jira "https://scoutmotors.atlassian.net/browse/${JIRA_KEY}" \
            '{
              name: $name,
              priority: 42,
              parameters: [],
              additionalSettings: {
                analysisExecutionMode: "sequential",
                downstreamAnalysisPartitioning: "analysis",
                expirationTimeInMinutes: 60,
                issueTrackerTickets: [$jira],
                remainingRetriesOnError: 0
              }
            }' > onecx-request.json

          cat onecx-request.json

      # Execute existing ONE.CX Playbook.
      - name: Execute ONE.CX Playbook
        id: execute
        shell: bash
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          set -euo pipefail

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output onecx-response.json \
              --write-out "%{http_code}" \
              --request POST \
              --header "accept: */*" \
              --header "Content-Type: application/json" \
              --header "TestGuide-AuthKey: $ONECX_AUTH_KEY" \
              --data @onecx-request.json \
              "${ONECX_URL}/api/v2/execution/playbook/${ONECX_PLAYBOOK_ID}/execute?projectId=${ONECX_PROJECT_ID}&checkLastExecution=false"
          )"

          echo "HTTP: $HTTP_CODE"
          cat onecx-response.json

          [ "$HTTP_CODE" = "200" ] || {
            echo "ERROR: ONE.CX execution request failed."
            exit 1
          }

          TASK_ID="$(jq -r '.taskIds[0] // empty' onecx-response.json)"

          [ -n "$TASK_ID" ] || {
            echo "ERROR: ONE.CX returned no taskId."
            exit 1
          }

          echo "TASK_ID=$TASK_ID" >> "$GITHUB_ENV"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

          echo "ONE.CX Task ID: $TASK_ID"

      # Poll ONE.CX task.
      - name: Wait for ONE.CX task
        shell: bash
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do

            HTTP_CODE="$(
              curl \
                --silent \
                --show-error \
                --output task.json \
                --write-out "%{http_code}" \
                --header "accept: application/json" \
                --header "TestGuide-AuthKey: $ONECX_AUTH_KEY" \
                "${ONECX_URL}/api/v2/execution/task/${TASK_ID}?projectId=${ONECX_PROJECT_ID}"
            )"

            [ "$HTTP_CODE" = "200" ] || {
              echo "ERROR: Unable to retrieve ONE.CX task."
              cat task.json
              exit 1
            }

            STATE="$(jq -r '.state // "UNKNOWN"' task.json)"

            echo "Attempt $attempt: $STATE"

            case "$STATE" in
              FINISHED|COMPLETED|SUCCESS|SUCCEEDED)
                echo "ONE.CX execution completed."
                exit 0
                ;;

              ERROR|FAILED|ABORTED|CANCELLED|CANCELED)
                echo "ONE.CX execution failed."
                jq '.stateInfo // {}' task.json
                exit 1
                ;;

              *)
                sleep 10
                ;;
            esac

          done

          echo "ERROR: ONE.CX execution timeout."
          exit 1

      # Write execution summary.
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CT Execution"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Jira | \`${JIRA_KEY}\` |"
            echo "| Bench ID | \`${BENCH_ID}\` |"
            echo "| Bench Name | \`${BENCH_NAME}\` |"
            echo "| Target ECU | \`${TARGET_ECU}\` |"
            echo "| Test Cases | \`${TEST_CASES}\` |"
            echo "| Parent SHA | \`${PARENT_SHA:-Unavailable}\` |"
            echo "| Project | \`${RELATIVE_PROJECT_PATH:-Unavailable}\` |"
            echo "| Playbook | \`${ONECX_PLAYBOOK_ID}\` |"
            echo "| ONE.CX Task | \`${TASK_ID:-Unavailable}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
