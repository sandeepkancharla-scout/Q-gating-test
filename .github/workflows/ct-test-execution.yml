name: CT Test Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}
  ONECX_PLAYBOOK_NAME: SandeepTestNewPlaybook

jobs:
  execute:
    runs-on:
      - self-hosted
      - Windows
      - X64

    env:
      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}

    steps:
      # Validate inputs.
      - name: Validate inputs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Jira Key        : $env:JIRA_KEY"
          Write-Host "Bench ID        : $env:BENCH_ID"
          Write-Host "Bench Name      : $env:BENCH_NAME"
          Write-Host "Target ECU      : $env:TARGET_ECU"
          Write-Host "Test Cases      : $env:TEST_CASES"
          Write-Host "ONE.CX Project  : $env:ONECX_PROJECT_ID"
          Write-Host "ONE.CX Playbook : $env:ONECX_PLAYBOOK_NAME"

          if ([string]::IsNullOrWhiteSpace($env:JIRA_KEY)) {
            throw "Jira Key missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:BENCH_ID)) {
            throw "Bench ID missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:BENCH_NAME)) {
            throw "Bench Name missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:TARGET_ECU)) {
            throw "Target ECU missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:TEST_CASES)) {
            throw "Test Cases missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:ONECX_PROJECT_ID)) {
            throw "GitHub variable ONECX_PROJECT_ID is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:ONECX_PLAYBOOK_NAME)) {
            throw "ONECX_PLAYBOOK_NAME is missing"
          }

      # Verify Git.
      - name: Verify Git
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          git --version

          if ($LASTEXITCODE -ne 0) {
            throw "Git is not available on the runner PATH"
          }

          where.exe git

      # Checkout parent and all HIL submodules.
      - name: Checkout eeint-Test-Automation
        uses: actions/checkout@v4
        with:
          repository: scout-motors/eeint-Test-Automation
          ref: main
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.HIL_REPO_PAT }}
          path: eeint-Test-Automation

      # Get exact parent SHA.
      - name: Get repository SHA
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $repoPath = Join-Path $env:GITHUB_WORKSPACE "eeint-Test-Automation"
          $parentSha = git -C "$repoPath" rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to determine repository SHA"
          }

          $parentSha = $parentSha.Trim()

          Write-Host "Parent SHA: $parentSha"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PARENT_SHA=$parentSha"

          git -C "$repoPath" submodule status --recursive

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read submodule status"
          }

      # Resolve ECU project.
      - name: Resolve ECU project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $repoPath = Join-Path $env:GITHUB_WORKSPACE "eeint-Test-Automation"

          $projectDir = Join-Path `
            $repoPath `
            "Packages\$env:BENCH_NAME\L2_Quality_Gate\$env:TARGET_ECU"

          Write-Host "Project directory: $projectDir"

          if (-not (Test-Path -LiteralPath $projectDir -PathType Container)) {
            throw "Project directory not found: $projectDir"
          }

          $projects = @(
            Get-ChildItem `
              -LiteralPath $projectDir `
              -Filter "*.prj" `
              -File
          )

          Write-Host "Found $($projects.Count) project file(s)"

          foreach ($project in $projects) {
            Write-Host "PRJ: $($project.FullName)"
          }

          if ($projects.Count -eq 0) {
            throw "No .prj file found"
          }

          if ($projects.Count -gt 1) {
            throw "Expected exactly one .prj file"
          }

          $absolutePath = $projects[0].FullName
          $relativePath = $absolutePath.Substring($repoPath.Length + 1)

          Write-Host "Resolved project: $relativePath"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PROJECT_PATH=$relativePath"

      # Resolve latest ONE.CX Playbook revision.
      - name: Resolve latest ONE.CX Playbook
        shell: powershell
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:ONECX_AUTH_KEY)) {
            throw "ONECX_AUTH_KEY secret is missing"
          }

          $encodedName = [Uri]::EscapeDataString($env:ONECX_PLAYBOOK_NAME)

          $uri = "{0}/api/v2/execution/playbook?projectId={1}&playbookName={2}&sort=NAME&ascending=ASC&offset=0&limit=100" -f `
            $env:ONECX_URL, `
            $env:ONECX_PROJECT_ID, `
            $encodedName

          $headers = @{
            "TestGuide-AuthKey" = $env:ONECX_AUTH_KEY
            "Accept" = "application/json"
          }

          Write-Host "Resolving Playbook: $env:ONECX_PLAYBOOK_NAME"
          Write-Host "ONE.CX Project   : $env:ONECX_PROJECT_ID"

          $response = Invoke-RestMethod `
            -Method Get `
            -Uri $uri `
            -Headers $headers

          $matchingPlaybooks = @(
            $response |
              Where-Object {
                $_.metadata.name -eq $env:ONECX_PLAYBOOK_NAME
              }
          )

          Write-Host "Matching revisions: $($matchingPlaybooks.Count)"

          if ($matchingPlaybooks.Count -eq 0) {
            throw "No matching Playbook found"
          }

          foreach ($playbook in $matchingPlaybooks) {
            Write-Host "ID=$($playbook.playbookId) Revision=$($playbook.revision) Project=$($playbook.projectId)"
          }

          $latestPlaybook = $matchingPlaybooks |
            Sort-Object `
              -Property revision `
              -Descending |
            Select-Object -First 1

          if ($null -eq $latestPlaybook) {
            throw "Unable to select latest Playbook"
          }

          $playbookId = "$($latestPlaybook.playbookId)".Trim()
          $playbookRevision = "$($latestPlaybook.revision)".Trim()
          $playbookProjectId = "$($latestPlaybook.projectId)".Trim()
          $configuredProjectId = "$env:ONECX_PROJECT_ID".Trim()

          Write-Host "Selected Playbook ID      : $playbookId"
          Write-Host "Selected Playbook Revision: $playbookRevision"
          Write-Host "Selected Playbook Project : $playbookProjectId"

          if ($playbookProjectId -ne $configuredProjectId) {
            throw "Playbook project ID does not match configured project ID"
          }

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "ONECX_PLAYBOOK_ID=$playbookId"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "ONECX_PLAYBOOK_REVISION=$playbookRevision"

          $latestPlaybook |
            ConvertTo-Json -Depth 30 |
            Set-Content `
              -Path "$env:GITHUB_WORKSPACE\resolved-playbook.json" `
              -Encoding UTF8

      # Verify repository .prj matches the Playbook.
      - name: Verify Playbook project path
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $playbook = Get-Content `
            -Path "$env:GITHUB_WORKSPACE\resolved-playbook.json" `
            -Raw |
            ConvertFrom-Json

          $projectSteps = @(
            $playbook.execution.testcases |
              Where-Object {
                $_.type -eq "project"
              }
          )

          if ($projectSteps.Count -eq 0) {
            throw "Playbook contains no project testcase"
          }

          if ($projectSteps.Count -gt 1) {
            throw "Playbook contains more than one project testcase"
          }

          $repositoryPath = "$env:PROJECT_PATH"
          $playbookPath = "$($projectSteps[0].relativePath)"

          $repositoryPath = $repositoryPath.Replace("/", "\")
          $playbookPath = $playbookPath.Replace("/", "\")

          Write-Host "Repository project: $repositoryPath"
          Write-Host "Playbook project  : $playbookPath"

          if ($repositoryPath -ne $playbookPath) {
            throw "Repository project does not match latest Playbook"
          }

      # Build ONE.CX request.
      - name: Build ONE.CX request
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $jiraUrl = "https://scoutmotors.atlassian.net/browse/$env:JIRA_KEY"

          $request = @{
            name = "$env:JIRA_KEY - $env:TARGET_ECU L2 Quality Gate"
            priority = 42
            parameters = @()
            additionalSettings = @{
              analysisExecutionMode = "sequential"
              downstreamAnalysisPartitioning = "analysis"
              expirationTimeInMinutes = 60
              issueTrackerTickets = @(
                $jiraUrl
              )
              remainingRetriesOnError = 0
            }
          }

          $json = $request |
            ConvertTo-Json -Depth 10

          Set-Content `
            -Path "$env:GITHUB_WORKSPACE\onecx-request.json" `
            -Value $json `
            -Encoding UTF8

          Write-Host $json

      # Execute latest ONE.CX Playbook.
      - name: Execute ONE.CX Playbook
        shell: powershell
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:ONECX_PLAYBOOK_ID)) {
            throw "ONECX_PLAYBOOK_ID was not resolved"
          }

          if ([string]::IsNullOrWhiteSpace($env:ONECX_AUTH_KEY)) {
            throw "ONECX_AUTH_KEY secret is missing"
          }

          $uri = "{0}/api/v2/execution/playbook/{1}/execute?projectId={2}&checkLastExecution=false" -f `
            $env:ONECX_URL, `
            $env:ONECX_PLAYBOOK_ID, `
            $env:ONECX_PROJECT_ID

          $headers = @{
            "TestGuide-AuthKey" = $env:ONECX_AUTH_KEY
            "Accept" = "*/*"
          }

          Write-Host "ONE.CX Project    : $env:ONECX_PROJECT_ID"
          Write-Host "Playbook Name     : $env:ONECX_PLAYBOOK_NAME"
          Write-Host "Playbook ID       : $env:ONECX_PLAYBOOK_ID"
          Write-Host "Playbook Revision : $env:ONECX_PLAYBOOK_REVISION"

          $body = Get-Content `
            -Path "$env:GITHUB_WORKSPACE\onecx-request.json" `
            -Raw

          $response = Invoke-RestMethod `
            -Method Post `
            -Uri $uri `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $body

          Write-Host "ONE.CX response:"

          $response |
            ConvertTo-Json -Depth 10 |
            Write-Host

          $taskIds = @($response.taskIds)

          if ($taskIds.Count -eq 0) {
            throw "ONE.CX returned no taskId"
          }

          $taskId = "$($taskIds[0])".Trim()

          if ([string]::IsNullOrWhiteSpace($taskId)) {
            throw "ONE.CX returned an empty taskId"
          }

          Write-Host "ONE.CX Task ID: $taskId"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "TASK_ID=$taskId"

      # Poll ONE.CX task.
      - name: Wait for ONE.CX task
        shell: powershell
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TASK_ID)) {
            throw "TASK_ID is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:ONECX_AUTH_KEY)) {
            throw "ONECX_AUTH_KEY is missing"
          }

          $headers = @{
            "TestGuide-AuthKey" = $env:ONECX_AUTH_KEY
            "Accept" = "application/json"
          }

          $uri = "{0}/api/v2/execution/task/{1}?projectId={2}" -f `
            $env:ONECX_URL, `
            $env:TASK_ID, `
            $env:ONECX_PROJECT_ID

          Write-Host "Task ID  : $env:TASK_ID"
          Write-Host "Project  : $env:ONECX_PROJECT_ID"
          Write-Host "Task URL : $uri"

          for ($attempt = 1; $attempt -le 60; $attempt++) {

            $task = Invoke-RestMethod `
              -Method Get `
              -Uri $uri `
              -Headers $headers

            $state = "$($task.state)".ToUpper()

            Write-Host "Attempt ${attempt}: $state"

            if ($state -in @(
              "FINISHED",
              "COMPLETED",
              "SUCCESS",
              "SUCCEEDED"
            )) {
              Write-Host "ONE.CX execution completed      "ABORTED",
              "CANCELLED",
              "CANCELED"
            )) {
              Write-Host "ONE.CX execution failed"

              if ($task.stateInfo.errorMessage) {
                Write-Host "Error: $($task.stateInfo.errorMessage)"
              }

              Write-Host "Task response:"

              $task |
                ConvertTo-Json -Depth 30 |
                Write-Host

              exit 1
            }

            Start-Sleep -Seconds 10
          }

          throw "ONE.CX execution timed out after 10 minutes"

      # Write execution summary.
      - name: Summary
        if: always()
        shell: powershell
        run: |
          $parentSha = $env:PARENT_SHA
          $projectPath = $env:PROJECT_PATH
          $playbookId = $env:ONECX_PLAYBOOK_ID
          $revision = $env:ONECX_PLAYBOOK_REVISION
          $taskId = $env:TASK_ID

          if (-not $parentSha) {
            $parentSha = "Unavailable"
          }

          if (-not $projectPath) {
            $projectPath = "Unavailable"
          }

          if (-not $playbookId) {
            $playbookId = "Unavailable"
          }

          if (-not $revision) {
            $revision = "Unavailable"
          }

          if (-not $taskId) {
            $taskId = "Unavailable"
          }

          $summary = @"
          ## CT Execution

          | Field | Value |
          |---|---|
          | Jira | $env:JIRA_KEY |
          | Bench ID | $env:BENCH_ID |
          | Bench Name | $env:BENCH_NAME |
          | Target ECU | $env:TARGET_ECU |
          | Test Cases | $env:TEST_CASES |
          | Parent SHA | $parentSha |
          | Project | $projectPath |
          | ONE.CX Project | $env:ONECX_PROJECT_ID |
          | Playbook Name | $env:ONECX_PLAYBOOK_NAME |
          | Playbook ID | $playbookId |
          | Playbook Revision | $revision |
          | ONE.CX Task | $taskId |
          "@

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value $summary
