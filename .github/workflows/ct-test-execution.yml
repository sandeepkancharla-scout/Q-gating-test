name: CT TestGuide Jira ATX Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  testguide:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      # ==========================================================
      # JIRA INPUTS
      # ==========================================================

      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}
      RESOURCE_NAME: ${{ github.event.client_payload.resource_name }}

      # ==========================================================
      # CONFIGURATION
      # ==========================================================

      CONFIGURATION_FOLDER: 'SUBSYS1'

      # ==========================================================
      # ONE.CX
      # ==========================================================

      ONECX_URL: 'https://testguide-ssp.onecx.vwgroup.com'
      ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

      # ==========================================================
      # JIRA
      # ==========================================================

      JIRA_URL: 'https://scoutmotors.atlassian.net'


    steps:

      # ==========================================================
      # 1. VALIDATE REQUEST
      # ==========================================================

      - name: Validate request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredValues = @{
            JIRA_KEY = $env:JIRA_KEY
            BENCH_ID = $env:BENCH_ID
            BENCH_NAME = $env:BENCH_NAME
            TARGET_ECU = $env:TARGET_ECU
            TEST_CASES = $env:TEST_CASES
            PLAYBOOK_NAME = $env:PLAYBOOK_NAME
            ONECX_PROJECT_ID = $env:ONECX_PROJECT_ID
          }

          foreach ($item in $requiredValues.GetEnumerator()) {

            if (
              [System.String]::IsNullOrWhiteSpace(
                [System.String]$item.Value
              )
            ) {
              throw "Missing required value: $($item.Key)"
            }
          }

          $projectId = 0

          if (
            -not [System.Int32]::TryParse(
              $env:ONECX_PROJECT_ID,
              [ref]$projectId
            )
          ) {
            throw 'ONECX_PROJECT_ID must be an integer.'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JIRA EXECUTION REQUEST'
          Write-Host '========================================'
          Write-Host "Jira       : $env:JIRA_KEY"
          Write-Host "Bench      : $env:BENCH_ID"
          Write-Host "Bench Name : $env:BENCH_NAME"
          Write-Host "ECU        : $env:TARGET_ECU"
          Write-Host "Test Cases : $env:TEST_CASES"
          Write-Host "Playbook   : $env:PLAYBOOK_NAME"
          Write-Host "Project ID : $env:ONECX_PROJECT_ID"
          Write-Host '========================================'


      # ==========================================================
      # 2. RESOLVE RESOURCE
      # ==========================================================

      - name: Resolve ONE.CX resource
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bench = $env:BENCH_ID.Trim().ToUpperInvariant()

          switch ($bench) {

            { $_ -in @(
                'SYSHIL1',
                'SYSHIL1-LABTEST1'
              )
            } {
              $resourceName = 'syshil1-labtest1'
              $workspaceRoot = 'D:\HIL\Testing\eeint-Test-Automation'
              break
            }

            { $_ -in @(
                'SYSHIL2',
                'SYSHIL2-LABTEST2'
              )
            } {
              $resourceName = 'syshil2-labtest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            { $_ -in @(
                'INFO1',
                'SUBSYSINFO1',
                'SUBSYSINFO1-INFOTEST1'
              )
            } {
              $resourceName = 'subsysinfo1-infotest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            { $_ -in @(
                'INFO2',
                'SUBSYSINFO2',
                'SUBSYSINFO2-INFOTEST2'
              )
            } {
              $resourceName = 'subsysinfo2-infotest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            { $_ -in @(
                'THERMAL',
                'SUBSYSTHERMAL1',
                'SUBSYSTHERMAL1-THERMALTEST1'
              )
            } {
              $resourceName = 'subsysthermal1-thermaltest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            { $_ -in @(
                'CHARGING',
                'SUBSYSCHARGING1',
                'SUBSYSCHARGING1-LABTEST6'
              )
            } {
              $resourceName = 'subsyscharging1-labtest6'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            { $_ -in @(
                'MICROBENCH',
                'MICROBENCHINFO',
                'MICROBENCHINFO-MICROBENCHHIL1'
              )
            } {
              $resourceName = 'microbenchinfo-microbenchhil1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            default {

              $resourceName = (
                [System.Convert]::ToString(
                  $env:RESOURCE_NAME
                )
              ).Trim()

              if (
                [System.String]::IsNullOrWhiteSpace(
                  $resourceName
                )
              ) {
                throw "No ONE.CX resource mapping exists for $bench."
              }

              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
            }
          }

          $xilIdentifier = (
            'novi_hq/1stfloor/ee_lab_novi/' +
            "$resourceName/ControlComputer"
          )

          $ecuTestStepName = (
            "ecu.test $resourceName Start"
          )

          $cfg = $env:CONFIGURATION_FOLDER.Trim()
          $benchPackage = $env:BENCH_NAME.Trim()
          $ecu = $env:TARGET_ECU.Trim()

          $tbcPath = (
            "Configurations\$cfg\" +
            "${cfg}_TestBenchConfig.tbc"
          )

          $tcfPath = (
            "Configurations\$cfg\" +
            "${cfg}_TestConfig.tcf"
          )

          $projectPath = (
            "Packages\$benchPackage\L2_Quality_Gate\" +
            "$ecu\" +
            "${ecu}_L2QualityGate.prj"
          )

          "TESTGUIDE_RESOURCE=$resourceName" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ROOT=$workspaceRoot" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "XIL_IDENTIFIER=$xilIdentifier" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "ECUTEST_STEP_NAME=$ecuTestStepName" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TBC_RELATIVE_PATH=$tbcPath" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TCF_RELATIVE_PATH=$tcfPath" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "PROJECT_RELATIVE_PATH=$projectPath" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'RESOURCE'
          Write-Host '========================================'
          Write-Host "Bench      : $bench"
          Write-Host "Resource   : $resourceName"
          Write-Host "Workspace  : $workspaceRoot"
          Write-Host "Identifier : $xilIdentifier"
          Write-Host "TBC        : $tbcPath"
          Write-Host "TCF        : $tcfPath"
          Write-Host "PRJ        : $projectPath"
          Write-Host '========================================'


      # ==========================================================
      # 3. GENERATE PLAYBOOK
      # ==========================================================

      - name: Generate TestGuide playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $playbook = [ordered]@{

            metadata = [ordered]@{
              name = $env:PLAYBOOK_NAME
              taskNameTemplate = '${playbook_name} (${playbook_datetime}) ${distribution_count}'
              labels = @()
            }

            workspace = [ordered]@{

              source = [ordered]@{
                path = $env:TESTGUIDE_ROOT
                sourceType = 'location'
              }

              dependencies = @()
            }

            setup = [ordered]@{

              steps = @(

                [ordered]@{
                  reuse = 'always'
                  keepConfiguration = $false
                  waitMinutesForLicense = 0
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'ecuTestStart'
                },

                [ordered]@{
                  tbcPath = $env:TBC_RELATIVE_PATH
                  tcfPath = $env:TCF_RELATIVE_PATH
                  stepName = 'Test Configuration Selection'
                  type = 'configuration'
                }
              )
            }

            execution = [ordered]@{

              testcases = @(
                [ordered]@{
                  relativePath = $env:PROJECT_RELATIVE_PATH
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'project'
                }
              )
            }

            teardown = [ordered]@{

              steps = @(
                [ordered]@{
                  type = 'ecuTestStop'
                }
              )
            }

            xilConfigRequirements = @(

              [ordered]@{
                label = 'Identifier'
                category = 'XIL'
                value = $env:XIL_IDENTIFIER
                type = 'configuration'
              }
            )

            parameters = @()
          }

          $playbookFile = Join-Path `
            $env:RUNNER_TEMP `
            'testguide-playbook.json'

          $playbook |
            ConvertTo-Json -Depth 30 |
            Set-Content `
              -LiteralPath $playbookFile `
              -Encoding utf8

          "TESTGUIDE_PLAYBOOK_FILE=$playbookFile" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 4. UPLOAD PLAYBOOK
      # ==========================================================

      - name: Upload TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:ONECX_AUTH_KEY
            )
          ) {
            throw 'ONECX_AUTH_KEY is missing.'
          }

          $folder = [System.Uri]::EscapeDataString('/')

          $url = (
            "$env:ONECX_URL/api/v2/execution/playbook" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&folder=$folder"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $body = Get-Content `
            -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
            -Raw

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $url `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $body `
            -ErrorAction Stop

          $playbookId = (
            [System.Convert]::ToString(
              $response.playbookId
            )
          ).Trim()

          if (
            [System.String]::IsNullOrWhiteSpace(
              $playbookId
            )
          ) {
            throw 'Upload did not return playbookId.'
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_PLAYBOOK_LINK=$($response.playbookLink)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Playbook ID: $playbookId"


      # ==========================================================
      # 5. EXECUTE PLAYBOOK
      # ==========================================================

      - name: Execute TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $url = (
            "$env:ONECX_URL/api/v2/execution/playbook/" +
            "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&checkLastExecution=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $jiraIssueUrl = (
            "$env:JIRA_URL/browse/$env:JIRA_KEY"
          )

          $request = [ordered]@{

            name = (
              "$env:JIRA_KEY - " +
              "$env:TARGET_ECU L2 Quality Gate"
            )

            priority = 42

            parameters = @()

            additionalSettings = [ordered]@{
              analysisExecutionMode = 'sequential'
              downstreamAnalysisPartitioning = 'analysis'
              expirationTimeInMinutes = 60

              issueTrackerTickets = @(
                $jiraIssueUrl
              )

              remainingRetriesOnError = 0
            }
          }

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $url `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body (
              $request |
              ConvertTo-Json -Depth 20
            ) `
            -ErrorAction Stop

          $taskIds = @($response.taskIds)

          if ($taskIds.Count -eq 0) {
            throw 'Execution did not return taskIds.'
          }

          $taskId = (
            [System.Convert]::ToString(
              $taskIds[0]
            )
          ).Trim()

          if (
            [System.String]::IsNullOrWhiteSpace(
              $taskId
            )
          ) {
            throw 'Execution returned an empty taskId.'
          }

          "TESTGUIDE_TASK_ID=$taskId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Execution Task ID: $taskId"


      # ==========================================================
      # 6. POLL EXECUTION
      # ==========================================================

      - name: Poll TestGuide execution
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $url = (
            "$env:ONECX_URL/api/v2/execution/task/" +
            "$env:TESTGUIDE_TASK_ID" +
            "?projectId=$env:ONECX_PROJECT_ID"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $deadline = (Get-Date).AddMinutes(170)

          $successStates = @(
            'FINISHED',
            'COMPLETED',
            'SUCCESS',
            'SUCCEEDED'
          )

          $failureStates = @(
            'ERROR',
            'FAILED',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          $task = $null

          while ((Get-Date) -lt $deadline) {

            $task = Invoke-RestMethod `
              -Method GET `
              -Uri $url `
              -Headers $headers `
              -ErrorAction Stop

            $state = (
              [System.Convert]::ToString(
                $task.state
              )
            ).Trim().ToUpperInvariant()

            Write-Host (
              "State=$state | " +
              "Verdict=$($task.aggregatedVerdict)"
            )

            if ($state -in $successStates) {
              break
            }

            if ($state -in $failureStates) {
              throw (
                "Execution failed. " +
                "State=$state. " +
                "StateInfo=$($task.stateInfo)"
              )
            }

            Start-Sleep -Seconds 10
          }

          if ($null -eq $task) {
            throw 'No execution response.'
          }

          $finalState = (
            [System.Convert]::ToString(
              $task.state
            )
          ).Trim().ToUpperInvariant()

          if ($finalState -notin $successStates) {
            throw "Execution timed out. State=$finalState"
          }

          "FINAL_TASK_STATE=$($task.state)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_VERDICT=$($task.aggregatedVerdict)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_START_DATE=$($task.startDate)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_END_DATE=$($task.endDate)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 7. FIND CURRENT TESTGUIDE REPORT
      # ==========================================================

      - name: Find current TestGuide report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $taskStart = [System.DateTime]::Parse(
            $env:TASK_START_DATE,
            [System.Globalization.CultureInfo]::InvariantCulture
          )

          $taskEnd = [System.DateTime]::Parse(
            $env:TASK_END_DATE,
            [System.Globalization.CultureInfo]::InvariantCulture
          )

          $windowStart = $taskStart.AddMinutes(-2)
          $windowEnd = $taskEnd.AddMinutes(20)

          $expectedPlan = (
            "$($env:TARGET_ECU.Trim())_L2QualityGate"
          )

          $deadline = (Get-Date).AddMinutes(15)
          $selectedReport = $null

          while ((Get-Date) -lt $deadline) {

            $startDate = $windowStart.ToString(
              'yyyy-MM-ddTHH:mm:ss.fffZ'
            )

            $endDate = $windowEnd.ToString(
              'yyyy-MM-ddTHH:mm:ss.fffZ'
            )

            $startEncoded = [System.Uri]::EscapeDataString(
              $startDate
            )

            $endEncoded = [System.Uri]::EscapeDataString(
              $endDate
            )

            $url = (
              "$env:ONECX_URL/api/report/reports/history" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&startDate=$startEncoded" +
              "&endDate=$endEncoded" +
              "&offset=0" +
              "&limit=100"
            )

            $response = Invoke-RestMethod `
              -Method GET `
              -Uri $url `
              -Headers $headers `
              -ErrorAction Stop

            $reports = @($response)

            $matches = @(
              $reports |
              Where-Object {

                $name = (
                  [System.Convert]::ToString(
                    $_.testPlanName
                  )
                ).Trim()

                $status = (
                  [System.Convert]::ToString(
                    $_.status
                  )
                ).Trim().ToUpperInvariant()

                $executionText = (
                  [System.Convert]::ToString(
                    $_.executionDate
                  )
                ).Trim()

                if (
                  [System.String]::IsNullOrWhiteSpace(
                    $executionText
                  )
                ) {
                  return $false
                }

                $executionDate = [System.DateTime]::Parse(
                  $executionText,
                  [System.Globalization.CultureInfo]::InvariantCulture
                )

                return (
                  $name -ieq $expectedPlan -and
                  $status -eq 'COMPLETE' -and
                  $executionDate -ge $windowStart -and
                  $executionDate -le $windowEnd
                )
              } |
              Sort-Object {

                [System.DateTime]::Parse(
                  [System.Convert]::ToString(
                    $_.uploadDate
                  ),
                  [System.Globalization.CultureInfo]::InvariantCulture
                )

              } -Descending
            )

            if ($matches.Count -gt 0) {
              $selectedReport = $matches[0]
              break
            }

            Write-Host "Waiting for $expectedPlan report..."

            Start-Sleep -Seconds 15
          }

          if ($null -eq $selectedReport) {
            throw "No TestGuide report found for $expectedPlan."
          }

          $reportId = (
            [System.Convert]::ToString(
              $selectedReport.reportId
            )
          ).Trim()

          "TESTGUIDE_REPORT_ID=$reportId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_PLAN=$($selectedReport.testPlanName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_EXECUTION_DATE=$($selectedReport.executionDate)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_UPLOAD_DATE=$($selectedReport.uploadDate)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TESTGUIDE REPORT'
          Write-Host '========================================'
          Write-Host "Execution Task : $env:TESTGUIDE_TASK_ID"
          Write-Host "Report ID      : $reportId"
          Write-Host "Plan           : $($selectedReport.testPlanName)"
          Write-Host "Execution Date : $($selectedReport.executionDate)"
          Write-Host "Upload Date    : $($selectedReport.uploadDate)"
          Write-Host '========================================'


      # ==========================================================
      # 8. START ATX EXPORT
      # ==========================================================

      - name: Start ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $reportId = [System.Uri]::EscapeDataString(
            $env:TESTGUIDE_REPORT_ID
          )

          $url = (
            "$env:ONECX_URL/api/report/export/atx/" +
            "$reportId" +
            "?useExportStorage=false"
          )

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $url `
            -Headers $headers `
            -ErrorAction Stop

          $taskId = (
            [System.Convert]::ToString(
              $response.taskId
            )
          ).Trim()

          if (
            [System.String]::IsNullOrWhiteSpace(
              $taskId
            )
          ) {
            throw 'ATX export did not return taskId.'
          }

          "ATX_EXPORT_TASK_ID=$taskId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "ATX Export Task: $taskId"


      # ==========================================================
      # 9. POLL ATX EXPORT
      # ==========================================================

      - name: Poll ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $taskId = [System.Uri]::EscapeDataString(
            $env:ATX_EXPORT_TASK_ID
          )

          $url = (
            "$env:ONECX_URL/api/report/export/atx/" +
            "$taskId/status"
          )

          $deadline = (Get-Date).AddMinutes(30)
          $ready = $false

          while ((Get-Date) -lt $deadline) {

            $status = Invoke-RestMethod `
              -Method GET `
              -Uri $url `
              -Headers $headers `
              -ErrorAction Stop

            $status |
              ConvertTo-Json -Depth 20 |
              Write-Host

            if (
              $null -ne $status.done -and
              [System.Boolean]$status.done
            ) {
              $ready = $true
              break
            }

            $state = ''

            if ($null -ne $status.state) {
              $state = (
                [System.Convert]::ToString(
                  $status.state
                )
              ).Trim().ToUpperInvariant()
            }
            elseif ($null -ne $status.status) {
              $state = (
                [System.Convert]::ToString(
                  $status.status
                )
              ).Trim().ToUpperInvariant()
      ).Trim().ToUpperInvariant()
            }

            if (
              $state -in @(
                'FINISHED',
                'COMPLETED',
                'SUCCESS',
                'READY',
                'DONE'
              )
            ) {
              $ready = $true
              break
            }

            if (
              $state -in @(
                'FAILED',
                'ERROR',
                'ABORTED',
                'CANCELLED'
              )
            ) {
              throw "ATX export failed: $state"
            }

            Start-Sleep -f (-not $ready) {
            throw 'ATX export timed out.'
          }

          "ATX_EXPORT_STATE=COMPLETED" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 10. DOWNLOAD COMPLETE TESTGUIDE EXPORT
      # ==========================================================

      - name: Download TestGuide report export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $safeJira = (
            $env:JIRA_KEY -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $safeEcu = (
            $env:TARGET_ECU -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $temporaryFile = Join-Path `
            $env:RUNNER_TEMP `
            "${safeJira}_${safeEcu}_ATX_Export.bin"

          $taskId = [System.Uri]::EscapeDataString(
            $env:ATX_EXPORT_TASK_ID
          )

          $url = (
            "$env:ONECX_URL/api/report/export/atx/" +
            "$taskId/download"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
          }

          Invoke-WebRequest `
            -Method GET `
            -Uri $url `
            -Headers $headers `
            -OutFile $temporaryFile `
            -ErrorAction Stop

          if (-not (Test-Path -LiteralPath $temporaryFile)) {
            throw 'TestGuide report was not downloaded.'
          }

          $downloadInfo = Get-Item `
            -LiteralPath $temporaryFile

          if ($downloadInfo.Length -eq 0) {
            throw 'TestGuide report is empty.'
          }

          $bytes = [System.IO.File]::ReadAllBytes(
            $temporaryFile
          )

          $signatureLength = [System.Math]::Min(
            4,
            $bytes.Length
          )

          $signature = [System.Text.Encoding]::ASCII.GetString(
            $bytes,
            0,
            $signatureLength
          )

          if ($signature.StartsWith('PK')) {

            $finalFile = Join-Path `
              $env:RUNNER_TEMP `
              "${safeJira}_${safeEcu}_ATX_Export.zip"

            $type = 'ZIP'

          }
          else {

            $previewLength = [System.Math]::Min(
              500,
              $bytes.Length
            )

            $preview = [System.Text.Encoding]::UTF8.GetString(
              $bytes,
              0,
              $previewLength
            )

            if (
              $preview.TrimStart().StartsWith('{') -or
              $preview.TrimStart().StartsWith('<html') -or
              $preview.TrimStart().StartsWith('<!DOCTYPE html')
            ) {
              Write-Host $preview
              throw 'TestGuide download returned JSON or HTML.'
            }

            $finalFile = Join-Path `
              $env:RUNNER_TEMP `
              "${safeJira}_${safeEcu}_ATX_Export.atx"

            $type = 'ATX'
          }

          Move-Item `
            -LiteralPath $temporaryFile `
            -Destination $finalFile `
            -Force

          $finalInfo = Get-Item `
            -LiteralPath $finalFile

          "TESTGUIDE_ATX_FILE=$finalFile" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ATX_EXPORT_TYPE=$type" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ATX_SIZE=$($finalInfo.Length)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TESTGUIDE REPORT DOWNLOADED'
          Write-Host '========================================'
          Write-Host "Report ID : $env:TESTGUIDE_REPORT_ID"
          Write-Host "Type      : $type"
          Write-Host "File      : $finalFile"
          Write-Host "Size      : $($finalInfo.Length)"
          Write-Host '========================================'


      # ==========================================================
      # 11. UPLOAD REPORT TO GITHUB ACTIONS
      # ==========================================================

      - name: Upload TestGuide report to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JIRA_KEY }}_${{ env.TARGET_ECU }}_TestGuideReport
          path: ${{ env.TESTGUIDE_ATX_FILE }}
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 12. ATTACH REPORT DIRECTLY TO JIRA
      #
      # GitHub Secrets required:
      #
      # JIRA_EMAIL
      # JIRA_API_TOKEN
      # ==========================================================

      - name: Attach TestGuide report to Jira
        shell: pwsh
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:JIRA_EMAIL
            )
          ) {
            throw 'JIRA_EMAIL GitHub secret is missing.'
          }

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:JIRA_API_TOKEN
            )
          ) {
            throw 'JIRA_API_TOKEN GitHub secret is missing.'
          }

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:JIRA_KEY
            )
          ) {
            throw 'JIRA_KEY is missing.'
          }

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:TESTGUIDE_ATX_FILE
            )
          ) {
            throw 'TESTGUIDE_ATX_FILE is missing.'
          }

          if (
            -not (
              Test-Path -LiteralPath $env:TESTGUIDE_ATX_FILE
            )
          ) {
            throw (
              'TestGuide report file does not exist: ' +
              $env:TESTGUIDE_ATX_FILE
            )
          }

          $fileInfo = Get-Item `
            -LiteralPath $env:TESTGUIDE_ATX_FILE

          if ($fileInfo.Length -eq 0) {
            throw 'TestGuide report file is empty.'
          }

          $jiraAttachmentUrl = (
            "$env:JIRA_URL/rest/api/3/issue/" +
            "$env:JIRA_KEY/attachments"
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'ATTACH TESTGUIDE REPORT TO JIRA'
          Write-Host '========================================'
          Write-Host "Issue     : $env:JIRA_KEY"
          Write-Host "Report ID : $env:TESTGUIDE_REPORT_ID"
          Write-Host "File      : $($fileInfo.FullName)"
          Write-Host "Size      : $($fileInfo.Length) bytes"
          Write-Host '========================================'

          $curlOutput = & curl.exe `
            --fail-with-body `
            --silent `
            --show-error `
            --request POST `
            --user "${env:JIRA_EMAIL}:${env:JIRA_API_TOKEN}" `
            --header "X-Atlassian-Token: no-check" `
            --form "file=@$($fileInfo.FullName)" `
            $jiraAttachmentUrl

          $curlExitCode = $LASTEXITCODE

          if ($curlExitCode -ne 0) {

            Write-Host ''
            Write-Host 'Jira response:'
            Write-Host $curlOutput

            throw (
              'Jira attachment upload failed. ' +
              "curl exit code: $curlExitCode"
            )
          }

          Write-Host ''
          Write-Host 'Jira response:'
          Write-Host $curlOutput

          "JIRA_REPORT_ATTACHED=true" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TESTGUIDE REPORT ATTACHED TO JIRA'
          Write-Host '========================================'
          Write-Host "Issue : $env:JIRA_KEY"
          Write-Host "File  : $($fileInfo.Name)"
          Write-Host '========================================'


      # ==========================================================
      # 13. SUMMARY
      # ==========================================================

      - name: Publish execution summary
        if: always()
        shell: pwsh
        run: |
          @(
            '## TestGuide Execution',
            '',
            '| Field | Value |',
            '|---|---|',
            "| Jira | $env:JIRA_KEY |",
            "| Bench | $env:BENCH_ID |",
            "| Resource | $env:TESTGUIDE_RESOURCE |",
            "| ECU | $env:TARGET_ECU |",
            "| Playbook ID | $env:TESTGUIDE_PLAYBOOK_ID |",
            "| Execution Task | $env:TESTGUIDE_TASK_ID |",
            "| Verdict | $env:FINAL_TASK_VERDICT |",
            "| TestGuide Report ID | $env:TESTGUIDE_REPORT_ID |",
            "| TestGuide Plan | $env:TESTGUIDE_REPORT_PLAN |",
            "| ATX Export Task | $env:ATX_EXPORT_TASK_ID |",
            "| Export Type | $env:TESTGUIDE_ATX_EXPORT_TYPE |",
            "| Export File | $env:TESTGUIDE_ATX_FILE |",
            "| Export Size | $env:TESTGUIDE_ATX_SIZE bytes |",
            "| Jira Attachment | $env:JIRA_REPORT_ATTACHED |",
            "| Workflow Status | ${{ job.status }} |"
          ) |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
