name: CT TestGuide Jira Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  testguide:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      # ==========================================================
      # JIRA INPUTS
      # ==========================================================

      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}

      # ==========================================================
      # LOCAL AUTOMATION TREE
      # Already populated on the runner.
      # ==========================================================

      LOCAL_ROOT: 'C:\HIL\Testing\eeint-Test-Automation'

      # Current known configuration
      CONFIGURATION_FOLDER: 'SUBSYS1'

      # ==========================================================
      # ONECX / TESTGUIDE
      # ==========================================================

      ONECX_PROJECT_ID: ${{ secrets.ONECX_PROJECT_ID }}

      # Change only if Swagger uses a different API base.
      TESTGUIDE_BASE_URL: 'https://testguide-ssp.onecx.vwgroup.com'

    steps:

      # ==========================================================
      # 1. VALIDATE JIRA REQUEST
      # ==========================================================

      - name: Validate Jira request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredValues = @{
            JIRA_KEY         = $env:JIRA_KEY
            BENCH_ID         = $env:BENCH_ID
            BENCH_NAME       = $env:BENCH_NAME
            TARGET_ECU       = $env:TARGET_ECU
            TEST_CASES       = $env:TEST_CASES
            PLAYBOOK_NAME    = $env:PLAYBOOK_NAME
            ONECX_PROJECT_ID = $env:ONECX_PROJECT_ID
          }

          foreach ($entry in $requiredValues.GetEnumerator()) {
            if (
              [System.String]::IsNullOrWhiteSpace(
                [System.String]$entry.Value
              )
            ) {
              throw "Missing required value: $($entry.Key)"
            }
          }

          if (-not (Test-Path -LiteralPath $env:LOCAL_ROOT)) {
            throw "Local repository does not exist: $env:LOCAL_ROOT"
          }

          $parsedProjectId = 0

          if (
            -not [System.Int32]::TryParse(
              $env:ONECX_PROJECT_ID,
              [ref]$parsedProjectId
            )
          ) {
            throw "ONECX_PROJECT_ID must be an integer."
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JIRA EXECUTION REQUEST'
          Write-Host '========================================'
          Write-Host "Jira Key      : $env:JIRA_KEY"
          Write-Host "Bench ID      : $env:BENCH_ID"
          Write-Host "Bench Name    : $env:BENCH_NAME"
          Write-Host "Target ECU    : $env:TARGET_ECU"
          Write-Host "Test Cases    : $env:TEST_CASES"
          Write-Host "Playbook Name : $env:PLAYBOOK_NAME"
          Write-Host "Project ID    : $env:ONECX_PROJECT_ID"
          Write-Host '========================================'


      # ==========================================================
      # 2. RESOLVE TESTGUIDE BENCH
      #
      # SYSHIL1 -> SysHIL1 -> D:
      # Other current benches -> C:
      # ==========================================================

      - name: Resolve TestGuide bench
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $normalizedBenchId =
            $env:BENCH_ID.Trim().ToUpperInvariant()

          switch ($normalizedBenchId) {

            'SYSHIL1' {
              $testGuideBench = 'SysHIL1'

              $workspaceRoot =
                'D:\HIL\Testing\eeint-Test-Automation'
            }

            'SYSHIL2' {
              $testGuideBench = 'SysHIL2'

              $workspaceRoot =
                'C:\HIL\Testing\eeint-Test-Automation'
            }

            'SYSHIL5' {
              $testGuideBench = 'SysHIL5'

              $workspaceRoot =
                'C:\HIL\Testing\eeint-Test-Automation'
            }

            default {
              $testGuideBench =
                $env:BENCH_ID.Trim()

              $workspaceRoot =
                'C:\HIL\Testing\eeint-Test-Automation'
            }
          }

          $ecuTestStepName =
            "ecu.test $testGuideBench Start"

          $xilIdentifier =
            "novi_hq/1stfloor/EE_Lab_novi/$testGuideBench/TestLabPC1"

          "TESTGUIDE_BENCH=$testGuideBench" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "TESTGUIDE_ROOT=$workspaceRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "ECUTEST_STEP_NAME=$ecuTestStepName" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "XIL_IDENTIFIER=$xilIdentifier" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TESTGUIDE BENCH'
          Write-Host '========================================'
          Write-Host "Bench      : $testGuideBench"
          Write-Host "Workspace  : $workspaceRoot"
          Write-Host "Start Step : $ecuTestStepName"
          Write-Host "XIL        : $xilIdentifier"
          Write-Host '========================================'


      # ==========================================================
      # 3. RESOLVE BENCH PACKAGE
      #
      # system-hil ->
      # Packages\system-hil
      # ==========================================================

      - name: Resolve bench package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packageRoot =
            Join-Path `
              $env:LOCAL_ROOT `
              "Packages\$env:BENCH_NAME"

          if (-not (Test-Path -LiteralPath $packageRoot)) {
            throw "Bench package does not exist: $packageRoot"
          }

          "PACKAGE_ROOT=$packageRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Package: $packageRoot"


      # ==========================================================
      # 4. RESOLVE TBC AND TCF
      #
      # Known current configuration:
      #
      # Configurations\SUBSYS1
      # ==========================================================

      - name: Resolve TBC and TCF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $configurationFolder =
            $env:CONFIGURATION_FOLDER.Trim()

          $configurationRoot =
            Join-Path `
              $env:LOCAL_ROOT `
              "Configurations\$configurationFolder"

          if (-not (Test-Path -LiteralPath $configurationRoot)) {
            throw "Configuration folder not found: $configurationRoot"
          }

          $expectedTbc =
            Join-Path `
              $configurationRoot `
              "${configurationFolder}_TestBenchConfig.tbc"

          $expectedTcf =
            Join-Path `
              $configurationRoot `
              "${configurationFolder}_TestConfig.tcf"

          if (Test-Path -LiteralPath $expectedTbc) {
            $selectedTbc =
              Get-Item -LiteralPath $expectedTbc
          }
          else {
            $tbcCandidates = @(
              Get-ChildItem `
                -LiteralPath $configurationRoot `
                -Filter '*.tbc' `
                -File `
                -Recurse
            )

            if ($tbcCandidates.Count -ne 1) {
              throw "Expected exactly one TBC. Found $($tbcCandidates.Count)."
            }

            $selectedTbc =
              $tbcCandidates[0]
          }

          if (Test-Path -LiteralPath $expectedTcf) {
            $selectedTcf =
              Get-Item -LiteralPath $expectedTcf
          }
          else {
            $tcfCandidates = @(
              Get-ChildItem `
                -LiteralPath $configurationRoot `
                -Filter '*.tcf' `
                -File `
                -Recurse
            )

            if ($tcfCandidates.Count -ne 1) {
              throw "Expected exactly one TCF. Found $($tcfCandidates.Count)."
            }

            $selectedTcf =
              $tcfCandidates[0]
          }

          $tbcRelative =
            [System.IO.Path]::GetRelativePath(
              $env:LOCAL_ROOT,
              $selectedTbc.FullName
            )

          $tcfRelative =
            [System.IO.Path]::GetRelativePath(
              $env:LOCAL_ROOT,
              $selectedTcf.FullName
            )

          "TBC_RELATIVE_PATH=$tbcRelative" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "TCF_RELATIVE_PATH=$tcfRelative" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "TBC: $tbcRelative"
          Write-Host "TCF: $tcfRelative"


      # ==========================================================
      # 5. RESOLVE PRJ
      #
      # Jira TARGET_ECU:
      #
      # VAS_FL
      #
      # Expected:
      #
      # VAS_FL_L2QualityGate.prj
      # ==========================================================

      - name: Resolve target ECU project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $targetEcu =
            $env:TARGET_ECU.Trim()

          $expectedProjectName =
            "${targetEcu}_L2QualityGate.prj"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PROJECT RESOLUTION'
          Write-Host '========================================'
          Write-Host "ECU          : $targetEcu"
          Write-Host "Expected PRJ : $expectedProjectName"
          Write-Host "Package      : $env:PACKAGE_ROOT"
          Write-Host '========================================'

          $matches = @(
            Get-ChildItem `
              -LiteralPath $env:PACKAGE_ROOT `
              -Filter $expectedProjectName `
              -File `
              -Recurse
          )

          if ($matches.Count -eq 0) {

            Write-Host ''
            Write-Host 'Available L2 Quality Gate projects:'

            Get-ChildItem `
              -LiteralPath $env:PACKAGE_ROOT `
              -Filter '*_L2QualityGate.prj' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "  $($_.FullName)"
            }

            throw "Project not found: $expectedProjectName"
          }

          if ($matches.Count -gt 1) {

            $matches |
              ForEach-Object {
                Write-Host "  $($_.FullName)"
              }

            throw "Multiple instances of $expectedProjectName found."
          }

          $selected =
            $matches[0]

          $relative =
            [System.IO.Path]::GetRelativePath(
              $env:LOCAL_ROOT,
              $selected.FullName
            )

          "PROJECT_RELATIVE_PATH=$relative" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ''
          Write-Host "Selected project: $relative"


      # ==========================================================
      # 6. PARSE TEST CASE IDS
      # ==========================================================

      - name: Parse Jira Test Cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ids = @(
            $env:TEST_CASES -split '[,;]' |
            ForEach-Object {
              $_.Trim()
            } |
            Where-Object {
              -not [System.String]::IsNullOrWhiteSpace($_)
            }
          )

          if ($ids.Count -eq 0) {
            throw 'No valid Jira Test Case IDs.'
          }

          $normalized =
            $ids -join ','

          "NORMALIZED_TEST_CASES=$normalized" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Test Cases: $normalized"


      # ==========================================================
      # 7. GENERATE EXACT PLAYBOOK STRUCTURE
      # ==========================================================

      - name: Generate TestGuide playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $playbook = [ordered]@{

            metadata = [ordered]@{
              name =
                $env:PLAYBOOK_NAME

              taskNameTemplate =
                '${playbook_name} (${playbook_datetime}) ${distribution_count}'

              labels =
                @()
            }


            workspace = [ordered]@{
              source = [ordered]@{
                path =
                  $env:TESTGUIDE_ROOT

                sourceType =
                  'location'
              }

              dependencies =
                @()
            }


            setup = [ordered]@{
              steps = @(

                [ordered]@{
                  reuse =
                    'always'

                  keepConfiguration =
                    $false

                  waitMinutesForLicense =
                    0

                  stepName =
                    $env:ECUTEST_STEP_NAME

                  type =
                    'ecuTestStart'
                },

                [ordered]@{
                  tbcPath =
                    $env:TBC_RELATIVE_PATH

                  tcfPath =
                    $env:TCF_RELATIVE_PATH

                  stepName =
                    'Test Configuration Selection'

                  type =
                    'configuration'
                }
              )
            }


            execution = [ordered]@{
              testcases = @(

                [ordered]@{
                  relativePath =
                    $env:PROJECT_RELATIVE_PATH

                  stepName =
                    $env:ECUTEST_STEP_NAME

                  type =
                    'project'
                }
              )
            }


            teardown = [ordered]@{
              steps = @(

                [ordered]@{
                  type =
                    'ecuTestStop'
                }
              )
            }


            xilConfigRequirements = @(

              [ordered]@{
                label =
                  'Identifier'

                category =
                  'XIL'

                value =
                  $env:XIL_IDENTIFIER

                type =
                  'configuration'
              }
            )
          }

          $json =
            $playbook |
            ConvertTo-Json -Depth 30

          $file =
            Join-Path `
              $env:RUNNER_TEMP `
              'testguide-playbook.json'

          $json |
            Set-Content `
              -LiteralPath $file `
              -Encoding utf8

          "TESTGUIDE_PLAYBOOK_FILE=$file" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'GENERATED PLAYBOOK'
          Write-Host '========================================'
          Write-Host $json
          Write-Host '========================================'


      # ==========================================================
      # 8. VALIDATE PLAYBOOK BEFORE API CALL
      # ==========================================================

      - name: Validate generated playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            -not (
              Test-Path `
                -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE
            )
          ) {
            throw 'Generated playbook JSON is missing.'
          }

          $playbook =
            Get-Content `
              -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
              -Raw |
            ConvertFrom-Json

          if ($playbook.setup.steps.Count -ne 2) {
            throw 'Expected exactly 2 setup steps.'
          }

          if ($playbook.execution.testcases.Count -ne 1) {
            throw 'Expected exactly 1 project execution entry.'
          }

          if ($playbook.xilConfigRequirements.Count -ne 1) {
            throw 'Expected exactly 1 XIL configuration requirement.'
          }

          Write-Host ''
          Write-Host 'Playbook validation successful.'


      # ==========================================================
      # 9. UPLOAD PLAYBOOK
      #
      # CONFIRMED SWAGGER:
      #
      # POST /playbook
      #
      # Query:
      # projectId = required
      # folder = optional, default "/"
      #
      # Body:
      # application/json
      #
      # Response:
      #
      # {
      #   "playbookId": 1,
      #   "playbookLink": "...",
      #   "warnings": []
      # }
      # ==========================================================

      - name: Upload TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:ONECX_AUTH_KEY
            )
          ) {
            throw 'ONECX_AUTH_KEY is missing.'
          }

          $baseUrl =
            $env:TESTGUIDE_BASE_URL.TrimEnd('/')

          $folder =
            [System.Uri]::EscapeDataString('/')

          $uploadUrl = (
            "$baseUrl/playbook" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&folder=$folder"
          )

          $authValue =
            $env:ONECX_AUTH_KEY.Trim()

          if (
            -not $authValue.StartsWith(
              'Bearer ',
              [System.StringComparison]::OrdinalIgnoreCase
            )
          ) {
            $authValue =
              "Bearer $authValue"
          }

          $headers = @{
            Authorization = $authValue
            Accept = 'application/json'
          }

          $body =
            Get-Content `
              -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
              -Raw

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'UPLOAD PLAYBOOK'
          Write-Host '========================================'
          Write-Host "URL      : $uploadUrl"
          Write-Host "Project  : $env:ONECX_PROJECT_ID"
          Write-Host "Playbook : $env:PLAYBOOK_NAME"
          Write-Host '========================================'

          $response =
            Invoke-RestMethod `
              -Method POST `
              -Uri $uploadUrl `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $body

          if ($null -eq $response) {
            throw 'TestGuide returned an empty upload response.'
          }

          $playbookId =
            [System.String]$response.playbookId

          if (
            [System.String]::IsNullOrWhiteSpace(
              $playbookId
            )
          ) {
            throw 'TestGuide upload did not return playbookId.'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PLAYBOOK STORED'
          Write-Host '========================================'
          Write-Host "Playbook ID   : $playbookId"
          Write-Host "Playbook Link : $($response.playbookLink)"

          if ($null -ne $response.warnings) {

            foreach ($warning in $response.warnings) {
              Write-Warning $warning
            }
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "TESTGUIDE_PLAYBOOK_LINK=$($response.playbookLink)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 10. EXECUTE PLAYBOOK
      #
      # CONFIRMED ENDPOINT:
      #
      # POST /playbook/{playbookId}/execute
      #
      # Required query:
      # projectId
      # ==========================================================

      - name: Execute TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:TESTGUIDE_PLAYBOOK_ID
            )
          ) {
            throw 'TESTGUIDE_PLAYBOOK_ID is missing.'
          }

          $baseUrl =
            $env:TESTGUIDE_BASE_URL.TrimEnd('/')

          $executeUrl = (
            "$baseUrl/playbook/" +
            "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&checkLastExecution=true"
          )

          $authValue =
            $env:ONECX_AUTH_KEY.Trim()

          if (
            -not $authValue.StartsWith(
              'Bearer ',
              [System.StringComparison]::OrdinalIgnoreCase
            )
          ) {
            $authValue =
              "Bearer $authValue"
          }

          $headers = @{
            Authorization = $authValue
            Accept = 'application/json'
          }

          $jiraUrl = (
            'https://scoutmotors.atlassian.net/browse/' +
            $env:JIRA_KEY
          )

          $executeRequest = [ordered]@{

            name =
              '${playbook_name} (${playbook_datetime}) ${distribution_count}'

            priority =
              42

            parameters = @(

              [ordered]@{
                label = 'JiraKey'
                value = $env:JIRA_KEY
              },

              [ordered]@{
                label = 'BenchId'
                value = $env:BENCH_ID
              },

              [ordered]@{
                label = 'TargetEcu'
                value = $env:TARGET_ECU
              },

              [ordered]@{
                label = 'TestCaseIds'
                value = $env:NORMALIZED_TEST_CASES
              }
            )

            additionalSettings = [ordered]@{

              analysisExecutionMode =
                'sequential'

              downstreamAnalysisPartitioning =
                'analysis'

              expirationTimeInMinutes =
                1

              issueTrackerTickets =
                @($jiraUrl)

              remainingRetriesOnError =
                0
            }
          }

          $executeJson =
            $executeRequest |
            ConvertTo-Json -Depth 30

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'EXECUTE TESTGUIDE PLAYBOOK'
          Write-Host '========================================'
          Write-Host "URL         : $executeUrl"
          Write-Host "Playbook ID : $env:TESTGUIDE_PLAYBOOK_ID"
          Write-Host "Project ID  : $env:ONECX_PROJECT_ID"
          Write-Host "Jira        : $env:JIRA_KEY"
          Write-Host "Bench       : $env:BENCH_ID"
          Write-Host "ECU         : $env:TARGET_ECU"
          Write-Host "Test Cases  : $env:NORMALIZED_TEST_CASES"
          Write-Host '========================================'

          Write-Host ''
          Write-Host 'Execution request:'
          Write-Host $executeJson

          $response =
            Invoke-RestMethod `
              -Method POST `
              -Uri $executeUrl `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $executeJson

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'EXECUTION RESPONSE'
          Write-Host '========================================'

          if ($null -eq $response) {

            Write-Host 'TestGuide accepted the execute request.'
            Write-Host 'No response body was returned.'

          }
          else {

            $responseJson =
              $response |
              ConvertTo-Json -Depth 30

            Write-Host $responseJson

            $responseFile =
              Join-Path `
                $env:RUNNER_TEMP `
                'testguide-execution-response.json'

            $responseJson |
              Set-Content `
                -LiteralPath $responseFile `
                -Encoding utf8

            "TESTGUIDE_EXECUTION_RESPONSE_FILE=$responseFile" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TESTGUIDE EXECUTION SUBMITTED'
          Write-Host '========================================'


      # ==========================================================
      # 11. SUMMARY
      # ==========================================================

      - name: Publish execution summary
        if: always()
        shell: pwsh
        run: |
          $summary = @(
            '## TestGuide execution',
            '',
            '| Field | Value |',
            '|---|---|',
            "| Jira | $env:JIRA_KEY |",
            "| Bench | $env:TESTGUIDE_BENCH |",
            "| Bench Name | $env:BENCH_NAME |",
            "| Target ECU | $env:TARGET_ECU |",
            "| Test Cases | $env:NORMALIZED_TEST_CASES |",
            "| Playbook | $env:PLAYBOOK_NAME |",
            "| Playbook ID | $env:TESTGUIDE_PLAYBOOK_ID |",
            "| Workspace | $env:TESTGUIDE_ROOT |",
            "| TBC | $env:TBC_RELATIVE_PATH |",
            "| TCF | $env:TCF_RELATIVE_PATH |",
            "| PRJ | $env:PROJECT_RELATIVE_PATH |",
            "| XIL | $env:XIL_IDENTIFIER |",
            "| Status | ${{ job.status }} |"
          )

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
