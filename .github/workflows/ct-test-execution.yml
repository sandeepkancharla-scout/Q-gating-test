name: CT Test Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

jobs:
  phase-2:
    runs-on:
      - self-hosted
      - Windows
      - X64

    env:
      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}

    steps:
      - name: Validate Jira payload
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Jira Key      : $env:JIRA_KEY"
          Write-Host "Bench ID      : $env:BENCH_ID"
          Write-Host "Bench Name    : $env:BENCH_NAME"
          Write-Host "Target ECU    : $env:TARGET_ECU"
          Write-Host "Test Cases    : $env:TEST_CASES"
          Write-Host "Playbook Name : $env:PLAYBOOK_NAME"

          if (-not $env:JIRA_KEY) {
            throw "Jira Key missing"
          }

          if (-not $env:BENCH_ID) {
            throw "Bench ID missing"
          }

          if (-not $env:BENCH_NAME) {
            throw "Bench Name missing"
          }

          if (-not $env:TARGET_ECU) {
            throw "Target ECU missing"
          }

          if (-not $env:TEST_CASES) {
            throw "Test Cases missing"
          }

          if (-not $env:PLAYBOOK_NAME) {
            throw "Playbook Name missing"
          }

          if (-not $env:ONECX_PROJECT_ID) {
            throw "ONECX_PROJECT_ID repository variable missing"
          }

      - name: Resolve latest ONE.CX Playbook
        shell: powershell
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:ONECX_AUTH_KEY) {
            throw "ONECX_AUTH_KEY secret missing"
          }

          $baseUrl = $env:ONECX_URL.TrimEnd("/")

          $encodedName = [System.Uri]::EscapeDataString(
            $env:PLAYBOOK_NAME
          )

          $uri = "{0}/api/v2/execution/playbook?projectId={1}&playbookName={2}&sort=NAME&ascending=ASC&offset=0&limit=100" -f `
            $baseUrl, `
            $env:ONECX_PROJECT_ID, `
            $encodedName

          $headers = @{
            "TestGuide-AuthKey" = $env:ONECX_AUTH_KEY
            "Accept" = "application/json"
          }

          Write-Host "Requested Playbook : $env:PLAYBOOK_NAME"
          Write-Host "ONE.CX Project     : $env:ONECX_PROJECT_ID"
          Write-Host "Lookup URL         : $uri"

          $response = Invoke-RestMethod `
            -Method Get `
            -Uri $uri `
            -Headers $headers

          $playbooks = @(
            $response |
              Where-Object {
                $_.metadata.name -eq $env:PLAYBOOK_NAME
              }
          )

          Write-Host "Matching revisions: $($playbooks.Count)"

          if ($playbooks.Count -eq 0) {
            throw "Playbook '$env:PLAYBOOK_NAME' not found"
          }

          foreach ($playbook in $playbooks) {
            Write-Host "ID=$($playbook.playbookId) Revision=$($playbook.revision) Project=$($playbook.projectId)"
          }

          $latest = $playbooks |
            Sort-Object -Property revision -Descending |
            Select-Object -First 1

          if (-not $latest) {
            throw "Unable to select latest Playbook revision"
          }

          $playbookId = "$($latest.playbookId)".Trim()
          $revision = "$($latest.revision)".Trim()
          $projectId = "$($latest.projectId)".Trim()

          Write-Host ""
          Write-Host "Selected Playbook"
          Write-Host "-----------------"
          Write-Host "Name       : $env:PLAYBOOK_NAME"
          Write-Host "ID         : $playbookId"
          Write-Host "Revision   : $revision"
          Write-Host "Project ID : $projectId"

          if ($projectId -ne "$env:ONECX_PROJECT_ID".Trim()) {
            throw "Playbook project does not match ONECX_PROJECT_ID"
          }

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "ONECX_PLAYBOOK_ID=$playbookId"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "ONECX_PLAYBOOK_REVISION=$revision"

      - name: Phase 2 summary
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "PHASE 2 COMPLETE"
          Write-Host "======================================"
          Write-Host "Jira       : $env:JIRA_KEY"
          Write-Host "Bench ID   : $env:BENCH_ID"
          Write-Host "Bench Name : $env:BENCH_NAME"
          Write-Host "ECU        : $env:TARGET_ECU"
          Write-Host "Test Cases : $env:TEST_CASES"
          Write-Host "Playbook   : $env:PLAYBOOK_NAME"
          Write-Host "ID         : $env:ONECX_PLAYBOOK_ID"
          Write-Host "Revision   : $env:ONECX_PLAYBOOK_REVISION"
          Write-Host "======================================"
