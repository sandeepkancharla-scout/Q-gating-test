name: CT TestGuide Jira ATX Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  testguide:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}
      RESOURCE_NAME: ${{ github.event.client_payload.resource_name }}

      ONECX_URL: 'https://testguide-ssp.onecx.vwgroup.com'
      ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

      JIRA_URL: 'https://scoutmotors.atlassian.net'

    steps:

      # ==========================================================
      # 1. VALIDATE REQUEST
      # ==========================================================

      - name: Validate request
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredValues = @{
            JIRA_KEY = $env:JIRA_KEY
            BENCH_ID = $env:BENCH_ID
            BENCH_NAME = $env:BENCH_NAME
            TARGET_ECU = $env:TARGET_ECU
            TEST_CASES = $env:TEST_CASES
            PLAYBOOK_NAME = $env:PLAYBOOK_NAME
            ONECX_PROJECT_ID = $env:ONECX_PROJECT_ID
            ONECX_AUTH_KEY = $env:ONECX_AUTH_KEY
          }

          foreach ($item in $requiredValues.GetEnumerator()) {
            if (
              [string]::IsNullOrWhiteSpace(
                [string]$item.Value
              )
            ) {
              throw "Missing required value: $($item.Key)"
            }
          }

          $projectId = 0

          if (
            -not [int]::TryParse(
              $env:ONECX_PROJECT_ID,
              [ref]$projectId
            )
          ) {
            throw 'ONECX_PROJECT_ID must be an integer.'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JIRA EXECUTION REQUEST'
          Write-Host '========================================'
          Write-Host "Jira       : $env:JIRA_KEY"
          Write-Host "Bench ID   : $env:BENCH_ID"
          Write-Host "Bench Name : $env:BENCH_NAME"
          Write-Host "ECU        : $env:TARGET_ECU"
          Write-Host "Test Cases : $env:TEST_CASES"
          Write-Host "Playbook   : $env:PLAYBOOK_NAME"
          Write-Host "Project ID : $env:ONECX_PROJECT_ID"
          Write-Host '========================================'


      # ==========================================================
      # 2. RESOLVE RESOURCE AND PATHS
      # ==========================================================

      - name: Resolve resource and paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bench = $env:BENCH_ID.Trim().ToUpperInvariant()

          $resourceName = ''
          $workspaceRoot = ''
          $configurationFolder = ''

          switch ($bench) {

            { $_ -in @('SYSHIL1', 'SYSHIL1-LABTEST1') } {
              $resourceName = 'syshil1-labtest1'
              $workspaceRoot = 'D:\HIL\Testing\eeint-Test-Automation'
              $configurationFolder = 'SYSHIL1'
              break
            }

            { $_ -in @('SYSHIL2', 'SYSHIL2-LABTEST2') } {
              $resourceName = 'syshil2-labtest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              $configurationFolder = 'SYSHIL2'
              break
            }

            {
              $_ -in @(
                'INFO1',
                'SUBSYSINFO1',
                'SUBSYSINFO1-INFOTEST1'
              )
            } {
              $resourceName = 'subsysinfo1-infotest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              $configurationFolder = 'SUBSYSINFO1'
              break
            }

            {
              $_ -in @(
                'INFO2',
                'SUBSYSINFO2',
                'SUBSYSINFO2-INFOTEST2'
              )
            } {
              $resourceName = 'subsysinfo2-infotest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              $configurationFolder = 'SUBSYSINFO2'
              break
            }

            {
              $_ -in @(
                'THERMAL',
                'SUBSYSTHERMAL1',
                'SUBSYSTHERMAL1-THERMALTEST1'
              )
            } {
              $resourceName = 'subsysthermal1-thermaltest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              $configurationFolder = 'SUBSYSTHERMAL1'
              break
            }

            {
              $_ -in @(
                'CHARGING',
                'SUBSYSCHARGING1',
                'SUBSYSCHARGING1-LABTEST6'
              )
            } {
              $resourceName = 'subsyscharging1-labtest6'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              $configurationFolder = 'SUBSYSCHARGING1'
              break
            }

            {
              $_ -in @(
                'MICROBENCH',
                'MICROBENCHINFO',
                'MICROBENCHINFO-MICROBENCHHIL1'
              )
            } {
              $resourceName = 'microbenchinfo-microbenchhil1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              $configurationFolder = 'MICROBENCHINFO'
              break
            }

            default {
              $resourceName = [string]$env:RESOURCE_NAME
              $resourceName = $resourceName.Trim()

              if (
                [string]::IsNullOrWhiteSpace(
                  $resourceName
                )
              ) {
                throw "No ONE.CX resource mapping exists for $bench."
              }

              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              $configurationFolder = $bench
            }
          }

          $xilIdentifier = (
            'novi_hq/1stfloor/ee_lab_novi/' +
            "$resourceName/ControlComputer"
          )

          $ecuTestStepName = "ecu.test $resourceName Start"

          $benchPackage = $env:BENCH_NAME.Trim()
          $targetEcu = $env:TARGET_ECU.Trim()

          $tbcRelativePath = (
            "Configurations\$configurationFolder\" +
            "${configurationFolder}_TestBenchConfig.tbc"
          )

          $tcfRelativePath = (
            "Configurations\$configurationFolder\" +
            "${configurationFolder}_TestConfig.tcf"
          )

          $projectRelativePath = (
            "Packages\$benchPackage\L2_Quality_Gate\" +
            "$targetEcu\" +
            "${targetEcu}_L2QualityGate.prj"
          )

          "TESTGUIDE_RESOURCE=$resourceName" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ROOT=$workspaceRoot" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "CONFIGURATION_FOLDER=$configurationFolder" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "XIL_IDENTIFIER=$xilIdentifier" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "ECUTEST_STEP_NAME=$ecuTestStepName" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TBC_RELATIVE_PATH=$tbcRelativePath" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TCF_RELATIVE_PATH=$tcfRelativePath" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "PROJECT_RELATIVE_PATH=$projectRelativePath" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'RESOURCE CONFIGURATION'
          Write-Host '========================================'
          Write-Host "Bench         : $bench"
          Write-Host "Resource      : $resourceName"
          Write-Host "Workspace     : $workspaceRoot"
          Write-Host "Configuration : $configurationFolder"
          Write-Host "Identifier    : $xilIdentifier"
          Write-Host "TBC           : $tbcRelativePath"
          Write-Host "TCF           : $tcfRelativePath"
          Write-Host "Project       : $projectRelativePath"
          Write-Host '========================================'


      # ==========================================================
      # 3. PARSE TEST CASES
      # ==========================================================

      - name: Parse Jira test cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ids = @(
            $env:TEST_CASES -split '[,;]' |
            ForEach-Object {
              $_.Trim()
            } |
            Where-Object {
              -not [string]::IsNullOrWhiteSpace($_)
            }
          )

          if ($ids.Count -eq 0) {
            throw 'No valid Jira test case IDs.'
          }

          $normalized = $ids -join ','

          "NORMALIZED_TEST_CASES=$normalized" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Test Cases: $normalized"


      # ==========================================================
      # 4. GENERATE PLAYBOOK
      # ==========================================================

      - name: Generate TestGuide playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $playbook = [ordered]@{
            metadata = [ordered]@{
              name = $env:PLAYBOOK_NAME
              taskNameTemplate = '${playbook_name} (${playbook_datetime}) ${distribution_count}'
              labels = @()
            }

            workspace = [ordered]@{
              source = [ordered]@{
                path = $env:TESTGUIDE_ROOT
                sourceType = 'location'
              }

              dependencies = @()
            }

            setup = [ordered]@{
              steps = @(
                [ordered]@{
                  reuse = 'always'
                  keepConfiguration = $false
                  waitMinutesForLicense = 0
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'ecuTestStart'
                },

                [ordered]@{
                  tbcPath = $env:TBC_RELATIVE_PATH
                  tcfPath = $env:TCF_RELATIVE_PATH
                  stepName = 'Test Configuration Selection'
                  type = 'configuration'
                }
              )
            }

            execution = [ordered]@{
              testcases = @(
                [ordered]@{
                  relativePath = $env:PROJECT_RELATIVE_PATH
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'project'
                }
              )
            }

            teardown = [ordered]@{
              steps = @(
                [ordered]@{
                  type = 'ecuTestStop'
                }
              )
            }

            xilConfigRequirements = @(
              [ordered]@{
                label = 'Identifier'
                category = 'XIL'
                value = $env:XIL_IDENTIFIER
                type = 'configuration'
              }
            )

            parameters = @()
          }

          $playbookFile = Join-Path `
            $env:RUNNER_TEMP `
            'testguide-playbook.json'

          $playbookJson = $playbook |
            ConvertTo-Json -Depth 30

          $playbookJson |
            Set-Content `
              -LiteralPath $playbookFile `
              -Encoding utf8

          if (
            -not (
              Test-Path -LiteralPath $playbookFile
            )
          ) {
            throw 'Playbook file was not created.'
          }

          "TESTGUIDE_PLAYBOOK_FILE=$playbookFile" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host $playbookJson


      # ==========================================================
      # 5. UPLOAD PLAYBOOK
      # ==========================================================

      - name: Upload TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [string]::IsNullOrWhiteSpace(
              $env:ONECX_AUTH_KEY
            )
          ) {
            throw 'ONECX_AUTH_KEY is missing.'
          }

          $folder = [uri]::EscapeDataString('/')

          $url = (
            "$env:ONECX_URL/api/v2/execution/playbook" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&folder=$folder"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $body = Get-Content `
            -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
            -Raw

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $url `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $body `
            -ErrorAction Stop

          $playbookId = [convert]::ToString(
            $response.playbookId
          ).Trim()

          if (
            [string]::IsNullOrWhiteSpace(
              $playbookId
            )
          ) {
            throw 'Upload did not return playbookId.'
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_PLAYBOOK_LINK=$($response.playbookLink)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Playbook ID: $playbookId"


      # ==========================================================
      # 6. EXECUTE PLAYBOOK
      # ==========================================================

      - name: Execute TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $url = (
            "$env:ONECX_URL/api/v2/execution/playbook/" +
            "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&checkLastExecution=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $jiraIssueUrl = (
            "$env:JIRA_URL/browse/$env:JIRA_KEY"
          )

          $request = [ordered]@{
            name = (
              "$env:JIRA_KEY - " +
              "$env:TARGET_ECU L2 Quality Gate"
            )

            priority = 42
            parameters = @()

            additionalSettings = [ordered]@{
              analysisExecutionMode = 'sequential'
              downstreamAnalysisPartitioning = 'analysis'
              expirationTimeInMinutes = 60

              issueTrackerTickets = @(
                $jiraIssueUrl
              )

              remainingRetriesOnError = 0
            }
          }

          $requestJson = $request |
            ConvertTo-Json -Depth 20

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $url `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $requestJson `
            -ErrorAction Stop

          $taskIds = @($response.taskIds)

          if ($taskIds.Count -eq 0) {
            throw 'Execution did not return taskIds.'
          }

          $taskId = [convert]::ToString(
            $taskIds[0]
          ).Trim()

          if (
            [string]::IsNullOrWhiteSpace(
              $taskId
            )
          ) {
            throw 'Execution returned an empty taskId.'
          }

          "TESTGUIDE_TASK_ID=$taskId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Execution Task ID: $taskId"


      # ==========================================================
      # 7. POLL EXECUTION
      # ==========================================================

      - name: Poll TestGuide execution
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $url = (
            "$env:ONECX_URL/api/v2/execution/task/" +
            "$env:TESTGUIDE_TASK_ID" +
            "?projectId=$env:ONECX_PROJECT_ID"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $deadline = (Get-Date).AddMinutes(170)

          $successStates = @(
            'FINISHED',
            'COMPLETED',
            'SUCCESS',
            'SUCCEEDED'
          )

          $failureStates = @(
            'ERROR',
            'FAILED',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          $task = $null
          $finalState = ''

          while ((Get-Date) -lt $deadline) {
            $task = Invoke-RestMethod `
              -Method GET `
              -Uri $url `
              -Headers $headers `
              -ErrorAction Stop

            $state = [convert]::ToString(
              $task.state
            ).Trim().ToUpperInvariant()

            Write-Host (
              "State=$state | " +
              "Verdict=$($task.aggregatedVerdict)"
            )

            if ($state -in $successStates) {
              $finalState = $state
              break
            }

            if ($state -in $failureStates) {
              throw (
                "Execution failed. " +
                "State=$state. " +
                "StateInfo=$($task.stateInfo)"
              )
            }

 ow 'No execution response was received.'
          }

          if ($finalState -notin $successStates) {
            throw (
              "Execution timed out. " +
              "Last state=$($task.state)"
            )
          }

          $taskStartDate = :ToString(
            $task.startDate
          ).Trim()

          $taskEndDate = :ToString(
            $task.endDate
          ).Trim()

          if (
            :IsNullOrWhiteSpace(
              $taskStartDate
            )
          ) {
            throw 'Completed task has no startDate.'
          }

          if (
            :IsNullOrWhiteSpace(
              $taskEndDate
            )
          ) {
            throw 'Completed task has no endDate.'
          }

          "FINAL_TASK_STATE=$($task.state)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_STATE_INFO=$($task.stateInfo)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_VERDICT=$($task.aggregatedVerdict)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_START_DATE=$taskStartDate" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_END_DATE=$taskEndDate" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 8. FIND CURRENT TESTGUIDE REPORT
      # ==========================================================

      - name: Find current TestGuide report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $taskStart = :Parse(
            $env:TASK_START_DATE,
            [globalization.CultureInfo]::InvariantCulture
          )

          $taskEnd = :Parse(
            $env:TASK_END_DATE,
            [globalization.CultureInfo]::InvariantCulture
          )

          $windowStart = $taskStart.AddMinutes(-2)
          $windowEnd = $taskEnd.AddMinutes(20)

          $expectedPlan = (
            "$($env:TARGET_ECU.Trim())_L2QualityGate"
          )

          $deadline = (Get-Date).AddMinutes(15)
          $selectedReport = $null
          $attempt = 0

          while ((Get-Date) -lt $deadline) {
            $attempt++

            $startDate = $windowStart.ToString(
              'yyyy-MM-ddTHH:mm:ss.fffZ'
            )

            $endDate = $windowEnd.ToString(
              'yyyy-MM-ddTHH:mm:ss.fffZ'
            )

            $encodedStart = :EscapeDataString(
              $startDate
            )

            $encodedEnd = :EscapeDataString(
              $endDate
            )

            $url = (
              "$env:ONECX_URL/api/report/reports/history" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&startDate=$encodedStart" +
              "&endDate=$encodedEnd" +
              "&offset=0" +
              "&limit=100"
            )

            Write-Host (
              "Report attempt $attempt | " +
              "Expected=$expectedPlan"
            )

            $response = Invoke-RestMethod `
              -Method GET `
              -Uri $url `
              -Headers $headers `
              -ErrorAction Stop

            $reports = @($response)

            $matches = @(
              $reports |
              Where-Object {
                $name = :ToString(
                  $_.testPlanName
                ).Trim()

                $status = :ToString(
                  $_.status
                ).Trim().ToUpperInvariant()

                $executionText = :ToString(
                  $_.executionDate
                ).Trim()

                if (
                  :IsNullOrWhiteSpace(
                    $executionText
                  )
                ) {
                  return $false
                }

                $executionDate = :Parse(
                  $executionText,
                  [globalization.CultureInfo]::InvariantCulture
                )

                return (
                  $name -ieq $expectedPlan -and
                  $status -eq 'COMPLETE' -and
                  $executionDate -ge $windowStart -and
                  $executionDate -le $windowEnd
                )
              } |
              Sort-Object {
                :Parse(
                  :ToString(
                    $_.uploadDate
                  ),
                  [globalization.CultureInfo]::InvariantCulture
                )
              } -Descending
            )

            if ($matches.Count -gt 0) {
              $selectedReport = $matches[0]
              break
            }

            Write-Host 'Report not imported yet. Waiting 15 seconds.'

            Start-Sleep -Seconds 15
          }

          if ($null -eq $selectedReport) {
            throw "No TestGuide report found for $expectedPlan."
          }

          $reportId = :ToString(
            $selectedReport.reportId
          ).Trim()

          if (
            :IsNullOrWhiteSpace(
              $reportId
            )
          ) {
            throw 'Selected report has no reportId.'
          }

          "TESTGUIDE_REPORT_ID=$reportId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_PLAN=$($selectedReport.testPlanName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_EXECUTION_DATE=$($selectedReport.executionDate)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_UPLOAD_DATE=$($selectedReport.uploadDate)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "TestGuide Report ID: $reportId"


      # ==========================================================
      # 9. START ATX EXPORT
      # ==========================================================

      - name: Start ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            :IsNullOrWhiteSpace(
              $env:TESTGUIDE_REPORT_ID
            )
          ) {
            throw 'TESTGUIDE_REPORT_ID is missing.'
          }

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $reportId = :EscapeDataString(
            $env:TESTGUIDE_REPORT_ID
          )

          $url = (
            "$env:ONECX_URL/api/report/export/atx/" +
            "$reportId" +
            "?useExportStorage=false"
          )

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $url `
            -Headers $headers `
            -ErrorAction Stop

          $taskId = :ToString(
            $response.taskId
          ).Trim()

          if (
            :IsNullOrWhiteSpace(
              $taskId
            )
          ) {
            throw 'ATX export did not return taskId.'
          }

          "ATX_EXPORT_TASK_ID=$taskId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "ATX Export Task: $taskId"


      # ==========================================================
      # 10. POLL ATX EXPORT
      # ==========================================================

      - name: Poll ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $taskId = :EscapeDataString(
            $env:ATX_EXPORT_TASK_ID
          )

          $url = (
            "$env:ONECX_URL/api/report/export/atx/" +
            "$taskId/status"
          )

          $deadline = (Get-Date).AddMinutes(30)
          $ready = $false

          $successStates = @(
            'FINISHED',
            'COMPLETED',
            'COMPLETE',
            'SUCCESS',
            'SUCCEEDED',
            'READY',
            'DONE'
          )

          $failureStates = @(
            'FAILED',
            'FAILURE',
            'ERROR',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          while ((Get-Date) -lt $deadline) {
            $status = Invoke-RestMethod `
              -Method GET `
              -Uri $url `
              -Headers $headers `
              -ErrorAction Stop

            $status |
              ConvertTo-Json -Depth 20 |
              Write-Host

            if (
              $null -ne $status.done -and
              [bool]$status.done
            ) {
              $ready = $true
              break
            }

            $state = ''

            if ($null -ne $status.state) {
              $state = :ToString(
                $status.state
              ).Trim().ToUpperInvariant()
            }
            elseif ($null -ne $status.status) {
              $state = :ToString(
                $status.status
              ).Trim().ToUpperInvariant()
            }
            elseif ($status -is [string]) {
              $state = $status.Trim().Trim('"').ToUpperInvariant()
            }

            if ($state -in $successStates) {
              $ready = $true
              break
            }

            if ($state -in $failureStates) {
              throw "ATX export failed: $state"
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ready) {
            throw 'ATX export timed out.'
          }

          "ATX_EXPORT_STATE=COMPLETED" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 11. DOWNLOAD TESTGUIDE REPORT
      # ==========================================================

      - name: Download TestGuide report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:ATX_EXPORT_STATE -ne 'COMPLETED') {
            throw 'ATX export is not complete.'
          }

          $safeJira = (
            $env:JIRA_KEY -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $safeEcu = (
            $env:TARGET_ECU -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $temporaryFile = Join-Path `
            $env:RUNNER_TEMP `
            "${safeJira}_${safeEcu}_ATX_Export.bin"

          $taskId = :EscapeDataString(
            $env:ATX_EXPORT_TASK_ID
          )

          $url = (
            "$env:ONECX_URL/api/report/export/atx/" +
            "$taskId/download"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
          }

          Invoke-WebRequest `
            -Method GET `
            -Uri $url `
            -Headers $headers `
            -OutFile $temporaryFile `
            -ErrorAction Stop

          if (
            -not (
              Test-Path -LiteralPath $temporaryFile
            )
          ) {
            throw 'TestGuide report was not downloaded.'
          }

          $downloadInfo = Get-Item `
            -LiteralPath $temporaryFile

          if ($downloadInfo.Length -eq 0) {
            throw 'TestGuide report is empty.'
          }

          $bytes = [io.file]::ReadAllBytes(
            $temporaryFile
          )

          $signatureLength = :Min(
            4,
            $bytes.Length
          )

          $signature = [text.encoding]::ASCII.GetString(
            $bytes,
            0,
            $signatureLength
          )

          if ($signature.StartsWith('PK')) {
            $finalFile = Join-Path `
              $env:RUNNER_TEMP `
              "${safeJira}_${safeEcu}_ATX_Export.zip"

            $exportType = 'ZIP'
          }
          else {
            $previewLength = :Min(
              500,
              $bytes.Length
            )

            $preview = [text.encoding]::UTF8.GetString(
              $bytes,
              0,
              $previewLength
            )

            if (
              $preview.TrimStart().StartsWith('{') -or
              $preview.TrimStart().StartsWith('<html') -or
              $preview.TrimStart().StartsWith('<!DOCTYPE html')
            ) {
              Write-Host $preview

              throw 'TestGuide download returned JSON or HTML.'
            }

            $finalFile = Join-Path `
              $env:RUNNER_TEMP `
              "${safeJira}_${safeEcu}_ATX_Export.atx"

            $exportType = 'ATX'
          }

          Move-Item `
            -LiteralPath $temporaryFile `
            -Destination $finalFile `
            -Force

          $finalInfo = Get-Item `
            -LiteralPath $finalFile

          "TESTGUIDE_ATX_FILE=$finalFile" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ATX_EXPORT_TYPE=$exportType" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ATX_SIZE=$($finalInfo.Length)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Report: $finalFile"
          Write-Host "Type: $exportType"
          Write-Host "Size: $($finalInfo.Length) bytes"


      # ==========================================================
      # 12. UPLOAD TO GITHUB ACTIONS
      # ==========================================================

      - name: Upload TestGuide report to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JIRA_KEY }}_${{ env.TARGET_ECU }}_TestGuideReport
          path: ${{ env.TESTGUIDE_ATX_FILE }}
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 13. ATTACH REPORT DIRECTLY TO JIRA
      # ==========================================================

      - name: Attach TestGuide report to Jira
        shell: pwsh
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            :IsNullOrWhiteSpace(
              $env:JIRA_EMAIL
            )
          ) {
            throw 'JIRA_EMAIL secret is missing.'
          }

          if (
            :IsNullOrWhiteSpace(
              $env:JIRA_API_TOKEN
            )
          ) {
            throw 'JIRA_API_TOKEN secret is missing.'
          }

          if (
            -not (
              Test-Path -LiteralPath $env:TESTGUIDE_ATX_FILE
            )
          ) {
            throw (
              'TestGuide report does not exist: ' +
              $env:TESTGUIDE_ATX_FILE
            )
          }

          $fileInfo = Get-Item `
            -LiteralPath $env:TESTGUIDE_ATX_FILE

          if ($fileInfo.Length -eq 0) {
            throw 'TestGuide report file is empty.'
          }

          $jiraAttachmentUrl = (
            "$env:JIRA_URL/rest/api/3/issue/" +
            "$env:JIRA_KEY/attachments"
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'ATTACH REPORT TO JIRA'
          Write-Host '========================================'
          Write-Host "Issue : $env:JIRA_KEY"
          Write-Host "File  : $($fileInfo.FullName)"
          Write-Host "Size  : $($fileInfo.Length)"
          Write-Host "URL   : $jiraAttachmentUrl"
          Write-Host '========================================'

          $curlArguments = @(
            '--fail-with-body'
            '--silent'
            '--show-error'
            '--request'
            'POST'
            '--user'
            "${env:JIRA_EMAIL}:${env:JIRA_API_TOKEN}"
            '--header'
            'X-Atlassian-Token: no-check'
            '--form'
            "file=@$($fileInfo.FullName)"
            $jiraAttachmentUrl
          )

          $curlOutput = & curl.exe @curlArguments
          $curlExitCode = $LASTEXITCODE

          Write-Host $curlOutput

          if ($curlExitCode -ne 0) {
            throw (
              'Jira attachment upload failed. ' +
              "curl exit code: $curlExitCode"
            )
          }

          "JIRA_REPORT_ATTACHED=true" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host 'Report attached to Jira successfully.'


      # ==========================================================
      # 14. SUMMARY
      # ==========================================================

      - name: Publish execution summary
        if: always()
        shell: pwsh
        run: |
          @(
            '## TestGuide Execution',
            '',
            '| Field | Value |',
            '|---|---|',
            "| Jira | $env:JIRA_KEY |",
            "| Bench | $env:BENCH_ID |",
            "| Resource | $env:TESTGUIDE_RESOURCE |",
            "| Configuration | $env:CONFIGURATION_FOLDER |",
            "| ECU | $env:TARGET_ECU |",
            "| Playbook ID | $env:TESTGUIDE_PLAYBOOK_ID |",
            "| Execution Task | $env:TESTGUIDE_TASK_ID |",
            "| Execution State | $env:FINAL_TASK_STATE |",
            "| Verdict | $env:FINAL_TASK_VERDICT |",
            "| TestGuide Report ID | $env:TESTGUIDE_REPORT_ID |",
            "| TestGuide Plan | $env:TESTGUIDE_REPORT_PLAN |",
            "| ATX Export Task | $env:ATX_EXPORT_TASK_ID |",
            "| Export Type | $env:TESTGUIDE_ATX_EXPORT_TYPE |",
            "| Export File | $env:TESTGUIDE_ATX_FILE |",
            "| Export Size | $env:TESTGUIDE_ATX_SIZE bytes |",
            "| Jira Attachment | $env:JIRA_REPORT_ATTACHED |",
            "| Workflow Status | ${{ job.status }} |"
          ) |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
