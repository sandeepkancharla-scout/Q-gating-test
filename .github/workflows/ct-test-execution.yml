name: CT TestGuide Jira ATX Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  testguide:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}

      CONFIGURATION_FOLDER: 'SUBSYS1'

      ONECX_URL: 'https://testguide-ssp.onecx.vwgroup.com'
      ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

    steps:

      # ==========================================================
      # 1. VALIDATE
      # ==========================================================

      - name: Validate request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @{
            JIRA_KEY = $env:JIRA_KEY
            BENCH_ID = $env:BENCH_ID
            BENCH_NAME = $env:BENCH_NAME
            TARGET_ECU = $env:TARGET_ECU
            TEST_CASES = $env:TEST_CASES
            PLAYBOOK_NAME = $env:PLAYBOOK_NAME
            ONECX_PROJECT_ID = $env:ONECX_PROJECT_ID
          }

          foreach ($item in $required.GetEnumerator()) {
            if (
              [System.String]::IsNullOrWhiteSpace(
                [System.String]$item.Value
              )
            ) {
              throw "Missing required value: $($item.Key)"
            }
          }

          $projectId = 0

          if (
            -not [System.Int32]::TryParse(
              $env:ONECX_PROJECT_ID,
              [ref]$projectId
            )
          ) {
            throw 'ONECX_PROJECT_ID must be an integer.'
          }


      # ==========================================================
      # 2. RESOLVE RESOURCE
      # ==========================================================

      - name: Resolve ONE.CX resource and paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bench = $env:BENCH_ID.Trim().ToUpperInvariant()

          switch ($bench) {

            { $_ -in @('SYSHIL1', 'SYSHIL1-LABTEST1') } {
              $resource = 'syshil1-labtest1'
              $root = 'D:\HIL\Testing\eeint-Test-Automation'
              break
            }

            { $_ -in @('SYSHIL2', 'SYSHIL2-LABTEST2') } {
              $resource = 'syshil2-labtest2'
              $root = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'MICROBENCH',
                'MICROBENCHINFO',
                'MICROBENCHINFO-MICROBENCHHIL1'
              )
            } {
              $resource = 'microbenchinfo-microbenchhil1'
              $root = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'CHARGING',
                'SUBSYSCHARGING1',
                'SUBSYSCHARGING1-LABTEST6'
              )
            } {
              $resource = 'subsyscharging1-labtest6'
              $root = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'INFO1',
                'SUBSYSINFO1',
                'SUBSYSINFO1-INFOTEST1'
              )
            } {
              $resource = 'subsysinfo1-infotest1'
              $root = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'INFO2',
                'SUBSYSINFO2',
                'SUBSYSINFO2-INFOTEST2'
              )
            } {
              $resource = 'subsysinfo2-infotest2'
              $root = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'THERMAL',
                'SUBSYSTHERMAL1',
                'SUBSYSTHERMAL1-THERMALTEST1'
              )
            } {
              $resource = 'subsysthermal1-thermaltest1'
              $root = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            default {
              throw "Unsupported bench/resource: $env:BENCH_ID"
            }
          }

          $cfg = $env:CONFIGURATION_FOLDER.Trim()
          $benchPackage = $env:BENCH_NAME.Trim()
          $ecu = $env:TARGET_ECU.Trim()

          $identifier = (
            "novi_hq/1stfloor/ee_lab_novi/" +
            "$resource/ControlComputer"
          )

          $stepName = "ecu.test $resource Start"

          $tbc = (
            "Configurations\$cfg\" +
            "${cfg}_TestBenchConfig.tbc"
          )

          $tcf = (
            "Configurations\$cfg\" +
            "${cfg}_TestConfig.tcf"
          )

          $project = (
            "Packages\$benchPackage\L2_Quality_Gate\" +
            "$ecu\" +
            "${ecu}_L2QualityGate.prj"
          )

          "TESTGUIDE_RESOURCE=$resource" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ROOT=$root" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "XIL_IDENTIFIER=$identifier" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "ECUTEST_STEP_NAME=$stepName" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TBC_RELATIVE_PATH=$tbc" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TCF_RELATIVE_PATH=$tcf" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "PROJECT_RELATIVE_PATH=$project" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Resource   : $resource"
          Write-Host "Workspace  : $root"
          Write-Host "Identifier : $identifier"
          Write-Host "PRJ        : $project"


      # ==========================================================
      # 3. PARSE TEST CASES
      # ==========================================================

      - name: Parse Jira test cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ids = @(
            $env:TEST_CASES -split '[,;]' |
            ForEach-Object {
              $_.Trim()
            } |
            Where-Object {
              -not [System.String]::IsNullOrWhiteSpace($_)
            }
          )

          if ($ids.Count -eq 0) {
            throw 'No valid Jira test case IDs.'
          }

          $normalized = $ids -join ','

          "NORMALIZED_TEST_CASES=$normalized" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 4. GENERATE PLAYBOOK
      # ==========================================================

      - name: Generate TestGuide playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $playbook = [ordered]@{

            metadata = [ordered]@{
              name = $env:PLAYBOOK_NAME
              taskNameTemplate = '${playbook_name} (${playbook_datetime}) ${distribution_count}'
              labels = @()
            }

            workspace = [ordered]@{

              source = [ordered]@{
                path = $env:TESTGUIDE_ROOT
                sourceType = 'location'
              }

              dependencies = @()
            }

            setup = [ordered]@{

              steps = @(

                [ordered]@{
                  reuse = 'always'
                  keepConfiguration = $false
                  waitMinutesForLicense = 0
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'ecuTestStart'
                },

                [ordered]@{
                  tbcPath = $env:TBC_RELATIVE_PATH
                  tcfPath = $env:TCF_RELATIVE_PATH
                  stepName = 'Test Configuration Selection'
                  type = 'configuration'
                }
              )
            }

            execution = [ordered]@{

              testcases = @(

                [ordered]@{
                  relativePath = $env:PROJECT_RELATIVE_PATH
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'project'
                }
              )
            }

            teardown = [ordered]@{

              steps = @(
                [ordered]@{
                  type = 'ecuTestStop'
                }
              )
            }

            xilConfigRequirements = @(

              [ordered]@{
                label = 'Identifier'
                category = 'XIL'
                value = $env:XIL_IDENTIFIER
                type = 'configuration'
              }
            )

            parameters = @()
          }

          $file = Join-Path `
            $env:RUNNER_TEMP `
            'testguide-playbook.json'

          $json = $playbook |
            ConvertTo-Json -Depth 30

          $json |
            Set-Content `
              -LiteralPath $file `
              -Encoding utf8

          "TESTGUIDE_PLAYBOOK_FILE=$file" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host $json


      # ==========================================================
      # 5. UPLOAD PLAYBOOK
      # ==========================================================

      - name: Upload TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:ONECX_AUTH_KEY
            )
          ) {
            throw 'ONECX_AUTH_KEY is missing.'
          }

          $folder = [System.Uri]::EscapeDataString('/')

          $url = (
            "$env:ONECX_URL/api/v2/execution/playbook" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&folder=$folder"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $body = Get-Content `
            -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
            -Raw

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $url `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $body `
            -ErrorAction Stop

          $playbookId = (
            [System.Convert]::ToString(
              $response.playbookId
            )
          ).Trim()

          if (
            [System.String]::IsNullOrWhiteSpace(
              $playbookId
            )
          ) {
            throw 'Upload did not return playbookId.'
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_PLAYBOOK_LINK=$($response.playbookLink)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Playbook ID: $playbookId"


      # ==========================================================
      # 6. EXECUTE PLAYBOOK
      # ==========================================================

      - name: Execute TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $url = (
            "$env:ONECX_URL/api/v2/execution/playbook/" +
            "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&checkLastExecution=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $jiraUrl = (
            'https://scoutmotors.atlassian.net/browse/' +
            $env:JIRA_KEY
          )

          $request = [ordered]@{

            name = (
              "$env:JIRA_KEY - " +
              "$env:TARGET_ECU L2 Quality Gate"
            )

            priority = 42

            parameters = @()

            additionalSettings = [ordered]@{
              analysisExecutionMode = 'sequential'
              downstreamAnalysisPartitioning = 'analysis'
              expirationTimeInMinutes = 60
              issueTrackerTickets = @($jiraUrl)
              remainingRetriesOnError = 0
            }
          }

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $url `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body (
              $request |
              ConvertTo-Json -Depth 20
            ) `
            -ErrorAction Stop

          $taskIds = @($response.taskIds)

          if ($taskIds.Count -eq 0) {
            throw 'Execution did not return taskIds.'
          }

          $taskId = (
            [System.Convert]::ToString(
              $taskIds[0]
            )
          ).Trim()

          if (
            [System.String]::IsNullOrWhiteSpace(
              $taskId
            )
          ) {
            throw 'Execution returned an empty taskId.'
          }

          "TESTGUIDE_TASK_ID=$taskId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Execution Task ID: $taskId"


      # ==========================================================
      # 7. POLL EXECUTION
      # ==========================================================

      - name: Poll TestGuide execution
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $url = (
            "$env:ONECX_URL/api/v2/execution/task/" +
            "$env:TESTGUIDE_TASK_ID" +
            "?projectId=$env:ONECX_PROJECT_ID"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $deadline = (Get-Date).AddMinutes(170)

          $successStates = @(
            'FINISHED',
            'COMPLETED',
            'SUCCESS',
            'SUCCEEDED'
          )

          $failureStates = @(
            'ERROR',
            'FAILED',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          $blockedSince = $null
          $task = $null
          $attempt = 0

          while ((Get-Date) -lt $deadline) {

            $attempt++

            $task = Invoke-RestMethod `
              -Method GET `
              -Uri $url `
              -Headers $headers `
              -ErrorAction Stop

            $state = (
              [System.Convert]::ToString(
                $task.state
              )
            ).Trim().ToUpperInvariant()

            $stateInfo = [System.Convert]::ToString(
              $task.stateInfo
            )

            $verdict = [System.Convert]::ToString(
              $task.aggregatedVerdict
            )

            Write-Host (
              "Attempt $attempt | " +
              "State=$state | " +
              "Verdict=$verdict | " +
              "StateInfo=$stateInfo"
            )

            if ($state -in $successStates) {
              break
            }

            if ($state -in $failureStates) {
              throw (
                "Execution failed. " +
                "State=$state. " +
                "StateInfo=$stateInfo"
              )
            }

            if ($state -eq 'BLOCKED') {

              if ($null -eq $blockedSince) {
                $blockedSince = Get-Date
              }

              if (
                (
                  (Get-Date) - $blockedSince
                ).TotalMinutes -ge 5
              ) {
                throw 'Execution remained BLOCKED for 5 minutes.'
              }

            }
            else {
              $blockedSince = $null
            }

            Start-Sleep -Seconds 10
          }

          if ($null -eq $task) {
            throw 'No execution task response was received.'
          }

          $finalState = (
            [System.Convert]::ToString(
              $task.state
            )
          ).Trim().ToUpperInvariant()

          if ($finalState -notin $successStates) {
            throw (
              "Execution timed out. Last state: $finalState"
            )
          }

          $startDate = [System.Convert]::ToString(
            $task.startDate
          )

          $endDate = [System.Convert]::ToString(
            $task.endDate
          )

          if (
            [System.String]::IsNullOrWhiteSpace(
              $startDate
            )
          ) {
            throw 'Completed task has no startDate.'
          }

          if (
            [System.String]::IsNullOrWhiteSpace(
              $endDate
            )
          ) {
            throw 'Completed task has no endDate.'
          }

          "FINAL_TASK_STATE=$($task.state)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_STATE_INFO=$($task.stateInfo)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_VERDICT=$($task.aggregatedVerdict)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_START_DATE=$startDate" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_END_DATE=$endDate" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 8. FIND IMPORTED TESTGUIDE REPORT
      #
      # Correct endpoint:
      # /api/report/reports/history
      # ==========================================================

      - name: Find imported TestGuide report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $taskStart = [System.DateTimeOffset]::Parse(
            $env:TASK_START_DATE,
            [System.Globalization.CultureInfo]::InvariantCulture
          )

          $taskEnd = [System.DateTimeOffset]::Parse(
            $env:TASK_END_DATE,
            [System.Globalization.CultureInfo]::InvariantCulture
          )

          $windowStart = $taskStart.AddMinutes(-2)
          $windowEnd = $taskEnd.AddMinutes(20)

          $expectedTestPlan = (
            "$($env:TARGET_ECU.Trim())_L2QualityGate"
          )

          $deadline = (Get-Date).AddMinutes(15)

          $attempt = 0
          $selectedReport = $null

          while ((Get-Date) -lt $deadline) {

            $attempt++

            $startDate = (
              $windowStart.ToUniversalTime().ToString(
                'yyyy-MM-ddTHH:mm:ss.fffZ'
              )
            )

            $endDate = (
              $windowEnd.ToUniversalTime().ToString(
                'yyyy-MM-ddTHH:mm:ss.fffZ'
              )
            )

            $encodedStart = [System.Uri]::EscapeDataString(
              $startDate
            )

            $encodedEnd = [System.Uri]::EscapeDataString(
              $endDate
            )

            $historyUrl = (
              "$env:ONECX_URL/api/report/reports/history" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&startDate=$encodedStart" +
              "&endDate=$encodedEnd" +
              "&offset=0" +
              "&limit=100"
            )

            Write-Host ''
            Write-Host '========================================'
            Write-Host "REPORT HISTORY ATTEMPT $attempt"
            Write-Host '========================================'
            Write-Host "Expected Plan : $expectedTestPlan"
            Write-Host "Start         : $startDate"
            Write-Host "End           : $endDate"
            Write-Host "URL           : $historyUrl"
            Write-Host '========================================'

            $response = Invoke-RestMethod `
              -Method GET `
              -Uri $historyUrl `
              -Headers $headers `
              -ErrorAction Stop

            $reports = @($response)

            Write-Host "Reports returned: $($reports.Count)"

            $matches = @(
              $reports |
              Where-Object {

                $name = (
                  [System.Convert]::ToString(
                    $_.testPlanName
                  )
                ).Trim()

                $status = (
                  [System.Convert]::ToString(
                    $_.status
                  )
                ).Trim().ToUpperInvariant()

                $executionText = (
                  [System.Convert]::ToString(
                    $_.executionDate
                  )
                ).Trim()

                if (
                  [System.String]::IsNullOrWhiteSpace(
                    $executionText
                  )
                ) {
                  return $false
                }

                $executionDate = (
                  [System.DateTimeOffset]::Parse(
                    $executionText,
                    [System.Globalization.CultureInfo]::InvariantCulture
                  )
                )

                return (
                  $name -ieq $expectedTestPlan -and
                  $status -eq 'COMPLETE' -and
                  $executionDate -ge $windowStart -and
                  $executionDate -le $windowEnd
                )
              } |
              Sort-Object {
                [System.DateTimeOffset]::Parse(
                  [System.Convert]::ToString(
                    $_.uploadDate
                  ),
                  [System.Globalization.CultureInfo]::InvariantCulture
                )
              } -Descending
            )

            if ($matches.Count -gt 0) {
              $selectedReport = $matches[0]
              break
            }

            Write-Host (
              "No matching COMPLETE report for " +
              "$expectedTestPlan yet."
            )

            Start-Sleep -Seconds 15
          }

          if ($null -eq $selectedReport) {
            throw (
              'No COMPLETE TestGuide report found for ' +
              "$expectedTestPlan in the execution window."
            )
          }

          $reportId = (
            [System.Convert]::ToString(
              $selectedReport.reportId
            )
          ).Trim()

          $numericReportId = 0

          if (
            -not [System.Int64]::TryParse(
              $reportId,
              [ref]$numericReportId
            )
          ) {
            throw "Matched reportId is not numeric: $reportId"
          }

          "TESTGUIDE_REPORT_ID=$numericReportId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_PLAN=$($selectedReport.testPlanName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_UPLOAD_DATE=$($selectedReport.uploadDate)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_EXECUTION_DATE=$($selectedReport.executionDate)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TESTGUIDE REPORT FOUND'
          Write-Host '========================================'
          Write-Host "Report ID      : $numericReportId"
          Write-Host "Test Plan      : $($selectedReport.testPlanName)"
          Write-Host "Execution Date : $($selectedReport.executionDate)"
          Write-Host "Upload Date    : $($selectedReport.uploadDate)"
          Write-Host "File Size      : $($selectedReport.fileSize)"
          Write-Host '========================================'


      # ==========================================================
      # 9. START ATX EXPORT
      # ==========================================================

      - name: Start ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $reportId = [System.Uri]::EscapeDataString(
            $env:TESTGUIDE_REPORT_ID
          )

          $url = (
            "$env:ONECX_URL/api/export/atx/" +
            "$reportId" +
            "?useExportStorage=false"
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'START ATX EXPORT'
          Write-Host '========================================'
          Write-Host "Report ID : $env:TESTGUIDE_REPORT_ID"
          Write-Host "URL       : $url"
          Write-Host '========================================'

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $url `
            -Headers $headers `
            -ErrorAction Stop

          $taskId = (
            [System.Convert]::ToString(
              $response.taskId
            )
          ).Trim()

          if (
            [System.String]::IsNullOrWhiteSpace(
              $taskId
            )
          ) {
            throw 'ATX export did not return taskId.'
          }

          "ATX_EXPORT_TASK_ID=$taskId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "ATX Export Task UUID: $taskId"


      # ==========================================================
      # 10. POLL ATX EXPORT
      # ==========================================================

      - name: Poll ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $id = [System.Uri]::EscapeDataString(
            $env:ATX_EXPORT_TASK_ID
          )

          $url = (
            "$env:ONECX_URL/api/export/atx/" +
            "$id/status"
          )

          $deadline = (Get-Date).AddMinutes(30)

          $successStates = @(
            'FINISHED',
            'COMPLETED',
            'COMPLETE',
            'SUCCESS',
            'SUCCEEDED',
            'READY',
            'DONE'
          )

          $failureStates = @(
            'FAILED',
            'FAILURE',
            'ERROR',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          $ready = $false
          $attempt = 0

          while ((Get-Date) -lt $deadline) {

            $attempt++

            $status = Invoke-RestMethod `
              -Method GET `
              -Uri $url `
              -Headers $headers `
              -ErrorAction Stop

            Write-Host ''
            Write-Host "ATX Export Attempt: $attempt"

            $status |
              ConvertTo-Json -Depth 20 |
              Write-Host

            if (
              $null -ne $status.done -and
              [System.Boolean]$status.done
            ) {
              $ready = $true
              break
            }

            $state = ''

            if ($null -ne $status.state) {
              $state = (
                [System.Convert]::ToString(
                  $status.state
                )
              ).Trim().ToUpperInvariant()
            }
            elseif ($null -ne $status.status) {
              $state = (
                [System.Convert]::ToString(
                  $status.status
                )
              ).Trim().ToUpperInvariant()
            }
            elseif ($status -is [System.String]) {
              $state = (
                [System.String]$status
              ).Trim().Trim('"').ToUpperInvariant()
            }

            if ($state -in $successStates) {
              $ready = $true
              break
            }

            if ($state -in $failureStates) {
              throw "ATX export failed: $state"
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ready) {
            throw 'ATX export timed out after 30 minutes.'
          }

          "ATX_EXPORT_STATE=COMPLETED" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 11. DOWNLOAD ATX EXPORT
      # ==========================================================

      - name: Download ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:ATX_EXPORT_STATE -ne 'COMPLETED') {
            throw 'ATX export has not completed.'
          }

          $safeJira = (
            $env:JIRA_KEY -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $safeEcu = (
            $env:TARGET_ECU -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $tempFile = Join-Path `
            $env:RUNNER_TEMP `
            "${safeJira}_${safeEcu}_ATX_Export.bin"

          $id = [System.Uri]::EscapeDataString(
            $env:ATX_EXPORT_TASK_ID
          )

          $url = (
            "$env:ONECX_URL/api/export/atx/" +
            "$id/download"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/octet-stream'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'DOWNLOAD ATX EXPORT'
          Write-Host '========================================'
          Write-Host "Report ID : $env:TESTGUIDE_REPORT_ID"
          Write-Host "Task UUID : $env:ATX_EXPORT_TASK_ID"
          Write-Host "URL       : $url"
          Write-Host '========================================'

          Invoke-WebRequest `
            -Method GET `
            -Uri $url `
            -Headers $headers `
            -OutFile $tempFile `
            -ErrorAction Stop

          if (-not (Test-Path -LiteralPath $tempFile)) {
            throw 'ATX export was not downloaded.'
          }

          $info = Get-Item `
            -LiteralPath $tempFile

          if ($info.Length -eq 0) {
            throw 'ATX export is empty.'
          }

          $bytes = [System.IO.File]::ReadAllBytes(
            $tempFile
          )

          $signatureLength = [System.Math]::Min(
            4,
            $bytes.Length
          )

          $signature = [System.Text.Encoding]::ASCII.GetString(
            $bytes,
            0,
            $signatureLength
          )

          Write-Host "Downloaded Signature: $signature"

          if ($signature.StartsWith('PK')) {

            $finalFile = Join-Path `
              $env:RUNNER_TEMP `
              "${safeJira}_${safeEcu}_ATX_Export.zip"

            $type = 'ZIP'

          }
          else {

            $previewLength = [System.Math]::Min(
              200,
              $bytes.Length
            )

            $preview = [System.Text.Encoding]::UTF8.GetString(
              $bytes,
              0,
              $previewLength
            )

            if (
              $preview.TrimStart().StartsWith('{') -or
              $preview.TrimStart().StartsWith('<html') -or
              $preview.TrimStart().StartsWith('<!DOCTYPE html')
            ) {
              Write-Host 'Unexpected response:'
              Write-Host $preview

              throw (
                'ATX download returned JSON or HTML ' +
                'instead of the export.'
              )
            }

            $finalFile = Join-Path `
              $env:RUNNER_TEMP `
              "${safeJira}_${safeEcu}_ATX_Export.atx"

            $type = 'ATX'
          }

          Move-Item `
            -LiteralPath $tempFile `
            -Destination $finalFile `
            -Force

          $finalInfo = Get-Item `
            -LiteralPath $finalFile

          "TESTGUIDE_ATX_EXPORT_TYPE=$type" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ATX_EXPORT_FILE=$finalFile" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ATX_EXPORT_SIZE=$($finalInfo.Length)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'ATX EXPORT DOWNLOADED'
          Write-Host '========================================'
          Write-Host "Type : $type"
          Write-Host "File : $finalFile"
          Write-Host "Size : $($finalInfo.Length) bytes"
          Write-Host '========================================'


      # ==========================================================
      # 12. UPLOAD TO GITHUB ACTIONS
      # ==========================================================

      - name: Upload ATX export to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JIRA_KEY }}_${{ env.TARGET_ECU }}_ATX
          path: ${{ env.TESTGUIDE_ATX_EXPORT_FILE }}
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 13. SUMMARY
      # ==========================================================

      - name: Publish execution summary
        if: always()
        shell: pwsh
        run: |
          $summary = @(
            '## TestGuide ATX Execution',
            '',
            '| Field | Value |',
            '|---|---|',
            "| Jira | $env:JIRA_KEY |",
            "| Bench | $env:BENCH_ID |",
            "| Resource | $env:TESTGUIDE_RESOURCE |",
            "| ECU | $env:TARGET_ECU |",
            "| XIL | $env:XIL_IDENTIFIER |",
            "| PRJ | $env:PROJECT_RELATIVE_PATH |",
            "| Playbook ID | $env:TESTGUIDE_PLAYBOOK_ID |",
            "| Execution Task | $env:TESTGUIDE_TASK_ID |",
            "| Execution State | $env:FINAL_TASK_STATE |",
            "| Verdict | $env:FINAL_TASK_VERDICT |",
            "| TestGuide Report ID | $env:TESTGUIDE_REPORT_ID |",
            "| Report Test Plan | $env:TESTGUIDE_REPORT_PLAN |",
            "| Report Execution Date | $env:TESTGUIDE_REPORT_EXECUTION_DATE |",
            "| Report Upload Date | $env:TESTGUIDE_REPORT_UPLOAD_DATE |",
            "| ATX Export Task UUID | $env:ATX_EXPORT_TASK_ID |",
            "| ATX Export State | $env:ATX_EXPORT_STATE |",
            "| ATX Export Type | $env:TESTGUIDE_ATX_EXPORT_TYPE |",
            "| ATX Export File | $env:TESTGUIDE_ATX_EXPORT_FILE |",
            "| ATX Export Size | $env:TESTGUIDE_ATX_EXPORT_SIZE bytes |",
            "| Workflow Status | ${{ job.status }} |"
          )

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
