name: CT TestGuide Jira Coverage Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  testguide:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}

      CONFIGURATION_FOLDER: 'SUBSYS1'

      ONECX_URL: 'https://testguide-ssp.onecx.vwgroup.com'
      ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

      # Preferred: stable filter name.
      ONECX_COVERAGE_FILTER_NAME: ${{ vars.ONECX_COVERAGE_FILTER_NAME }}

      # Optional fallback.
      ONECX_COVERAGE_FILTER_UUID: ${{ vars.ONECX_COVERAGE_FILTER_UUID }}

      # Default Test Coverage Report.
      ONECX_COVERAGE_TEMPLATE_ID: '20'

    steps:

      # ==========================================================
      # 1. VALIDATE INPUTS
      # ==========================================================

      - name: Validate request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredValues = @{
            JIRA_KEY = $env:JIRA_KEY
            BENCH_ID = $env:BENCH_ID
            BENCH_NAME = $env:BENCH_NAME
            TARGET_ECU = $env:TARGET_ECU
            TEST_CASES = $env:TEST_CASES
            PLAYBOOK_NAME = $env:PLAYBOOK_NAME
            ONECX_PROJECT_ID = $env:ONECX_PROJECT_ID
          }

          foreach ($item in $requiredValues.GetEnumerator()) {
            if (
              [System.String]::IsNullOrWhiteSpace(
                [System.String]$item.Value
              )
            ) {
              throw "Missing required value: $($item.Key)"
            }
          }

          $projectId = 0

          if (
            -not [System.Int32]::TryParse(
              $env:ONECX_PROJECT_ID,
              [ref]$projectId
            )
          ) {
            throw 'ONECX_PROJECT_ID must be an integer.'
          }

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:ONECX_COVERAGE_FILTER_NAME
            ) -and
            [System.String]::IsNullOrWhiteSpace(
              $env:ONECX_COVERAGE_FILTER_UUID
            )
          ) {
            throw (
              'Set ONECX_COVERAGE_FILTER_NAME or ' +
              'ONECX_COVERAGE_FILTER_UUID.'
            )
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JIRA EXECUTION REQUEST'
          Write-Host '========================================'
          Write-Host "Jira       : $env:JIRA_KEY"
          Write-Host "Bench      : $env:BENCH_ID"
          Write-Host "Bench Name : $env:BENCH_NAME"
          Write-Host "ECU        : $env:TARGET_ECU"
          Write-Host "Test Cases : $env:TEST_CASES"
          Write-Host "Playbook   : $env:PLAYBOOK_NAME"
          Write-Host "Project ID : $env:ONECX_PROJECT_ID"
          Write-Host '========================================'


      # ==========================================================
      # 2. RESOLVE RESOURCE AND PATHS
      # ==========================================================

      - name: Resolve ONE.CX resource and paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requestedBench = $env:BENCH_ID.Trim()
          $bench = $requestedBench.ToUpperInvariant()

          switch ($bench) {

            { $_ -in @('SYSHIL1', 'SYSHIL1-LABTEST1') } {
              $resourceName = 'syshil1-labtest1'
              $workspaceRoot = 'D:\HIL\Testing\eeint-Test-Automation'
              break
            }

            { $_ -in @('SYSHIL2', 'SYSHIL2-LABTEST2') } {
              $resourceName = 'syshil2-labtest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'MICROBENCH',
                'MICROBENCHINFO',
                'MICROBENCHINFO-MICROBENCHHIL1'
              )
            } {
              $resourceName = 'microbenchinfo-microbenchhil1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'CHARGING',
                'SUBSYSCHARGING1',
                'SUBSYSCHARGING1-LABTEST6'
              )
            } {
              $resourceName = 'subsyscharging1-labtest6'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'INFO1',
                'SUBSYSINFO1',
                'SUBSYSINFO1-INFOTEST1'
              )
            } {
              $resourceName = 'subsysinfo1-infotest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'INFO2',
                'SUBSYSINFO2',
                'SUBSYSINFO2-INFOTEST2'
              )
            } {
              $resourceName = 'subsysinfo2-infotest2'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            {
              $_ -in @(
                'THERMAL',
                'SUBSYSTHERMAL1',
                'SUBSYSTHERMAL1-THERMALTEST1'
              )
            } {
              $resourceName = 'subsysthermal1-thermaltest1'
              $workspaceRoot = 'C:\HIL\Testing\eeint-Test-Automation'
              break
            }

            default {
              throw "Unsupported bench/resource: $requestedBench"
            }
          }

          $xilIdentifier = (
            'novi_hq/1stfloor/ee_lab_novi/' +
            "$resourceName/ControlComputer"
          )

          $ecuTestStepName = "ecu.test $resourceName Start"

          $cfg = $env:CONFIGURATION_FOLDER.Trim()
          $benchPackage = $env:BENCH_NAME.Trim()
          $targetEcu = $env:TARGET_ECU.Trim()

          $tbcPath = (
            "Configurations\$cfg\" +
            "${cfg}_TestBenchConfig.tbc"
          )

          $tcfPath = (
            "Configurations\$cfg\" +
            "${cfg}_TestConfig.tcf"
          )

          $projectPath = (
            "Packages\$benchPackage\L2_Quality_Gate\" +
            "$targetEcu\" +
            "${targetEcu}_L2QualityGate.prj"
          )

          "TESTGUIDE_RESOURCE=$resourceName" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_ROOT=$workspaceRoot" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "XIL_IDENTIFIER=$xilIdentifier" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "ECUTEST_STEP_NAME=$ecuTestStepName" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TBC_RELATIVE_PATH=$tbcPath" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TCF_RELATIVE_PATH=$tcfPath" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "PROJECT_RELATIVE_PATH=$projectPath" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'RESOURCE RESOLUTION'
          Write-Host '========================================'
          Write-Host "Resource   : $resourceName"
          Write-Host "Workspace  : $workspaceRoot"
          Write-Host "Identifier : $xilIdentifier"
          Write-Host "TBC        : $tbcPath"
          Write-Host "TCF        : $tcfPath"
          Write-Host "PRJ        : $projectPath"
          Write-Host '========================================'


      # ==========================================================
      # 3. PARSE TEST CASES
      # ==========================================================

      - name: Parse Jira test cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ids = @(
            $env:TEST_CASES -split '[,;]' |
            ForEach-Object {
              $_.Trim()
            } |
            Where-Object {
              -not [System.String]::IsNullOrWhiteSpace($_)
            }
          )

          if ($ids.Count -eq 0) {
            throw 'No valid Jira test case IDs.'
          }

          "NORMALIZED_TEST_CASES=$($ids -join ',')" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 4. GENERATE PLAYBOOK
      # ==========================================================

      - name: Generate TestGuide playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $playbook = [ordered]@{

            metadata = [ordered]@{
              name = $env:PLAYBOOK_NAME
              taskNameTemplate = '${playbook_name} (${playbook_datetime}) ${distribution_count}'
              labels = @()
            }

            workspace = [ordered]@{
              source = [ordered]@{
                path = $env:TESTGUIDE_ROOT
                sourceType = 'location'
              }

              dependencies = @()
            }

            setup = [ordered]@{
              steps = @(

                [ordered]@{
                  reuse = 'always'
                  keepConfiguration = $false
                  waitMinutesForLicense = 0
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'ecuTestStart'
                },

                [ordered]@{
                  tbcPath = $env:TBC_RELATIVE_PATH
                  tcfPath = $env:TCF_RELATIVE_PATH
                  stepName = 'Test Configuration Selection'
                  type = 'configuration'
                }
              )
            }

            execution = [ordered]@{
              testcases = @(
                [ordered]@{
                  relativePath = $env:PROJECT_RELATIVE_PATH
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'project'
                }
              )
            }

            teardown = [ordered]@{
              steps = @(
                [ordered]@{
                  type = 'ecuTestStop'
                }
              )
            }

            xilConfigRequirements = @(
              [ordered]@{
                label = 'Identifier'
                category = 'XIL'
                value = $env:XIL_IDENTIFIER
                type = 'configuration'
              }
            )

            parameters = @()
          }

          $playbookFile = Join-Path `
            $env:RUNNER_TEMP `
            'testguide-playbook.json'

          $playbookJson = $playbook |
            ConvertTo-Json -Depth 30

          $playbookJson |
            Set-Content `
              -LiteralPath $playbookFile `
              -Encoding utf8

          "TESTGUIDE_PLAYBOOK_FILE=$playbookFile" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host $playbookJson


      # ==========================================================
      # 5. UPLOAD PLAYBOOK
      # ==========================================================

      - name: Upload TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [System.String]::IsNullOrWhiteSpace(
              $env:ONECX_AUTH_KEY
            )
          ) {
            throw 'ONECX_AUTH_KEY is missing.'
          }

          $folder = [System.Uri]::EscapeDataString('/')

          $uploadUrl = (
            "$env:ONECX_URL/api/v2/execution/playbook" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&folder=$folder"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $body = Get-Content `
            -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
            -Raw

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $uploadUrl `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $body `
            -ErrorAction Stop

          $playbookId = [System.Convert]::ToString(
            $response.playbookId
          )

          if (
            [System.String]::IsNullOrWhiteSpace(
              $playbookId
            )
          ) {
            throw 'Upload did not return playbookId.'
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_PLAYBOOK_LINK=$($response.playbookLink)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Playbook ID: $playbookId"


      # ==========================================================
      # 6. EXECUTE PLAYBOOK
      # ==========================================================

      - name: Execute TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $executeUrl = (
            "$env:ONECX_URL/api/v2/execution/playbook/" +
            "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&checkLastExecution=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $jiraUrl = (
            'https://scoutmotors.atlassian.net/browse/' +
            $env:JIRA_KEY
          )

          $executeRequest = [ordered]@{
            name = "$env:JIRA_KEY - $env:TARGET_ECU L2 Quality Gate"
            priority = 42
            parameters = @()

            additionalSettings = [ordered]@{
              analysisExecutionMode = 'sequential'
              downstreamAnalysisPartitioning = 'analysis'
              expirationTimeInMinutes = 60

              issueTrackerTickets = @(
                $jiraUrl
              )

              remainingRetriesOnError = 0
            }
          }

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $executeUrl `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body (
              $executeRequest |
              ConvertTo-Json -Depth 20
            ) `
            -ErrorAction Stop

          $taskIds = @($response.taskIds)

          if ($taskIds.Count -eq 0) {
            throw 'Execution did not return taskIds.'
          }

          $taskId = [System.Convert]::ToString(
            $taskIds[0]
          )

          if (
            [System.String]::IsNullOrWhiteSpace(
              $taskId
            )
          ) {
            throw 'Execution returned an empty taskId.'
          }

          "TESTGUIDE_TASK_ID=$taskId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Execution Task ID: $taskId"


      # ==========================================================
      # 7. POLL EXECUTION
      # ==========================================================

      - name: Poll TestGuide execution
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $taskUrl = (
            "$env:ONECX_URL/api/v2/execution/task/" +
            "$env:TESTGUIDE_TASK_ID" +
            "?projectId=$env:ONECX_PROJECT_ID"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $deadline = (Get-Date).AddMinutes(170)

          $successStates = @(
            'FINISHED',
            'COMPLETED',
            'SUCCESS',
            'SUCCEEDED'
          )

          $failureStates = @(
            'ERROR',
            'FAILED',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          $task = $null
          $attempt = 0
          $blockedSince = $null

          while ((Get-Date) -lt $deadline) {

            $attempt++

            $task = Invoke-RestMethod `
              -Method GET `
              -Uri $taskUrl `
              -Headers $headers `
              -ErrorAction Stop

            $state = (
              [System.Convert]::ToString(
                $task.state
              )
            ).Trim().ToUpperInvariant()

            $stateInfo = [System.Convert]::ToString(
              $task.stateInfo
            )

            $verdict = [System.Convert]::ToString(
              $task.aggregatedVerdict
            )

            Write-Host (
              "Attempt $attempt | " +
              "State=$state | " +
              "Verdict=$verdict | " +
              "StateInfo=$stateInfo"
            )

            if ($state -in $successStates) {
              break
            }

            if ($state -in $failureStates) {
              throw (
                "Execution failed. " +
                "State=$state. " +
                "StateInfo=$stateInfo"
              )
            }

            if ($state -eq 'BLOCKED') {

              if ($null -eq $blockedSince) {
                $blockedSince = Get-Date
              }

              if (
                (
                  (Get-Date) - $blockedSince
                ).TotalMinutes -ge 5
              ) {
                throw 'Execution remained BLOCKED for 5 minutes.'
              }

            }
            else {

              $blockedSince = $null
            }

            Start-Sleep -Seconds 10
          }

          if ($null -eq $task) {
            throw 'No execution task response was received.'
          }

          $finalState = (
            [System.Convert]::ToString(
              $task.state
            )
          ).Trim().ToUpperInvariant()

          if ($finalState -notin $successStates) {
            throw (
              "Execution polling timed out. " +
              "Last state: $finalState"
            )
          }

          "FINAL_TASK_STATE=$($task.state)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_STATE_INFO=$($task.stateInfo)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "FINAL_TASK_VERDICT=$($task.aggregatedVerdict)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_START_DATE=$($task.startDate)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TASK_END_DATE=$($task.endDate)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 8. WAIT FOR ATX IMPORT
      # ==========================================================

      - name: Wait for ATX import
        shell: pwsh
        run: |
          Write-Host 'Waiting 30 seconds for ATX import...'
          Start-Sleep -Seconds 30


      # ==========================================================
      # 9. RESOLVE CURRENT COVERAGE FILTER UUID
      #
      # If a filter name is configured:
      #
      # Name -> current filterDefinitionUUID dynamically
      #
      # If no name is configured, fallback to the GitHub UUID.
      # ==========================================================

      - name: Resolve coverage filter UUID
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $resolvedUuid = ''

          $filterName = (
            [System.Convert]::ToString(
              $env:ONECX_COVERAGE_FILTER_NAME
            )
          ).Trim()

          if (
            -not [System.String]::IsNullOrWhiteSpace(
              $filterName
            )
          ) {

            $filtersUrl = (
              "$env:ONECX_URL/api/coverage/" +
              "filterdefinitions/filter" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&type=COVERAGE" +
              "&offset=0" +
              "&limit=100"
            )

            $response = Invoke-RestMethod `
              -Method GET `
              -Uri $filtersUrl `
              -Headers $headers `
              -ErrorAction Stop

            $filters = @($response)

            $matches = @(
              $filters |
              Where-Object {

                $currentName = (
                  [System.Convert]::ToString(
                    $_.name
                  )
                ).Trim()

                $currentName -ieq $filterName
              }
            )

            if ($matches.Count -eq 0) {
              throw (
                'No coverage filter found with exact name: ' +
                $filterName
              )
            }

            if ($matches.Count -gt 1) {
              throw (
                'Multiple coverage filters found with name: ' +
                $filterName
              )
            }

            $resolvedUuid = (
              [System.Convert]::ToString(
                $matches[0].filterDefinitionUUID
              )
            ).Trim()

          }
          else {

            $resolvedUuid = (
              [System.Convert]::ToString(
                $env:ONECX_COVERAGE_FILTER_UUID
              )
            ).Trim()
          }

          $parsedUuid = [System.Guid]::Empty

          if (
            -not [System.Guid]::TryParse(
              $resolvedUuid,
              [ref]$parsedUuid
            )
          ) {
            throw (
              'Resolved coverage filter UUID is invalid: ' +
              $resolvedUuid
            )
          }

          "RESOLVED_COVERAGE_FILTER_UUID=$resolvedUuid" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Coverage Filter UUID: $resolvedUuid"


      # ==========================================================
      # 10. CREATE COVERAGE TASK
      #
      # POST /coverage creates a NEW UUID every run.
      # ==========================================================

      - name: Start ONE.CX coverage calculation
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $coverageUrl = (
            "$env:ONECX_URL/api/coverage"
          )

          $minTimestamp = (
            Get-Date
          ).ToUniversalTime().AddHours(-3).ToString(
            'yyyy-MM-ddTHH:mm:ss.fffZ'
          )

          $maxTimestamp = (
            Get-Date
          ).ToUniversalTime().AddMinutes(10).ToString(
            'yyyy-MM-ddTHH:mm:ss.fffZ'
          )

          $coverageRequest = [ordered]@{
            projectId = [int]$env:ONECX_PROJECT_ID

            filterDefinitionUUID = (
              $env:RESOLVED_COVERAGE_FILTER_UUID
            )

            baseFilterParameters = [ordered]@{
              minExecutionTimestamp = $minTimestamp
              maxExecutionTimestamp = $maxTimestamp
              testPlanName = ''
              invalidRuns = 'NO_CONSTRAINT'
              testCaseTagSetId = 0
            }

            placeholderValues = @{}
            scopeFilter = @()
            testGuideInstances = @()
          }

          $coverageJson = $coverageRequest |
            ConvertTo-Json -Depth 30

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'CREATE COVERAGE TASK'
          Write-Host '========================================'
          Write-Host "Filter UUID : $env:RESOLVED_COVERAGE_FILTER_UUID"
          Write-Host "From        : $minTimestamp"
          Write-Host "To          : $maxTimestamp"
          Write-Host $coverageJson
          Write-Host '========================================'

          $coverageResponse = Invoke-RestMethod `
            -Method POST `
            -Uri $coverageUrl `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $coverageJson `
            -ErrorAction Stop

          $coverageTaskId = (
            [System.Convert]::ToString(
              $coverageResponse.taskId
            )
          ).Trim()

          if (
            [System.String]::IsNullOrWhiteSpace(
              $coverageTaskId
            )
          ) {
            throw 'Coverage API did not return taskId.'
          }

          "COVERAGE_TASK_ID=$coverageTaskId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host "NEW Coverage Task UUID: $coverageTaskId"


      # ==========================================================
      # 11. POLL COVERAGE TASK
      # ==========================================================

      - name: Poll ONE.CX coverage calculation
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $coverageTaskId = [System.Uri]::EscapeDataString(
            $env:COVERAGE_TASK_ID
          )

          $statusUrl = (
            "$env:ONECX_URL/api/coverage/" +
            "$coverageTaskId/status"
          )

          $deadline = (Get-Date).AddMinutes(30)

          $done = $false
          $attempt = 0

          while ((Get-Date) -lt $deadline) {

            $attempt++

            $status = Invoke-RestMethod `
              -Method GET `
              -Uri $statusUrl `
              -Headers $headers `
              -ErrorAction Stop

            $done = [System.Boolean]$status.done

            Write-Host (
              "Attempt $attempt | " +
              "Coverage=$($status.name) | " +
              "Done=$done"
            )

            if ($done) {
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $done) {
            throw 'Coverage calculation timed out.'
          }

          "COVERAGE_STATE=COMPLETED" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 12. CREATE REPORT TASK
      #
      # POST /reporting/export creates ANOTHER NEW UUID every run.
      # ==========================================================

      - name: Start Coverage PDF generation
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $safeJiraKey = (
            $env:JIRA_KEY -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $safeEcu = (
            $env:TARGET_ECU -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $reportBaseName = (
            "${safeJiraKey}_${safeEcu}_TestCoverage"
          )

          $encodedFileName = [System.Uri]::EscapeDataString(
            $reportBaseName
          )

          $exportUrl = (
            "$env:ONECX_URL/api/reporting/export" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&templateId=$env:ONECX_COVERAGE_TEMPLATE_ID" +
            "&fileName=$encodedFileName" +
            "&locale=ENGLISH" +
            "&keepDataSource=false" +
            "&requestTicketStatus=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $reportRequest = [ordered]@{
            parameters = @(
              [ordered]@{
                name = 'includeReviews'
                value = $true
              }
            )

            dType = 'COVERAGE_FILTER'

            taskId = $env:COVERAGE_TASK_ID
          }

          $reportJson = $reportRequest |
            ConvertTo-Json -Depth 20

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'CREATE REPORT TASK'
          Write-Host '========================================'
          Write-Host "Coverage Task UUID : $env:COVERAGE_TASK_ID"
          Write-Host "Template           : $env:ONECX_COVERAGE_TEMPLATE_ID"
          Write-Host "Report             : $reportBaseName"
          Write-Host $reportJson
          Write-Host '========================================'

          $reportResponse = Invoke-RestMethod `
            -Method POST `
            -Uri $exportUrl `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $reportJson `
            -ErrorAction Stop

          $reportTaskId = (
            [System.Convert]::ToString(
              $reportResponse.taskId
            )
          ).Trim()

          if (
            [System.String]::IsNullOrWhiteSpace(
              $reportTaskId
            )
          ) {
            throw 'Reporting API did not return taskId.'
          }

          $reportFile = Join-Path `
            $env:RUNNER_TEMP `
            "$reportBaseName.pdf"

          "TESTGUIDE_REPORT_TASK_ID=$reportTaskId" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_BASE_NAME=$reportBaseName" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "TESTGUIDE_REPORT_FILE=$reportFile" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host "NEW Report Task UUID: $reportTaskId"


      # ==========================================================
      # 13. POLL REPORT TASK
      # ==========================================================

      - name: Poll Coverage PDF generation
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/json'
          }

          $reportTaskId = [System.Uri]::EscapeDataString(
            $env:TESTGUIDE_REPORT_TASK_ID
          )

          $statusUrl = (
            "$env:ONECX_URL/api/reporting/export/" +
            "$reportTaskId/status"
          )

          $deadline = (Get-Date).AddMinutes(30)

          $ready = $false

          $successStates = @(
            'FINISHED',
            'COMPLETED',
            'COMPLETE',
            'SUCCESS',
            'SUCCEEDED',
            'READY',
            'DONE'
          )

          $failureStates = @(
            'FAILED',
            'FAILURE',
            'ERROR',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          while ((Get-Date) -lt $deadline) {

            $status = Invoke-RestMethod `
              -Method GET `
              -Uri $statusUrl `
              -Headers $headers `
              -ErrorAction Stop

            $state = ''

            if (
              $null -ne $status.done -and
              [System.Boolean]$status.done
            ) {
              $ready = $true
              break
            }

            if ($null -ne $status.state) {
              $state = (
                [System.Convert]::ToString(
                  $status.state
                )
              ).Trim().ToUpperInvariant()
            }
            elseif ($null -ne $status.status) {
              $state = (
                [System.Convert]::ToString(
                  $status.status
                )
              ).Trim().ToUpperInvariant()
            }
            elseif ($status -is [System.String]) {
              $state = (
                [System.String]$status
              ).Trim().Trim('"').ToUpperInvariant()
            }

            Write-Host "Report State=$state"

            if ($state -in $successStates) {
              $ready = $true
              break
            }

            if ($state -in $failureStates) {
              throw "Report generation failed: $state"
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ready) {
            throw 'Report generation timed out.'
          }

          "TESTGUIDE_REPORT_STATE=COMPLETED" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append


      # ==========================================================
      # 14. DOWNLOAD REPORT
      # ==========================================================

      - name: Download Coverage PDF
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $reportTaskId = [System.Uri]::EscapeDataString(
            $env:TESTGUIDE_REPORT_TASK_ID
          )

          $downloadUrl = (
            "$env:ONECX_URL/api/reporting/export/" +
            "$reportTaskId/download"
          )

          $headers = @{
            'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
            'Accept' = 'application/pdf'
          }

          Invoke-WebRequest `
            -Method GET `
            -Uri $downloadUrl `
            -Headers $headers `
            -OutFile $env:TESTGUIDE_REPORT_FILE `
            -ErrorAction Stop

          if (
            -not (
              Test-Path -LiteralPath $env:TESTGUIDE_REPORT_FILE
            )
          ) {
            throw 'Coverage PDF was not created.'
          }

          $reportInfo = Get-Item `
            -LiteralPath $env:TESTGUIDE_REPORT_FILE

          if ($reportInfo.Length -lt 5) {
            throw 'Coverage PDF is empty.'
          }

          $bytes = [System.IO.File]::ReadAllBytes(
            $reportInfo.FullName
          )

          $signature = [System.Text.Encoding]::ASCII.GetString(
            $bytes,
            0,
            5
          )

          if ($signature -ne '%PDF-') {
            throw 'Downloaded file is not a valid PDF.'
          }

          "TESTGUIDE_REPORT_SIZE=$($reportInfo.Length)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'COVERAGE PDF DOWNLOADED'
          Write-Host '========================================'
          Write-Host "File : $($reportInfo.FullName)"
          Write-Host "Size : $($reportInfo.Length) bytes"
          Write-Host '========================================'


      # ==========================================================
      # 15. PUT REPORT IN GITHUB ACTIONS
      # ==========================================================

      - name: Upload Coverage PDF to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TESTGUIDE_REPORT_BASE_NAME }}
          path: ${{ env.TESTGUIDE_REPORT_FILE }}
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 16. SUMMARY
      # ==========================================================

      - name: Publish execution summary
        if: always()
        shell: pwsh
        run: |
          $summary = @(
            '## TestGuide Coverage Execution',
            '',
            '| Field | Value |',
            '|---|---|',
            "| Jira | $env:JIRA_KEY |",
            "| Bench | $env:BENCH_ID |",
            "| Resource | $env:TESTGUIDE_RESOURCE |",
            "| ECU | $env:TARGET_ECU |",
            "| Playbook ID | $env:TESTGUIDE_PLAYBOOK_ID |",
            "| Execution Task | $env:TESTGUIDE_TASK_ID |",
            "| Verdict | $env:FINAL_TASK_VERDICT |",
            "| Coverage Filter Name | $env:ONECX_COVERAGE_FILTER_NAME |",
            "| Resolved Filter UUID | $env:RESOLVED_COVERAGE_FILTER_UUID |",
            "| Coverage Task UUID | $env:COVERAGE_TASK_ID |",
            "| Coverage State | $env:COVERAGE_STATE |",
            "| Report Task UUID | $env:TESTGUIDE_REPORT_TASK_ID |",
            "| Report State | $env:TESTGUIDE_REPORT_STATE |",
            "| Report File | $env:TESTGUIDE_REPORT_FILE |",
            "| Report Size | $env:TESTGUIDE_REPORT_SIZE bytes |",
            "| Workflow Status | ${{ job.status }} |"
          )

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
