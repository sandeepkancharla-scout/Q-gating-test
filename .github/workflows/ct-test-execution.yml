name: CT TestGuide Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  testguide-execution:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: ct-testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      # ==========================================================
      # INPUTS FROM JIRA
      # ==========================================================

      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK: ${{ github.event.client_payload.playbook_name }}

      # ==========================================================
      # STATIC PATH CONFIGURATION
      # ==========================================================

      LOCAL_ROOT: 'C:\HIL\Testing\eeint-Test-Automation'
      TESTGUIDE_ROOT: 'D:\HIL\Testing\eeint-Test-Automation'

    steps:

      # ==========================================================
      # 1. VALIDATE JIRA PAYLOAD
      # ==========================================================

      - name: Validate Jira execution request
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "CT TESTGUIDE EXECUTION"
          Write-Host "============================================"
          Write-Host "Jira Key    : $env:JIRA_KEY"
          Write-Host "Bench ID    : $env:BENCH_ID"
          Write-Host "Bench Name  : $env:BENCH_NAME"
          Write-Host "Target ECU  : $env:TARGET_ECU"
          Write-Host "Test Cases  : $env:TEST_CASES"
          Write-Host "Playbook    : $env:PLAYBOOK"
          Write-Host "============================================"

          $required = @{
              JIRA_KEY   = $env:JIRA_KEY
              BENCH_ID   = $env:BENCH_ID
              BENCH_NAME = $env:BENCH_NAME
              TARGET_ECU = $env:TARGET_ECU
              TEST_CASES = $env:TEST_CASES
              PLAYBOOK   = $env:PLAYBOOK
          }

          foreach ($item in $required.GetEnumerator()) {

              if ([string]::IsNullOrWhiteSpace(
                  [string]$item.Value
              )) {

                  throw "Required Jira input '$($item.Key)' is missing."

              }
          }

          Write-Host ""
          Write-Host "Jira payload validation successful."


      # ==========================================================
      # 2. VALIDATE RUNNER
      # ==========================================================

      - name: Validate self-hosted runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "SELF-HOSTED RUNNER"
          Write-Host "============================================"

          Write-Host "Machine:"
          hostname

          Write-Host ""

          Write-Host "PowerShell:"
          Write-Host $PSVersionTable.PSVersion

          Write-Host ""

          Write-Host "Git:"
          git --version

          if ($LASTEXITCODE -ne 0) {
              throw "Git is not available on the self-hosted runner."
          }

          Write-Host ""

          Write-Host "Local repository:"
          Write-Host "$env:LOCAL_ROOT"

          Write-Host ""

          Write-Host "TestGuide root:"
          Write-Host "$env:TESTGUIDE_ROOT"


      # ==========================================================
      # 3. CLONE / UPDATE AUTOMATION REPOSITORY
      # ==========================================================

      - name: Checkout complete automation repository
        shell: pwsh
        env:
          AUTOMATION_REPO_URL: ${{ secrets.AUTOMATION_REPO_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          $repoPath = $env:LOCAL_ROOT
          $repoUrl  = $env:AUTOMATION_REPO_URL
          $branch   = "main"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PREPARE AUTOMATION REPOSITORY"
          Write-Host "============================================"
          Write-Host "Repository:"
          Write-Host "$repoPath"
          Write-Host ""

          # ------------------------------------------------------
          # CLONE IF MISSING
          # ------------------------------------------------------

          if (-not (Test-Path "$repoPath\.git")) {

              Write-Host "Repository is not currently cloned."

              if ([string]::IsNullOrWhiteSpace($repoUrl)) {

                  throw @"
          AUTOMATION_REPO_URL secret is missing.

          Configure the clone URL under:

          Repository
          -> Settings
          -> Secrets and variables
          -> Actions
          -> AUTOMATION_REPO_URL
          "@
              }

              $parent = Split-Path $repoPath -Parent

              if (-not (Test-Path $parent)) {

                  Write-Host ""
                  Write-Host "Creating:"
                  Write-Host "$parent"

                  New-Item `
                      -ItemType Directory `
                      -Path $parent `
                      -Force |
                  Out-Null
              }

              # Do not overwrite an existing non-Git directory.

              if (Test-Path $repoPath) {

                  $existingItems = @(
                      Get-ChildItem `
                          -Path $repoPath `
                          -Force `
                          -ErrorAction SilentlyContinue
                  )

                  if ($existingItems.Count -gt 0) {

                      Write-Host ""
                      Write-Host "Existing contents:"

                      foreach ($existingItem in $existingItems) {
                          Write-Host "  $($existingItem.FullName)"
                      }

                      throw @"
          Target directory exists but is not a Git repository.

          $repoPath

          Existing files will NOT be deleted automatically.
          "@
                  }
              }

              Write-Host ""
              Write-Host "Cloning repository including submodules..."

              git clone `
                  --branch $branch `
                  --recurse-submodules `
                  $repoUrl `
                  $repoPath

              if ($LASTEXITCODE -ne 0) {

                  throw "Repository clone failed."

              }
          }

          # ------------------------------------------------------
          # UPDATE IF ALREADY PRESENT
          # ------------------------------------------------------

          else {

              Write-Host "Existing repository found."

              Write-Host ""
              Write-Host "Fetching origin/$branch..."

              git -C $repoPath fetch `
                  --prune `
                  origin `
                  $branch

              if ($LASTEXITCODE -ne 0) {
                  throw "git fetch failed."
              }

              Write-Host ""
              Write-Host "Checking out $branch..."

              git -C $repoPath checkout $branch

              if ($LASTEXITCODE -ne 0) {
                  throw "git checkout $branch failed."
              }

              Write-Host ""
              Write-Host "Resetting to latest origin/$branch..."

              git -C $repoPath reset `
                  --hard `
                  "origin/$branch"

              if ($LASTEXITCODE -ne 0) {
                  throw "git reset failed."
              }
          }

          # ------------------------------------------------------
          # SUBMODULES
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "============================================"
          Write-Host "SUBMODULE SYNCHRONIZATION"
          Write-Host "============================================"

          git -C $repoPath submodule sync --recursive

          if ($LASTEXITCODE -ne 0) {
              throw "git submodule sync failed."
          }

          Write-Host ""
          Write-Host "Initializing/updating submodules..."

          git -C $repoPath submodule update `
              --init `
              --recursive `
              --force

          if ($LASTEXITCODE -ne 0) {
              throw "git submodule update failed."
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "CURRENT COMMIT"
          Write-Host "============================================"

          git -C $repoPath log `
              -1 `
              --pretty=format:"%H %cd %s" `
              --date=iso

          Write-Host ""
          Write-Host ""

          Write-Host "============================================"
          Write-Host "SUBMODULE STATUS"
          Write-Host "============================================"

          git -C $repoPath submodule status --recursive


      # ==========================================================
      # 4. VERIFY PRJ FILES EXIST
      # ==========================================================

      - name: Verify project files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:LOCAL_ROOT

          if (-not (Test-Path $root)) {
              throw "Repository does not exist: $root"
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PROJECT FILE DISCOVERY"
          Write-Host "============================================"

          $projects = @(
              Get-ChildItem `
                  -Path $root `
                  -Filter "*.prj" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue
          )

          Write-Host "PRJ files found: $($projects.Count)"
          Write-Host ""

          foreach ($project in $projects) {

              Write-Host "  $($project.FullName)"

          }

          if ($projects.Count -eq 0) {

              throw @"
          Repository and submodules were populated successfully,
          but no .prj files were found under:

          $root
          "@
          }


      # ==========================================================
      # 5. NORMALIZE JIRA TEST CASES
      # ==========================================================

      - name: Parse Jira Test Cases
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $testCases = @(
              $env:TEST_CASES -split '[,;]' |
              ForEach-Object {

                  $_.Trim()

              } |
              Where-Object {

                  -not [string]::IsNullOrWhiteSpace($_)

              }
          )

          if ($testCases.Count -eq 0) {

              throw "No valid Test Case IDs were received from Jira."

          }

          $normalizedTestCases = $testCases -join ","

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TEST CASES"
          Write-Host "============================================"

          foreach ($testCase in $testCases) {

              Write-Host "TC: $testCase"

          }

          Write-Host "============================================"

          "NORMALIZED_TEST_CASES=$normalizedTestCases" >>
              $env:GITHUB_ENV


      # ==========================================================
      # 6. FIND PRJ USING BENCH_NAME
      # ==========================================================

      - name: Resolve PRJ from Bench Name
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root      = $env:LOCAL_ROOT
          $benchName = $env:BENCH_NAME

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PROJECT RESOLUTION"
          Write-Host "============================================"

          Write-Host "Repository:"
          Write-Host "$root"

          Write-Host ""

          Write-Host "Bench Name:"
          Write-Host "$benchName"

          Write-Host ""

          $projects = @(
              Get-ChildItem `
                  -Path $root `
                  -Filter "*.prj" `
                  -File `
                  -Recurse `
                  -ErrorAction Stop
          )

          if ($projects.Count -eq 0) {

              throw "No .prj files were found under $root"

          }

          # ------------------------------------------------------
          # Find projects whose path contains bench_name.
          # Comparison is case insensitive.
          # ------------------------------------------------------

          $matches = @(
              $projects |
              Where-Object {

                  $_.FullName.IndexOf(
                      $benchName,
                      [System.StringComparison]::OrdinalIgnoreCase
                  ) -ge 0

              }
          )

          if ($matches.Count -eq 0) {

              Write-Host ""
              Write-Host "Available PRJ files:"

              foreach ($project in $projects) {

                  Write-Host "  $($project.FullName)"

              }

              throw @"
          No PRJ matched Jira bench_name:

          $benchName
          "@
          }

          if ($matches.Count -gt 1) {

              Write-Host ""
              Write-Host "Multiple projects matched:"

              foreach ($match in $matches) {

                  Write-Host "  $($match.FullName)"

              }

              throw @"
          Multiple PRJ files matched bench '$benchName'.

          Refusing to choose a project automatically.
          "@
          }

          $selectedProject = $matches[0]

          Write-Host ""
          Write-Host "============================================"
          Write-Host "LOCAL PRJ FOUND"
          Write-Host "============================================"

          Write-Host "$($selectedProject.FullName)"

          Write-Host "============================================"

          "LOCAL_PROJECT_PATH=$($selectedProject.FullName)" >>
              $env:GITHUB_ENV


      # ==========================================================
      # 7. MAP LOCAL C: PATH TO TESTGUIDE D: PATH
      # ==========================================================

      - name: Create TestGuide PRJ Path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $localRoot =
              [System.IO.Path]::GetFullPath($env:LOCAL_ROOT)

          $testGuideRoot =
              [System.IO.Path]::GetFullPath($env:TESTGUIDE_ROOT)

          $localProject =
              [System.IO.Path]::GetFullPath($env:LOCAL_PROJECT_PATH)

          if (-not (Test-Path $localProject)) {

              throw "Resolved local PRJ does not exist: $localProject"

          }

          # ------------------------------------------------------
          # Get path relative to C:\ repository root.
          # ---------------------------

          $relativePath =
              [System.IO.Path]::GetRelativePath(
                  $localRoot,
                  $localProject
              )

          # Safety check.

          if (
              $relativePath.StartsWith("..") -or
              [System.IO.Path]::IsPathRooted($relativePath)
          ) {

              throw "Resolved PRJ is outside LOCAL_ROOT."

          }

          # ------------------------------------------------------
          # Recreate identical hierarchy below D:\ root.
          # ------------------------------------------------------

          $testGuideProjectPath =
              Join-Path `
                  $testGuideRoot `
                  $relativePath

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PROJECT PATH MAPPING"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "LOCAL:"
          Write-Host "$localProject"

          Write-Host ""
          Write-Host "RELATIVE:"
          Write-Host "$relativePath"

          Write-Host ""
          Write-Host "TESTGUIDE:"
          Write-Host "$testGuideProjectPath"

          Write-Host ""
          Write-Host "============================================"

          "PROJECT_RELATIVE_PATH=$relativePath" >>
              $env:GITHUB_ENV

          "TESTGUIDE_PROJECT_PATH=$testGuideProjectPath" >>
              $env:GITHUB_ENV


      # ==========================================================
      # 8. BUILD TESTGUIDE TASK REQUEST
      #
      # IMPORTANT:
      # This body is a placeholder until the actual TestGuide
      # task API schema is confirmed.
      # ==========================================================

      - name: Prepare TestGuide Task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $testCaseIds = @(
              $env:NORMALIZED_TEST_CASES -split "," |
              ForEach-Object {

                  $_.Trim()

              } |
              Where-Object {

                  -not :IsNullOrWhiteSpace($_)

              }
          )

          $taskRequest = @{
              externalId = $env:JIRA_KEY

              bench = @{
                  id   = $env:BENCH_ID
                  name = $env:BENCH_NAME
              }

              playbookName = $env:PLAYBOOK

              projectPath =
                  $env:TESTGUIDE_PROJECT_PATH

              targetEcu =
                  $env:TARGET_ECU

              testCaseIds =
                  $testCaseIds
          }

          $taskJson =
              $taskRequest |
              ConvertTo-Json -Depth 20

          $taskFile =
              Join-Path `
                  $env:RUNNER_TEMP `
                  "testguide-task-request.json"

          $taskJson |
              Set-Content `
                  -Path $taskFile `
                  -Encoding UTF8

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TESTGUIDE TASK"
          Write-Host "============================================"

          Write-Host $taskJson

          Write-Host "============================================"

          "TESTGUIDE_TASK_FILE=$taskFile" >>
              $env:GITHUB_ENV


      # ==========================================================
      # 9. FINAL EXECUTION CONTEXT
      # ==========================================================

      - name: Show final TestGuide execution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TESTGUIDE EXECUTION READY"
          Write-Host "============================================"

          Write-Host "Jira:"
          Write-Host "  $env:JIRA_KEY"

          Write-Host ""

          Write-Host "Bench:"
          Write-Host "  $env:BENCH_ID"

          Write-Host ""

          Write-Host "Bench Name:"
          Write-Host "  $env:BENCH_NAME"

          Write-Host ""

          Write-Host "Playbook:"
          Write-Host "  $env:PLAYBOOK"

          Write-Host ""

          Write-Host "Target ECU:"
          Write-Host "  $env:TARGET_ECU"

          Write-Host ""

          Write-Host "Test Cases:"
          Write-Host "  $env:NORMALIZED_TEST_CASES"

          Write-Host ""

          Write-Host "Local PRJ:"
          Write-Host "  $env:LOCAL_PROJECT_PATH"

          Write-Host ""

          Write-Host "TestGuide PRJ:"
          Write-Host "  $env:TESTGUIDE_PROJECT_PATH"

          Write-Host ""

          Write-Host "Task file:"
          Write-Host "  $env:TESTGUIDE_TASK_FILE"

          Write-Host ""
          Write-Host "============================================"


      # ==========================================================
      # 10. TESTGUIDE TASK / PLAYBOOK EXECUTION PLACEHOLDER
      #
      # Replace this step after confirming:
      #
      #   1. TestGuide task POST endpoint
      #   2. Request body schema
      #   3. Authentication
      #   4. Task ID response field
      #
      # Nothing above this step needs to change.
      # ==========================================================

      - name: TestGuide Task Execution Placeholder
        shell: pwsh
        env:
          TESTGUIDE_TASK_URL: ${{ secrets.TESTGUIDE_TASK_URL }}
          TESTGUIDE_API_TOKEN: ${{ secrets.TESTGUIDE_API_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TESTGUIDE TASK EXECUTION PLACEHOLDER"
          Write-Host "============================================"

          Write-Host "Playbook:"
          Write-Host "$env:PLAYBOOK"

          Write-Host ""

          Write-Host "Project:"
          Write-Host "$env:TESTGUIDE_PROJECT_PATH"

          Write-Host ""

          Write-Host "ECU:"
          Write-Host "$env:TARGET_ECU"

          Write-Host ""

          Write-Host "Test Cases:"
          Write-Host "$env:NORMALIZED_TEST_CASES"

          Write-Host ""

          if (:IsNullOrWhiteSpace(
              $env:TESTGUIDE_TASK_URL
          )) {

              Write-Warning @"
          TESTGUIDE_TASK_URL has not been configured yet.

          All preparation phases completed successfully.

          The actual TestGuide POST request will be added here once
          the verified task/playbook endpoint is available.
          "@

              exit 0
          }

          if (:IsNullOrWhiteSpace(
              $env:TESTGUIDE_API_TOKEN
          )) {

              throw "TESTGUIDE_API_TOKEN secret is missing."

          }

          if (-not (Test-Path $env:TESTGUIDE_TASK_FILE)) {

              throw "TestGuide task JSON file does not exist."

          }

          # ------------------------------------------------------
          # PREPARED AUTHENTICATION
          #
          # Enable only if the TestGuide API confirms Bearer auth.
          # ------------------------------------------------------

          $headers = @{
              Authorization =
                  "Bearer $env:TESTGUIDE_API_TOKEN"

              Accept =
                  "application/json"
          }

          $requestBody =
              Get-Content `
                  -Path $env:TESTGUIDE_TASK_FILE `
                  -Raw

          Write-Host ""
          Write-Host "Task JSON prepared and ready."

          # ======================================================
          # DO NOT ENABLE UNTIL ENDPOINT + BODY ARE VERIFIED
          # ======================================================
          #
          # $response = Invoke-RestMethod `
          #     -Method POST `
          #     -Uri $env:TESTGUIDE_TASK_URL `
          #     -Headers $headers `
          #     -ContentType "application/json" `
          #     -Body $requestBody
          #
          # if ($null -eq $response) {
          #
          #     throw "TestGuide returned an empty response."
          #
          # }
          #
          # Write-Host ""
          # Write-Host "TestGuide response:"
          #
          # $response |
          #     ConvertTo-Json -Depth 20 |
          #     Write-Host
          #
          # $taskId = $response.taskId
          #
          # if (:IsNullOrWhiteSpace(
          #     [string]$taskId
          # )) {
          #
          #     throw "TestGuide response did not contain taskId."
          #
          # }
          #
          # Write-Host ""
          # Write-Host "Task created:"
          # Write-Host "$taskId"
          #
          # "TESTGUIDE_TASK_ID=$taskId" >>
          #     $env:GITHUB_ENV

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PREPARATION COMPLETE"
          Write-Host "============================================"
