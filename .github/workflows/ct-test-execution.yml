name: CT TestGuide Jira Execution

on:
  repository_dispatch:
    types:
      - ct_test_execution

jobs:
  testguide:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: testguide-${{ github.event.client_payload.bench_id }}
      cancel-in-progress: false

    env:
      JIRA_KEY: ${{ github.event.client_payload.jira_key }}
      BENCH_ID: ${{ github.event.client_payload.bench_id }}
      BENCH_NAME: ${{ github.event.client_payload.bench_name }}
      TARGET_ECU: ${{ github.event.client_payload.target_ecu }}
      TEST_CASES: ${{ github.event.client_payload.test_cases }}
      PLAYBOOK_NAME: ${{ github.event.client_payload.playbook_name }}

      CONFIGURATION_FOLDER: 'SUBSYS1'

      ONECX_URL: 'https://testguide-ssp.onecx.vwgroup.com'
      ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

      ONECX_REPORT_TEMPLATE_ID: '19'
      ONECX_REPORT_TEMPLATE_TYPE: 'TEST_SUMMARY_REPORT'

    steps:

      # ==========================================================
      # 1. VALIDATE INPUTS
      # ==========================================================

      - name: Validate request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @{
            JIRA_KEY = $env:JIRA_KEY
            BENCH_ID = $env:BENCH_ID
            BENCH_NAME = $env:BENCH_NAME
            TARGET_ECU = $env:TARGET_ECU
            TEST_CASES = $env:TEST_CASES
            PLAYBOOK_NAME = $env:PLAYBOOK_NAME
            ONECX_PROJECT_ID = $env:ONECX_PROJECT_ID
          }

          foreach ($item in $required.GetEnumerator()) {

            if (
              [string]::IsNullOrWhiteSpace(
                [string]$item.Value
              )
            ) {
              throw "Missing required value: $($item.Key)"
            }
          }

          [int]$projectId = 0

          if (
            -not [int]::TryParse(
              $env:ONECX_PROJECT_ID,
              [ref]$projectId
            )
          ) {
            throw 'ONECX_PROJECT_ID must be an integer.'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JIRA EXECUTION REQUEST'
          Write-Host '========================================'
          Write-Host "Jira       : $env:JIRA_KEY"
          Write-Host "Bench      : $env:BENCH_ID"
          Write-Host "Bench Name : $env:BENCH_NAME"
          Write-Host "ECU        : $env:TARGET_ECU"
          Write-Host "Test Cases : $env:TEST_CASES"
          Write-Host "Playbook   : $env:PLAYBOOK_NAME"
          Write-Host "Project ID : $env:ONECX_PROJECT_ID"
          Write-Host '========================================'


      # ==========================================================
      # 2. RESOLVE ONE.CX RESOURCE
      #
      # IMPORTANT:
      # XIL identifier now ends with:
      #
      # /ControlComputer
      #
      # NOT:
      #
      # /TestLabPC1
      #
      # SysHIL1 = D:
      # all other configured resources = C:
      # ==========================================================

      - name: Resolve ONE.CX resource and paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bench = $env:BENCH_ID.Trim().ToUpperInvariant()

          switch ($bench) {

            { $_ -in @(
                'SYSHIL1',
                'SYSHIL1-LABTEST1'
              )
            } {

              $resource = 'syshil1-labtest1'

              $root = (
                'D:\HIL\Testing\eeint-Test-Automation'
              )

              break
            }

            { $_ -in @(
                'SYSHIL2',
                'SYSHIL2-LABTEST2'
              )
            } {

              $resource = 'syshil2-labtest2'

              $root = (
                'C:\HIL\Testing\eeint-Test-Automation'
              )

              break
            }

            { $_ -in @(
                'MICROBENCH',
                'MICROBENCHINFO',
                'MICROBENCHINFO-MICROBENCHHIL1'
              )
            } {

              $resource = (
                'microbenchinfo-microbenchhil1'
              )

              $root = (
                'C:\HIL\Testing\eeint-Test-Automation'
              )

              break
            }

            { $_ -in @(
                'CHARGING',
                'SUBSYSCHARGING1',
                'SUBSYSCHARGING1-LABTEST6'
              )
            } {

              $resource = (
                'subsyscharging1-labtest6'
              )

              $root = (
                'C:\HIL\Testing\eeint-Test-Automation'
              )

              break
            }

            { $_ -in @(
                'INFO1',
                'SUBSYSINFO1',
                'SUBSYSINFO1-INFOTEST1'
              )
            } {

              $resource = (
                'subsysinfo1-infotest1'
              )

              $root = (
                'C:\HIL\Testing\eeint-Test-Automation'
              )

              break
            }

            { $_ -in @(
                'INFO2',
                'SUBSYSINFO2',
                'SUBSYSINFO2-INFOTEST2'
              )
            } {

              $resource = (
                'subsysinfo2-infotest2'
              )

              $root = (
                'C:\HIL\Testing\eeint-Test-Automation'
              )

              break
            }

            { $_ -in @(
                'THERMAL',
                'SUBSYSTHERMAL1',
                'SUBSYSTHERMAL1-THERMALTEST1'
              )
            } {

              $resource = (
                'subsysthermal1-thermaltest1'
              )

              $root = (
                'C:\HIL\Testing\eeint-Test-Automation'
              )

              break
            }

            default {

              throw (
                "Unsupported bench/resource: " +
                "$env:BENCH_ID"
              )
            }
          }

          # ------------------------------------------------------
          # Exact ONE.CX identifier format
          # ------------------------------------------------------

          $identifier = (
            'novi_hq/1stfloor/ee_lab_novi/' +
            "$resource/ControlComputer"
          )

          $stepName = "ecu.test $resource Start"

          $cfg = $env:CONFIGURATION_FOLDER.Trim()

          $benchPackage = $env:BENCH_NAME.Trim()

          $ecu = $env:TARGET_ECU.Trim()

          # ------------------------------------------------------
          # Common relative paths
          # ------------------------------------------------------

          $tbcPath = (
            "Configurations\$cfg\" +
            "${cfg}_TestBenchConfig.tbc"
          )

          $tcfPath = (
            "Configurations\$cfg\" +
            "${cfg}_TestConfig.tcf"
          )

          $projectPath = (
            "Packages\$benchPackage\" +
            "${ecu}_L2QualityGate.prj"
          )

          "TESTGUIDE_RESOURCE=$resource" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "TESTGUIDE_ROOT=$root" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "XIL_IDENTIFIER=$identifier" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "ECUTEST_STEP_NAME=$stepName" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "TBC_RELATIVE_PATH=$tbcPath" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "TCF_RELATIVE_PATH=$tcfPath" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PROJECT_RELATIVE_PATH=$projectPath" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'ONE.CX RESOURCE RESOLUTION'
          Write-Host '========================================'
          Write-Host "Requested   : $env:BENCH_ID"
          Write-Host "Resource    : $resource"
          Write-Host "Workspace   : $root"
          Write-Host "Identifier  : $identifier"
          Write-Host "ecu.test    : $stepName"
          Write-Host "TBC         : $tbcPath"
          Write-Host "TCF         : $tcfPath"
          Write-Host "PRJ         : $projectPath"
          Write-Host '========================================'


      # ==========================================================
      # 3. PARSE TEST CASES
      # ==========================================================

      - name: Parse Jira test cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ids = @(

            $env:TEST_CASES -split '[,;]' |

            ForEach-Object {
              $_.Trim()
            } |

            Where-Object {
              -not [string]::IsNullOrWhiteSpace($_)
            }
          )

          if ($ids.Count -eq 0) {
            throw 'No valid Jira test case IDs.'
          }

          $normalized = $ids -join ','

          "NORMALIZED_TEST_CASES=$normalized" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Test Cases: $normalized"


      # ==========================================================
      # 4. GENERATE PLAYBOOK
      # ==========================================================

      - name: Generate and validate playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $playbook = [ordered]@{

            metadata = [ordered]@{

              name = $env:PLAYBOOK_NAME

              taskNameTemplate = (
                '${playbook_name} ' +
                '(${playbook_datetime}) ' +
                '${distribution_count}'
              )

              labels = @()
            }

            workspace = [ordered]@{

              source = [ordered]@{
                path = $env:TESTGUIDE_ROOT
                sourceType = 'location'
              }

              dependencies = @()
            }

            setup = [ordered]@{

              steps = @(

                [ordered]@{
                  reuse = 'always'
                  keepConfiguration = $false
                  waitMinutesForLicense = 0
                  stepName = $env:ECUTEST_STEP_NAME
                  type = 'ecuTestStart'
                },

                [ordered]@{
                  tbcPath = $env:TBC_RELATIVE_PATH
                  tcfPath = $env:TCF_RELATIVE_PATH
                  stepName = 'Test Configuration Selection'
                  type = 'configuration'
                }
              )
            }

            execution = [ordered]@{

              testcases = @(

                [ordered]@{
                  relativePath = (
                    $env:PROJECT_RELATIVE_PATH
                  )

                  stepName = $env:ECUTEST_STEP_NAME

                  type = 'project'
                }
              )
            }

            teardown = [ordered]@{

              steps = @(

                [ordered]@{
                  type = 'ecuTestStop'
                }
              )
            }

            xilConfigRequirements = @(

              [ordered]@{
                label = 'Identifier'
                category = 'XIL'
                value = $env:XIL_IDENTIFIER
                type = 'configuration'
              }
            )

            parameters = @()
          }

          $file = Join-Path `
            $env:RUNNER_TEMP `
            'testguide-playbook.json'

          $playbook |
            ConvertTo-Json -Depth 30 |
            Set-Content `
              -LiteralPath $file `
              -Encoding utf8

          $check = Get-Content `
            -LiteralPath $file `
            -Raw |
            ConvertFrom-Json

          $actualIdentifier = (
            [string]
            $check.xilConfigRequirements[0].value
          )

          if (
            $actualIdentifier -ne
            $env:XIL_IDENTIFIER
          ) {
            throw (
              'XIL identifier validation failed.'
            )
          }

          "TESTGUIDE_PLAYBOOK_FILE=$file" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'GENERATED PLAYBOOK'
          Write-Host '========================================'

          Get-Content `
            -LiteralPath $file `
            -Raw |
            Write-Host

          Write-Host '========================================'


      # ==========================================================
      # 5. UPLOAD PLAYBOOK
      # ==========================================================

      - name: Upload playbook
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [string]::IsNullOrWhiteSpace(
              $env:ONECX_AUTH_KEY
            )
          ) {
            throw 'ONECX_AUTH_KEY is missing.'
          }

          $folder = (
            [uri]::EscapeDataString('/')
          )

          $uri = (
            "$env:ONECX_URL/api/v2/execution/playbook" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&folder=$folder"
          )

          $headers = @{
            'TestGuide-AuthKey' = (
              $env:ONECX_AUTH_KEY
            )

            Accept = 'application/json'
          }

          $body = Get-Content `
            -LiteralPath $env:TESTGUIDE_PLAYBOOK_FILE `
            -Raw

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'UPLOAD PLAYBOOK'
          Write-Host '========================================'
          Write-Host "URL        : $uri"
          Write-Host "Project    : $env:ONECX_PROJECT_ID"
          Write-Host "Resource   : $env:TESTGUIDE_RESOURCE"
          Write-Host "Identifier : $env:XIL_IDENTIFIER"
          Write-Host '========================================'

          try {

            $response = Invoke-RestMethod `
              -Method POST `
              -Uri $uri `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $body `
              -ErrorAction Stop

          }
          catch {

            Write-Host 'PLAYBOOK UPLOAD FAILED'
            Write-Host $_.Exception.Message

            if ($null -ne $_.ErrorDetails) {
              Write-Host $_.ErrorDetails.Message
            }

            throw
          }

          $id = [string]$response.playbookId

          if (
            [string]::IsNullOrWhiteSpace($id)
          ) {
            throw (
              'Upload did not return playbookId.'
            )
          }

          "TESTGUIDE_PLAYBOOK_ID=$id" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "TESTGUIDE_PLAYBOOK_LINK=$($response.playbookLink)" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Playbook ID: $id"


      # ==========================================================
      # 6. EXECUTE PLAYBOOK
      # ==========================================================

      - name: Execute playbook
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $uri = (
            "$env:ONECX_URL/api/v2/execution/" +
            "playbook/$env:TESTGUIDE_PLAYBOOK_ID/execute" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&checkLastExecution=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = (
              $env:ONECX_AUTH_KEY
            )

            Accept = 'application/json'
          }

          $jiraUrl = (
            'https://scoutmotors.atlassian.net/browse/' +
            $env:JIRA_KEY
          )

          $request = [ordered]@{

            name = (
              "$env:JIRA_KEY - " +
              "$env:TARGET_ECU L2 Quality Gate"
            )

            priority = 42

            parameters = @()

            additionalSettings = [ordered]@{

              analysisExecutionMode = 'sequential'

              downstreamAnalysisPartitioning = (
                'analysis'
              )

              expirationTimeInMinutes = 60

              issueTrackerTickets = @(
                $jiraUrl
              )

              remainingRetriesOnError = 0
            }
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'EXECUTE PLAYBOOK'
          Write-Host '========================================'
          Write-Host "Resource   : $env:TESTGUIDE_RESOURCE"
          Write-Host "Identifier : $env:XIL_IDENTIFIER"
          Write-Host '========================================'

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $uri `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body (
              $request |
              ConvertTo-Json -Depth 20
            ) `
            -ErrorAction Stop

          $taskIds = @(
            $response.taskIds
          )

          if ($taskIds.Count -eq 0) {
            throw (
              'Execution did not return taskIds.'
            )
          }

          $taskId = [string]$taskIds[0]

          if (
            [string]::IsNullOrWhiteSpace(
              $taskId
            )
          ) {
            throw (
              'Execution returned empty taskId.'
            )
          }

          "TESTGUIDE_TASK_ID=$taskId" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Execution Task ID: $taskId"


      # ==========================================================
      # 7. POLL EXECUTION
      #
      # BLOCKED gets 5 minutes.
      # We no longer wait 170 minutes on an unmatched resource.
      # ==========================================================

      - name: Poll execution task
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $uri = (
            "$env:ONECX_URL/api/v2/execution/task/" +
            "$env:TESTGUIDE_TASK_ID" +
            "?projectId=$env:ONECX_PROJECT_ID"
          )

          $headers = @{
            'TestGuide-AuthKey' = (
              $env:ONECX_AUTH_KEY
            )

            Accept = 'application/json'
          }

          $deadline = (
            Get-Date
          ).AddMinutes(170)

          $success = @(
            'FINISHED',
            'COMPLETED',
            'SUCCESS',
            'SUCCEEDED'
          )

          $failure = @(
            'ERROR',
            'FAILED',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          $blockedSince = $null
          $attempt = 0
          $task = $null

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'POLL EXECUTION TASK'
          Write-Host '========================================'
          Write-Host "Task ID    : $env:TESTGUIDE_TASK_ID"
          Write-Host "Resource   : $env:TESTGUIDE_RESOURCE"
          Write-Host "Identifier : $env:XIL_IDENTIFIER"
          Write-Host '========================================'

          while (
            (Get-Date) -lt $deadline
          ) {

            $attempt++

            $task = Invoke-RestMethod `
              -Method GET `
              -Uri $uri `
              -Headers $headers `
              -ErrorAction Stop

            $state = (
              [string]$task.state
            ).Trim().ToUpperInvariant()

            Write-Host (
              "Attempt $attempt | " +
              "State=$state | " +
              "Verdict=$($task.aggregatedVerdict) | " +
              "StateInfo=$($task.stateInfo)"
            )

            if ($state -in $success) {
              break
            }

            if ($state -in $failure) {

              throw (
                "Execution failed. " +
                "State=$state " +
                "StateInfo=$($task.stateInfo)"
              )
            }

            if ($state -eq 'BLOCKED') {

              if ($null -eq $blockedSince) {

                $blockedSince = Get-Date

                Write-Warning (
                  'Execution is BLOCKED. ' +
                  'Waiting up to 5 minutes for ' +
                  'matching test resource.'
                )
              }

              $blockedMinutes = (
                (
                  Get-Date
                ) - $blockedSince
              ).TotalMinutes

              if ($blockedMinutes -ge 5) {

                throw (
                  'Execution remained BLOCKED for ' +
                  '5 minutes. Check ONE.CX resource ' +
                  "Identifier: $env:XIL_IDENTIFIER"
                )
              }
            }
            else {

              $blockedSince = $null
            }

            Start-Sleep -Seconds 10
          }

          if ($null -eq $task) {
            throw 'No task response received.'
          }

          $final = (
            [string]$task.state
          ).Trim().ToUpperInvariant()

          if ($final -notin $success) {

            throw (
              "Execution timed out. " +
              "Last state: $final"
            )
          }

          "FINAL_TASK_STATE=$($task.state)" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "FINAL_TASK_STATE_INFO=$($task.stateInfo)" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "FINAL_TASK_VERDICT=$($task.aggregatedVerdict)" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "TASK_START_DATE=$($task.startDate)" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "TASK_END_DATE=$($task.endDate)" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 8. START PDF REPORT
      # ==========================================================

      - name: Start PDF report generation
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          [long]$executionTaskId      $env:TESTGUIDE_TASK_ID,
              [ref]$executionTaskId
            )
          ) {
            throw (
              'Execution task ID must be numeric.'
            )
          }

          $safeJira = (
            $env:JIRA_KEY -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $safeEcu = (
            $env:TARGET_ECU -replace
            '[^a-zA-Z0-9._-]',
            '_'
          )

          $baseName = (
            "${safeJira}_${safeEcu}_TestSummary"
          )

          $fileName = (
            :EscapeDataString($baseName)
          )

          $uri = (
            "$env:ONECX_URL/api/reporting/export" +
            "?projectId=$env:ONECX_PROJECT_ID" +
            "&templateId=$env:ONECX_REPORT_TEMPLATE_ID" +
            "&fileName=$fileName" +
            "&locale=ENGLISH" +
            "&keepDataSource=false" +
            "&requestTicketStatus=false"
          )

          $headers = @{
            'TestGuide-AuthKey' = (
              $env:ONECX_AUTH_KEY
            )

            Accept = 'application/json'
          }

          $bodyObject = [ordered]@{
            parameters = @()
            type = $env:ONECX_REPORT_TEMPLATE_TYPE
            taskId = $executionTaskId
          }

          $body = (
            $bodyObject |
            ConvertTo-Json -Depth 10
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'GENERATE TEST SUMMARY REPORT'
          Write-Host '========================================'
          Write-Host "Execution Task : $executionTaskId"
          Write-Host "Template       : $env:ONECX_REPORT_TEMPLATE_ID"
          Write-Host "Report         : $baseName"
          Write-Host '========================================'

          $response = Invoke-RestMethod `
            -Method POST `
            -Uri $uri `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $body `
            -ErrorAction Stop

          $reportTaskId = $null

          if ($response -is [string]) {

            $reportTaskId = [string]$response
          }
          elseif ($response.taskId) {

            $reportTaskId = (
              [string]$response.taskId
            )
          }
          elseif ($response.id) {

            $reportTaskId = (
              [string]$response.id
            )
          }
          elseif ($response.exportTaskId) {

            $reportTaskId = (
              [string]$response.exportTaskId
            )
          }
          elseif ($response.reportTaskId) {

            $reportTaskId = (
              [string]$response.reportTaskId
            )
          }
          else {

            throw (
              'Reporting API did not return ' +
              'a report task ID.'
            )
          }

          $reportTaskId = (
            $reportTaskId.Trim().Trim('"')
          )

          $reportFile = Join-Path `
            $env:RUNNER_TEMP `
            "$baseName.pdf"

          "TESTGUIDE_REPORT_TASK_ID=$reportTaskId" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "TESTGUIDE_REPORT_BASE_NAME=$baseName" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "TESTGUIDE_REPORT_FILE=$reportFile" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Report Task ID: $reportTaskId"


      # ==========================================================
      # 9. POLL REPORT
      # ==========================================================

      - name: Poll report generation
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $id = (
            :EscapeDataString(
              $env:TESTGUIDE_REPORT_TASK_ID
            )
          )

          $uri = (
            "$env:ONECX_URL/api/reporting/export/" +
            "$id/status"
          )

          $headers = @{
            'TestGuide-AuthKey' = (
              $env:ONECX_AUTH_KEY
            )

            Accept = 'application/json'
          }

          $deadline = (
            Get-Date
          ).AddMinutes(30)

          $success = @(
            'FINISHED',
            'COMPLETED',
            'COMPLETE',
            'SUCCESS',
            'SUCCEEDED',
            'READY',
            'DONE'
          )

          $failure = @(
            'FAILED',
            'FAILURE',
            'ERROR',
            'ABORTED',
            'CANCELLED',
            'CANCELED'
          )

          $state = ''

          while (
            (Get-Date) -lt $deadline
          ) {

            $r = Invoke-RestMethod `
              -Method GET `
              -Uri $uri `
              -Headers $headers `
              -ErrorAction Stop

            $raw = ''

            if ($r -is [string]) {

              $raw = [string]$r
            }
            elseif ($r.state) {

              $raw = [string]$r.state
            }
            elseif ($r.status) {

              $raw = [string]$r.status
            }
            elseif ($r.statusKey) {

              $raw = [string]$r.statusKey
            }
            elseif ($r.key) {

              $raw = [string]$r.key
            }
            elseif ($null -ne $r.finished) {

              if ([bool]$r.finished) {
                $raw = 'FINISHED'
              }
              else {
                $raw = 'RUNNING'
              }
            }

            $state = (
              $raw.Trim().Trim('"').ToUpperInvariant()
            )

            Write-Host "Report State=$state"

            if ($state -in $success) {
              break
            }

            if ($state -in $failure) {

              throw (
                "Report generation failed: $state"
              )
            }

            Start-Sleep -Seconds 5
          }

          if ($state -notin $success) {

            throw (
              "Report generation timed out. " +
              "Last state: $state"
            )
          }

          "TESTGUIDE_REPORT_STATE=$state" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 10. DOWNLOAD PDF
      # ==========================================================

      - name: Download PDF report
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $id = (
            :EscapeDataString(
              $env:TESTGUIDE_REPORT_TASK_ID
            )
          )

          $uri = (
            "$env:ONECX_URL/api/reporting/export/" +
            "$id/download"
          )

          $headers = @{
            'TestGuide-AuthKey' = (
              $env:ONECX_AUTH_KEY
            )

            Accept = 'application/pdf'
          }

          Invoke-WebRequest `
            -Method GET `
            -Uri $uri `
            -Headers $headers `
            -OutFile $env:TESTGUIDE_REPORT_FILE `
            -ErrorAction Stop

          $info = Get-Item `
            -LiteralPath $env:TESTGUIDE_REPORT_FILE

          if ($info.Length -lt 5) {
            throw 'Downloaded report is empty.'
          }

          $bytes = (
            [IO.File]::ReadAllBytes(
              $info.FullName
            )
          )

          $signature = (
            [Text.Encoding]::ASCII.GetString(
              $bytes,
              0,
              5
            )
          )

          if ($signature -ne '%PDF-') {

            throw (
              'Downloaded report is not a valid PDF.'
            )
          }

          "TESTGUIDE_REPORT_SIZE=$($info.Length)" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'REPORT DOWNLOADED'
          Write-Host '========================================'
          Write-Host "File : $($info.FullName)"
          Write-Host "Size : $($info.Length) bytes"
          Write-Host '========================================'


      # ==========================================================
      # 11. STORE REPORT IN GITHUB ACTIONS
      # ==========================================================

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4

        with:
          name: ${{ env.TESTGUIDE_REPORT_BASE_NAME }}
          path: ${{ env.TESTGUIDE_REPORT_FILE }}
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 12. SUMMARY
      # ==========================================================

      - name: Publish summary
        if: always()

        shell: pwsh

        run: |
          $summary = @(

            '## TestGuide Jira Execution',
            '',
            '| Field | Value |',
            '|---|---|',

            "| Jira | $env:JIRA_KEY |",

            "| Requested Bench | $env:BENCH_ID |",

            "| Selected Resource | " +
              "$env:TESTGUIDE_RESOURCE |",

            "| XIL Identifier | " +
              "$env:XIL_IDENTIFIER |",

            "| Workspace | " +
              "$env:TESTGUIDE_ROOT |",

            "| TBC | " +
              "$env:TBC_RELATIVE_PATH |",

            "| TCF | " +
              "$env:TCF_RELATIVE_PATH |",

            "| PRJ | " +
              "$env:PROJECT_RELATIVE_PATH |",

            "| Playbook ID | " +
              "$env:TESTGUIDE_PLAYBOOK_ID |",

            "| Playbook Link | " +
              "$env:TESTGUIDE_PLAYBOOK_LINK |",

            "| Execution Task | " +
              "$env:TESTGUIDE_TASK_ID |",

            "| Execution State | " +
              "$env:FINAL_TASK_STATE |",

            "| Verdict | " +
              "$env:FINAL_TASK_VERDICT |",

            "| Report Task | " +
              "$env:TESTGUIDE_REPORT_TASK_ID |",

            "| Report State | " +
              "$env:TESTGUIDE_REPORT_STATE |",

            "| Report File | " +
              "$env:TESTGUIDE_REPORT_FILE |",

            "| Workflow Status | " +
              "${{ job.status }} |"
          )

          $summary |
            Out-File `
              $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
