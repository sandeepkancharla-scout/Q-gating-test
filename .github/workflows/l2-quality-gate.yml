name: L2 Quality Gate - Jira Execution

on:
  repository_dispatch:
    types:
      - l2_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}
  TESTGUIDE_WORKSPACE: C:\HIL\Testing\eeint-Test-Automation
  JFROG_URL: https://artifactory.sctmtrs.xyz/artifactory
  JFROG_REPOSITORY: eeint-report-files
  JIRA_BASE_URL: https://scoutmotors.atlassian.net

jobs:
  l2-quality-gate:
    name: L2 Quality Gate
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: l2-quality-gate-${{ github.event.client_payload.test_bench }}
      cancel-in-progress: false

    steps:

      # ============================================================
      # 1. PARSE JIRA INPUTS
      # ============================================================

      - name: Parse Jira inputs
        shell: pwsh
        env:
          JIRA_KEY_RAW: ${{ github.event.client_payload.jira_key }}
          CATEGORY_RAW: ${{ github.event.client_payload.category }}
          CW_RELEASE_RAW: ${{ github.event.client_payload.cw_release }}
          TEST_BENCH_RAW: ${{ github.event.client_payload.test_bench }}
          TARGET_ECU_RAW: ${{ github.event.client_payload.target_ecu }}
          FLASH_ARCHIVE_RAW: ${{ github.event.client_payload.flash_archive_location }}
          RAL_FILE_RAW: ${{ github.event.client_payload.ral_file_location }}
          GIT_SUBMODULE_RAW: ${{ github.event.client_payload.git_submodule }}
          TEST_CASES_RAW: ${{ github.event.client_payload.test_cases }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Clean-Value {
              param($Value)

              if ($null -eq $Value) {
                  return ''
              }

              return (
                  "$Value" -replace '[\r\n]+', ' '
              ).Trim()
          }

          function Clean-Path {
              param($Value)

              if ($null -eq $Value) {
                  return ''
              }

              $result = (
                  "$Value" -replace '[\r\n]+', ''
              ).Trim()

              while (
                  $result.Length -ge 2 -and
                  $result.StartsWith('"') -and
                  $result.EndsWith('"')
              ) {
                  $result =
                      $result.Substring(
                          1,
                          $result.Length - 2
                      ).Trim()
              }

              return $result
          }

          $jiraKey =
              Clean-Value $env:JIRA_KEY_RAW

          $categoryInput =
              Clean-Value $env:CATEGORY_RAW

          $cwRelease =
              (
                  Clean-Value $env:CW_RELEASE_RAW
              ).ToUpperInvariant()

          $testBench =
              (
                  Clean-Value $env:TEST_BENCH_RAW
              ).ToLowerInvariant()

          $targetEcu =
              Clean-Value $env:TARGET_ECU_RAW

          $flashArchive =
              Clean-Path $env:FLASH_ARCHIVE_RAW

          $ralFile =
              Clean-Path $env:RAL_FILE_RAW

          $gitSubmodule =
              Clean-Value $env:GIT_SUBMODULE_RAW

          $testCases =
              Clean-Value $env:TEST_CASES_RAW

          if (-not $jiraKey) {
              throw 'jira_key is missing.'
          }

          if (-not $categoryInput) {
              throw 'category is missing.'
          }

          if (-not $cwRelease) {
              throw 'cw_release is missing.'
          }

          if (-not $testBench) {
              throw 'test_bench is missing.'
          }

          if (-not $targetEcu) {
              throw 'target_ecu is missing.'
          }

          if ($cwRelease -notmatch '^CW[0-9]{2}$') {
              throw "Invalid CW release: [$cwRelease]"
          }

          if (
              $testBench -notin @(
                  'syshil1',
                  'syshil2'
              )
          ) {
              throw "Unsupported Test Bench: [$testBench]"
          }

          switch ($categoryInput.ToLowerInvariant()) {

              'network_test' {
                  $categoryInput =
                      'Network_Test'
              }

              'network_testing' {
                  $categoryInput =
                      'Network_Test'
              }

              'diagnostic_test' {
                  $categoryInput =
                      'Diagnostic_Test'
              }

              'diagnostic_testing' {
                  $categoryInput =
                      'Diagnostic_Test'
              }

              'bootloader_compliance_test' {
                  $categoryInput =
                      'Bootloader_Compliance_Test'
              }

              default {
                  throw (
                      "Unsupported Jira category: " +
                      "[$categoryInput]"
                  )
              }
          }

          if (
              $categoryInput -eq
                  'Diagnostic_Test' -and
              -not $ralFile
          ) {
              throw (
                  'Diagnostic_Test requires ' +
                  'RAL File Location.'
              )
          }

          if (
              $categoryInput -eq
                  'Bootloader_Compliance_Test' -and
              -not $flashArchive
          ) {
              throw (
                  'Bootloader_Compliance_Test requires ' +
                  'Flash Archive Location.'
              )
          }

          $values = [ordered]@{
              JIRA_KEY =
                  $jiraKey

              CATEGORY_INPUT =
                  $categoryInput

              CW_RELEASE =
                  $cwRelease

              TEST_BENCH =
                  $testBench

              TARGET_ECU =
                  $targetEcu

              FLASH_ARCHIVE_LOCATION =
                  $flashArchive

              RAL_FILE_LOCATION =
                  $ralFile

              GIT_SUBMODULE =
                  $gitSubmodule

              TEST_CASES =
                  $testCases
          }

          foreach ($item in $values.GetEnumerator()) {

              "$($item.Key)=$($item.Value)" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PARSED JIRA INPUTS'
          Write-Host '========================================'
          Write-Host "Jira Key      : [$jiraKey]"
          Write-Host "Category      : [$categoryInput]"
          Write-Host "CW Release    : [$cwRelease]"
          Write-Host "Test Bench    : [$testBench]"
          Write-Host "Target ECU    : [$targetEcu]"
          Write-Host "Flash Archive : [$flashArchive]"
          Write-Host "RAL File      : [$ralFile]"
          Write-Host "Git Submodule : [$gitSubmodule]"
          Write-Host "Test Cases    : [$testCases]"
          Write-Host '========================================'

      # ============================================================
      # 2. USE EXISTING HIL WORKSPACE
      # ============================================================

      - name: Route category and validate existing workspace
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          switch ($env:CATEGORY_INPUT) {

              'Network_Test' {

                  $category =
                      'network-testing'

                  $testPlanName =
                      'NetworkTest'

                  $playbookName =
                      'L2-network-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Network-Test\NetworkTest.prj'
              }

              'Diagnostic_Test' {

                  $category =
                      'diagnostic-testing'

                  $testPlanName =
                      'DiagnosticTest'

                  $playbookName =
                      'L2-Diagnostic-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Diagnostic-Test\DiagnosticTest.prj'
              }

              'Bootloader_Compliance_Test' {

                  $category =
                      'bootloader-compliance'

                  $testPlanName =
                      'BootloaderComplianceTest'

                  $playbookName =
                      'L2-Bootloader-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Bootloader-Compliance-Test\BootloaderComplianceTest.prj'
              }

              default {

                  throw (
                      "Unsupported category: " +
                      "[$env:CATEGORY_INPUT]"
                  )
              }
          }

          switch ($env:TEST_BENCH) {

              'syshil1' {
                  $resource =
                      'syshil1-labtest1'

                  $configurationFolder =
                      'SUBSYS1'
              }

              'syshil2' {
                  $resource =
                      'syshil2-labtest2'

                  $configurationFolder =
                      'SUBSYS1'
              }

              default {
                  throw (
                      "Unsupported bench: " +
                      "[$env:TEST_BENCH]"
                  )
              }
          }

          $workspace =
              $env:TESTGUIDE_WORKSPACE

          $workspaceExists =
              Test-Path `
                  -LiteralPath $workspace `
                  -PathType Container

          if (-not $workspaceExists) {

              throw (
                  "Workspace does not exist: " +
                  "[$workspace]"
              )
          }

          $fullProjectPath =
              Join-Path `
                  -Path $workspace `
                  -ChildPath $projectRelativePath

          $projectExists =
              Test-Path `
                  -LiteralPath $fullProjectPath `
                  -PathType Leaf

          if (-not $projectExists) {

              throw (
                  "Project does not exist: " +
                  "[$fullProjectPath]"
              )
          }

          $tbcRelativePath = (
              "Configurations\" +
              "$configurationFolder\" +
              "${configurationFolder}_TestBenchConfig.tbc"
          )

          $tcfRelativePath = (
              "Configurations\" +
              "$configurationFolder\" +
              "${configurationFolder}_TestConfig.tcf"
          )

          $fullTbcPath =
              Join-Path `
                  -Path $workspace `
                  -ChildPath $tbcRelativePath

          $fullTcfPath =
              Join-Path `
                  -Path $workspace `
                  -ChildPath $tcfRelativePath

          $tbcExists =
              Test-Path `
                  -LiteralPath $fullTbcPath `
                  -PathType Leaf

          $tcfExists =
              Test-Path `
                  -LiteralPath $fullTcfPath `
                  -PathType Leaf

          if (-not $tbcExists) {
              throw "TBC missing: [$fullTbcPath]"
          }

          if (-not $tcfExists) {
              throw "TCF missing: [$fullTcfPath]"
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {

              $ralExists =
                  Test-Path `
                      -LiteralPath $env:RAL_FILE_LOCATION `
                      -PathType Leaf

              if (-not $ralExists) {

                  throw (
                      "RAL file does not exist: " +
                      "[$env:RAL_FILE_LOCATION]"
                  )
              }
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {

              $flashExists =
                  Test-Path `
                      -LiteralPath $env:FLASH_ARCHIVE_LOCATION `
                      -PathType Leaf

              if (-not $flashExists) {

                  throw (
                      "Bootloader file does not exist: " +
                      "[$env:FLASH_ARCHIVE_LOCATION]"
                  )
              }
          }

          $artifactRoot =
              Join-Path `
                  -Path $env:RUNNER_TEMP `
                  -ChildPath 'l2-artifacts'

          $atxDirectory =
              Join-Path `
                  -Path $artifactRoot `
                  -ChildPath 'atx'

          New-Item `
              -ItemType Directory `
              -Path $atxDirectory `
              -Force |
              Out-Null

          $runTimestamp =
              Get-Date `
                  -Format 'yyyy-MM-dd_HHmmss'

          $values = [ordered]@{

              CATEGORY =
                  $category

              TEST_PLAN_NAME =
                  $testPlanName

              PLAYBOOK_NAME =
                  $playbookName

              PROJECT_RELATIVE_PATH =
                  $projectRelativePath

              RESOURCE_NAME =
                  $resource

              TBC_RELATIVE_PATH =
                  $tbcRelativePath

              TCF_RELATIVE_PATH =
                  $tcfRelativePath

              XIL_IDENTIFIER =
                  "novi_hq/1stfloor/ee_lab_novi/$resource/ControlComputer"

              ARTIFACT_ROOT =
                  $artifactRoot

              ATX_DIRECTORY =
                  $atxDirectory

              RUN_TIMESTAMP =
                  $runTimestamp
          }

          foreach ($item in $values.GetEnumerator()) {

              "$($item.Key)=$($item.Value)" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'SELECTED EXECUTION'
          Write-Host '========================================'
          Write-Host "Workspace : [$workspace]"
          Write-Host "Category  : [$category]"
          Write-Host "Test Plan : [$testPlanName]"
          Write-Host "Playbook  : [$playbookName]"
          Write-Host "Project   : [$projectRelativePath]"
          Write-Host "Resource  : [$resource]"
          Write-Host '========================================'

      # ============================================================
      # 3. GENERATE TESTGUIDE PLAYBOOK
      # ============================================================

      - name: Generate selected TestGuide playbook
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToEcuTestPathExpression {

              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path
              )

              $clean =
                  $Path.Trim().Trim('"')

              return (
                  '"' +
                  $clean.Replace('\', '\\') +
                  '"'
              )
          }

          $ecuExpression =
              "'" +
              $env:TARGET_ECU +
              "'"

          $constants = @(

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  value =
                      $ecuExpression
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  value =
                      'True'
              }
          )

          $parameters = @(

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  defaultValue =
                      $ecuExpression

                  required =
                      $false
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  defaultValue =
                      'True'

                  required =
                      $false
              }
          )

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {

              $value =
                  Convert-ToEcuTestPathExpression `
                      -Path $env:RAL_FILE_LOCATION

              $constants += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_RAL_FILE_PATH'

                  value =
                      $value
              }

              $parameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_RAL_FILE_PATH'

                  defaultValue =
                      $value

                  required =
                      $false
              }
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {

              $value =
                  Convert-ToEcuTestPathExpression `
                      -Path $env:FLASH_ARCHIVE_LOCATION

              $constants += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                  value =
                      $value
              }

              $parameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                  defaultValue =
                      $value

                  required =
                      $false
              }
          }

          $playbook = [ordered]@{

              metadata = [ordered]@{

                  name = (
                      "$env:PLAYBOOK_NAME-" +
                      "$env:JIRA_KEY-" +
                      "$env:RUN_TIMESTAMP"
                  )

                  taskNameTemplate =
                      '${playbook_name} (${playbook_datetime}) ${distribution_count}'

                  labels =
                      @()
              }

              workspace = [ordered]@{

                  source = [ordered]@{

                      path =
                          $env:TESTGUIDE_WORKSPACE

                      sourceType =
                          'location'
                  }

                  dependencies =
                      @()
              }

              setup = [ordered]@{

                  steps = @(

                      [ordered]@{

                          reuse =
                              'always'

                          keepConfiguration =
                              $false

                          waitMinutesForLicense =
                              0

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'ecuTestStart'
                      },

                      [ordered]@{

                          tbcPath =
                              $env:TBC_RELATIVE_PATH

                          tcfPath =
                              $env:TCF_RELATIVE_PATH

                          stepName =
                              'Test Configuration Selection'

                          type =
                              'configuration'
                      }
                  )
              }

              execution = [ordered]@{

                  testcases = @(

                      [ordered]@{

                          relativePath =
                              $env:PROJECT_RELATIVE_PATH

                          constants =
                              $constants

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'project'
                      }
                  )
              }

              teardown = [ordered]@{

                  steps = @(
                      [ordered]@{
                          type =
                              'ecuTestStop'
                      }
                  )
              }

              xilConfigRequirements = @(

                  [ordered]@{

                      label =
                          'Identifier'

                      category =
                          'XIL'

                      value =
                          $env:XIL_IDENTIFIER

                      type =
                          'configuration'
                  }
              )

              parameters =
                  $parameters
          }

          $playbookFile =
              Join-Path `
                  -Path $env:ARTIFACT_ROOT `
                  -ChildPath 'playbook.json'

          $playbook |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath $playbookFile `
                  -Encoding utf8

          "PLAYBOOK_FILE=$playbookFile" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

      # ============================================================
      # 4. CREATE TESTGUIDE PLAYBOOK
      # ============================================================

      - name: Create TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ONECX_AUTH_KEY) {
              throw 'ONECX_AUTH_KEY is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $url = (
              "$env:ONECX_URL/api/v2/execution/playbook" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&folder=%2F"
          )

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $url `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body (
                      Get-Content `
                          -LiteralPath $env:PLAYBOOK_FILE `
                          -Raw
                  ) `
                  -ErrorAction Stop

          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          -Path $env:ARTIFACT_ROOT `
                          -ChildPath 'create-response.json'
                  ) `
                  -Encoding utf8

          $playbookId =
              $null

          if ($response.playbookId) {

              $playbookId =
                  $response.playbookId
          }
          elseif ($response.id) {

              $playbookId =
                  $response.id
          }
          elseif (
              $response.data -and
              $response.data.id
          ) {

              $playbookId =
                  $response.data.id
          }

          if (-not $playbookId) {

              throw (
                  'Create API returned no playbook ID.'
              )
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Playbook ID=[$playbookId]"

      # ============================================================
      # 5. EXECUTE PLAYBOOK
      # ============================================================

      - name: Execute selected TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToEcuTestPathExpression {

              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path
              )

              $clean =
                  $Path.Trim().Trim('"')

              return (
                  '"' +
                  $clean.Replace('\', '\\') +
                  '"'
              )
          }

          $executionParameters = @(

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  value =
                      "'$($env:TARGET_ECU)'"
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  value =
                      'True'
              }
          )

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {

              $executionParameters +=
                  [ordered]@{

                      label =
                          'PROJECT_GENERATOR_RAL_FILE_PATH'

                      value = (
                          Convert-ToEcuTestPathExpression `
                              -Path $env:RAL_FILE_LOCATION
                      )
                  }
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {

              $executionParameters +=
                  [ordered]@{

                      label =
                          'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                      value = (
                          Convert-ToEcuTestPathExpression `
                              -Path $env:FLASH_ARCHIVE_LOCATION
                      )
                  }
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $url = (
              "$env:ONECX_URL/api/v2/execution/playbook/" +
              "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&checkLastExecution=true"
          )

          $body = @{
              parameters =
                  $executionParameters
          } |
              ConvertTo-Json -Depth 20

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $url `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $body `
                  -ErrorAction Stop

          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          -Path $env:ARTIFACT_ROOT `
                          -ChildPath 'execute-response.json'
                  ) `
                  -Encoding utf8

          $taskId =
              $null

          if ($response.taskIds) {

              $taskId =
                  @($response.taskIds)[0]
          }
          elseif ($response.taskId) {

              $taskId =
                  $response.taskId
          }
          elseif ($response.id) {

              $taskId =
                  $response.id
          }
          elseif (
              $response.data -and
              $response.data.taskIds
          ) {

              $taskId =
                  @($response.data.taskIds)[0]
          }
          elseif (
              $response.data -and
              $response.data.taskId
          ) {

              $taskId =
                  $response.data.taskId
          }

          if (-not $taskId) {
              throw (
                  'Execute API returned no execution task ID.'
              )
          }

          "TESTGUIDE_TASK_ID=$taskId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Execution Task ID=[$taskId]"

      # ============================================================
      # 6. POLL EXECUTION TASK
      # ============================================================

      - name: Wait for TestGuide execution task
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $url = (
              "$env:ONECX_URL/api/v2/execution/task/" +
              "$env:TESTGUIDE_TASK_ID" +
              "?projectId=$env:ONECX_PROJECT_ID"
          )

          $finishedStates = @(
              'FINISHED',
              'COMPLETED',
              'COMPLETE',
              'SUCCESS',
              'SUCCEEDED',
              'DONE',
              'ENDED'
          )

          $failedStates = @(
              'ABORTED',
              'ABORT',
              'ERROR',
              'FAILED',
              'FAILURE',
              'CANCELLED',
              'CANCELED'
          )

          $deadline =
              (Get-Date).AddMinutes(180)

          $attempt =
              0

          while ((Get-Date) -lt $deadline) {

              $attempt++

              $task =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $url `
                      -Headers $headers `
                      -ErrorAction Stop

              $state =
                  "$($task.state)".
                      Trim().
                      ToUpperInvariant()

              $verdict =
                  "$($task.aggregatedVerdict)".
                      Trim().
                      ToUpperInvariant()

              $stateInfo =
                  "$($task.stateInfo)".Trim()

              $startDate =
                  "$($task.startDate)".Trim()

              $endDate =
                  "$($task.endDate)".Trim()

              Write-Host (
                  "Attempt=$attempt " +
                  "State=$state " +
                  "Verdict=$verdict"
              )

              if ($stateInfo) {

                  Write-Host (
                      "StateInfo=$stateInfo"
                  )
              }

              $task |
                  ConvertTo-Json -Depth 30 |
                  Set-Content `
                      -LiteralPath (
                          Join-Path `
                              -Path $env:ARTIFACT_ROOT `
                              -ChildPath 'execution-task-latest.json'
                      ) `
                      -Encoding utf8

              if (-not $state) {

                  throw (
                      'Execution task API returned no state. ' +
                      "Task=[$env:TESTGUIDE_TASK_ID]"
                  )
              }

              if ($state -in $failedStates) {

                  $safeInfo =
                      (
                          $stateInfo -replace
                          '[\r\n]+',
                          ' '
                      ).Trim()

                  "TESTGUIDE_STATE=$state" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_VERDICT=$verdict" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_MESSAGE=$safeInfo" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  throw (
                      "Execution ended. " +
                      "State=$state; " +
                      "Message=$safeInfo"
                  )
              }

              if (
                  ($state -in $finishedStates) -or
                  $endDate
              ) {

                  if (-not $startDate) {

                      $startDate =
                          (Get-Date).
                              AddMinutes(-30).
                              ToUniversalTime().
                              ToString('o')
                  }

                  if (-not $endDate) {

                      $endDate =
                          (Get-Date).
                              ToUniversalTime().
                              ToString('o')
                  }

                  "TASK_START_DATE=$startDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TASK_END_DATE=$endDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_STATE=$state" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_VERDICT=$verdict" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  Write-Host ''
                  Write-Host '========================================'
                  Write-Host 'EXECUTION COMPLETE'
                  Write-Host '========================================'
                  Write-Host "State   : [$state]"
                  Write-Host "Verdict : [$verdict]"
                  Write-Host "Start   : [$startDate]"
                  Write-Host "End     : [$endDate]"
                  Write-Host '========================================'

                  exit 0
              }

              Start-Sleep -Seconds 15
          }

          throw (
              'Execution polling exceeded 180 minutes.'
          )

      # ============================================================
      # 7. FIND TESTGUIDE REPORT
      # ============================================================

      - name: Find TestGuide report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:TASK_START_DATE) {
              throw 'TASK_START_DATE is missing.'
          }

          if (-not $env:TASK_END_DATE) {
              throw 'TASK_END_DATE is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PARSING EXECUTION DATES'
          Write-Host '========================================'
          Write-Host "Raw Start : [$env:TASK_START_DATE]"
          Write-Host "Raw End   : [$env:TASK_END_DATE]"
          Write-Host '========================================'

          try {

              $executionStart =
                  [System.DateTimeOffset]::Parse(
                      $env:TASK_START_DATE,
                      [System.Globalization.CultureInfo]::InvariantCulture,
                      [System.Globalization.DateTimeStyles]::AssumeUniversal
                  )

              $executionEnd =
                  [System.DateTimeOffset]::Parse(
                      $env:TASK_END_DATE,
                      [System.Globalization.CultureInfo]::InvariantCulture,
                      [System.Globalization.DateTimeStyles]::AssumeUniversal
                  )
          }
          catch {

              throw (
                  'Unable to parse execution dates. ' +
                  "Start=[$env:TASK_START_DATE]; " +
                  "End=[$env:TASK_END_DATE]; " +
                  "Error=$($_.Exception.Message)"
              )
          }

          $historyStart =
              $executionStart.
                  AddMinutes(-5).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ',
                      [System.Globalization.CultureInfo]::InvariantCulture
                  )

          $historyEnd =
              $executionEnd.
                  AddMinutes(30).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ',
                      [System.Globalization.CultureInfo]::InvariantCulture
                  )

          $encodedStart =
              [System.Uri]::EscapeDataString(
                  $historyStart
              )

          $encodedEnd =
              [System.Uri]::EscapeDataString(
                  $historyEnd
              )

          $historyUrl = (
              "$env:ONECX_URL/api/v2/report/reports/history" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&startDate=$encodedStart" +
              "&endDate=$encodedEnd" +
              "&offset=0" +
              "&limit=100"
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'REPORT HISTORY LOOKUP'
          Write-Host '========================================'
          Write-Host "Test Plan : [$env:TEST_PLAN_NAME]"
          Write-Host "Start     : [$historyStart]"
          Write-Host "End       : [$historyEnd]"
          Write-Host '========================================'

          $selectedReport =
              $null

          for (
              $attempt = 1;
              $attempt -le 20;
              $attempt++
          ) {

              $reports =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $historyUrl `
                      -Headers $headers `
                      -ErrorAction Stop

              $reportArray =
                  @($reports)

              $matchingReports =
                  @(
                      $reportArray |
                          Where-Object {

                              "$($_.status)".
                                  Trim().
                                  ToUpperInvariant() -eq
                                      'COMPLETE' -and

                              "$($_.testPlanName)".
                                  Trim() -eq
                                      "$env:TEST_PLAN_NAME"
                          }
                  )

              Write-Host (
                  "Report lookup attempt=$attempt " +
                  "Returned=$($reportArray.Count) " +
                  "Matching=$($matchingReports.Count)"
              )

              $sortableReports =
                  @()

              foreach ($report in $matchingReports) {

                  $parsedUploadDate =
                      [System.DateTimeOffset]::MinValue

                  if ($report.uploadDate) {

                      $temporaryDate =
                          [System.DateTimeOffset]::MinValue

                      $wasParsed =
                          [System.DateTimeOffset]::TryParse(
                              "$($report.uploadDate)",
                              [System.Globalization.CultureInfo]::InvariantCulture,
                              [System.Globalization.DateTimeStyles]::AssumeUniversal,
                              [ref]$temporaryDate
                          )

                      if ($wasParsed) {

                          $parsedUploadDate =
                              $temporaryDate
                      }
                  }

                  $sortableReports +=
                      [PSCustomObject]@{

                          Report =
                              $report

                          ParsedUploadDate =
                              $parsedUploadDate
                      }
              }

              $selectedWrapper =
                  $sortableReports |
                      Sort-Object `
                          -Property ParsedUploadDate `
                          -Descending |
                      Select-Object -First 1

              if ($null -ne $selectedWrapper) {

                  $selectedReport =
                      $selectedWrapper.Report

                  break
              }

              Write-Host (
                  'No matching COMPLETE report yet. ' +
                  'Checking again in 15 seconds.'
              )

              Start-Sleep -Seconds 15
          }

          if ($null -eq $selectedReport) {

              throw (
                  'No COMPLETE TestGuide report was found for ' +
                  "[$env:TEST_PLAN_NAME] between " +
                  "[$historyStart] and [$historyEnd]."
              )
          }

          $reportId =
              "$($selectedReport.reportId)".Trim()

          if (-not $reportId) {

              throw (
                  'Selected report has no reportId.'
              )
          }

          "TESTGUIDE_REPORT_ID=$reportId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'REPORT FOUND'
          Write-Host '========================================'
          Write-Host "Report ID      : [$reportId]"
          Write-Host "Test Plan      : [$($selectedReport.testPlanName)]"
          Write-Host "Status         : [$($selectedReport.status)]"
          Write-Host "Execution Date : [$($selectedReport.executionDate)]"
          Write-Host "Upload Date    : [$($selectedReport.uploadDate)]"
          Write-Host "File Size      : [$($selectedReport.fileSize)]"
          Write-Host '========================================'

      # ============================================================
      # 8. START ATX EXPORT
      # ============================================================

      - name: Start ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:TESTGUIDE_REPORT_ID) {
              throw 'TESTGUIDE_REPORT_ID is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $url = (
              "$env:ONECX_URL/api/v2/report/export/atx/" +
              "$env:TESTGUIDE_REPORT_ID" +
              "?projectId=$env:ONECX_PROJECT_ID"
          )

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $url `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -ErrorAction Stop

          Write-Host ''
          Write-Host 'ATX EXPORT RESPONSE:'

          Write-Host (
              $response |
                  ConvertTo-Json -Depth 20
          )

          $exportTaskId =
              $null

          if (
              $response -is [string] -or
              $response -is [int] -or
              $response -is [long]
          ) {

              $exportTaskId =
                  "$response".Trim()
          }
          elseif ($response.taskId) {

              $exportTaskId =
                  "$($response.taskId)"
          }
          elseif ($response.id) {

              $exportTaskId =
                  "$($response.id)"
          }
          elseif (
              $response.data -and
              $response.data.taskId
          ) {

              $exportTaskId =
                  "$($response.data.taskId)"
          }
          elseif (
              $response.data -and
              $response.data.id
          ) {

              $exportTaskId =
                  "$($response.data.id)"
          }

          if (-not $exportTaskId) {

              throw (
                  'ATX export response did not contain ' +
                  'a recognizable task ID.'
              )
          }

          "ATX_EXPORT_TASK_ID=$exportTaskId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host (
              "ATX Export Task ID=[$exportTaskId]"
          )

      # ============================================================
      # 9. POLL ATX EXPORT
      # ============================================================

      - name: Wait for ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $url = (
              "$env:ONECX_URL/api/v2/report/export/atx/" +
              "$env:ATX_EXPORT_TASK_ID/status" +
              "?projectId=$env:ONECX_PROJECT_ID"
          )

          $deadline =
              (Get-Date).AddMinutes(30)

          $attempt =
              0

          while ((Get-Date) -lt $deadline) {

              $attempt++

              $response =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $url `
                      -Headers $headers `
                      -ErrorAction Stop

              if ($response -is [string]) {

                  $state =
                      "$response".
                          Trim().
                          ToUpperInvariant()
              }
              elseif ($response.state) {

                  $state =
                      "$($response.state)".
                          Trim().
                          ToUpperInvariant()
              }
              elseif ($response.status) {

                  $state =
                      "$($response.status)".
                          Trim().
                          ToUpperInvariant()
              }
              else {

                  $state =
                      ''
              }

              Write-Host (
                  "ATX Attempt=$attempt State=$state"
              )

              if (
                  $state -in @(
                      'FINISHED',
                      'COMPLETE',
                      'COMPLETED',
                      'SUCCESS',
                      'SUCCEEDED',
                      'DONE'
                  )
              ) {

                  Write-Host 'ATX export completed.'

                  exit 0
              }

              if (
                  $state -in @(
                      'FAILED',
                      'FAILURE',
                      'ERROR',
                      'ABORTED',
                      'CANCELLED',
                      'CANCELED'
                  )
              ) {

                  throw (
                      "ATX export failed. State=$state"
                  )
              }

              if (-not $state) {

                  $responseJson =
                      $response |
                          ConvertTo-Json `
                              -Compress `
                              -Depth 20

                  throw (
                      'Unable to determine ATX export state. ' +
                      "Response=$responseJson"
                  )
              }

              Start-Sleep -Seconds 5
          }

          throw (
              'ATX export polling exceeded 30 minutes.'
          )

      # ============================================================
      # 10. DOWNLOAD ATX
      # ============================================================

      - name: Download generated ATX
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/octet-stream'
          }

          $url = (
              "$env:ONECX_URL/api/v2/report/export/atx/" +
              "$env:ATX_EXPORT_TASK_ID/download" +
              "?projectId=$env:ONECX_PROJECT_ID"
          )

          $fileName = (
              "$env:TEST_PLAN_NAME" +
              "_" +
              "$env:TARGET_ECU" +
              "_" +
              "$env:RUN_TIMESTAMP" +
              ".atx"
          )

          $destination =
              Join-Path `
                  -Path $env:ATX_DIRECTORY `
                  -ChildPath $fileName

          Invoke-WebRequest `
              -Method Get `
              -Uri $url `
              -Headers $headers `
              -OutFile $destination `
              -ErrorAction Stop

          $file =
              Get-Item `
                  -LiteralPath $destination

          if ($file.Length -eq 0) {

              throw (
                  'Downloaded ATX file is empty.'
              )
          }

          "ATX_FILE_PATH=$destination" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          "ATX_FILE_NAME=$fileName" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'ATX DOWNLOAD COMPLETE'
          Write-Host '========================================'
          Write-Host "File : [$destination]"
          Write-Host "Size : [$($file.Length)]"
          Write-Host '========================================'

      # ============================================================
      # 11. BUILD JFROG DESTINATION
      # ============================================================

      - name: Build JFrog destination
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToSafeSegment {

              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Value
              )

              $safe =
                  $Value.Trim()

              $safe =
                  $safe -replace '[\\/:*?"<>|]', '_'

              $safe =
                  $safe -replace '\s+', '_'

              $safe =
                  $safe.Trim('.')

              if (-not $safe) {

                  throw (
                      "Invalid JFrog segment: [$Value]"
                  )
              }

              return $safe
          }

          $release =
              Convert-ToSafeSegment `
                  -Value $env:CW_RELEASE

          $ecu =
              Convert-ToSafeSegment `
                  -Value $env:TARGET_ECU

          $category =
              Convert-ToSafeSegment `
                  -Value $env:CATEGORY

          $testPlan =
              Convert-ToSafeSegment `
                  -Value $env:TEST_PLAN_NAME

          $timestamp =
              Convert-ToSafeSegment `
                  -Value $env:RUN_TIMESTAMP

          $targetPath = (
              'L2_Quality_Gate/' +
              "$release/" +
              "$ecu/" +
              "$category/" +
              "$testPlan/" +
              "$timestamp/"
          )

          "JFROG_TARGET_PATH=$targetPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host (
              "JFrog target=[$targetPath]"
          )

      # ============================================================
      # 12. UPLOAD TO JFROG
      # ============================================================

      - name: Upload generated ATX to JFrog
        shell: pwsh
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:JFROG_TOKEN) {
              throw 'JFROG_TOKEN is missing.'
          }

          $file =
              Get-Item `
                  -LiteralPath $env:ATX_FILE_PATH `
                  -ErrorAction Stop

          $segments =
              $env:JFROG_TARGET_PATH.
                  Trim('/').
                  Split('/') |
                  ForEach-Object {
                      [System.Uri]::EscapeDataString(
                          $_
                      )
                  }

          $target =
              $segments -join '/'

          $encodedFileName =
              [System.Uri]::EscapeDataString(
                  $file.Name
              )

          $uploadUrl = (
              "$($env:JFROG_URL.TrimEnd('/'))/" +
              "$env:JFROG_REPOSITORY/" +
              "$target/" +
              "$encodedFileName"
          )

          if ($env:JFROG_USER) {

              curl.exe `
                  --fail-with-body `
                  --silent `
                  --show-error `
                  --request PUT `
                  --user "$($env:JFROG_USER):$($env:JFROG_TOKEN)" `
                  --header 'Content-Type: application/octet-stream' `
                  --upload-file "$($file.FullName)" `
                  "$uploadUrl"
          }
          else {

              curl.exe `
                  --fail-with-body `
                  --silent `
                  --show-error `
                  --request PUT `
                  --header "Authorization: Bearer $env:JFROG_TOKEN" `
                  --header 'Content-Type: application/octet-stream' `
                  --upload-file "$($file.FullName)" `
                  "$uploadUrl"
          }

          if ($LASTEXITCODE -ne 0) {

              throw (
                  'JFrog upload failed. ' +
                  "Curl exit code=$LASTEXITCODE"
              )
          }

          $folderUrl = (
              "$($env:JFROG_URL.TrimEnd('/'))/" +
              "$env:JFROG_REPOSITORY/" +
              "$target/"
          )

          "JFROG_FILE_URL=$uploadUrl" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          "JFROG_FOLDER_URL=$folderUrl" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JFROG UPLOAD COMPLETE'
          Write-Host '========================================'
          Write-Host "File URL   : [$uploadUrl]"
          Write-Host "Folder URL : [$folderUrl]"
          Write-Host '========================================'

      # ============================================================
      # 13. ADD JFROG LOCATION TO JIRA
      # ============================================================

      - name: Add ATX location to Jira
        shell: pwsh
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:JIRA_KEY) {
              throw 'JIRA_KEY is missing.'
          }

          if (-not $env:JIRA_EMAIL) {
              throw 'JIRA_EMAIL is missing.'
          }

          if (-not $env:JIRA_API_TOKEN) {
              throw 'JIRA_API_TOKEN is missing.'
          }

          if (-not $env:JFROG_FILE_URL) {
              throw 'JFROG_FILE_URL is missing.'
          }

          $githubRunUrl =
              'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          $commentText = (
              "L2 Quality Gate execution completed.`n`n" +
              "Category: $env:CATEGORY`n" +
              "Test Plan: $env:TEST_PLAN_NAME`n" +
              "CW Release: $env:CW_RELEASE`n" +
              "Target ECU: $env:TARGET_ECU`n" +
              "Test Bench: $env:TEST_BENCH`n" +
              "Project: $env:PROJECT_RELATIVE_PATH`n`n" +
              "Playbook ID: $env:TESTGUIDE_PLAYBOOK_ID`n" +
              "Execution Task ID: $env:TESTGUIDE_TASK_ID`n" +
              "Execution State: $env:TESTGUIDE_STATE`n" +
              "Execution Verdict: $env:TESTGUIDE_VERDICT`n" +
              "Report ID: $env:TESTGUIDE_REPORT_ID`n" +
              "ATX Export Task ID: $env:ATX_EXPORT_TASK_ID`n`n" +
              "ATX on runner:`n" +
              "$env:ATX_FILE_PATH`n`n" +
              "JFrog ATX file:`n" +
              "$env:JFROG_FILE_URL`n`n" +
              "JFrog folder:`n" +
              "$env:JFROG_FOLDER_URL`n`n" +
              "GitHub run:`n" +
              "$githubRunUrl"
          )

          $commentFile =
              Join-Path `
                  -Path $env:RUNNER_TEMP `
                  -ChildPath 'jira-atx-comment.json'

          @{
              body =
                  $commentText
          } |
              ConvertTo-Json -Depth 10 |
              Set-Content `
                  -LiteralPath $commentFile `
                  -Encoding utf8

          $jiraUrl = (
              "$($env:JIRA_BASE_URL.TrimEnd('/'))/" +
              "rest/api/2/issue/" +
              "$env:JIRA_KEY/comment"
          )

          curl.exe `
              --fail-with-body `
              --silent `
              --show-error `
              --request POST `
              --user "$($env:JIRA_EMAIL):$($env:JIRA_API_TOKEN)" `
              --header 'Accept: application/json' `
              --header 'Content-Type: application/json' `
              --data-binary "@$commentFile" `
              "$jiraUrl"

          if ($LASTEXITCODE -ne 0) {

              throw (
                  'Jira comment failed. ' +
                  "Curl exit code=$LASTEXITCODE"
              )
          }

          Write-Host (
              "Jira comment added to [$env:JIRA_KEY]."
          )

      # ============================================================
      # 14. RETAIN ATX/DIAGNOSTICS IN GITHUB
      # ============================================================

      - name: Upload ATX and diagnostics to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-atx-${{ github.event.client_payload.jira_key }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: 30
