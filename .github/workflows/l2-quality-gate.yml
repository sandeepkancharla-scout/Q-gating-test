name: L2 Quality Gate - Jira Execution

on:
  repository_dispatch:
    types:
      - l2_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}
  TESTGUIDE_WORKSPACE: C:\HIL\Testing\eeint-Test-Automation

  JFROG_URL: https://artifactory.sctmtrs.xyz/artifactory
  JFROG_REPOSITORY: eeint-report-files

  JIRA_BASE_URL: https://scoutmotors.atlassian.net

jobs:
  l2-quality-gate:
    name: L2 Quality Gate

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: l2-quality-gate-${{ github.event.client_payload.test_bench }}
      cancel-in-progress: false

    steps:
      # ============================================================
      # 1. PARSE JIRA INPUTS
      # ============================================================

      - name: Parse Jira inputs
        shell: pwsh
        env:
          JIRA_KEY_RAW: ${{ github.event.client_payload.jira_key }}
          CATEGORY_RAW: ${{ github.event.client_payload.category }}
          CW_RELEASE_RAW: ${{ github.event.client_payload.cw_release }}
          TEST_BENCH_RAW: ${{ github.event.client_payload.test_bench }}
          TARGET_ECU_RAW: ${{ github.event.client_payload.target_ecu }}
          FLASH_ARCHIVE_RAW: ${{ github.event.client_payload.flash_archive_location }}
          RAL_FILE_RAW: ${{ github.event.client_payload.ral_file_location }}
          GIT_SUBMODULE_RAW: ${{ github.event.client_payload.git_submodule }}
          TEST_CASES_RAW: ${{ github.event.client_payload.test_cases }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Clean-Value {
              param($Value)

              if ($null -eq $Value) {
                  return ''
              }

              return (
                  "$Value" -replace '[\r\n]+', ' '
              ).Trim()
          }

          function Clean-Path {
              param($Value)

              if ($null -eq $Value) {
                  return ''
              }

              $result = (
                  "$Value" -replace '[\r\n]+', ''
              ).Trim()

              while (
                  $result.Length -ge 2 -and
                  $result.StartsWith('"') -and
                  $result.EndsWith('"')
              ) {
                  $result =
                      $result.Substring(
                          1,
                          $result.Length - 2
                      ).Trim()
              }

              return $result
          }

          function Set-WorkflowEnvironment {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Name,

                  [AllowEmptyString()]
                  [string]$Value
              )

              "$Name=$Value" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          $jiraKey =
              Clean-Value $env:JIRA_KEY_RAW

          $categoryInput =
              Clean-Value $env:CATEGORY_RAW

          $cwRelease =
              (
                  Clean-Value $env:CW_RELEASE_RAW
              ).ToUpperInvariant()

          $testBench =
              (
                  Clean-Value $env:TEST_BENCH_RAW
              ).ToLowerInvariant()

          $targetEcu =
              Clean-Value $env:TARGET_ECU_RAW

          $flashArchiveLocation =
              Clean-Path $env:FLASH_ARCHIVE_RAW

          $ralFileLocation =
              Clean-Path $env:RAL_FILE_RAW

          $gitSubmodule =
              Clean-Value $env:GIT_SUBMODULE_RAW

          $testCases =
              Clean-Value $env:TEST_CASES_RAW

          if (-not $jiraKey) {
              throw 'jira_key is missing.'
          }

          if (-not $categoryInput) {
              throw 'category is missing.'
          }

          if (-not $cwRelease) {
              throw 'cw_release is missing.'
          }

          if (-not $testBench) {
              throw 'test_bench is missing.'
          }

          if (-not $targetEcu) {
              throw 'target_ecu is missing.'
          }

          if ($cwRelease -notmatch '^CW[0-9]{2}$') {
              throw (
                  "Invalid CW release [$cwRelease]. " +
                  'Expected CW45 format.'
              )
          }

          if (
              $testBench -notin @(
                  'syshil1',
                  'syshil2'
              )
          ) {
              throw "Unsupported test bench [$testBench]."
          }

          switch ($categoryInput.ToLowerInvariant()) {
              'network_test' {
                  $categoryInput = 'Network_Test'
              }

              'network_testing' {
                  $categoryInput = 'Network_Test'
              }

              'diagnostic_test' {
                  $categoryInput = 'Diagnostic_Test'
              }

              'diagnostic_testing' {
                  $categoryInput = 'Diagnostic_Test'
              }

              'bootloader_compliance_test' {
                  $categoryInput =
                      'Bootloader_Compliance_Test'
              }

              default {
                  throw (
                      "Unsupported Jira category " +
                      "[$categoryInput]."
                  )
              }
          }

          if (
              $categoryInput -eq 'Diagnostic_Test' -and
              -not $ralFileLocation
          ) {
              throw (
                  'Diagnostic_Test requires ' +
                  'ral_file_location.'
              )
          }

          if (
              $categoryInput -eq
                  'Bootloader_Compliance_Test' -and
              -not $flashArchiveLocation
          ) {
              throw (
                  'Bootloader_Compliance_Test requires ' +
                  'flash_archive_location.'
              )
          }

          Set-WorkflowEnvironment `
              -Name 'JIRA_KEY' `
              -Value $jiraKey

          Set-WorkflowEnvironment `
              -Name 'CATEGORY_INPUT' `
              -Value $categoryInput

          Set-WorkflowEnvironment `
              -Name 'CW_RELEASE' `
              -Value $cwRelease

          Set-WorkflowEnvironment `
              -Name 'TEST_BENCH' `
              -Value $testBench

          Set-WorkflowEnvironment `
              -Name 'TARGET_ECU' `
              -Value $targetEcu

          Set-WorkflowEnvironment `
              -Name 'FLASH_ARCHIVE_LOCATION' `
              -Value $flashArchiveLocation

          Set-WorkflowEnvironment `
              -Name 'RAL_FILE_LOCATION' `
              -Value $ralFileLocation

          Set-WorkflowEnvironment `
              -Name 'GIT_SUBMODULE' `
              -Value $gitSubmodule

          Set-WorkflowEnvironment `
              -Name 'TEST_CASES' `
              -Value $testCases

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PARSED JIRA INPUTS'
          Write-Host '========================================'
          Write-Host "Jira Key      : $jiraKey"
          Write-Host "Category      : $categoryInput"
          Write-Host "CW Release    : $cwRelease"
          Write-Host "Test Bench    : $testBench"
          Write-Host "Target ECU    : $targetEcu"
          Write-Host "Flash Path    : $flashArchiveLocation"
          Write-Host "RAL Path      : $ralFileLocation"
          Write-Host "Git Submodule : $gitSubmodule"
          Write-Host "Test Cases    : $testCases"
          Write-Host '========================================'

      # ============================================================
      # 2. ROUTE CATEGORY AND PREPARE PLAYBOOK
      # ============================================================

      - name: Route category and prepare playbook
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          switch ($env:CATEGORY_INPUT) {
              'Network_Test' {
                  $category =
                      'network-testing'

                  $testPlanName =
                      'NetworkTest'

                  $playbookBaseName =
                      'L2-network-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Network-Test\NetworkTest.prj'
              }

              'Diagnostic_Test' {
                  $category =
                      'diagnostic-testing'

                  $testPlanName =
                      'DiagnosticTest'

                  $playbookBaseName =
                      'L2-Diagnostic-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Diagnostic-Test\DiagnosticTest.prj'
              }

              'Bootloader_Compliance_Test' {
                  $category =
                      'bootloader-compliance'

                  $testPlanName =
                      'BootloaderComplianceTest'

                  $playbookBaseName =
                      'L2-Bootloader-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Bootloader-Compliance-Test\BootloaderComplianceTest.prj'
              }

              default {
                  throw (
                      "Unsupported category " +
                      "[$env:CATEGORY_INPUT]."
                  )
              }
          }

          switch ($env:TEST_BENCH) {
              'syshil1' {
                  $resource =
                      'syshil1-labtest1'

                  $configurationFolder =
                      'SUBSYS1'
              }

              'syshil2' {
                  $resource =
                      'syshil2-labtest2'

                  $configurationFolder =
                      'SUBSYS1'
              }

              default {
                  throw (
                      "Unsupported test bench " +
                      "[$env:TEST_BENCH]."
                  )
              }
          }

          $workspace =
              $env:TESTGUIDE_WORKSPACE

          if (
              -not (
                  Test-Path `
                      -LiteralPath $workspace `
                      -PathType Container
              )
          ) {
              throw (
                  "TestGuide workspace does not exist: " +
                  "[$workspace]"
              )
          }

          $fullProjectPath =
              Join-Path `
                  -Path $workspace `
                  -ChildPath $projectRelativePath

          if (
              -not (
                  Test-Path `
                      -LiteralPath $fullProjectPath `
                      -PathType Leaf
              )
          ) {
              throw (
                  "Project does not exist: " +
                  "[$fullProjectPath]"
              )
          }

          $tbcRelativePath = (
              "Configurations\" +
              "$configurationFolder\" +
              "${configurationFolder}_TestBenchConfig.tbc"
          )

          $tcfRelativePath = (
              "Configurations\" +
              "$configurationFolder\" +
              "${configurationFolder}_TestConfig.tcf"
          )

          $fullTbcPath =
              Join-Path `
                  -Path $workspace `
                  -ChildPath $tbcRelativePath

          $fullTcfPath =
              Join-Path `
                  -Path $workspace `
                  -ChildPath $tcfRelativePath

          if (
              -not (
                  Test-Path `
                      -LiteralPath $fullTbcPath `
                      -PathType Leaf
              )
          ) {
              throw "TBC does not exist: [$fullTbcPath]"
          }

          if (
              -not (
                  Test-Path `
                      -LiteralPath $fullTcfPath `
                      -PathType Leaf
              )
          ) {
              throw "TCF does not exist: [$fullTcfPath]"
          }

          $artifactRoot =
              Join-Path `
                  -Path $env:RUNNER_TEMP `
                  -ChildPath 'l2-artifacts'

          $atxDirectory =
              Join-Path `
                  -Path $artifactRoot `
                  -ChildPath 'atx'

          New-Item `
              -ItemType Directory `
              -Path $atxDirectory `
              -Force |
              Out-Null

          $runTimestamp =
              Get-Date `
                  -Format 'yyyy-MM-dd_HHmmss'

          $playbookName = (
              "$playbookBaseName-" +
              "$env:JIRA_KEY-" +
              "$runTimestamp"
          )

          $values = [ordered]@{
              CATEGORY =
                  $category

              TEST_PLAN_NAME =
                  $testPlanName

              PLAYBOOK_BASE_NAME =
                  $playbookBaseName

              PLAYBOOK_NAME =
                  $playbookName

              PROJECT_RELATIVE_PATH =
                  $projectRelativePath

              RESOURCE_NAME =
                  $resource

              TBC_RELATIVE_PATH =
                  $tbcRelativePath

              TCF_RELATIVE_PATH =
                  $tcfRelativePath

              XIL_IDENTIFIER =
                  "novi_hq/1stfloor/ee_lab_novi/$resource/ControlComputer"

              ARTIFACT_ROOT =
                  $artifactRoot

              ATX_DIRECTORY =
                  $atxDirectory

              RUN_TIMESTAMP =
                  $runTimestamp
          }

          foreach ($item in $values.GetEnumerator()) {
              "$($item.Key)=$($item.Value)" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PLAYBOOK CONFIGURATION'
          Write-Host '========================================'
          Write-Host "Category      : $category"
          Write-Host "Test Plan     : $testPlanName"
          Write-Host "Playbook Name : $playbookName"
          Write-Host "Project       : $projectRelativePath"
          Write-Host "Resource      : $resource"
          Write-Host "Target ECU    : $env:TARGET_ECU"
          Write-Host '========================================'

      # ============================================================
      # 3. GENERATE PLAYBOOK JSON
      # ============================================================

      - name: Generate new TestGuide playbook
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToEcuTestPathExpression {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path
              )

              $cleanPath =
                  $Path.Trim().Trim('"')

              $escapedPath =
                  $cleanPath.Replace(
                      '\',
                      '\\'
                  )

              return (
                  '"' +
                  $escapedPath +
                  '"'
              )
          }

          $targetEcuExpression =
              "'" + $env:TARGET_ECU + "'"

          $constants = @(
              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  value =
                      $targetEcuExpression
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  value =
                      'True'
              }
          )

          $parameters = @(
              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  defaultValue =
                      $targetEcuExpression

                  required =
                      $false
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  defaultValue =
                      'True'

                  required =
                      $false
              }
          )

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              $ralExpression =
                  Convert-ToEcuTestPathExpression `
                      -Path $env:RAL_FILE_LOCATION

              $constants +=
                  [ordered]@{
                      label =
                          'PROJECT_GENERATOR_RAL_FILE_PATH'

                      value =
                          $ralExpression
                  }

              $parameters +=
                  [ordered]@{
                      label =
                          'PROJECT_GENERATOR_RAL_FILE_PATH'

                      defaultValue =
                          $ralExpression

                      required =
                          $false
                  }
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              $flashExpression =
                  Convert-ToEcuTestPathExpression `
                      -Path $env:FLASH_ARCHIVE_LOCATION

              $constants +=
                  [ordered]@{
                      label =
                          'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                      value =
                          $flashExpression
                  }

              $parameters +=
                  [ordered]@{
                      label =
                          'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                      defaultValue =
                          $flashExpression

                      required =
                          $false
                  }
          }

          $playbook = [ordered]@{
              metadata = [ordered]@{
                  name =
                      $env:PLAYBOOK_NAME

                  taskNameTemplate =
                      '${playbook_name} (${playbook_datetime}) ${distribution_count}'

                  labels =
                      @()
              }

              workspace = [ordered]@{
                  source = [ordered]@{
                      path =
                          $env:TESTGUIDE_WORKSPACE

                      sourceType =
                          'location'
                  }

                  dependencies =
                      @()
              }

              setup = [ordered]@{
                  steps = @(
                      [ordered]@{
                          reuse =
                              'always'

                          keepConfiguration =
                              $false

                          waitMinutesForLicense =
                              0

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'ecuTestStart'
                      },

                      [ordered]@{
                          tbcPath =
                              $env:TBC_RELATIVE_PATH

                          tcfPath =
                              $env:TCF_RELATIVE_PATH

                          stepName =
                              'Test Configuration Selection'

                          type =
                              'configuration'
                      }
                  )
              }

              execution = [ordered]@{
                  testcases = @(
                      [ordered]@{
                          relativePath =
                              $env:PROJECT_RELATIVE_PATH

                          constants =
                              $constants

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'project'
                      }
                  )
              }

              teardown = [ordered]@{
                  steps = @(
                      [ordered]@{
                          type =
                              'ecuTestStop'
                      }
                  )
              }

              xilConfigRequirements = @(
                  [ordered]@{
                      label =
                          'Identifier'

                      category =
                          'XIL'

                      value =
                          $env:XIL_IDENTIFIER

                      type =
                          'configuration'
                  }
              )

              parameters =
                  $parameters
          }

          $playbookFile =
              Join-Path `
                  -Path $env:ARTIFACT_ROOT `
                  -ChildPath 'playbook.json'

          $playbook |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath $playbookFile `
                  -Encoding utf8

          "PLAYBOOK_FILE=$playbookFile" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Playbook file: $playbookFile"

      # ============================================================
      # 4. CREATE PLAYBOOK
      # ============================================================

      - name: Create new TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ONECX_AUTH_KEY) {
              throw 'ONECX_AUTH_KEY is missing.'
          }

          if (-not $env:ONECX_PROJECT_ID) {
              throw 'ONECX_PROJECT_ID is missing.'
          }

          if (-not $env:PLAYBOOK_FILE) {
              throw 'PLAYBOOK_FILE is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $createUrl = (
              "$env:ONECX_URL/api/v2/execution/playbook" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&folder=%2F"
          )

          $requestBody =
              Get-Content `
                  -LiteralPath $env:PLAYBOOK_FILE `
                  -Raw

          $createResponse =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $createUrl `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $requestBody `
                  -ErrorAction Stop

          $createResponse |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          -Path $env:ARTIFACT_ROOT `
                          -ChildPath 'create-response.json'
                  ) `
                  -Encoding utf8

          $newPlaybookId =
              $null

          if ($createResponse.playbookId) {
              $newPlaybookId =
                  $createResponse.playbookId
          }
          elseif ($createResponse.id) {
              $newPlaybookId =
                  $createResponse.id
          }
          elseif (
              $createResponse.data -and
              $createResponse.data.playbookId
          ) {
              $newPlaybookId =
                  $createResponse.data.playbookId
          }
          elseif (
              $createResponse.data -and
              $createResponse.data.id
          ) {
              $newPlaybookId =
                  $createResponse.data.id
          }

          if (-not $newPlaybookId) {
              Write-Host (
                  $createResponse |
                      ConvertTo-Json -Depth 30
              )

              throw 'Create API returned no new playbook ID.'
          }

          "TESTGUIDE_PLAYBOOK_ID=$newPlaybookId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Created Playbook ID: $newPlaybookId"

      # ============================================================
      # 5. EXECUTE PLAYBOOK
      # ============================================================

      - name: Execute newly created TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToEcuTestPathExpression {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path
              )

              return (
                  '"' +
                  $Path.Trim().Trim('"').Replace('\', '\\') +
                  '"'
              )
          }

          if (-not $env:TESTGUIDE_PLAYBOOK_ID) {
              throw 'TESTGUIDE_PLAYBOOK_ID is missing.'
          }

          $executionParameters = @(
              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  value =
                      "'$($env:TARGET_ECU)'"
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  value =
                      'True'
              }
          )

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              $executionParameters +=
                  [ordered]@{
                      label =
                          'PROJECT_GENERATOR_RAL_FILE_PATH'

                      value = (
                          Convert-ToEcuTestPathExpression `
                              -Path $env:RAL_FILE_LOCATION
                      )
                  }
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              $executionParameters +=
                  [ordered]@{
                      label =
                          'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                      value = (
                          Convert-ToEcuTestPathExpression `
                              -Path $env:FLASH_ARCHIVE_LOCATION
                      )
                  }
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $executeUrl = (
              "$env:ONECX_URL/api/v2/execution/playbook/" +
              "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&checkLastExecution=true"
          )

          $requestBody =
              @{
                  parameters =
                      $executionParameters
              } |
                  ConvertTo-Json -Depth 20

          $executeResponse =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $executeUrl `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $requestBody `
                  -ErrorAction Stop

          $executeResponse |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          -Path $env:ARTIFACT_ROOT `
                          -ChildPath 'execute-response.json'
                  ) `
                  -Encoding utf8

          Write-Host ''
          Write-Host 'RAW EXECUTE RESPONSE'
          Write-Host (
              $executeResponse |
                  ConvertTo-Json -Depth 30
          )

          $executionTaskId =
              $null

          if ($executeResponse.taskIds) {
              $executionTaskId =
                  @($executeResponse.taskIds)[0]
          }
          elseif ($executeResponse.taskId) {
              $executionTaskId =
                  $executeResponse.taskId
          }
          elseif ($executeResponse.id) {
              $executionTaskId =
                  $executeResponse.id
          }
          elseif (
              $executeResponse.data -and
              $executeResponse.data.taskIds
          ) {
              $executionTaskId =
                  @($executeResponse.data.taskIds)[0]
          }
          elseif (
              $executeResponse.data -and
              $executeResponse.data.taskId
          ) {
              $executionTaskId =
                  $executeResponse.data.taskId
          }

          if (-not $executionTaskId) {
              throw (
                  'Execute API returned no execution task ID.'
              )
          }

          "TESTGUIDE_TASK_ID=$executionTaskId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Execution Task ID: $executionTaskId"

      # ============================================================
      # 6. POLL EXECUTION TASK
      # ============================================================

      - name: Wait for new playbook execution task
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:TESTGUIDE_TASK_ID) {
              throw 'TESTGUIDE_TASK_ID is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $taskUrl = (
              "$env:ONECX_URL/api/v2/execution/task/" +
              "$env:TESTGUIDE_TASK_ID" +
              "?projectId=$env:ONECX_PROJECT_ID"
          )

          $completeStates = @(
              'FINISHED',
              'COMPLETED',
              'COMPLETE',
              'SUCCESS',
              'SUCCEEDED',
              'DONE',
              'ENDED'
          )

          $failureStates = @(
              'ABORTED',
              'ABORT',
              'ERROR',
              'FAILED',
              'FAILURE',
              'CANCELLED',
              'CANCELED'
          )

          $deadline =
              (Get-Date).AddMinutes(180)

          $attempt =
              0

          $notFoundCount =
              0

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'EXECUTION TASK POLLING'
          Write-Host '========================================'
          Write-Host "Project ID  : $env:ONECX_PROJECT_ID"
          Write-Host "Playbook ID : $env:TESTGUIDE_PLAYBOOK_ID"
          Write-Host "Task ID     : $env:TESTGUIDE_TASK_ID"
          Write-Host "URL         : $taskUrl"
          Write-Host '========================================'

          while ((Get-Date) -lt $deadline) {
              $attempt++

              try {
                  $task =
                      Invoke-RestMethod `
                          -Method Get `
                          -Uri $taskUrl `
                          -Headers $headers `
                          -ErrorAction Stop
              }
              catch {
                  $statusCode =
                      $null

                  if (
                      $_.Exception.Response -and
                      $_.Exception.Response.StatusCode
                  ) {
                      $statusCode =
                          [int]$_.Exception.Response.StatusCode
                  }

                  Write-Host (
                      "Polling error. " +
                      "Attempt=$attempt " +
                      "HTTP=$statusCode " +
                      "Error=$($_.Exception.Message)"
                  )

                  if ($statusCode -eq 404) {
                      $notFoundCount++

                      if ($notFoundCount -le 20) {
                          Write-Host (
                              "Task currently returns 404. " +
                              "Retry=$notFoundCount/20"
                          )

                          Start-Sleep -Seconds 15
                          continue
                      }
                  }

                  $executeResponseFile =
                      Join-Path `
                          -Path $env:ARTIFACT_ROOT `
                          -ChildPath 'execute-response.json'

                  if (
                      Test-Path `
                          -LiteralPath $executeResponseFile
                  ) {
                      Write-Host ''
                      Write-Host 'RAW EXECUTE RESPONSE:'

                      Get-Content `
                          -LiteralPath $executeResponseFile `
                          -Raw |
                          Write-Host
                  }

                  throw
              }

              $state =
                  "$($task.state)".
                      Trim().
                      ToUpperInvariant()

              $verdict =
                  "$($task.aggregatedVerdict)".
                      Trim().
                      ToUpperInvariant()

              $stateInfo =
                  "$($task.stateInfo)".Trim()

              $startDate =
                  "$($task.startDate)".Trim()

              $endDate =
                  "$($task.endDate)".Trim()

              Write-Host (
                  "Attempt=$attempt " +
                  "State=$state " +
                  "Verdict=$verdict"
              )

              $task |
                  ConvertTo-Json -Depth 30 |
                  Set-Content `
                      -LiteralPath (
                          Join-Path `
                              -Path $env:ARTIFACT_ROOT `
                              -ChildPath 'execution-task-latest.json'
                      ) `
                      -Encoding utf8

              if (-not $state) {
                  Write-Host (
                      $task |
                          ConvertTo-Json -Depth 30
                  )

                  throw (
                      'Execution task API returned no state.'
                  )
              }

              if ($state -in $failureStates) {
                  $safeStateInfo =
                      (
                          $stateInfo -replace
                          '[\r\n]+',
                          ' '
                      ).Trim()

                  "TESTGUIDE_STATE=$state" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_VERDICT=$verdict" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_MESSAGE=$safeStateInfo" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  throw (
                      "Execution ended. " +
                      "State=$state; " +
                      "Message=$safeStateInfo"
                  )
              }

              if (
                  ($state -in $completeStates) -or
                  $endDate
              ) {
                  if (-not $startDate) {
                      $startDate =
                          (Get-Date).
                              AddMinutes(-30).
                              ToUniversalTime().
                              ToString('o')
                  }

                  if (-not $endDate) {
                      $endDate =
                          (Get-Date).
                              ToUniversalTime().
                              ToString('o')
                  }

                  "TASK_START_DATE=$startDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TASK_END_DATE=$endDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_STATE=$state" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_VERDICT=$verdict" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  Write-Host ''
                  Write-Host '========================================'
                  Write-Host 'EXECUTION COMPLETE'
                  Write-Host '========================================'
                  Write-Host "State   : $state"
                  Write-Host "Verdict : $verdict"
                  Write-Host "Start   : $startDate"
                  Write-Host "End     : $endDate"
                  Write-Host '========================================'

                  exit 0
              }

              Start-Sleep -Seconds 15
          }

          throw 'Execution polling exceeded 180 minutes.'

      # ============================================================
      # 7. FIND REPORT
      # ============================================================

      - name: Find TestGuide report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:TASK_START_DATE) {
              throw 'TASK_START_DATE is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          try {
              $executionStart =
                  Get-Date `
                      -Date $env:TASK_START_DATE `
                      -ErrorAction Stop

              $executionStart =
                  $executionStart.ToUniversalTime()
          }
          catch {
              throw (
                  'Unable to parse TASK_START_DATE. ' +
                  "Value=[$env:TASK_START_DATE]. " +
                  "Error=$($_.Exception.Message)"
              )
          }

          $dayStartText =
              $executionStart.ToString(
                  'yyyy-MM-ddT00:00:00Z'
              )

          $dayStart =
              Get-Date `
                  -Date $dayStartText

          $dayEnd =
              $dayStart.AddDays(1)

          $historyStart =
              $dayStart.
                  ToUniversalTime().
                  ToString('yyyy-MM-ddTHH:mm:ssZ')

          $historyEnd =
              $dayEnd.
                  ToUniversalTime().
                  ToString('yyyy-MM-ddTHH:mm:ssZ')

          $encodedStart =
              [System.Uri]::EscapeDataString(
                  $historyStart
              )

          $encodedEnd =
              [System.Uri]::EscapeDataString(
                  $historyEnd
              )

          $historyUrl = (
              "$env:ONECX_URL/api/report/reports/history" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&startDate=$encodedStart" +
              "&endDate=$encodedEnd" +
              "&offset=0" +
              "&limit=100"
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'FULL-DAY REPORT HISTORY LOOKUP'
          Write-Host '========================================'
          Write-Host "Test Plan : $env:TEST_PLAN_NAME"
          Write-Host "Start     : $historyStart"
          Write-Host "End       : $historyEnd"
          Write-Host "URL       : $historyUrl"
          Write-Host '========================================'

          $selectedReport =
              $null

          for (
              $attempt = 1;
              $attempt -le 20;
              $attempt++
          ) {
              $historyResponse =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $historyUrl `
                      -Headers $headers `
                      -ErrorAction Stop

              if ($null -eq $historyResponse) {
                  $allReports =
                      @()
              }
              elseif (
                  $historyResponse.PSObject.Properties[
                      'content'
                  ]
              ) {
                  $allReports =
                      @($historyResponse.content)
              }
              elseif (
                  $historyResponse.PSObject.Properties[
                      'reports'
                  ]
              ) {
                  $allReports =
                      @($historyResponse.reports)
              }
              elseif (
                  $historyResponse.PSObject.Properties[
                      'data'
                  ]
              ) {
                  $allReports =
                      @($historyResponse.data)
              }
              else {
                  $allReports =
                      @($historyResponse)
              }

              $matchingReports =
                  @(
                      $allReports |
                          Where-Object {
                              $reportStatus =
                                  "$($_.status)".
                                      Trim().
                                      ToUpperInvariant()

                              $reportPlan =
                                  "$($_.testPlanName)".
                                      Trim()

                              (
                                  $reportStatus -eq
                                      'COMPLETE' -and

                                  $reportPlan -eq
                                      $env:TEST_PLAN_NAME
                              )
                          }
                  )

              Write-Host (
                  "Report lookup attempt=$attempt " +
                  "Matching=$($matchingReports.Count)"
              )

              if ($matchingReports.Count -gt 0) {
                  $rankedReports =
                      foreach (
                          $report in $matchingReports
                      ) {
                          $differenceSeconds =
                              999999999999999

                          $uploadDate =
                              Get-Date `
                                  -Date '1900-01-01T00:00:00Z'

                          if ($report.executionDate) {
                              try {
                                  $reportExecutionDate =
                                      Get-Date `
                                          -Date (
                                              "$($report.executionDate)"
                                          ) `
                                          -ErrorAction Stop

                                  $reportExecutionDate =
                                      $reportExecutionDate.
                                          ToUniversalTime()

                                  $differenceSeconds =
                                      [System.Math]::Abs(
                                          (
                                              $reportExecutionDate -
                                              $executionStart
                                          ).TotalSeconds
                                      )
                              }
                              catch {
                                  Write-Host (
                                      'Could not parse ' +
                                      'executionDate: ' +
                                      "$($report.executionDate)"
                                  )
                              }
                          }

                          if ($report.uploadDate) {
                              try {
                                  $uploadDate =
                                      Get-Date `
                                          -Date (
                                              "$($report.uploadDate)"
                                          ) `
                                          -ErrorAction Stop
                              }
                              catch {
                                  Write-Host (
                                      'Could not parse ' +
                                      'uploadDate: ' +
                                      "$($report.uploadDate)"
                                  )
                              }
                          }

                          [PSCustomObject]@{
                              Report =
                                  $report

                              Difference =
                                  $differenceSeconds

                              UploadDate =
                                  $uploadDate
                          }
                      }

                  $selectedWrapper =
                      $rankedReports |
                          Sort-Object `
                              -Property @(
                                  @{
                                      Expression =
                                          'Difference'

                                      Ascending =
                                          $true
                                  },
                                  @{
                                      Expression =
                                          'UploadDate'

                                      Descending =
                                          $true
                                  }
                              ) |
                          Select-Object -First 1

                  if ($null -ne $selectedWrapper) {
                      $selectedReport =
                          $selectedWrapper.Report

                      Write-Host (
                          'Selected report difference: ' +
                          "$($selectedWrapper.Difference) seconds"
                      )

                      break
                  }
              }

              if ($attempt -lt 20) {
                  Write-Host (
                      'Matching report not available yet. ' +
                      'Waiting 15 seconds...'
                  )

                  Start-Sleep -Seconds 15
              }
          }

          if ($null -eq $selectedReport) {
              throw (
                  'No COMPLETE report found for ' +
                  "[$env:TEST_PLAN_NAME] between " +
                  "[$historyStart] and [$historyEnd]."
              )
          }

          $reportId =
              $selectedReport.reportId

          if ($null -eq $reportId) {
              Write-Host (
                  $selectedReport |
                      ConvertTo-Json -Depth 30
              )

              throw (
                  'Selected report contains no reportId.'
              )
          }

          $reportId =
              ([string]$reportId).Trim()

          if (-not $reportId) {
              throw (
                  'Selected report contains an empty reportId.'
              )
          }

          "TESTGUIDE_REPORT_ID=$reportId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'REPORT FOUND'
          Write-Host '========================================'
          Write-Host "Report ID      : $reportId"
          Write-Host "Test Plan      : $($selectedReport.testPlanName)"
          Write-Host "Status         : $($selectedReport.status)"
          Write-Host "Execution Date : $($selectedReport.executionDate)"
          Write-Host "Upload Date    : $($selectedReport.uploadDate)"
          Write-Host '========================================'

      # ============================================================
      # 8. START ATX EXPORT
      # ============================================================

      - name: Start ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:TESTGUIDE_REPORT_ID) {
              throw 'TESTGUIDE_REPORT_ID is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $exportUrl = (
              "$env:ONECX_URL/api/report/export/atx/" +
              "$env:TESTGUIDE_REPORT_ID" +
              "?projectId=$env:ONECX_PROJECT_ID"
          )

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $exportUrl `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -ErrorAction Stop

          $exportTaskId =
              $null

          if (
              $response -is [string] -or
              $response -is [int] -or
              $response -is [long]
          ) {
              $exportTaskId =
                  "$response".Trim()
          }
          elseif ($response.taskId) {
              $exportTaskId =
                  "$($response.taskId)".Trim()
          }
          elseif ($response.id) {
              $exportTaskId =
                  "$($response.id)".Trim()
          }
          elseif (
              $response.data -and
              $response.data.taskId
          ) {
              $exportTaskId =
                  "$($response.data.taskId)".Trim()
          }
          elseif (
              $response.data -and
              $response.data.id
          ) {
              $exportTaskId =
                  "$($response.data.id)".Trim()
          }

          if (-not $exportTaskId) {
              Write-Host (
                  $response |
                      ConvertTo-Json -Depth 20
              )

              throw (
                  'ATX export response contains no task ID.'
              )
          }

          "ATX_EXPORT_TASK_ID=$exportTaskId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "ATX Export Task ID: $exportTaskId"

      # ============================================================
      # 9. POLL ATX EXPORT
      # ============================================================

      - name: Wait for ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ATX_EXPORT_TASK_ID) {
              throw 'ATX_EXPORT_TASK_ID is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $statusUrl = (
              "$env:ONECX_URL/api/report/export/atx/" +
              "$env:ATX_EXPORT_TASK_ID/status" +
              "?projectId=$env:ONECX_PROJECT_ID"
          )

          $successStates = @(
              'FINISHED',
              'COMPLETE',
              'COMPLETED',
              'SUCCESS',
              'SUCCEEDED',
              'DONE'
          )

          $failureStates = @(
              'FAILED',
              'FAILURE',
              'ERROR',
              'ABORTED',
              'CANCELLED',
              'CANCELED'
          )

          $deadline =
              (Get-Date).AddMinutes(30)

          $attempt =
              0

          while ((Get-Date) -lt $deadline) {
              $attempt++

              $response =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $statusUrl `
                      -Headers $headers `
                      -ErrorAction Stop

              if ($response -is [string]) {
                  $responseJson =
                      [string]$response
              }
              else {
                  $responseJson =
                      $response |
                          ConvertTo-Json `
                              -Compress `
                              -Depth 20
              }

              Write-Host (
                  "ATX attempt=$attempt " +
                  "Response=$responseJson"
              )

              $doneProperty =
                  $null

              if ($response -isnot [string]) {
                  $doneProperty =
                      $response.PSObject.Properties[
                          'done'
                      ]
              }

              if ($null -ne $doneProperty) {
                  $doneText =
                      "$($doneProperty.Value)".
                          Trim().
                          ToLowerInvariant()

                  if ($doneText -eq 'true') {
                      Write-Host ''
                      Write-Host '========================================'
                      Write-Host 'ATX EXPORT COMPLETE'
                      Write-Host '========================================'
                      Write-Host "Task ID : $env:ATX_EXPORT_TASK_ID"
                      Write-Host "Name    : $($response.name)"
                      Write-Host 'Done    : true'
                      Write-Host '========================================'

                      exit 0
                  }

                  if ($doneText -eq 'false') {
                      if ($response.progressinfo) {
                          Write-Host (
                              'ATX export still running. ' +
                              "Progress=$($response.progressinfo)"
                          )
                      }
                      else {
                          Write-Host (
                              'ATX export still running. ' +
                              'Done=false'
                          )
                      }

                      Start-Sleep -Seconds 5
                      continue
                  }

                  throw (
                      'ATX status contains invalid done value. ' +
                      "Value=[$doneText]. " +
                      "Response=$responseJson"
                  )
              }

              $state =
                  ''

              if ($response -is [string]) {
                  $state =
                      "$response".
                          Trim().
                          ToUpperInvariant()
              }
              elseif ($response.state) {
                  $state =
                      "$($response.state)".
                          Trim().
                          ToUpperInvariant()
              }
              elseif ($response.status) {
                  $state =
                      "$($response.status)".
                          Trim().
                          ToUpperInvariant()
              }

              if ($state -in $successStates) {
                  Write-Host (
                      "ATX export complete. State=$state"
                  )

                  exit 0
              }

              if ($state -in $failureStates) {
                  throw (
                      "ATX export failed. " +
                      "State=$state. " +
                      "Response=$responseJson"
                  )
              }

              if ($state) {
                  Write-Host (
                      "ATX export still running. State=$state"
                  )

                  Start-Sleep -Seconds 5
                  continue
              }

              throw (
                  'Unable to determine ATX export state. ' +
                  "Response=$responseJson"
              )
          }

          throw 'ATX export polling exceeded 30 minutes.'

      # ============================================================
      # 10. DOWNLOAD ATX ZIP TO WINDOWS RUNNER
      #
      # Confirmed by TestGuide Swagger:
      # GET /api/report/export/atx/{taskId}/download
      # Accept: application/zip
      # No projectId query parameter
      # ============================================================

      - name: Download ATX ZIP to runner
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ONECX_AUTH_KEY) {
              throw 'ONECX_AUTH_KEY is missing.'
          }

          if (-not $env:ATX_EXPORT_TASK_ID) {
              throw 'ATX_EXPORT_TASK_ID is missing.'
          }

          if (-not $env:ATX_DIRECTORY) {
              throw 'ATX_DIRECTORY is missing.'
          }

          if (
              -not (
                  Test-Path `
                      -LiteralPath $env:ATX_DIRECTORY `
                      -PathType Container
              )
          ) {
              New-Item `
                  -ItemType Directory `
                  -Path $env:ATX_DIRECTORY `
                  -Force |
                  Out-Null
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/zip'
          }

          $downloadUrl = (
              "$env:ONECX_URL/api/report/export/atx/" +
              "$env:ATX_EXPORT_TASK_ID/download"
          )

          $safeTargetEcu =
              $env:TARGET_ECU -replace
                  '[\\/:*?"<>|]',
                  '_'

          $zipFileName = (
              "$env:TEST_PLAN_NAME" +
              "_" +
              "$safeTargetEcu" +
              "_" +
              "$env:RUN_TIMESTAMP" +
              ".zip"
          )

          $zipFilePath =
              Join-Path `
                  -Path $env:ATX_DIRECTORY `
                  -ChildPath $zipFileName

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TESTGUIDE -> WINDOWS RUNNER'
          Write-Host '========================================'
          Write-Host "Export Task ID : $env:ATX_EXPORT_TASK_ID"
          Write-Host "Download URL   : $downloadUrl"
          Write-Host 'Accept         : application/zip'
          Write-Host "Runner path    : $zipFilePath"
          Write-Host '========================================'

          try {
              Invoke-WebRequest `
                  -Method Get `
                  -Uri $downloadUrl `
                  -Headers $headers `
                  -OutFile $zipFilePath `
                  -ErrorAction Stop
          }
          catch {
              $statusCode =
                  $null

              if (
                  $_.Exception.Response -and
                  $_.Exception.Response.StatusCode
              ) {
                  $statusCode =
                      [int]$_.Exception.Response.StatusCode
              }

              Write-Host ''
              Write-Host '========================================'
              Write-Host 'ATX ZIP DOWNLOAD FAILED'
              Write-Host '========================================'
              Write-Host "HTTP Status : $statusCode"
              Write-Host "Task ID     : $env:ATX_EXPORT_TASK_ID"
              Write-Host "URL         : $downloadUrl"
              Write-Host 'Accept      : application/zip'
              Write-Host "Error       : $($_.Exception.Message)"
              Write-Host '========================================'

              throw
          }

          if (
              -not (
                  Test-Path `
                      -LiteralPath $zipFilePath `
                      -PathType Leaf
              )
          ) {
              throw (
                  'TestGuide download completed but ZIP ' +
                  "was not created on runner: [$zipFilePath]"
              )
          }

          $zipFile =
              Get-Item `
                  -LiteralPath $zipFilePath `
                  -ErrorAction Stop

          if ($zipFile.Length -le 0) {
              throw (
                  'Downloaded ATX ZIP is empty. ' +
                  "Path=[$zipFilePath]"
              )
          }

          "ATX_FILE_PATH=$zipFilePath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          "ATX_FILE_NAME=$zipFileName" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'ATX ZIP STORED ON RUNNER'
          Write-Host '========================================'
          Write-Host "Path : $zipFilePath"
          Write-Host "Name : $zipFileName"
          Write-Host "Size : $($zipFile.Length) bytes"
          Write-Host '========================================'

      # ============================================================
      # 11. BUILD JFROG DESTINATION
      # ============================================================

      - name: Build JFrog destination
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToSafeSegment {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Value
              )

              $safe =
                  $Value.Trim()

              $safe =
                  $safe -replace '[\\/:*?"<>|]', '_'

              $safe =
                  $safe -replace '\s+', '_'

              $safe =
                  $safe.Trim('.')

              if (-not $safe) {
                  throw (
                      "Invalid JFrog segment: [$Value]"
                  )
              }

              return $safe
          }

          $targetPath = (
              'L2_Quality_Gate/' +
              (
                  Convert-ToSafeSegment `
                      -Value $env:CW_RELEASE
              ) +
              '/' +
              (
                  Convert-ToSafeSegment `
                      -Value $env:TARGET_ECU
              ) +
              '/' +
              (
                  Convert-ToSafeSegment `
                      -Value $env:CATEGORY
              ) +
              '/' +
              (
                  Convert-ToSafeSegment `
                      -Value $env:TEST_PLAN_NAME
              ) +
              '/' +
              (
                  Convert-ToSafeSegment `
                      -Value $env:RUN_TIMESTAMP
              ) +
              '/'
          )

          "JFROG_TARGET_PATH=$targetPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JFROG DESTINATION'
          Write-Host '========================================'
          Write-Host "Target: $targetPath"
          Write-Host '========================================'

      # ============================================================
      # 12. UPLOAD RUNNER ZIP TO JFROG
      # ============================================================

      - name: Upload ATX ZIP from runner to JFrog
        shell: pwsh
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:JFROG_TOKEN) {
              throw 'JFROG_TOKEN is missing.'
          }

          if (-not $env:ATX_FILE_PATH) {
              throw 'ATX_FILE_PATH is missing.'
          }

          if (-not $env:JFROG_TARGET_PATH) {
              throw 'JFROG_TARGET_PATH is missing.'
          }

          if (
              -not (
                  Test-Path `
                      -LiteralPath $env:ATX_FILE_PATH `
                      -PathType Leaf
              )
          ) {
              throw (
                  'ATX ZIP does not exist on runner: ' +
                  "[$env:ATX_FILE_PATH]"
              )
          }

          $file =
              Get-Item `
                  -LiteralPath $env:ATX_FILE_PATH `
                  -ErrorAction Stop

          if ($file.Length -le 0) {
              throw (
                  'ATX ZIP on runner is empty: ' +
                  "[$($file.FullName)]"
              )
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'WINDOWS RUNNER -> JFROG'
          Write-Host '========================================'
          Write-Host "Runner file : $($file.FullName)"
          Write-Host "File name   : $($file.Name)"
          Write-Host "File size   : $($file.Length) bytes"
          Write-Host "JFrog path  : $env:JFROG_TARGET_PATH"
          Write-Host '========================================'

          $segments =
              $env:JFROG_TARGET_PATH.
                  Trim('/').
                  Split('/') |
                  ForEach-Object {
                      [System.Uri]::EscapeDataString(
                          $_
                      )
                  }

          $encodedTarget =
              $segments -join '/'

          $encodedFileName =
              [System.Uri]::EscapeDataString(
                  $file.Name
              )

          $uploadUrl = (
              "$($env:JFROG_URL.TrimEnd('/'))/" +
              "$env:JFROG_REPOSITORY/" +
              "$encodedTarget/" +
              "$encodedFileName"
          )

          Write-Host "JFrog upload URL: $uploadUrl"

          if ($env:JFROG_USER) {
              curl.exe `
                  --fail-with-body `
                  --silent `
                  --show-error `
                  --request PUT `
                  --user "$($env:JFROG_USER):$($env:JFROG_TOKEN)" `
                  --header 'Content-Type: application/zip' `
                  --upload-file "$($file.FullName)" `
                  "$uploadUrl"
          }
          else {
              curl.exe `
                  --fail-with-body `
                  --silent `
                  --show-error `
                  --request PUT `
                  --header "Authorization: Bearer $env:JFROG_TOKEN" `
                  --header 'Content-Type: application/zip' `
                  --upload-file "$($file.FullName)" `
                  "$uploadUrl"
          }

          if ($LASTEXITCODE -ne 0) {
              throw (
                  'JFrog upload failed. ' +
                  "Curl exit code=$LASTEXITCODE"
              )
          }

          $folderUrl = (
              "$($env:JFROG_URL.TrimEnd('/'))/" +
              "$env:JFROG_REPOSITORY/" +
              "$encodedTarget/"
          )

          "JFROG_FILE_URL=$uploadUrl" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          "JFROG_FOLDER_URL=$folderUrl" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JFROG UPLOAD COMPLETE'
          Write-Host '========================================'
          Write-Host "Source : $($file.FullName)"
          Write-Host "Target : $uploadUrl"
          Write-Host '========================================'

      # ============================================================
      # 13. ADD JFROG LOCATION TO JIRA
      # ============================================================

      - name: Add ATX ZIP location to Jira
        shell: pwsh
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:JIRA_KEY) {
              throw 'JIRA_KEY is missing.'
          }

          if (-not $env:JIRA_EMAIL) {
              throw 'JIRA_EMAIL is missing.'
          }

          if (-not $env:JIRA_API_TOKEN) {
              throw 'JIRA_API_TOKEN is missing.'
          }

          if (-not $env:JFROG_FILE_URL) {
              throw 'JFROG_FILE_URL is missing.'
          }

          $runUrl =
              'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          $commentText = (
              "L2 Quality Gate execution completed.`n`n" +
              "Category: $env:CATEGORY`n" +
              "Test Plan: $env:TEST_PLAN_NAME`n" +
              "CW Release: $env:CW_RELEASE`n" +
              "Target ECU: $env:TARGET_ECU`n" +
              "Test Bench: $env:TEST_BENCH`n`n" +
              "New Playbook ID: $env:TESTGUIDE_PLAYBOOK_ID`n" +
              "Execution Task ID: $env:TESTGUIDE_TASK_ID`n" +
              "Execution State: $env:TESTGUIDE_STATE`n" +
              "Execution Verdict: $env:TESTGUIDE_VERDICT`n" +
              "Report ID: $env:TESTGUIDE_REPORT_ID`n" +
              "ATX Export Task ID: $env:ATX_EXPORT_TASK_ID`n`n" +
              "Runner ZIP file: $env:ATX_FILE_PATH`n`n" +
              "JFrog ATX ZIP file:`n" +
              "$env:JFROG_FILE_URL`n`n" +
              "JFrog folder:`n" +
              "$env:JFROG_FOLDER_URL`n`n" +
              "GitHub run:`n" +
              "$runUrl"
          )

          $commentFile =
              Join-Path `
                  -Path $env:RUNNER_TEMP `
                  -ChildPath 'jira-atx-comment.json'

          @{
              body =
                  $commentText
          } |
              ConvertTo-Json -Depth 10 |
              Set-Content `
                  -LiteralPath $commentFile `
                  -Encoding utf8

          $jiraUrl = (
              "$($env:JIRA_BASE_URL.TrimEnd('/'))/" +
              "rest/api/2/issue/" +
              "$env:JIRA_KEY/comment"
          )

          curl.exe `
              --fail-with-body `
              --silent `
              --show-error `
              --request POST `
              --user "$($env:JIRA_EMAIL):$($env:JIRA_API_TOKEN)" `
              --header 'Accept: application/json' `
              --header 'Content-Type: application/json' `
              --data-binary "@$commentFile" `
              "$jiraUrl"

          if ($LASTEXITCODE -ne 0) {
              throw (
                  'Jira comment failed. ' +
                  "Curl exit code=$LASTEXITCODE"
              )
          }

          Write-Host (
              "Jira comment added to $env:JIRA_KEY."
          )

      # ============================================================
      # 14. RETAIN ZIP AND DIAGNOSTICS IN GITHUB
      # ============================================================

      - name: Upload ATX ZIP and diagnostics to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-atx-${{ github.event.client_payload.jira_key }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: 30
