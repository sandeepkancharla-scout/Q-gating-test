name: Jira Dispatch Test

on:
  repository_dispatch:
    types:
      - l2_execution

jobs:
  jira-dispatch-test:
    runs-on: ubuntu-latest

    steps:
      - name: Show Jira payload
        shell: bash
        run: |
          echo "Jira: ${{ github.event.client_payload.jira_key }}"
          echo "Labels: ${{ github.event.client_payload.labels }}"
          echo "CW: ${{ github.event.client_payload.cw_release }}"
          echo "Bench: ${{ github.event.client_payload.test_bench }}"
          echo "ECU: ${{ github.event.client_payload.target_ecu }}"
