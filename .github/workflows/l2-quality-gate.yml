name: L2 Quality Gate - Jira Execution

on:
  repository_dispatch:
    types:
      - l2_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

  JFROG_URL: https://artifactory.sctmtrs.xyz/artifactory
  JFROG_REPOSITORY: eeint-report-files

  JIRA_BASE_URL: https://scoutmotors.atlassian.net

jobs:
  l2-quality-gate:
    name: L2 Quality Gate

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: l2-quality-gate-${{ github.event.client_payload.test_bench }}
      cancel-in-progress: false

    steps:

      # ============================================================
      # 1. READ ALL INPUTS FROM JIRA
      # ============================================================

      - name: Parse and validate Jira inputs
        shell: pwsh

        env:
          JIRA_KEY_RAW: ${{ github.event.client_payload.jira_key }}
          CATEGORY_RAW: ${{ github.event.client_payload.category }}
          CW_RELEASE_RAW: ${{ github.event.client_payload.cw_release }}
          TEST_BENCH_RAW: ${{ github.event.client_payload.test_bench }}
          TARGET_ECU_RAW: ${{ github.event.client_payload.target_ecu }}
          FLASH_ARCHIVE_RAW: ${{ github.event.client_payload.flash_archive_location }}
          RAL_FILE_RAW: ${{ github.event.client_payload.ral_file_location }}
          GIT_SUBMODULE_RAW: ${{ github.event.client_payload.git_submodule }}
          TEST_CASES_RAW: ${{ github.event.client_payload.test_cases }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Clean-Value {
              param($Value)

              if ($null -eq $Value) {
                  return ''
              }

              $clean = "$Value".Trim()
              $clean = $clean -replace '[\r\n]+', ''

              return $clean.Trim()
          }

          $jiraKey =
              Clean-Value $env:JIRA_KEY_RAW

          $categoryInput =
              Clean-Value $env:CATEGORY_RAW

          $cwRelease =
              Clean-Value $env:CW_RELEASE_RAW

          $testBench =
              Clean-Value $env:TEST_BENCH_RAW

          $targetEcu =
              Clean-Value $env:TARGET_ECU_RAW

          $flashArchive =
              Clean-Value $env:FLASH_ARCHIVE_RAW

          $ralFile =
              Clean-Value $env:RAL_FILE_RAW

          $gitSubmodule =
              Clean-Value $env:GIT_SUBMODULE_RAW

          $testCases =
              Clean-Value $env:TEST_CASES_RAW


          # --------------------------------------------------------
          # Normalize controlled values
          # --------------------------------------------------------

          $cwRelease =
              $cwRelease.ToUpperInvariant()

          $testBench =
              $testBench.ToLowerInvariant()


          # --------------------------------------------------------
          # Mandatory values
          # --------------------------------------------------------

          if (-not $jiraKey) {
              throw 'JIRA_KEY is missing.'
          }

          if (-not $categoryInput) {
              throw 'CATEGORY is missing.'
          }

          if (-not $cwRelease) {
              throw 'CW_RELEASE is missing.'
          }

          if (-not $testBench) {
              throw 'TEST_BENCH is missing.'
          }

          if (-not $targetEcu) {
              throw 'TARGET_ECU is missing.'
          }


          # --------------------------------------------------------
          # Validate CW format
          # --------------------------------------------------------

          if ($cwRelease -notmatch '^CW[0-9]{2}$') {
              throw "Invalid CW Release '$cwRelease'. Expected CW45 format."
          }


          # --------------------------------------------------------
          # Normalize Jira category
          # --------------------------------------------------------

          switch ($categoryInput.ToLowerInvariant()) {

              'network_test' {
                  $categoryInput = 'Network_Test'
              }

              'diagnostic_test' {
                  $categoryInput = 'Diagnostic_Test'
              }

              'bootloader_compliance_test' {
                  $categoryInput = 'Bootloader_Compliance_Test'
              }

              default {
                  throw "Unsupported Jira category: '$categoryInput'"
              }
          }


          # --------------------------------------------------------
          # Validate bench
          # --------------------------------------------------------

          if ($testBench -notin @(
              'syshil1',
              'syshil2'
          )) {
              throw "Unsupported Jira bench: '$testBench'"
          }


          # --------------------------------------------------------
          # Export values
          # --------------------------------------------------------

          "JIRA_KEY=$jiraKey" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "CATEGORY_INPUT=$categoryInput" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "CW_RELEASE=$cwRelease" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "TEST_BENCH=$testBench" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "TARGET_ECU=$targetEcu" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "FLASH_ARCHIVE_LOCATION=$flashArchive" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "RAL_FILE_LOCATION=$ralFile" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "GIT_SUBMODULE=$gitSubmodule" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "TEST_CASES=$testCases" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8


          # --------------------------------------------------------
          # Log parsed Jira values
          # --------------------------------------------------------

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PARSED JIRA INPUTS'
          Write-Host '========================================'

          Write-Host "Jira Key      : $jiraKey"
          Write-Host "Category      : $categoryInput"
          Write-Host "CW Release    : $cwRelease"
          Write-Host "Test Bench    : $testBench"
          Write-Host "Target ECU    : $targetEcu"
          Write-Host "Flash Archive : $flashArchive"
          Write-Host "RAL File      : $ralFile"
          Write-Host "Git Submodule : $gitSubmodule"
          Write-Host "Test Cases    : $testCases"

          Write-Host '========================================'


      # ============================================================
      # 2. CHECKOUT PIPELINE REPOSITORY
      # ============================================================

      - name: Checkout Q-gating-test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 3. CHECKOUT L2 QUALITY GATE
      # ============================================================

      - name: Checkout L2 Quality Gate
        uses: actions/checkout@v4
        with:
          repository: scout-motors/eeint-L2-Quality-Gate
          token: ${{ secrets.HIL_REPO_PAT }}
          path: eeint-L2-Quality-Gate
          fetch-depth: 1


      # ============================================================
      # 4. SELECT PROJECT FROM JIRA CATEGORY
      # ============================================================

      - name: Resolve L2 project
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          switch ($env:CATEGORY_INPUT) {

              'Network_Test' {

                  $category =
                      'network-testing'

                  $testName =
                      'NetworkTest'

                  $projectRelative =
                      'eeint-L2-Quality-Gate\ProjectGenerator\Network-Test\NetworkTest.prj'
              }


              'Diagnostic_Test' {

                  $category =
                      'diagnostic-testing'

                  $testName =
                      'DiagnosticTest'

                  $projectRelative =
                      'eeint-L2-Quality-Gate\ProjectGenerator\Diagnostic-Test\DiagnosticTest.prj'
              }


              'Bootloader_Compliance_Test' {

                  $category =
                      'bootloader-compliance'

                  $testName =
                      'BootloaderComplianceTest'

                  $projectRelative =
                      'eeint-L2-Quality-Gate\ProjectGenerator\Bootloader-Compliance-Test\BootloaderComplianceTest.prj'
              }


              default {

                  throw "Unsupported category: $env:CATEGORY_INPUT"
              }
          }


          $projectFile =
              Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $projectRelative


          if (-not (
              Test-Path `
                  -LiteralPath $projectFile `
                  -PathType Leaf
          )) {

              throw "Project not found: $projectFile"
          }


          "CATEGORY=$category" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "TEST_OR_VALIDATOR=$testName" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "SOURCE_PROJECT=$projectFile" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8


          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PROJECT SELECTED'
          Write-Host '========================================'

          Write-Host "Category : $category"
          Write-Host "Test     : $testName"
          Write-Host "Project  : $projectFile"

          Write-Host '========================================'


      # ============================================================
      # 5. RESOLVE HIL
      # ============================================================

      - name: Resolve HIL
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          switch ($env:TEST_BENCH) {

              'syshil1' {

                  $resource =
                      'syshil1-labtest1'

                  $workspace =
                      'D:\HIL\Testing\eeint-L2-Quality-Gate'
              }


              'syshil2' {

                  $resource =
                      'syshil2-labtest2'

                  $workspace =
                      'C:\HIL\Testing\eeint-L2-Quality-Gate'
              }


              default {

                  throw "Unsupported HIL: $env:TEST_BENCH"
              }
          }


          $xilIdentifier =
              "novi_hq/1stfloor/ee_lab_novi/$resource/ControlComputer"


          "RESOURCE_NAME=$resource" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "TESTGUIDE_WORKSPACE=$workspace" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "XIL_IDENTIFIER=$xilIdentifier" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8


          Write-Host ''
          Write-Host '========================================'
          Write-Host 'HIL SELECTED'
          Write-Host '========================================'

          Write-Host "Bench     : $env:TEST_BENCH"
          Write-Host "Resource  : $resource"
          Write-Host "Workspace : $workspace"
          Write-Host "XIL       : $xilIdentifier"

          Write-Host '========================================'


      # ============================================================
      # 6. PREPARE TESTGUIDE WORKSPACE
      # ============================================================

      - name: Prepare TestGuide workspace
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          $projectFolder =
              Join-Path `
                  $env:TESTGUIDE_WORKSPACE `
                  'ProjectGenerator'


          New-Item `
              -ItemType Directory `
              -Path $projectFolder `
              -Force |
              Out-Null


          $projectName =
              Split-Path `
                  $env:SOURCE_PROJECT `
                  -Leaf


          $destination =
              Join-Path `
                  $projectFolder `
                  $projectName


          Copy-Item `
              -LiteralPath $env:SOURCE_PROJECT `
              -Destination $destination `
              -Force


          $projectRelativePath =
              "ProjectGenerator\$projectName"


          $artifactRoot =
              Join-Path `
                  $env:RUNNER_TEMP `
                  'l2-artifacts'


          $atxDirectory =
              Join-Path `
                  $artifactRoot `
                  'atx'


          New-Item `
              -ItemType Directory `
              -Path $atxDirectory `
              -Force |
              Out-Null


          $timestamp =
              Get-Date `
                  -Format 'yyyy-MM-dd_HHmmss'


          "PROJECT_RELATIVE_PATH=$projectRelativePath" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "ARTIFACT_ROOT=$artifactRoot" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "ATX_DIRECTORY=$atxDirectory" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "RUN_TIMESTAMP=$timestamp" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8


          Write-Host "Project copied to: $destination"
          Write-Host "Artifact root: $artifactRoot"


      # ============================================================
      # 7. GENERATE TESTGUIDE PLAYBOOK
      # ============================================================

      - name: Generate TestGuide playbook
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          $targetEcu =
              $env:TARGET_ECU.Trim()


          $constants = @(

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  value =
                      "'$targetEcu'"
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  value =
                      'True'
              }
          )


          if ($env:FLASH_ARCHIVE_LOCATION) {

              $constants += [ordered]@{
                  label =
                      'FLASH_ARCHIVE_LOCATION'

                  value =
                      $env:FLASH_ARCHIVE_LOCATION
              }
          }


          if ($env:RAL_FILE_LOCATION) {

              $constants += [ordered]@{
                  label =
                      'RAL_FILE_LOCATION'

                  value =
                      $env:RAL_FILE_LOCATION
              }
          }


          if ($env:TEST_CASES) {

              $constants += [ordered]@{
                  label =
                      'TEST_CASES'

                  value =
                      $env:TEST_CASES
              }
          }


          $playbook = [ordered]@{

              metadata = [ordered]@{

                  name =
                      "L2-$env:CATEGORY-$env:JIRA_KEY-$env:RUN_TIMESTAMP"

                  taskNameTemplate =
                      '${playbook_name} (${playbook_datetime}) ${distribution_count}'

                  labels =
                      @()
              }


              workspace = [ordered]@{

                  source = [ordered]@{
                      path =
                          $env:TESTGUIDE_WORKSPACE

                      sourceType =
                          'location'
                  }

                  dependencies =
                      @()
              }


              setup = [ordered]@{

                  steps = @(

                      [ordered]@{

                          reuse =
                              'always'

                          keepConfiguration =
                              $false

                          waitMinutesForLicense =
                              0

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'ecuTestStart'
                      }
                  )
              }


              execution = [ordered]@{

                  testcases = @(

                      [ordered]@{

                          relativePath =
                              $env:PROJECT_RELATIVE_PATH

                          constants =
                              $constants

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'project'
                      }
                  )
              }


              teardown = [ordered]@{

                  steps = @(

                      [ordered]@{

                          type =
                              'ecuTestStop'
                      }
                  )
              }


              xilConfigRequirements = @(

                  [ordered]@{

                      label =
                          'Identifier'

                      category =
                          'XIL'

                      value =
                          $env:XIL_IDENTIFIER

                      type =
                          'configuration'
                  }
              )


              parameters = @(

                  [ordered]@{

                      label =
                          'PROJECT_GENERATOR_TARGETECU'

                      defaultValue =
                          "'$targetEcu'"

                      required =
                          $false
                  },

                  [ordered]@{

                      label =
                          'PROJECT_GENERATOR_CT'

                      defaultValue =
                          'True'

                      required =
                          $false
                  }
              )
          }


          $playbookFile =
              Join-Path `
                  $env:ARTIFACT_ROOT `
                  'playbook.json'


          $playbook |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath $playbookFile `
                  -Encoding utf8


          "PLAYBOOK_FILE=$playbookFile" |
              Out-File `
                  $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8


          Write-Host ''
          Write-Host "Generated playbook: $playbookFile"


      # ============================================================
      # 8. CREATE PLAYBOOK USING TESTGUIDE API
      # ============================================================

      - name: Create TestGuide playbook
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'


          if (-not $env:ONECX_AUTH_KEY) {

              throw 'ONECX_AUTH_KEY is missing.'
          }


          if (-not $env:ONECX_PROJECT_ID) {

              throw 'ONECX_PROJECT_ID is missing.'
          }


          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              'Accept' =
                  'application/json'
          }


          $url = (
              "$env:ONECX_URL/api/v2/execution/playbook" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&folder=%2F"
          )


          $body =
              Get-Content `
                  -LiteralPath $env:PLAYBOOK_FILE `
                  -Raw


          Write-Host ''
          Write-Host 'Creating TestGuide playbook'
          Write-Host "URL: $url"


          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $url `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $body `
                  -ErrorAction Stop


          $createResponseFile =
              Join-Path `
                  $env:ARTIFACT_ROOT `
                  'playbook-create-response.json'


          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath $createResponseFile `
                  -Encoding utf8


          $playbookId =
              $response.playbookId


          if (-not $playbookId) {

              $playbookId =
                  $response.id
          }


          if (
              (-not $playbookId) -and
              ($null -ne $response.data)
          ) {

              $playbookId =
                  $response.data.id
          }


          if (-not $playbookId) {

              Write-Host (
                  $response |
                  ConvertTo-Json -Depth 30
              )

              throw 'Create API returned no playbookId.'
          }


          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
              Out-File `
                  $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8


          Write-Host ''
          Write-Host "Playbook ID: $playbookId"


      # ============================================================
      # 9. EXECUTE TESTGUIDE PLAYBOOK
      # ============================================================

      - name: Execute TestGuide playbook
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'


          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              'Accept' =
                  'application/json'
          }


          $url = (
              "$env:ONECX_URL/api/v2/execution/playbook/" +
              "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&checkLastExecution=true"
          )


          $body = [ordered]@{

              parameters = @(

                  [ordered]@{
                      label =
                          'PROJECT_GENERATOR_TARGETECU'

                      value =
                          "'$($env:TARGET_ECU)'"
                  },

                  [ordered]@{
                      label =
                          'PROJECT_GENERATOR_CT'

                      value =
                          'True'
                  }
              )
          } |
              ConvertTo-Json -Depth 10


          Write-Host ''
          Write-Host 'Executing TestGuide playbook'
          Write-Host "Playbook ID: $env:TESTGUIDE_PLAYBOOK_ID"


          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $url `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $body `
                  -ErrorAction Stop


          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          $env:ARTIFACT_ROOT `
                          'playbook-execute-response.json'
                  ) `
                  -Encoding utf8


          $taskId =
              $response.taskId


          if (-not $taskId) {

              $taskId =
                  $response.id
          }


          if (
              (-not $taskId) -and
              ($null -ne $response.data)
          ) {

              $taskId =
                  $response.data.taskId
          }


          if (-not $taskId) {

              Write-Host (
                  $response |
                  ConvertTo-Json -Depth 30
              )

              throw 'Execute API returned no taskId.'
          }


          "TESTGUIDE_TASK_ID=$taskId" |
              Out-File `
                  $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8


          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PLAYBOOK EXECUTION STARTED'
          Write-Host '========================================'
          Write-Host "Playbook: $env:TESTGUIDE_PLAYBOOK_ID"
          Write-Host "Task: $taskId"
          Write-Host "ECU: $env:TARGET_ECU"
          Write-Host "Bench: $env:TEST_BENCH"
          Write-Host '========================================'


      # ============================================================
      # 10. POLL TESTGUIDE EXECUTION
      # ============================================================

      - name: Wait for TestGuide execution
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'


          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              'Accept' =
                  'application/json'
          }


          $url = (
              "$env:ONECX_URL/api/v2/execution/task/" +
              "$env:TESTGUIDE_TASK_ID" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&fields=taskId" +
              "&fields=startDate" +
              "&fields=endDate" +
              "&fields=state" +
              "&fields=stateInfo" +
              "&fields=aggregatedVerdict"
          )


          $deadline =
              (Get-Date).AddMinutes(170)


          $blockedSince =
              $null


          $finished =
              $false


          while ((Get-Date) -lt $deadline) {

              $task =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $url `
                      -Headers $headers `
                      -ErrorAction Stop


              $state =
                  "$($task.state)"


              $verdict =
                  "$($task.aggregatedVerdict)"


              Write-Host (
                  "Task=$env:TESTGUIDE_TASK_ID " +
                  "State=$state " +
                  "Verdict=$verdict"
              )


              if (
                  $state -in @(
                      'FINISHED',
                      'COMPLETED',
                      'SUCCESS',
                      'SUCCEEDED'
                  )
              ) {

                  "TASK_START_DATE=$($task.startDate)" |
                      Out-File `
                          $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8


                  "TASK_END_DATE=$($task.endDate)" |
                      Out-File `
                          $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8


                  "TESTGUIDE_VERDICT=$verdict" |
                      Out-File `
                          $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8


                  $task |
                      ConvertTo-Json -Depth 30 |
                      Set-Content `
                          -LiteralPath (
                              Join-Path `
                                  $env:ARTIFACT_ROOT `
                                  'task-result.json'
                          ) `
                          -Encoding utf8


                  $finished =
                      $true


                  break
              }


              if (
                  $state -in @(
                      'ERROR',
                      'FAILED',
                      'ABORTED',
                      'CANCELLED',
                      'CANCELED'
                  )
              ) {

                  throw (
                      "Execution failed. " +
                      "State=$state " +
                      "Info=$($task.stateInfo)"
                  )
              }


              if ($state -eq 'BLOCKED') {

                  if (-not $blockedSince) {

                      $blockedSince =
                          Get-Date
                  }


                  $blockedMinutes =
                      (
                          (Get-Date) -
                          $blockedSince
                      ).TotalMinutes


                  if ($blockedMinutes -ge 5) {

                      throw (
                          'Execution remained BLOCKED ' +
                          'for five minutes.'
                      )
                  }
              }
              else {

                  $blockedSince =
                      $null
              }


              Start-Sleep -Seconds 10
          }


          if (-not $finished) {

              throw (
                  'TestGuide execution timed out ' +
                  'after 170 minutes.'
              )
          }


      # ============================================================
      # 11. DOWNLOAD ATX FROM TESTGUIDE
      # ============================================================

      - name: Download ATX artifacts
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'


          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              'Accept' =
                  'application/json'
          }


          $depositoryUrl = (
              "$env:ONECX_URL/api/artifact/depositories" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&shared=false"
          )


          $depositoryResponse =
              Invoke-RestMethod `
                  -Method Get `
                  -Uri $depositoryUrl `
                  -Headers $headers `
                  -ErrorAction Stop


          if ($depositoryResponse.items) {

              $depositories =
                  @($depositoryResponse.items)
          }
          else {

              $depositories =
                  @($depositoryResponse)
          }


          if (-not $env:TASK_START_DATE) {

              throw 'Task start date is missing.'
          }


          if (-not $env:TASK_END_DATE) {

              throw 'Task end date is missing.'
          }


          $startDate =
              Get-Date `
                  $env:TASK_START_DATE


          $endDate =
              Get-Date `
                  $env:TASK_END_DATE


          $from =
              $startDate.
                  AddMinutes(-2).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ'
                  )


          $to =
              $endDate.
                  AddMinutes(15).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ'
                  )


          $downloadCount =
              0


          foreach ($depository in $depositories) {

              $depositoryId =
                  "$($depository.id)"


              if (-not $depositoryId) {

                  continue
              }


              Write-Host (
                  "Checking depository: " +
                  "$depositoryId"
              )


              # Depository IDs are expected to be simple names.
              # Dates are sent directly as ISO timestamps.

              $artifactUrl = (
                  "$env:ONECX_URL/api/artifact/artifacts" +
                  "?depositoryId=$depositoryId" +
                  "&startDate=$from" +
                  "&endDate=$to"
              )


              try {

                  $artifactResponse =
                      Invoke-RestMethod `
                          -Method Get `
                          -Uri $artifactUrl `
                          -Headers $headers `
                          -ErrorAction Stop
              }
              catch {

                  Write-Warning (
                      "Unable to query depository " +
                      "$depositoryId"
                  )

                  continue
              }


              if ($artifactResponse.items) {

                  $artifacts =
                      @($artifactResponse.items)
              }
              else {

                  $artifacts =
                      @($artifactResponse)
              }


              foreach ($artifact in $artifacts) {

                  $fileName =
                      "$($artifact.fileName)"


                  $extension =
                      "$($artifact.extension)".
                          TrimStart('.').
                          ToLowerInvariant()


                  if (
                      ($extension -ne 'atx') -and
                      ($fileName -notmatch '(?i)\.atx$')
                  ) {

                      continue
                  }


                  $artifactId =
                      "$($artifact.id)"


                  if (-not $artifactId) {

                      continue
                  }


                  if (-not $fileName) {

                      $fileName =
                          "$artifactId.atx"
                  }


                  $downloadUrl = (
                      "$env:ONECX_URL/api/artifact/artifacts/" +
                      "$artifactId/download"
                  )


                  $destination =
                      Join-Path `
                          $env:ATX_DIRECTORY `
                          $fileName


                  Write-Host (
                      "Downloading ATX: " +
                      "$fileName"
                  )


                  Invoke-WebRequest `
                      -Method Get `
                      -Uri $downloadUrl `
                      -Headers $headers `
                      -OutFile $destination `
                      -ErrorAction Stop


                  $downloadedFile =
                      Get-Item `
                          -LiteralPath $destination


                  if (
                      $downloadedFile.Length -eq 0
                  ) {

                      throw (
                          'Downloaded ATX is empty: ' +
                          "$fileName"
                      )
                  }


                  $downloadCount++
              }
          }


          if ($downloadCount -eq 0) {

              throw (
                  'No ATX artifacts were found ' +
                  'for this execution.'
              )
          }


          Write-Host ""
          Write-Host (
              "Downloaded ATX files: " +
              "$downloadCount"
          )


      # ============================================================
      # 12. BUILD JFROG DESTINATION
      # ============================================================

      - name: Build JFrog destination
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'


          $segments = @(
              $env:CW_RELEASE
              $env:TARGET_ECU
              $env:CATEGORY
              $env:TEST_OR_VALIDATOR
              $env:RUN_TIMESTAMP
          )


          foreach ($segment in $segments) {

              if (
                  $segment -notmatch
                  '^[A-Za-z0-9._-]+$'
              ) {

                  throw (
                      "Unsafe JFrog path segment: " +
                      "$segment"
                  )
              }
          }


          $targetPath = (
              'L2_Quality_Gate/' +
              ($segments -join '/') +
              '/'
          )


          "JFROG_TARGET_PATH=$targetPath" |
              Out-File `
                  $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8


          Write-Host ''
          Write-Host 'JFROG DESTINATION'
          Write-Host $targetPath


      # ============================================================
      # 13. UPLOAD ATX TO JFROG
      # ============================================================

      - name: Upload ATX to JFrog
        shell: pwsh

        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'


          if (-not $env:JFROG_TOKEN) {

              throw 'JFROG_TOKEN is missing.'
          }


          $files =
              Get-ChildItem `
                  -LiteralPath $env:ATX_DIRECTORY `
                  -Filter '*.atx' `
                  -File


          if (-not $files) {

              throw 'No ATX files to upload.'
          }


          foreach ($file in $files) {

              $uploadUrl = (
                  "$($env:JFROG_URL.TrimEnd('/'))/" +
                  "$env:JFROG_REPOSITORY/" +
                  "$env:JFROG_TARGET_PATH" +
                  "$($file.Name)"
              )


              Write-Host (
                  "Uploading: " +
                  "$($file.Name)"
              )


              Invoke-RestMethod `
                  -Method Put `
                  -Uri $uploadUrl `
                  -Headers @{
                      Authorization =
                          "Bearer $env:JFROG_TOKEN"
                  } `
                  -InFile $file.FullName `
                  -ContentType 'application/octet-stream' `
                  -ErrorAction Stop
          }


          $folderUrl = (
              "$($env:JFROG_URL.TrimEnd('/'))/" +
              "$env:JFROG_REPOSITORY/" +
              "$env:JFROG_TARGET_PATH"
          )


          "JFROG_REPORT_URL=$folderUrl" |
              Out-File `
                  $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8


      # ============================================================
      # 14. GITHUB ACTIONS ARTIFACT
      # ============================================================

      - name: Upload pipeline artifacts
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: l2-${{ github.event.client_payload.jira_key }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: 30


      # ============================================================
      # 15. COMMENT RESULT ON JIRA
      # ============================================================

      - name: Comment result on Jira
        if: always()

        continue-on-error: true

        shell: pwsh

        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

        run: |
          if (-not $env:JIRA_KEY) {

              exit 0
          }


          if (
              (-not $env:JIRA_EMAIL) -or
              (-not $env:JIRA_API_TOKEN)
          ) {

              Write-Warning (
                  'Jira credentials are missing. ' +
                  'Skipping Jira comment.'
              )

              exit 0
          }


          if (
              '${{ job.status }}' -eq
              'success'
          ) {

              $status =
                  'COMPLETED'
          }
          else {

              $status =
                  'FAILED'
          }


          $githubRunUrl =
              'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'


          $comment = @"
          L2 Quality Gate execution $status

          Jira: $env:JIRA_KEY
          Category: $env:CATEGORY
          Test/Validator: $env:TEST_OR_VALIDATOR
          CW Release: $env:CW_RELEASE
          Target ECU: $env:TARGET_ECU
          Test Bench: $env:TEST_BENCH

          TestGuide Playbook ID:
          $env:TESTGUIDE_PLAYBOOK_ID

          TestGuide Task ID:
          $env:TESTGUIDE_TASK_ID

          Verdict:
          $env:TESTGUIDE_VERDICT

          GitHub Run:
          $githubRunUrl

          JFrog:
          $env:JFROG_REPORT_URL
          "@


          $commentFile =
              Join-Path `
                  $env:RUNNER_TEMP `
                  'jira-comment.json'


          @{
              body = $comment
          } |
              ConvertTo-Json |
              Set-Content `
                  -LiteralPath $commentFile `
                  -Encoding utf8


          # curl.exe handles Basic Authentication safely,
          # avoiding manual Base64 generation in PowerShell.

          curl.exe `
              --fail-with-body `
              --silent `
              --show-error `
              --request POST `
              --user "$($env:JIRA_EMAIL):$($env:JIRA_API_TOKEN)" `
              --header "Accept: application/json" `
              --header "Content-Type: application/json" `
              --data-binary "@$commentFile" `
              "$env:JIRA_BASE_URL/rest/api/2/issue/$env:JIRA_KEY/comment"


      # ============================================================
      # 16. GITHUB SUMMARY
      # ============================================================

      - name: Write execution summary
        if: always()

        shell: pwsh

        run: |
          @"
          ## L2 Quality Gate

          - Jira: $env:JIRA_KEY
          - Category: $env:CATEGORY
          - Test/Validator: $env:TEST_OR_VALIDATOR
          - CW Release: $env:CW_RELEASE
          - ECU: $env:TARGET_ECU
          - Bench: $env:TEST_BENCH
          - Project: $env:PROJECT_RELATIVE_PATH
          - Playbook ID: $env:TESTGUIDE_PLAYBOOK_ID
          - Task ID: $env:TESTGUIDE_TASK_ID
          - Verdict: $env:TESTGUIDE_VERDICT
          - JFrog Path: $env:JFROG_TARGET_PATH
          - JFrog URL: $env:JFROG_REPORT_URL
          "@ |
              Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY `
                  -Append `
                  -Encoding utf8
