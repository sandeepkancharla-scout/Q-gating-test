name: L2 Quality Gate - Jira Execution

on:
  repository_dispatch:
    types:
      - l2_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}
  JFROG_URL: https://artifactory.sctmtrs.xyz/artifactory
  JFROG_REPOSITORY: eeint-report-files
  JIRA_BASE_URL: https://scoutmotors.atlassian.net

jobs:
  l2-quality-gate:
    name: L2 Quality Gate
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: l2-quality-gate-${{ github.event.client_payload.test_bench }}
      cancel-in-progress: false

    steps:
      # ============================================================
      # 1. PARSE JIRA INPUTS
      # ============================================================

      - name: Parse Jira inputs
        shell: pwsh
        env:
          JIRA_KEY_RAW: ${{ github.event.client_payload.jira_key }}
          CATEGORY_RAW: ${{ github.event.client_payload.category }}
          CW_RAW: ${{ github.event.client_payload.cw_release }}
          BENCH_RAW: ${{ github.event.client_payload.test_bench }}
          ECU_RAW: ${{ github.event.client_payload.target_ecu }}
          FLASH_RAW: ${{ github.event.client_payload.flash_archive_location }}
          RAL_RAW: ${{ github.event.client_payload.ral_file_location }}
          SUBMODULE_RAW: ${{ github.event.client_payload.git_submodule }}
          TEST_CASES_RAW: ${{ github.event.client_payload.test_cases }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Clean-Value {
              param($Value)

              if ($null -eq $Value) {
                  return ''
              }

              return (
                  "$Value" -replace '[\r\n]+', ' '
              ).Trim()
          }

          function Clean-Path {
              param($Value)

              $result = Clean-Value $Value

              while (
                  $result.Length -ge 2 -and
                  $result.StartsWith('"') -and
                  $result.EndsWith('"')
              ) {
                  $result =
                      $result.Substring(
                          1,
                          $result.Length - 2
                      ).Trim()
              }

              return $result
          }

          $jira =
              Clean-Value $env:JIRA_KEY_RAW

          $category =
              Clean-Value $env:CATEGORY_RAW

          $cw =
              (
                  Clean-Value $env:CW_RAW
              ).ToUpperInvariant()

          $bench =
              (
                  Clean-Value $env:BENCH_RAW
              ).ToLowerInvariant()

          $ecu =
              Clean-Value $env:ECU_RAW

          $flash =
              Clean-Path $env:FLASH_RAW

          $ral =
              Clean-Path $env:RAL_RAW

          $submodule =
              Clean-Value $env:SUBMODULE_RAW

          $testCases =
              Clean-Value $env:TEST_CASES_RAW

          if (-not $jira) {
              throw 'jira_key is missing.'
          }

          if (-not $category) {
              throw 'category is missing.'
          }

          if ($cw -notmatch '^CW[0-9]{2}$') {
              throw "Invalid CW release: $cw"
          }

          if (
              $bench -notin @(
                  'syshil1',
                  'syshil2'
              )
          ) {
              throw "Unsupported bench: $bench"
          }

          if (-not $ecu) {
              throw 'target_ecu is missing.'
          }

          switch ($category.ToLowerInvariant()) {
              'network_test' {
                  $category = 'Network_Test'
              }

              'network_testing' {
                  $category = 'Network_Test'
              }

              'diagnostic_test' {
                  $category = 'Diagnostic_Test'
              }

              'diagnostic_testing' {
                  $category = 'Diagnostic_Test'
              }

              'bootloader_compliance_test' {
                  $category =
                      'Bootloader_Compliance_Test'
              }

              default {
                  throw "Unsupported category: $category"
              }
          }

          if (
              $category -eq 'Diagnostic_Test' -and
              -not $ral
          ) {
              throw (
                  'Diagnostic_Test requires ' +
                  'ral_file_location.'
              )
          }

          if (
              $category -eq 'Bootloader_Compliance_Test' -and
              -not $flash
          ) {
              throw (
                  'Bootloader_Compliance_Test requires ' +
                  'flash_archive_location.'
              )
          }

          $values = [ordered]@{
              JIRA_KEY =
                  $jira

              CATEGORY_INPUT =
                  $category

              CW_RELEASE =
                  $cw

              TEST_BENCH =
                  $bench

              TARGET_ECU =
                  $ecu

              FLASH_ARCHIVE_LOCATION =
                  $flash

              RAL_FILE_LOCATION =
                  $ral

              GIT_SUBMODULE =
                  $submodule

              TEST_CASES =
                  $testCases
          }

          foreach ($item in $values.GetEnumerator()) {
              "$($item.Key)=$($item.Value)" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JIRA INPUTS'
          Write-Host '========================================'
          Write-Host "Jira       : $jira"
          Write-Host "Category   : $category"
          Write-Host "CW         : $cw"
          Write-Host "Bench      : $bench"
          Write-Host "ECU        : $ecu"
          Write-Host "Flash File : $flash"
          Write-Host "RAL File   : $ral"
          Write-Host "Submodule  : $submodule"
          Write-Host "Test Cases : $testCases"
          Write-Host '========================================'

      # ============================================================
      # 2. CHECKOUT
      # ============================================================

      - name: Checkout pipeline repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout L2 Quality Gate
        uses: actions/checkout@v4
        with:
          repository: scout-motors/eeint-L2-Quality-Gate
          token: ${{ secrets.HIL_REPO_PAT }}
          path: source-l2
          fetch-depth: 1
          submodules: recursive

      # ============================================================
      # 3. ROUTE CATEGORY AND PREPARE WORKSPACE
      # ============================================================

      - name: Route category and prepare workspace
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          switch ($env:CATEGORY_INPUT) {
              'Network_Test' {
                  $category = 'network-testing'
                  $testName = 'NetworkTest'
                  $playbookName = 'L2-network-testing'
                  $project = 'Packages\L2-Quality-Gate\ProjectGenerator\Network-Test\NetworkTest.prj'
              }

              'Diagnostic_Test' {
                  $category = 'diagnostic-testing'
                  $testName = 'DiagnosticTest'
                  $playbookName = 'L2-Diagnostic-testing'
                  $project = 'Packages\L2-Quality-Gate\ProjectGenerator\Diagnostic-Test\DiagnosticTest.prj'
              }

              'Bootloader_Compliance_Test' {
                  $category = 'bootloader-compliance'
                  $testName = 'BootloaderComplianceTest'
                  $playbookName = 'L2-Bootloader-testing'
                  $project = 'Packages\L2-Quality-Gate\ProjectGenerator\Bootloader-Compliance-Test\BootloaderComplianceTest.prj'
              }

              default {
                  throw (
                      "Unsupported category: " +
                      "$env:CATEGORY_INPUT"
                  )
              }
          }

          switch ($env:TEST_BENCH) {
              'syshil1' {
                  $resource = 'syshil1-labtest1'
                  $configurationFolder = 'SUBSYS1'
              }

              'syshil2' {
                  $resource = 'syshil2-labtest2'
                  $configurationFolder = 'SUBSYS1'
              }

              default {
                  throw (
                      "Unsupported bench: " +
                      "$env:TEST_BENCH"
                  )
              }
          }

          $workspace =
              'C:\HIL\Testing\eeint-Test-Automation'

          $project =
              $project.Trim().Trim('"')

          if ($project.Contains('"')) {
              throw (
                  "Illegal quote inside project path: " +
                  "$project"
              )
          }

          $source =
              Join-Path `
                  $env:GITHUB_WORKSPACE `
                  'source-l2'

          $destination =
              Join-Path `
                  $workspace `
                  'Packages\L2-Quality-Gate'

          New-Item `
              -ItemType Directory `
              -Path $destination `
              -Force |
              Out-Null

          Copy-Item `
              -Path (
                  Join-Path `
                      $source `
                      '*'
              ) `
              -Destination $destination `
              -Recurse `
              -Force

          $fullProject =
              Join-Path `
                  $workspace `
                  $project

          if (
              -not (
                  Test-Path `
                      -LiteralPath $fullProject `
                      -PathType Leaf
              )
          ) {
              throw "Project does not exist: $fullProject"
          }

          $tbc = (
              "Configurations\" +
              "$configurationFolder\" +
              "${configurationFolder}_TestBenchConfig.tbc"
          )

          $tcf = (
              "Configurations\" +
              "$configurationFolder\" +
              "${configurationFolder}_TestConfig.tcf"
          )

          if (
              -not (
                  Test-Path `
                      -LiteralPath (
                          Join-Path `
                              $workspace `
                              $tbc
                      ) `
                      -PathType Leaf
              )
          ) {
              throw "TBC is missing: $tbc"
          }

          if (
              -not (
                  Test-Path `
                      -LiteralPath (
                          Join-Path `
                              $workspace `
                              $tcf
                      ) `
                      -PathType Leaf
              )
          ) {
              throw "TCF is missing: $tcf"
          }

          if (
              $env:CATEGORY_INPUT -eq 'Diagnostic_Test' -and
              -not (
                  Test-Path `
                      -LiteralPath $env:RAL_FILE_LOCATION `
                      -PathType Leaf
              )
          ) {
              throw (
                  "RAL file does not exist: " +
                  "$env:RAL_FILE_LOCATION"
              )
          }

          if (
              $env:CATEGORY_INPUT -eq 'Bootloader_Compliance_Test' -and
              -not (
                  Test-Path `
                      -LiteralPath $env:FLASH_ARCHIVE_LOCATION `
                      -PathType Leaf
              )
          ) {
              throw (
                  "Bootloader file does not exist: " +
                  "$env:FLASH_ARCHIVE_LOCATION"
              )
          }

          $artifactRoot =
              Join-Path `
                  $env:RUNNER_TEMP `
                  'l2-artifacts'

          $atxDirectory =
              Join-Path `
                  $artifactRoot `
                  'atx'

          New-Item `
              -ItemType Directory `
              -Path $atxDirectory `
              -Force |
              Out-Null

          $values = [ordered]@{
              CATEGORY =
                  $category

              TEST_OR_VALIDATOR =
                  $testName

              PLAYBOOK_NAME =
                  $playbookName

              PROJECT_RELATIVE_PATH =
                  $project

              RESOURCE_NAME =
                  $resource

              TESTGUIDE_WORKSPACE =
                  $workspace

              TBC_RELATIVE_PATH =
                  $tbc

              TCF_RELATIVE_PATH =
                  $tcf

              XIL_IDENTIFIER =
                  "novi_hq/1stfloor/ee_lab_novi/$resource/ControlComputer"

              ARTIFACT_ROOT =
                  $artifactRoot

              ATX_DIRECTORY =
                  $atxDirectory

              RUN_TIMESTAMP =
                  Get-Date -Format 'yyyy-MM-dd_HHmmss'
          }

          foreach ($item in $values.GetEnumerator()) {
              "$($item.Key)=$($item.Value)" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'SELECTED EXECUTION'
          Write-Host '========================================'
          Write-Host "Category : $category"
          Write-Host "Playbook : $playbookName"
          Write-Host "Project  : [$project]"
          Write-Host "Resource : $resource"
          Write-Host "TBC      : $tbc"
          Write-Host "TCF      : $tcf"
          Write-Host '========================================'

      # ============================================================
      # 4. GENERATE SELECTED PLAYBOOK
      # ============================================================

      - name: Generate selected TestGuide playbook
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToExpressionPath {
              param([string]$Path)

              $clean =
                  $Path.Trim().Trim('"')

              $escaped =
                  $clean.Replace(
                      '\',
                      '\\'
                  )

              return (
                  '"' +
                  $escaped +
                  '"'
              )
          }

          $ecuExpression =
              "'" +
              $env:TARGET_ECU +
              "'"

          $constants = @(
              [ordered]@{
                  label = 'PROJECT_GENERATOR_TARGETECU'
                  value = $ecuExpression
              },

              [ordered]@{
                  label = 'PROJECT_GENERATOR_CT'
                  value = 'True'
              }
          )

          $parameters = @(
              [ordered]@{
                  label = 'PROJECT_GENERATOR_TARGETECU'
                  defaultValue = $ecuExpression
                  required = $false
              },

              [ordered]@{
                  label = 'PROJECT_GENERATOR_CT'
                  defaultValue = 'True'
                  required = $false
              }
          )

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              $value =
                  Convert-ToExpressionPath `
                      $env:RAL_FILE_LOCATION

              $constants += [ordered]@{
                  label = 'PROJECT_GENERATOR_RAL_FILE_PATH'
                  value = $value
              }

              $parameters += [ordered]@{
                  label = 'PROJECT_GENERATOR_RAL_FILE_PATH'
                  defaultValue = $value
                  required = $false
              }
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              $value =
                  Convert-ToExpressionPath `
                      $env:FLASH_ARCHIVE_LOCATION

              $constants += [ordered]@{
                  label = 'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'
                  value = $value
              }

              $parameters += [ordered]@{
                  label = 'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'
                  defaultValue = $value
                  required = $false
              }
          }

          $playbook = [ordered]@{
              metadata = [ordered]@{
                  name = (
                      "$env:PLAYBOOK_NAME-" +
                      "$env:JIRA_KEY-" +
                      "$env:RUN_TIMESTAMP"
                  )

                  taskNameTemplate =
                      '${playbook_name} (${playbook_datetime}) ${distribution_count}'

                  labels =
                      @()
              }

              workspace = [ordered]@{
                  source = [ordered]@{
                      path = $env:TESTGUIDE_WORKSPACE
                      sourceType = 'location'
                  }

                  dependencies =
                      @()
              }

              setup = [ordered]@{
                  steps = @(
                      [ordered]@{
                          reuse = 'always'
                          keepConfiguration = $false
                          waitMinutesForLicense = 0
                          stepName = "ecu.test $env:RESOURCE_NAME Start"
                          type = 'ecuTestStart'
                      },

                      [ordered]@{
                          tbcPath = $env:TBC_RELATIVE_PATH
                          tcfPath = $env:TCF_RELATIVE_PATH
                          stepName = 'Test Configuration Selection'
                          type = 'configuration'
                      }
                  )
              }

              execution = [ordered]@{
                  testcases = @(
                      [ordered]@{
                          relativePath = $env:PROJECT_RELATIVE_PATH
                          constants = $constants
                          stepName = "ecu.test $env:RESOURCE_NAME Start"
                          type = 'project'
                      }
                  )
              }

              teardown = [ordered]@{
                  steps = @(
                      [ordered]@{
                          type = 'ecuTestStop'
                      }
                  )
              }

              xilConfigRequirements = @(
                  [ordered]@{
                      label = 'Identifier'
                      category = 'XIL'
                      value = $env:XIL_IDENTIFIER
                      type = 'configuration'
                  }
              )

              parameters =
                  $parameters
          }

          $playbookFile =
              Join-Path `
                  $env:ARTIFACT_ROOT `
                  'playbook.json'

          $playbook |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath $playbookFile `
                  -Encoding utf8

          "PLAYBOOK_FILE=$playbookFile" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

      # ============================================================
      # 5. CREATE PLAYBOOK
      # ============================================================

      - name: Create TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ONECX_AUTH_KEY) {
              throw 'ONECX_AUTH_KEY is missing.'
          }

          if (-not $env:ONECX_PROJECT_ID) {
              throw 'ONECX_PROJECT_ID is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
              Accept = 'application/json'
          }

          $url = (
              "$env:ONECX_URL/api/v2/execution/playbook" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&folder=%2F"
          )

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $url `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body (
                      Get-Content `
                          $env:PLAYBOOK_FILE `
                          -Raw
                  ) `
                  -ErrorAction Stop

          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          $env:ARTIFACT_ROOT `
                          'create-response.json'
                  ) `
                  -Encoding utf8

          $id =
              $null

          if ($response.playbookId) {
              $id = $response.playbookId
          }
          elseif ($response.id) {
              $id = $response.id
          }
          elseif ($response.data) {
              $id = $response.data.id
          }

          if (-not $id) {
              throw 'Create API returned no playbook ID.'
          }

          "TESTGUIDE_PLAYBOOK_ID=$id" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Playbook ID: $id"

      # ============================================================
      # 6. EXECUTE PLAYBOOK
      # ============================================================

      - name: Execute selected TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToExpressionPath {
              param([string]$Path)

              $clean =
                  $Path.Trim().Trim('"')

              return (
                  '"' +
                  $clean.Replace('\', '\\') +
                  '"'
              )
          }

          $parameters = @(
              [ordered]@{
                  label = 'PROJECT_GENERATOR_TARGETECU'
                  value = "'$($env:TARGET_ECU)'"
              },

              [ordered]@{
                  label = 'PROJECT_GENERATOR_CT'
                  value = 'True'
              }
          )

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              $parameters += [ordered]@{
                  label = 'PROJECT_GENERATOR_RAL_FILE_PATH'
                  value = (
                      Convert-ToExpressionPath `
                          $env:RAL_FILE_LOCATION
                  )
              }
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              $parameters += [ordered]@{
                  label = 'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'
                  value = (
                      Convert-ToExpressionPath `
                          $env:FLASH_ARCHIVE_LOCATION
                  )
              }
          }

          $headers = @{
              'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
              Accept = 'application/json'
          }

          $url = (
              "$env:ONECX_URL/api/v2/execution/playbook/" +
              "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&checkLastExecution=true"
          )

          $body = @{
              parameters = $parameters
          } |
              ConvertTo-Json -Depth 20

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $url `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $body `
                  -ErrorAction Stop

          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          $env:ARTIFACT_ROOT `
                          'execute-response.json'
                  ) `
                  -Encoding utf8

          $taskId =
              $null

          if ($response.taskIds) {
              $taskId = @($response.taskIds)[0]
          }
          elseif ($response.taskId) {
              $taskId = $response.taskId
          }
          elseif ($response.id) {
              $taskId = $response.id
          }
          elseif (
              $response.data -and
              $response.data.taskIds
          ) {
              $taskId = @($response.data.taskIds)[0]
          }
          elseif (
              $response.data -and
              $response.data.taskId
          ) {
              $taskId = $response.data.taskId
          }

          if (-not $taskId) {
              throw 'Execute API returned no task ID.'
          }

          "TESTGUIDE_TASK_ID=$taskId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Task ID: $taskId"

      # ============================================================
      # 7. POLL EVERY 15 SECONDS UNTIL ANY TERMINAL STATE
      # ============================================================

      - name: Wait for TestGuide terminal state
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
              Accept = 'application/json'
          }

          $url = (
              "$env:ONECX_URL/api/v2/execution/task/" +
              "$env:TESTGUIDE_TASK_ID" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&fields=taskId" +
              "&fields=startDate" +
              "&fields=endDate" +
              "&fields=state" +
              "&fields=stateInfo" +
              "&fields=aggregatedVerdict" +
              "&fields=abortedByUser"
          )

          $completeStates = @(
              'FINISHED',
              'COMPLETED',
              'COMPLETE',
              'SUCCESS',
              'SUCCEEDED',
              'DONE'
          )

          $abortStates = @(
              'ABORTED',
              'ABORT'
          )

          $failureStates = @(
              'ERROR',
              'FAILED',
              'FAILURE'
          )

          $cancelStates = @(
              'CANCELLED',
              'CANCELED'
          )

          $deadline =
              (Get-Date).AddMinutes(180)

          while (
              (Get-Date) -lt
              $deadline
          ) {
              $task =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $url `
                      -Headers $headers `
                      -ErrorAction Stop

              $state =
                  "$($task.state)".
                      Trim().
                      ToUpperInvariant()

              $verdict =
                  "$($task.aggregatedVerdict)".
                      Trim()

              $stateInfo =
                  "$($task.stateInfo)".
                      Trim()

              $startDate =
                  "$($task.startDate)".
                      Trim()

              $endDate =
                  "$($task.endDate)".
                      Trim()

              $abortedBy =
                  "$($task.abortedByUser)".
                      Trim()

              Write-Host (
                  "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') " +
                  "Task=$env:TESTGUIDE_TASK_ID " +
                  "State=[$state] " +
                  "Verdict=[$verdict] " +
                  "EndDate=[$endDate]"
              )

              $task |
                  ConvertTo-Json -Depth 30 |
                  Set-Content `
                      -LiteralPath (
                          Join-Path `
                              $env:ARTIFACT_ROOT `
                              'task-latest.json'
                      ) `
                      -Encoding utf8

              $terminal =
                  ($state -in $completeStates) -or
                  ($state -in $abortStates) -or
                  ($state -in $failureStates) -or
                  ($state -in $cancelStates)

              # If TestGuide returns an unexpected final state but
              # endDate is populated, the execution has ended.
              if (
                  -not $terminal -and
                  $endDate
              ) {
                  Write-Warning (
                      "Task has endDate but returned " +
                      "unrecognized state '$state'. " +
                      'Treating the task as complete.'
                  )

                  $terminal = $true
              }

              if ($terminal) {
                  $safeInfo =
                      (
                          $stateInfo -replace
                          '[\r\n]+',
                          ' '
                      ).Trim()

                  "TASK_START_DATE=$startDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TASK_END_DATE=$endDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_STATE=$state" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_VERDICT=$verdict" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_MESSAGE=$safeInfo" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  $task |
                      ConvertTo-Json -Depth 30 |
                      Set-Content `
                          -LiteralPath (
                              Join-Path `
                                  $env:ARTIFACT_ROOT `
                                  'task-result.json'
                          ) `
                          -Encoding utf8

                  # Normal completion or an unknown state with an
                  # endDate continues to ATX download.
                  if (
                      ($state -in $completeStates) -or
                      (
                          $endDate -and
                          $state -notin $abortStates -and
                          $state -notin $failureStates -and
                          $state -notin $cancelStates
                      )
                  ) {
                      Write-Host (
                          "Execution ended. State=$state. " +
                          'Moving to ATX download.'
                      )

                      exit 0
                  }

                  # Aborted/failed/cancelled: stop polling and fail,
                  # while preserving the exact TestGuide message.
                  if (-not $safeInfo) {
                      if ($state -in $abortStates) {
                          $safeInfo =
                              'TestGuide execution was aborted.'
                      }
                      elseif ($state -in $cancelStates) {
                          $safeInfo =
                              'TestGuide execution was cancelled.'
                      }
                      else {
                          $safeInfo =
                              'TestGuide returned no failure message.'
                      }
                  }

                  $message = (
                      "TestGuide execution ended. " +
                      "State=$state; " +
                      "Task=$env:TESTGUIDE_TASK_ID; " +
                      "Verdict=$verdict; " +
                      "Message=$safeInfo"
                  )

                  if ($abortedBy) {
                      $message += (
                          "; AbortedBy=$abortedBy"
                      )
                  }

                  $message |
                      Set-Content `
                          -LiteralPath (
                              Join-Path `
                                  $env:ARTIFACT_ROOT `
                                  'testguide-error.txt'
                          ) `
                          -Encoding utf8

                  throw $message
              }

              Write-Host (
                  "Task is still active. State=$state. " +
                  'Polling again in 15 seconds...'
              )

              Start-Sleep -Seconds 15
          }

          throw (
              'Polling exceeded 180 minutes. ' +
              "Task=$env:TESTGUIDE_TASK_ID"
          )

      # ============================================================
      # 8. DOWNLOAD ATX AFTER COMPLETION
      # ============================================================

      - name: Download ATX report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' = $env:ONECX_AUTH_KEY
              Accept = 'application/json'
          }

          $response =
              Invoke-RestMethod `
                  -Uri (
                      "$env:ONECX_URL/api/artifact/depositories" +
                      "?projectId=$env:ONECX_PROJECT_ID" +
                      "&shared=false"
                  ) `
                  -Headers $headers `
                  -ErrorAction Stop

          if ($response.items) {
              $depositories = @($response.items)
          }
          else {
              $depositories = @($response)
          }

          $from =
              (
                  Get-Date $env:TASK_START_DATE
              ).
                  AddMinutes(-2).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ'
                  )

          $to =
              (
                  Get-Date $env:TASK_END_DATE
              ).
                  AddMinutes(15).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ'
                  )

          $count = 0

          foreach ($depository in $depositories) {
              $id = "$($depository.id)"

              if (-not $id) {
                  continue
              }

              try {
                  $result =
                      Invoke-RestMethod `
                          -Uri (
                              "$env:ONECX_URL/api/artifact/artifacts" +
                              "?depositoryId=$id" +
                              "&startDate=$from" +
                              "&endDate=$to"
                          ) `
                          -Headers $headers `
                          -ErrorAction Stop
              }
              catch {
                  continue
              }

              if ($result.items) {
                  $artifacts = @($result.items)
              }
              else {
                  $artifacts = @($result)
              }

              foreach ($artifact in $artifacts) {
                  $name = "$($artifact.fileName)"

                  $extension =
                      "$($artifact.extension)".
                          TrimStart('.').
                          ToLowerInvariant()

                  if (
                      $extension -ne 'atx' -and
                      $name -notmatch '(?i)\.atx$'
                  ) {
                      continue
                  }

                  $artifactId = "$($artifact.id)"

                  if (-not $artifactId) {
                      continue
                  }

                  if (-not $name) {
                      $name = "$artifactId.atx"
                  }

                  $output =
                      Join-Path `
                          $env:ATX_DIRECTORY `
                          $name

                  Invoke-WebRequest `
                      -Uri (
                          "$env:ONECX_URL/api/artifact/artifacts/" +
                          "$artifactId/download"
                      ) `
                      -Headers $headers `
                      -OutFile $output `
                      -ErrorAction Stop

                  if (
                      (Get-Item $output).Length -eq 0
                  ) {
                      throw "Downloaded ATX is empty: $name"
                  }

                  Write-Host "Downloaded ATX: $name"

                  $count++
              }
          }

          if ($count -eq 0) {
              throw 'No ATX report was found.'
          }

      # ============================================================
      # 9. BUILD JFROG PATH
      # ============================================================

      - name: Build JFrog destination
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          $segments = @(
              $env:CW_RELEASE
              $env:TARGET_ECU
              $env:CATEGORY
              $env:TEST_OR_VALIDATOR
              $env:RUN_TIMESTAMP
          )

          foreach ($segment in $segments) {
              if (
                  $segment -notmatch
                  '^[A-Za-z0-9._-]+$'
              ) {
                  throw (
                      "Unsafe JFrog path segment: " +
                      "$segment"
                  )
              }
          }

          $path = (
              'L2_Quality_Gate/' +
              ($segments -join '/') +
              '/'
          )

          "JFROG_TARGET_PATH=$path" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "JFrog target: $path"

      # ============================================================
      # 10. UPLOAD ATX TO JFROG
      # ============================================================

      - name: Upload ATX to JFrog
        shell: pwsh
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:JFROG_TOKEN) {
              throw 'JFROG_TOKEN is missing.'
          }

          $files =
              Get-ChildItem `
                  $env:ATX_DIRECTORY `
                  -Filter '*.atx' `
                  -File

          if (-not $files) {
              throw 'No ATX report is available to upload.'
          }

          foreach ($file in $files) {
              $url = (
                  "$($env:JFROG_URL.TrimEnd('/'))/" +
                  "$env:JFROG_REPOSITORY/" +
                  "$env:JFROG_TARGET_PATH" +
                  "$($file.Name)"
              )

              if ($env:JFROG_USER) {
                  curl.exe `
                      --fail-with-body `
                      --silent `
                      --show-error `
                      --request PUT `
                      --user "$($env:JFROG_USER):$($env:JFROG_TOKEN)" `
                      --header 'Content-Type: application/octet-stream' `
                      --upload-file "$($file.FullName)" `
                      "$url"
              }
              else {
                  curl.exe `
                      --fail-with-body `
                      --silent `
                      --show-error `
                      --request PUT `
                      --header "Authorization: Bearer $env:JFROG_TOKEN" `
                      --header 'Content-Type: application/octet-stream' `
                      --upload-file "$($file.FullName)" `
                      "$url"
              }

              if ($LASTEXITCODE -ne 0) {
                  throw "JFrog upload failed: $($file.Name)"
              }
          }

          $jfrogUrl = (
              "$($env:JFROG_URL.TrimEnd('/'))/" +
              "$env:JFROG_REPOSITORY/" +
              "$env:JFROG_TARGET_PATH"
          )

          "JFROG_REPORT_URL=$jfrogUrl" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

      # ============================================================
      # 11. UPLOAD PIPELINE ARTIFACTS
      # ============================================================

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-${{ github.event.client_payload.jira_key }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 12. COMMENT RESULT ON JIRA
      # ============================================================

      - name: Comment result on Jira
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

        run: |
          if (
              -not $env:JIRA_KEY -or
              -not $env:JIRA_EMAIL -or
              -not $env:JIRA_API_TOKEN
          ) {
              exit 0
          }

          if ('${{ job.status }}' -eq 'success') {
              $result = 'COMPLETED'
          }
          elseif ($env:TESTGUIDE_STATE) {
              $result = $env:TESTGUIDE_STATE
          }
          else {
              $result = 'FAILED'
          }

          $runUrl =
              'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          $text = (
              "L2 Quality Gate $result`n`n" +
              "Category: $env:CATEGORY`n" +
              "Test/Validator: $env:TEST_OR_VALIDATOR`n" +
              "CW: $env:CW_RELEASE`n" +
              "ECU: $env:TARGET_ECU`n" +
              "Bench: $env:TEST_BENCH`n" +
              "Project: $env:PROJECT_RELATIVE_PATH`n" +
              "Playbook ID: $env:TESTGUIDE_PLAYBOOK_ID`n" +
              "Task ID: $env:TESTGUIDE_TASK_ID`n" +
              "State: $env:TESTGUIDE_STATE`n" +
              "Verdict: $env:TESTGUIDE_VERDICT`n" +
              "Message: $env:TESTGUIDE_MESSAGE`n`n" +
              "GitHub: $runUrl`n" +
              "JFrog: $env:JFROG_REPORT_URL"
          )

          $commentFile =
              Join-Path `
                  $env:RUNNER_TEMP `
                  'jira-comment.json'

          @{
              body = $text
          } |
              ConvertTo-Json |
              Set-Content `
                  $commentFile `
                  -Encoding utf8

          curl.exe `
              --fail-with-body `
              --silent `
              --show-error `
              --request POST `
              --user "$($env:JIRA_EMAIL):$($env:JIRA_API_TOKEN)" `
              --header 'Accept: application/json' `
              --header 'Content-Type: application/json' `
              --data-binary "@$commentFile" `
              "$env:JIRA_BASE_URL/rest/api/2/issue/$env:JIRA_KEY/comment"

      # ============================================================
      # 13. SUMMARY
      # ============================================================

      - name: Write workflow summary
        if: always()
        shell: pwsh

        run: |
          @"
          ## L2 Quality Gate

          - Jira: $env:JIRA_KEY
          - Category: $env:CATEGORY_INPUT
          - Project: $env:PROJECT_RELATIVE_PATH
          - Playbook ID: $env:TESTGUIDE_PLAYBOOK_ID
          - Task ID: $env:TESTGUIDE_TASK_ID
          - State: $env:TESTGUIDE_STATE
          - Verdict: $env:TESTGUIDE_VERDICT
          - Message: $env:TESTGUIDE_MESSAGE
          - JFrog: $env:JFROG_REPORT_URL
          "@ |
              Out-File `
                  $env:GITHUB_STEP_SUMMARY `
                  -Append `
                  -Encoding utf8
