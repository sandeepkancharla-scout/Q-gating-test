name: L2 Quality Gate - Jira Execution

on:
  repository_dispatch:
    types:
      - l2_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

  JFROG_URL: https://artifactory.sctmtrs.xyz/artifactory
  JFROG_REPOSITORY: eeint-report-files

  JIRA_BASE_URL: https://scoutmotors.atlassian.net

jobs:
  l2-quality-gate:
    name: L2 Quality Gate

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: l2-${{ github.event.client_payload.test_bench }}
      cancel-in-progress: false

    steps:
      # ============================================================
      # 1. PARSE JIRA INPUTS
      # ============================================================

      - name: Parse Jira inputs
        shell: pwsh
        env:
          JIRA_KEY_RAW: ${{ github.event.client_payload.jira_key }}
          CATEGORY_RAW: ${{ github.event.client_payload.category }}
          CW_RAW: ${{ github.event.client_payload.cw_release }}
          BENCH_RAW: ${{ github.event.client_payload.test_bench }}
          ECU_RAW: ${{ github.event.client_payload.target_ecu }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Clean-Value {
              param($Value)

              if ($null -eq $Value) {
                  return ''
              }

              return (
                  "$Value" -replace '[\r\n]+', ''
              ).Trim()
          }

          $jiraKey =
              Clean-Value $env:JIRA_KEY_RAW

          $categoryInput =
              Clean-Value $env:CATEGORY_RAW

          $cwRelease =
              (
                  Clean-Value $env:CW_RAW
              ).ToUpperInvariant()

          $testBench =
              (
                  Clean-Value $env:BENCH_RAW
              ).ToLowerInvariant()

          $targetEcu =
              Clean-Value $env:ECU_RAW

          if (-not $jiraKey) {
              throw 'jira_key is missing.'
          }

          if (-not $categoryInput) {
              throw 'category is missing.'
          }

          if ($cwRelease -notmatch '^CW[0-9]{2}$') {
              throw "Invalid CW release: $cwRelease"
          }

          if (
              $testBench -notin @(
                  'syshil1',
                  'syshil2'
              )
          ) {
              throw "Unsupported bench: $testBench"
          }

          if (-not $targetEcu) {
              throw 'target_ecu is missing.'
          }

          switch (
              $categoryInput.ToLowerInvariant()
          ) {
              'network_test' {
                  $categoryInput =
                      'Network_Test'
              }

              'diagnostic_test' {
                  $categoryInput =
                      'Diagnostic_Test'
              }

              'bootloader_compliance_test' {
                  $categoryInput =
                      'Bootloader_Compliance_Test'
              }

              default {
                  throw (
                      "Unsupported category: " +
                      "$categoryInput"
                  )
              }
          }

          $jiraValues = @{
              JIRA_KEY =
                  $jiraKey

              CATEGORY_INPUT =
                  $categoryInput

              CW_RELEASE =
                  $cwRelease

              TEST_BENCH =
                  $testBench

              TARGET_ECU =
                  $targetEcu
          }

          $jiraValues.GetEnumerator() |
              ForEach-Object {
                  "$($_.Key)=$($_.Value)" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8
              }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JIRA INPUTS'
          Write-Host '========================================'
          Write-Host "Jira Key   : $jiraKey"
          Write-Host "Category   : $categoryInput"
          Write-Host "CW Release : $cwRelease"
          Write-Host "Test Bench : $testBench"
          Write-Host "Target ECU : $targetEcu"
          Write-Host '========================================'

      # ============================================================
      # 2. CHECKOUT PIPELINE
      # ============================================================

      - name: Checkout pipeline repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 3. CHECKOUT L2 QUALITY GATE
      # ============================================================

      - name: Checkout L2 Quality Gate
        uses: actions/checkout@v4
        with:
          repository: scout-motors/eeint-L2-Quality-Gate
          token: ${{ secrets.HIL_REPO_PAT }}
          path: source-l2
          fetch-depth: 1

      # ============================================================
      # 4. ROUTE CATEGORY AND PREPARE TESTGUIDE WORKSPACE
      # ============================================================

      - name: Route category and prepare workspace
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          switch ($env:CATEGORY_INPUT) {
              'Network_Test' {
                  $domain =
                      'network-testing'

                  $testName =
                      'NetworkTest'

                  $playbookPrefix =
                      'L2-Network'

                  $relativeProject =
                      'ProjectGenerator\Network-Test\NetworkTest.prj'
              }

              'Diagnostic_Test' {
                  $domain =
                      'diagnostic-testing'

                  $testName =
                      'DiagnosticTest'

                  $playbookPrefix =
                      'L2-Diagnostic'

                  $relativeProject =
                      'ProjectGenerator\Diagnostic-Test\DiagnosticTest.prj'
              }

              'Bootloader_Compliance_Test' {
                  $domain =
                      'bootloader-compliance'

                  $testName =
                      'BootloaderComplianceTest'

                  $playbookPrefix =
                      'L2-Bootloader'

                  $relativeProject =
                      'ProjectGenerator\Bootloader-Compliance-Test\BootloaderComplianceTest.prj'
              }

              default {
                  throw (
                      "Unsupported category: " +
                      "$env:CATEGORY_INPUT"
                  )
              }
          }

          switch ($env:TEST_BENCH) {
              'syshil1' {
                  $resource =
                      'syshil1-labtest1'

                  $workspace =
                      'D:\HIL\Testing\eeint-L2-Quality-Gate'
              }

              'syshil2' {
                  $resource =
                      'syshil2-labtest2'

                  $workspace =
                      'C:\HIL\Testing\eeint-L2-Quality-Gate'
              }

              default {
                  throw (
                      "Unsupported bench: " +
                      "$env:TEST_BENCH"
                  )
              }
          }

          $sourceRepository =
              Join-Path `
                  $env:GITHUB_WORKSPACE `
                  'source-l2'

          $sourceProject =
              Join-Path `
                  $sourceRepository `
                  $relativeProject

          if (-not (
              Test-Path `
                  -LiteralPath $sourceProject `
                  -PathType Leaf
          )) {
              throw (
                  "Project file is missing: " +
                  "$sourceProject"
              )
          }

          $destinationProject =
              Join-Path `
                  $workspace `
                  $relativeProject

          $destinationFolder =
              Split-Path `
                  -Path $destinationProject `
                  -Parent

          New-Item `
              -ItemType Directory `
              -Path $destinationFolder `
              -Force |
              Out-Null

          Copy-Item `
              -LiteralPath $sourceProject `
              -Destination $destinationProject `
              -Force

          if (-not (
              Test-Path `
                  -LiteralPath $destinationProject `
                  -PathType Leaf
          )) {
              throw (
                  "Project copy failed: " +
                  "$destinationProject"
              )
          }

          $artifactRoot =
              Join-Path `
                  $env:RUNNER_TEMP `
                  'l2-artifacts'

          $atxDirectory =
              Join-Path `
                  $artifactRoot `
                  'atx'

          New-Item `
              -ItemType Directory `
              -Path $atxDirectory `
              -Force |
              Out-Null

          $resolvedValues = @{
              CATEGORY =
                  $domain

              TEST_OR_VALIDATOR =
                  $testName

              PLAYBOOK_PREFIX =
                  $playbookPrefix

              PROJECT_RELATIVE_PATH =
                  $relativeProject

              RESOURCE_NAME =
                  $resource

              TESTGUIDE_WORKSPACE =
                  $workspace

              XIL_IDENTIFIER =
                  "novi_hq/1stfloor/ee_lab_novi/$resource/ControlComputer"

              ARTIFACT_ROOT =
                  $artifactRoot

              ATX_DIRECTORY =
                  $atxDirectory

              RUN_TIMESTAMP =
                  Get-Date -Format 'yyyy-MM-dd_HHmmss'
          }

          $resolvedValues.GetEnumerator() |
              ForEach-Object {
                  "$($_.Key)=$($_.Value)" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8
              }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'CATEGORY ROUTING'
          Write-Host '========================================'
          Write-Host "Category     : $domain"
          Write-Host "Playbook     : $playbookPrefix"
          Write-Host "Project      : $relativeProject"
          Write-Host "Resource     : $resource"
          Write-Host "Workspace    : $workspace"
          Write-Host "Copied file  : $destinationProject"
          Write-Host '========================================'

      # ============================================================
      # 5. GENERATE CATEGORY-SPECIFIC PLAYBOOK
      #
      # ONLY THESE CONSTANTS ARE PASSED FOR NOW:
      #
      # PROJECT_GENERATOR_TARGETECU
      # PROJECT_GENERATOR_CT
      # ============================================================

      - name: Generate category playbook
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          $targetEcu =
              $env:TARGET_ECU.Trim()

          $playbook = [ordered]@{
              metadata = [ordered]@{
                  name =
                      "$env:PLAYBOOK_PREFIX-$env:JIRA_KEY-$env:RUN_TIMESTAMP"

                  taskNameTemplate =
                      '${playbook_name} (${playbook_datetime}) ${distribution_count}'

                  labels =
                      @()
              }

              workspace = [ordered]@{
                  source = [ordered]@{
                      path =
                          $env:TESTGUIDE_WORKSPACE

                      sourceType =
                          'location'
                  }

                  dependencies =
                      @()
              }

              setup = [ordered]@{
                  steps = @(
                      [ordered]@{
                          reuse =
                              'always'

                          keepConfiguration =
                              $false

                          waitMinutesForLicense =
                              0

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'ecuTestStart'
                      }
                  )
              }

              execution = [ordered]@{
                  testcases = @(
                      [ordered]@{
                          relativePath =
                              $env:PROJECT_RELATIVE_PATH

                          constants = @(
                              [ordered]@{
                                  label =
                                      'PROJECT_GENERATOR_TARGETECU'

                                  value =
                                      "'$targetEcu'"
                              },

                              [ordered]@{
                                  label =
                                      'PROJECT_GENERATOR_CT'

                                  value =
                                      'True'
                              }
                          )

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'project'
                      }
                  )
              }

              teardown = [ordered]@{
                  steps = @(
                      [ordered]@{
                          type =
                              'ecuTestStop'
                      }
                  )
              }

              xilConfigRequirements = @(
                  [ordered]@{
                      label =
                          'Identifier'

                      category =
                          'XIL'

                      value =
                          $env:XIL_IDENTIFIER

                      type =
                          'configuration'
                  }
              )

              parameters = @(
                  [ordered]@{
                      label =
                          'PROJECT_GENERATOR_TARGETECU'

                      defaultValue =
                          "'$targetEcu'"

                      required =
                          $false
                  },

                  [ordered]@{
                      label =
                          'PROJECT_GENERATOR_CT'

                      defaultValue =
                          'True'

                      required =
                          $false
                  }
              )
          }

          $playbookFile =
              Join-Path `
                  $env:ARTIFACT_ROOT `
                  'playbook.json'

          $playbook |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath $playbookFile `
                  -Encoding utf8

          "PLAYBOOK_FILE=$playbookFile" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host (
              "Generated category playbook: " +
              "$playbookFile"
          )

          Write-Host (
              "Project relative path: " +
              "$env:PROJECT_RELATIVE_PATH"
          )

      # ============================================================
      # 6. CREATE TESTGUIDE PLAYBOOK
      # ============================================================

      - name: Create TestGuide playbook
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ONECX_AUTH_KEY) {
              throw 'ONECX_AUTH_KEY is missing.'
          }

          if (-not $env:ONECX_PROJECT_ID) {
              throw 'ONECX_PROJECT_ID is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $url = (
              "$env:ONECX_URL/api/v2/execution/playbook" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&folder=%2F"
          )

          $body =
              Get-Content `
                  -LiteralPath $env:PLAYBOOK_FILE `
                  -Raw

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $url `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $body `
                  -ErrorAction Stop

          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          $env:ARTIFACT_ROOT `
                          'create-response.json'
                  ) `
                  -Encoding utf8

          $playbookId =
              $null

          if ($response.playbookId) {
              $playbookId =
                  $response.playbookId
          }
          elseif ($response.id) {
              $playbookId =
                  $response.id
          }
          elseif ($response.data) {
              $playbookId =
                  $response.data.id
          }

          if (-not $playbookId) {
              throw 'Create API returned no playbook ID.'
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Playbook ID: $playbookId"

      # ============================================================
      # 7. EXECUTE TESTGUIDE PLAYBOOK
      #
      # CONFIRMED RESPONSE FORMAT:
      #
      # {
      #   "taskIds": [14404]
      # }
      # ============================================================

      - name: Execute TestGuide playbook
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $url = (
              "$env:ONECX_URL/api/v2/execution/playbook/" +
              "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&checkLastExecution=true"
          )

          $requestBody = @{
              parameters = @(
                  @{
                      label =
                          'PROJECT_GENERATOR_TARGETECU'

                      value =
                          "'$($env:TARGET_ECU)'"
                  },

                  @{
                      label =
                          'PROJECT_GENERATOR_CT'

                      value =
                          'True'
                  }
              )
          } |
              ConvertTo-Json -Depth 10

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $url `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $requestBody `
                  -ErrorAction Stop

          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          $env:ARTIFACT_ROOT `
                          'execute-response.json'
                  ) `
                  -Encoding utf8

          Write-Host ''
          Write-Host 'TestGuide execute response:'

          Write-Host (
              $response |
                  ConvertTo-Json -Depth 30
          )

          $taskId =
              $null

          if ($response.taskIds) {
              $taskId =
                  @($response.taskIds)[0]
          }

          if (
              (-not $taskId) -and
              $response.taskId
          ) {
              $taskId =
                  $response.taskId
          }

          if (
              (-not $taskId) -and
              $response.id
          ) {
              $taskId =
                  $response.id
          }

          if (
              (-not $taskId) -and
              $response.data -and
              $response.data.taskIds
          ) {
              $taskId =
                  @($response.data.taskIds)[0]
          }

          if (
              (-not $taskId) -and
              $response.data -and
              $response.data.taskId
          ) {
              $taskId =
                  $response.data.taskId
          }

          if (-not $taskId) {
              throw 'Execute API returned no task ID.'
          }

          "TESTGUIDE_TASK_ID=$taskId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PLAYBOOK EXECUTION STARTED'
          Write-Host '========================================'
          Write-Host "Playbook ID : $env:TESTGUIDE_PLAYBOOK_ID"
          Write-Host "Task ID     : $taskId"
          Write-Host "Category    : $env:CATEGORY"
          Write-Host "Project     : $env:PROJECT_RELATIVE_PATH"
          Write-Host "ECU         : $env:TARGET_ECU"
          Write-Host "Bench       : $env:TEST_BENCH"
          Write-Host '========================================'

      # ============================================================
      # 8. POLL TESTGUIDE EXECUTION
      # ============================================================

      - name: Wait for TestGuide execution
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $url = (
              "$env:ONECX_URL/api/v2/execution/task/" +
              "$env:TESTGUIDE_TASK_ID" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&fields=taskId" +
              "&fields=startDate" +
              "&fields=endDate" +
              "&fields=state" +
              "&fields=stateInfo" +
              "&fields=aggregatedVerdict"
          )

          $deadline =
              (Get-Date).AddMinutes(170)

          $blockedSince =
              $null

          while (
              (Get-Date) -lt $deadline
          ) {
              $task =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $url `
                      -Headers $headers `
                      -ErrorAction Stop

              $state =
                  "$($task.state)"

              $verdict =
                  "$($task.aggregatedVerdict)"

              Write-Host (
                  "Task=$env:TESTGUIDE_TASK_ID " +
                  "State=$state " +
                  "Verdict=$verdict"
              )

              if (
                  $state -in @(
                      'FINISHED',
                      'COMPLETED',
                      'SUCCESS',
                      'SUCCEEDED'
                  )
              ) {
                  "TASK_START_DATE=$($task.startDate)" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TASK_END_DATE=$($task.endDate)" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_VERDICT=$verdict" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  $task |
                      ConvertTo-Json -Depth 30 |
                      Set-Content `
                          -LiteralPath (
                              Join-Path `
                                  $env:ARTIFACT_ROOT `
                                  'task-result.json'
                          ) `
                          -Encoding utf8

                  exit 0
              }

              if (
                  $state -in @(
                      'ERROR',
                      'FAILED',
                      'ABORTED',
                      'CANCELLED',
                      'CANCELED'
                  )
              ) {
                  $stateInfo =
                      "$($task.stateInfo)"

                  if (-not $stateInfo) {
                      $stateInfo =
                          'TestGuide did not return stateInfo.'
                  }

                  $errorMessage = (
                      "TestGuide playbook failed. " +
                      "Playbook=$env:TESTGUIDE_PLAYBOOK_ID; " +
                      "Task=$env:TESTGUIDE_TASK_ID; " +
                      "Category=$env:CATEGORY; " +
                      "Project=$env:PROJECT_RELATIVE_PATH; " +
                      "State=$state; " +
                      "Message=$stateInfo"
                  )

                  $errorMessage |
                      Set-Content `
                          -LiteralPath (
                              Join-Path `
                                  $env:ARTIFACT_ROOT `
                                  'testguide-error.txt'
                          ) `
                          -Encoding utf8

                  throw $errorMessage
              }

              if (
                  $state -eq 'BLOCKED'
              ) {
                  if (-not $blockedSince) {
                      $blockedSince =
                          Get-Date
                  }

                  $blockedMinutes =
                      (
                          (Get-Date) -
                          $blockedSince
                      ).TotalMinutes

                  if (
                      $blockedMinutes -ge 5
                  ) {
                      $stateInfo =
                          "$($task.stateInfo)"

                      throw (
                          "TestGuide task remained BLOCKED. " +
                          "Task=$env:TESTGUIDE_TASK_ID; " +
                          "Project=$env:PROJECT_RELATIVE_PATH; " +
                          "Message=$stateInfo"
                      )
                  }
              }
              else {
                  $blockedSince =
                      $null
              }

              Start-Sleep -Seconds 10
          }

          throw (
              "TestGuide execution timed out. " +
              "Task=$env:TESTGUIDE_TASK_ID"
          )

      # ============================================================
      # 9. DOWNLOAD ATX
      # ============================================================

      - name: Download ATX artifacts
        shell: pwsh

        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $depositoryUrl = (
              "$env:ONECX_URL/api/artifact/depositories" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&shared=false"
          )

          $response =
              Invoke-RestMethod `
                  -Method Get `
                  -Uri $depositoryUrl `
                  -Headers $headers `
                  -ErrorAction Stop

          if ($response.items) {
              $depositories =
                  @($response.items)
          }
          else {
              $depositories =
                  @($response)
          }

          if (-not $env:TASK_START_DATE) {
              throw 'TASK_START_DATE is missing.'
          }

          if (-not $env:TASK_END_DATE) {
              throw 'TASK_END_DATE is missing.'
          }

          $from =
              (
                  Get-Date $env:TASK_START_DATE
              ).
                  AddMinutes(-2).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ'
                  )

          $to =
              (
                  Get-Date $env:TASK_END_DATE
              ).
                  AddMinutes(15).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ'
                  )

          $downloadCount =
              0

          foreach (
              $depository in
              $depositories
          ) {
              $depositoryId =
                  "$($depository.id)"

              if (-not $depositoryId) {
                  continue
              }

              $artifactUrl = (
                  "$env:ONECX_URL/api/artifact/artifacts" +
                  "?depositoryId=$depositoryId" +
                  "&startDate=$from" +
                  "&endDate=$to"
              )

              try {
                  $artifactResponse =
                      Invoke-RestMethod `
                          -Method Get `
                          -Uri $artifactUrl `
                          -Headers $headers `
                          -ErrorAction Stop
              }
              catch {
                  Write-Warning (
                      "Unable to query depository: " +
                      "$depositoryId"
                  )

                  continue
              }

              if ($artifactResponse.items) {
                  $artifacts =
                      @($artifactResponse.items)
              }
              else {
                  $artifacts =
                      @($artifactResponse)
              }

              foreach (
                  $artifact in
                  $artifacts
              ) {
                  $fileName =
                      "$($artifact.fileName)"

                  $extension =
                      "$($artifact.extension)".
                          TrimStart('.').
                          ToLowerInvariant()

                  if (
                      ($extension -ne 'atx') -and
                      ($fileName -notmatch '(?i)\.atx$')
                  ) {
                      continue
                  }

                  $artifactId =
                      "$($artifact.id)"

                  if (-not $artifactId) {
                      continue
                  }

                  if (-not $fileName) {
                      $fileName =
                          "$artifactId.atx"
                  }

                  $destination =
                      Join-Path `
                          $env:ATX_DIRECTORY `
                          $fileName

                  $downloadUrl = (
                      "$env:ONECX_URL/api/artifact/artifacts/" +
                      "$artifactId/download"
                  )

                  Invoke-WebRequest `
                      -Method Get `
                      -Uri $downloadUrl `
                      -Headers $headers `
                      -OutFile $destination `
                      -ErrorAction Stop

                  if (
                      (Get-Item $destination).Length -eq 0
                  ) {
                      throw (
                          "Downloaded ATX is empty: " +
                          "$fileName"
                      )
                  }

                  $downloadCount++
              }
          }

          if (
              $downloadCount -eq 0
          ) {
              throw 'No ATX artifacts found.'
          }

          Write-Host (
              "Downloaded ATX files: " +
              "$downloadCount"
          )

      # ============================================================
      # 10. UPLOAD ATX TO JFROG
      # ============================================================

      - name: Upload ATX to JFrog
        shell: pwsh

        env:
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:JFROG_TOKEN) {
              throw 'JFROG_TOKEN is missing.'
          }

          $targetPath = (
              "L2_Quality_Gate/" +
              "$env:CW_RELEASE/" +
              "$env:TARGET_ECU/" +
              "$env:CATEGORY/" +
              "$env:TEST_OR_VALIDATOR/" +
              "$env:RUN_TIMESTAMP/"
          )

          $files =
              Get-ChildItem `
                  -LiteralPath $env:ATX_DIRECTORY `
                  -Filter '*.atx' `
                  -File

          if (-not $files) {
              throw 'No ATX files to upload.'
          }

          foreach ($file in $files) {
              $uploadUrl = (
                  "$($env:JFROG_URL.TrimEnd('/'))/" +
                  "$env:JFROG_REPOSITORY/" +
                  "$targetPath" +
                  "$($file.Name)"
              )

              Invoke-RestMethod `
                  -Method Put `
                  -Uri $uploadUrl `
                  -Headers @{
                      Authorization =
                          "Bearer $env:JFROG_TOKEN"
                  } `
                  -InFile $file.FullName `
                  -ContentType 'application/octet-stream' `
                  -ErrorAction Stop
          }

          $jfrogUrl = (
              "$($env:JFROG_URL.TrimEnd('/'))/" +
              "$env:JFROG_REPOSITORY/" +
              "$targetPath"
          )

          "JFROG_TARGET_PATH=$targetPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          "JFROG_REPORT_URL=$jfrogUrl" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

      # ============================================================
      # 11. UPLOAD GITHUB PIPELINE ARTIFACTS
      # ============================================================

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: l2-${{ github.event.client_payload.jira_key }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 12. COMMENT RESULT ON JIRA
      # ============================================================

      - name: Comment result on Jira
        if: always()
        continue-on-error: true
        shell: pwsh

        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

        run: |
          if (
              (-not $env:JIRA_KEY) -or
              (-not $env:JIRA_EMAIL) -or
              (-not $env:JIRA_API_TOKEN)
          ) {
              exit 0
          }

          if (
              '${{ job.status }}' -eq
              'success'
          ) {
              $status =
                  'COMPLETED'
          }
          else {
              $status =
                  'FAILED'
          }

          $githubRunUrl =
              'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          $commentText = (
              "L2 Quality Gate $status`n" +
              "Category: $env:CATEGORY`n" +
              "Project: $env:PROJECT_RELATIVE_PATH`n" +
              "Playbook: $env:TESTGUIDE_PLAYBOOK_ID`n" +
              "Task: $env:TESTGUIDE_TASK_ID`n" +
              "Verdict: $env:TESTGUIDE_VERDICT`n" +
              "GitHub: $githubRunUrl`n" +
              "JFrog: $env:JFROG_REPORT_URL"
          )

          $commentFile =
              Join-Path `
                  $env:RUNNER_TEMP `
                  'jira-comment.json'

          @{
              body =
                  $commentText
          } |
              ConvertTo-Json |
              Set-Content `
                  -LiteralPath $commentFile `
                  -Encoding utf8

          curl.exe `
              --fail-with-body `
              --silent `
              --show-error `
              --request POST `
              --user "$($env:JIRA_EMAIL):$($env:JIRA_API_TOKEN)" `
              --header 'Accept: application/json' `
              --header 'Content-Type: application/json' `
              --data-binary "@$commentFile" `
              "$env:JIRA_BASE_URL/rest/api/2/issue/$env:JIRA_KEY/comment"
