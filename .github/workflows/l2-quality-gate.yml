name: L2 Quality Gate - Jira Execution

on:
  repository_dispatch:
    types:
      - l2_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}
  JFROG_URL: https://artifactory.sctmtrs.xyz/artifactory
  JFROG_REPOSITORY: eeint-report-files
  JIRA_BASE_URL: https://scoutmotors.atlassian.net

jobs:
  l2-quality-gate:
    name: L2 Quality Gate

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: l2-quality-gate-${{ github.event.client_payload.test_bench }}
      cancel-in-progress: false

    steps:
      # ============================================================
      # 1. PARSE JIRA INPUTS
      # ============================================================

      - name: Parse Jira inputs
        shell: pwsh
        env:
          JIRA_KEY_RAW: ${{ github.event.client_payload.jira_key }}
          CATEGORY_RAW: ${{ github.event.client_payload.category }}
          CW_RELEASE_RAW: ${{ github.event.client_payload.cw_release }}
          TEST_BENCH_RAW: ${{ github.event.client_payload.test_bench }}
          TARGET_ECU_RAW: ${{ github.event.client_payload.target_ecu }}
          FLASH_ARCHIVE_RAW: ${{ github.event.client_payload.flash_archive_location }}
          RAL_FILE_RAW: ${{ github.event.client_payload.ral_file_location }}
          GIT_SUBMODULE_RAW: ${{ github.event.client_payload.git_submodule }}
          TEST_CASES_RAW: ${{ github.event.client_payload.test_cases }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Clean-Value {
              param(
                  [AllowNull()]
                  $Value
              )

              if ($null -eq $Value) {
                  return ''
              }

              $result = "$Value".Trim()
              $result = $result -replace '[\r\n]+', ' '

              return $result.Trim()
          }

          function Clean-Path {
              param(
                  [AllowNull()]
                  $Value
              )

              if ($null -eq $Value) {
                  return ''
              }

              $result = "$Value".Trim()
              $result = $result -replace '[\r\n]+', ''

              # Jira sends paths inside quotation marks.
              # Remove only surrounding quotation marks.
              # Do not change Jira labels or category values.
              while (
                  $result.Length -ge 2 -and
                  $result.StartsWith('"') -and
                  $result.EndsWith('"')
              ) {
                  $result =
                      $result.Substring(
                          1,
                          $result.Length - 2
                      ).Trim()
              }

              return $result
          }

          function Export-EnvironmentValue {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Name,

                  [AllowEmptyString()]
                  [string]$Value
              )

              "$Name=$Value" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          $jiraKey =
              Clean-Value $env:JIRA_KEY_RAW

          $categoryInput =
              Clean-Value $env:CATEGORY_RAW

          $cwRelease =
              (
                  Clean-Value $env:CW_RELEASE_RAW
              ).ToUpperInvariant()

          $testBench =
              (
                  Clean-Value $env:TEST_BENCH_RAW
              ).ToLowerInvariant()

          $targetEcu =
              Clean-Value $env:TARGET_ECU_RAW

          $flashArchive =
              Clean-Path $env:FLASH_ARCHIVE_RAW

          $ralFile =
              Clean-Path $env:RAL_FILE_RAW

          $gitSubmodule =
              Clean-Value $env:GIT_SUBMODULE_RAW

          $testCases =
              Clean-Value $env:TEST_CASES_RAW

          if (-not $jiraKey) {
              throw 'jira_key is missing.'
          }

          if (-not $categoryInput) {
              throw 'category is missing.'
          }

          if (-not $cwRelease) {
              throw 'cw_release is missing.'
          }

          if (-not $testBench) {
              throw 'test_bench is missing.'
          }

          if (-not $targetEcu) {
              throw 'target_ecu is missing.'
          }

          if ($cwRelease -notmatch '^CW[0-9]{2}$') {
              throw (
                  "Invalid CW Release '$cwRelease'. " +
                  'Expected a value such as CW45.'
              )
          }

          if (
              $testBench -notin @(
                  'syshil1',
                  'syshil2'
              )
          ) {
              throw "Unsupported Test Bench '$testBench'."
          }

          switch ($categoryInput.ToLowerInvariant()) {
              'network_test' {
                  $categoryInput = 'Network_Test'
              }

              'network_testing' {
                  $categoryInput = 'Network_Test'
              }

              'diagnostic_test' {
                  $categoryInput = 'Diagnostic_Test'
              }

              'diagnostic_testing' {
                  $categoryInput = 'Diagnostic_Test'
              }

              'bootloader_compliance_test' {
                  $categoryInput =
                      'Bootloader_Compliance_Test'
              }

              default {
                  throw (
                      "Unsupported Jira category: " +
                      "'$categoryInput'"
                  )
              }
          }

          if (
              $categoryInput -eq 'Diagnostic_Test' -and
              -not $ralFile
          ) {
              throw (
                  'Diagnostic_Test requires ' +
                  'RAL File Location.'
              )
          }

          if (
              $categoryInput -eq
                  'Bootloader_Compliance_Test' -and
              -not $flashArchive
          ) {
              throw (
                  'Bootloader_Compliance_Test requires ' +
                  'Flash Archieve Location.'
              )
          }

          Export-EnvironmentValue `
              -Name 'JIRA_KEY' `
              -Value $jiraKey

          Export-EnvironmentValue `
              -Name 'CATEGORY_INPUT' `
              -Value $categoryInput

          Export-EnvironmentValue `
              -Name 'CW_RELEASE' `
              -Value $cwRelease

          Export-EnvironmentValue `
              -Name 'TEST_BENCH' `
              -Value $testBench

          Export-EnvironmentValue `
              -Name 'TARGET_ECU' `
              -Value $targetEcu

          Export-EnvironmentValue `
              -Name 'FLASH_ARCHIVE_LOCATION' `
              -Value $flashArchive

          Export-EnvironmentValue `
              -Name 'RAL_FILE_LOCATION' `
              -Value $ralFile

          Export-EnvironmentValue `
              -Name 'GIT_SUBMODULE' `
              -Value $gitSubmodule

          Export-EnvironmentValue `
              -Name 'TEST_CASES' `
              -Value $testCases

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PARSED JIRA INPUTS'
          Write-Host '========================================'
          Write-Host "Jira Key      : [$jiraKey]"
          Write-Host "Category      : [$categoryInput]"
          Write-Host "CW Release    : [$cwRelease]"
          Write-Host "Test Bench    : [$testBench]"
          Write-Host "Target ECU    : [$targetEcu]"
          Write-Host "Flash raw     : [$env:FLASH_ARCHIVE_RAW]"
          Write-Host "Flash parsed  : [$flashArchive]"
          Write-Host "RAL raw       : [$env:RAL_FILE_RAW]"
          Write-Host "RAL parsed    : [$ralFile]"
          Write-Host "Git Submodule : [$gitSubmodule]"
          Write-Host "Test Cases    : [$testCases]"
          Write-Host '========================================'

      # ============================================================
      # 2. CHECKOUT REPOSITORIES
      # ============================================================

      - name: Checkout pipeline repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout L2 Quality Gate
        uses: actions/checkout@v4
        with:
          repository: scout-motors/eeint-L2-Quality-Gate
          token: ${{ secrets.HIL_REPO_PAT }}
          path: source-l2
          fetch-depth: 1
          submodules: recursive

      # ============================================================
      # 3. ROUTE CATEGORY AND PREPARE WORKSPACE
      # ============================================================

      - name: Route category and prepare workspace
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          switch ($env:CATEGORY_INPUT) {
              'Network_Test' {
                  $category =
                      'network-testing'

                  $testOrValidator =
                      'NetworkTest'

                  $playbookName =
                      'L2-network-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Network-Test\NetworkTest.prj'
              }

              'Diagnostic_Test' {
                  $category =
                      'diagnostic-testing'

                  $testOrValidator =
                      'DiagnosticTest'

                  $playbookName =
                      'L2-Diagnostic-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Diagnostic-Test\DiagnosticTest.prj'
              }

              'Bootloader_Compliance_Test' {
                  $category =
                      'bootloader-compliance'

                  $testOrValidator =
                      'BootloaderComplianceTest'

                  $playbookName =
                      'L2-Bootloader-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Bootloader-Compliance-Test\BootloaderComplianceTest.prj'
              }

              default {
                  throw (
                      "Unsupported Jira category: " +
                      "$env:CATEGORY_INPUT"
                  )
              }
          }

          switch ($env:TEST_BENCH) {
              'syshil1' {
                  $resource =
                      'syshil1-labtest1'

                  $configurationFolder =
                      'SUBSYS1'
              }

              'syshil2' {
                  $resource =
                      'syshil2-labtest2'

                  $configurationFolder =
                      'SUBSYS1'
              }

              default {
                  throw (
                      "Unsupported test bench: " +
                      "$env:TEST_BENCH"
                  )
              }
          }

          $workspace =
              'C:\HIL\Testing\eeint-Test-Automation'

          $sourceRepository =
              Join-Path `
                  -Path $env:GITHUB_WORKSPACE `
                  -ChildPath 'source-l2'

          $destinationRepository =
              Join-Path `
                  -Path $workspace `
                  -ChildPath 'Packages\L2-Quality-Gate'

          $sourceRepositoryExists =
              Test-Path `
                  -LiteralPath $sourceRepository `
                  -PathType Container

          if (-not $sourceRepositoryExists) {
              throw (
                  'Checked-out repository does not exist: ' +
                  "$sourceRepository"
              )
          }

          New-Item `
              -ItemType Directory `
              -Path $destinationRepository `
              -Force |
              Out-Null

          Copy-Item `
              -Path (
                  Join-Path `
                      -Path $sourceRepository `
                      -ChildPath '*'
              ) `
              -Destination $destinationRepository `
              -Recurse `
              -Force

          $fullProjectPath =
              Join-Path `
                  -Path $workspace `
                  -ChildPath $projectRelativePath

          $projectExists =
              Test-Path `
                  -LiteralPath $fullProjectPath `
                  -PathType Leaf

          Write-Host "Project path   : [$fullProjectPath]"
          Write-Host "Project exists : [$projectExists]"

          if (-not $projectExists) {
              throw (
                  'Selected project does not exist: ' +
                  "$fullProjectPath"
              )
          }

          $tbcRelativePath = (
              "Configurations\" +
              "$configurationFolder\" +
              "${configurationFolder}_TestBenchConfig.tbc"
          )

          $tcfRelativePath = (
              "Configurations\" +
              "$configurationFolder\" +
              "${configurationFolder}_TestConfig.tcf"
          )

          $fullTbcPath =
              Join-Path `
                  -Path $workspace `
                  -ChildPath $tbcRelativePath

          $fullTcfPath =
              Join-Path `
                  -Path $workspace `
                  -ChildPath $tcfRelativePath

          $tbcExists =
              Test-Path `
                  -LiteralPath $fullTbcPath `
                  -PathType Leaf

          $tcfExists =
              Test-Path `
                  -LiteralPath $fullTcfPath `
                  -PathType Leaf

          if (-not $tbcExists) {
              throw "TBC file does not exist: $fullTbcPath"
          }

          if (-not $tcfExists) {
              throw "TCF file does not exist: $fullTcfPath"
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              $ralExists =
                  Test-Path `
                      -LiteralPath $env:RAL_FILE_LOCATION `
                      -PathType Leaf

              Write-Host (
                  'Diagnostic RAL path   : ' +
                  "[$env:RAL_FILE_LOCATION]"
              )

              Write-Host (
                  'Diagnostic RAL exists : ' +
                  "[$ralExists]"
              )

              if (-not $ralExists) {
                  throw (
                      'Diagnostic RAL file does not exist: ' +
                      "$env:RAL_FILE_LOCATION"
                  )
              }
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              $flashFileExists =
                  Test-Path `
                      -LiteralPath $env:FLASH_ARCHIVE_LOCATION `
                      -PathType Leaf

              Write-Host (
                  'Bootloader file path   : ' +
                  "[$env:FLASH_ARCHIVE_LOCATION]"
              )

              Write-Host (
                  'Bootloader file exists : ' +
                  "[$flashFileExists]"
              )

              if (-not $flashFileExists) {
                  throw (
                      'Bootloader file does not exist: ' +
                      "$env:FLASH_ARCHIVE_LOCATION"
                  )
              }
          }

          $artifactRoot =
              Join-Path `
                  -Path $env:RUNNER_TEMP `
                  -ChildPath 'l2-artifacts'

          $atxDirectory =
              Join-Path `
                  -Path $artifactRoot `
                  -ChildPath 'atx'

          New-Item `
              -ItemType Directory `
              -Path $atxDirectory `
              -Force |
              Out-Null

          $runTimestamp =
              Get-Date `
                  -Format 'yyyy-MM-dd_HHmmss'

          $resolvedValues = [ordered]@{
              CATEGORY =
                  $category

              TEST_OR_VALIDATOR =
                  $testOrValidator

              PLAYBOOK_NAME =
                  $playbookName

              PROJECT_RELATIVE_PATH =
                  $projectRelativePath

              RESOURCE_NAME =
                  $resource

              TESTGUIDE_WORKSPACE =
                  $workspace

              TBC_RELATIVE_PATH =
                  $tbcRelativePath

              TCF_RELATIVE_PATH =
                  $tcfRelativePath

              XIL_IDENTIFIER = (
                  "novi_hq/1stfloor/ee_lab_novi/" +
                  "$resource/ControlComputer"
              )

              ARTIFACT_ROOT =
                  $artifactRoot

              ATX_DIRECTORY =
                  $atxDirectory

              RUN_TIMESTAMP =
                  $runTimestamp
          }

          foreach ($item in $resolvedValues.GetEnumerator()) {
              "$($item.Key)=$($item.Value)" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'SELECTED EXECUTION'
          Write-Host '========================================'
          Write-Host "Category : [$category]"
          Write-Host "Playbook : [$playbookName]"
          Write-Host "Project  : [$projectRelativePath]"
          Write-Host "Resource : [$resource]"
          Write-Host "TBC      : [$tbcRelativePath]"
          Write-Host "TCF      : [$tcfRelativePath]"
          Write-Host '========================================'

      # ============================================================
      # 4. GENERATE CATEGORY-SPECIFIC PLAYBOOK
      # ============================================================

      - name: Generate selected TestGuide playbook
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToEcuTestPathExpression {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path
              )

              $cleanPath =
                  $Path.Trim()

              while (
                  $cleanPath.Length -ge 2 -and
                  $cleanPath.StartsWith('"') -and
                  $cleanPath.EndsWith('"')
              ) {
                  $cleanPath =
                      $cleanPath.Substring(
                          1,
                          $cleanPath.Length - 2
                      ).Trim()
              }

              $escapedPath =
                  $cleanPath.Replace(
                      '\',
                      '\\'
                  )

              return (
                  '"' +
                  $escapedPath +
                  '"'
              )
          }

          $targetEcuExpression = (
              "'" +
              $env:TARGET_ECU +
              "'"
          )

          $constants = @(
              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  value =
                      $targetEcuExpression
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  value =
                      'True'
              }
          )

          $parameters = @(
              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  defaultValue =
                      $targetEcuExpression

                  required =
                      $false
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  defaultValue =
                      'True'

                  required =
                      $false
              }
          )

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              $ralExpression =
                  Convert-ToEcuTestPathExpression `
                      -Path $env:RAL_FILE_LOCATION

              $constants += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_RAL_FILE_PATH'

                  value =
                      $ralExpression
              }

              $parameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_RAL_FILE_PATH'

                  defaultValue =
                      $ralExpression

                  required =
                      $false
              }

              Write-Host (
                  'RAL Windows path   : ' +
                  "[$env:RAL_FILE_LOCATION]"
              )

              Write-Host (
                  'RAL ECU expression : ' +
                  "[$ralExpression]"
              )
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              $hexExpression =
                  Convert-ToEcuTestPathExpression `
                      -Path $env:FLASH_ARCHIVE_LOCATION

              $constants += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                  value =
                      $hexExpression
              }

              $parameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                  defaultValue =
                      $hexExpression

                  required =
                      $false
              }

              Write-Host (
                  'HEX Windows path   : ' +
                  "[$env:FLASH_ARCHIVE_LOCATION]"
              )

              Write-Host (
                  'HEX ECU expression : ' +
                  "[$hexExpression]"
              )
          }

          $playbook = [ordered]@{
              metadata = [ordered]@{
                  name = (
                      "$env:PLAYBOOK_NAME-" +
                      "$env:JIRA_KEY-" +
                      "$env:RUN_TIMESTAMP"
                  )

                  taskNameTemplate =
                      '${playbook_name} (${playbook_datetime}) ${distribution_count}'

                  labels =
                      @()
              }

              workspace = [ordered]@{
                  source = [ordered]@{
                      path =
                          $env:TESTGUIDE_WORKSPACE

                      sourceType =
                          'location'
                  }

                  dependencies =
                      @()
              }

              setup = [ordered]@{
                  steps = @(
                      [ordered]@{
                          reuse =
                              'always'

                          keepConfiguration =
                              $false

                          waitMinutesForLicense =
                              0

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'ecuTestStart'
                      },

                      [ordered]@{
                          tbcPath =
                              $env:TBC_RELATIVE_PATH

                          tcfPath =
                              $env:TCF_RELATIVE_PATH

                          stepName =
                              'Test Configuration Selection'

                          type =
                              'configuration'
                      }
                  )
              }

              execution = [ordered]@{
                  testcases = @(
                      [ordered]@{
                          relativePath =
                              $env:PROJECT_RELATIVE_PATH

                          constants =
                              $constants

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'project'
                      }
                  )
              }

              teardown = [ordered]@{
                  steps = @(
                      [ordered]@{
                          type =
                              'ecuTestStop'
                      }
                  )
              }

              xilConfigRequirements = @(
                  [ordered]@{
                      label =
                          'Identifier'

                      category =
                          'XIL'

                      value =
                          $env:XIL_IDENTIFIER

                      type =
                          'configuration'
                  }
              )

              parameters =
                  $parameters
          }

          $playbookFile =
              Join-Path `
                  -Path $env:ARTIFACT_ROOT `
                  -ChildPath 'playbook.json'

          $playbook |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath $playbookFile `
                  -Encoding utf8

          "PLAYBOOK_FILE=$playbookFile" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Playbook JSON: $playbookFile"

      # ============================================================
      # 5. CREATE TESTGUIDE PLAYBOOK
      # ============================================================

      - name: Create TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ONECX_AUTH_KEY) {
              throw 'ONECX_AUTH_KEY is missing.'
          }

          if (-not $env:ONECX_PROJECT_ID) {
              throw 'ONECX_PROJECT_ID is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $createUrl = (
              "$env:ONECX_URL/api/v2/execution/playbook" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&folder=%2F"
          )

          $requestBody =
              Get-Content `
                  -LiteralPath $env:PLAYBOOK_FILE `
                  -Raw

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $createUrl `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $requestBody `
                  -ErrorAction Stop

          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          -Path $env:ARTIFACT_ROOT `
                          -ChildPath 'create-response.json'
                  ) `
                  -Encoding utf8

          $playbookId =
              $null

          if ($response.playbookId) {
              $playbookId =
                  $response.playbookId
          }
          elseif ($response.id) {
              $playbookId =
                  $response.id
          }
          elseif ($response.data) {
              $playbookId =
                  $response.data.id
          }

          if (-not $playbookId) {
              Write-Host (
                  $response |
                      ConvertTo-Json -Depth 30
              )

              throw (
                  'Create TestGuide API returned ' +
                  'no playbook ID.'
              )
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Playbook ID: $playbookId"

      # ============================================================
      # 6. EXECUTE TESTGUIDE PLAYBOOK
      # ============================================================

      - name: Execute selected TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToEcuTestPathExpression {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path
              )

              $cleanPath =
                  $Path.Trim()

              while (
                  $cleanPath.Length -ge 2 -and
                  $cleanPath.StartsWith('"') -and
                  $cleanPath.EndsWith('"')
              ) {
                  $cleanPath =
                      $cleanPath.Substring(
                          1,
                          $cleanPath.Length - 2
                      ).Trim()
              }

              return (
                  '"' +
                  $cleanPath.Replace('\', '\\') +
                  '"'
              )
          }

          $executionParameters = @(
              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  value =
                      "'$($env:TARGET_ECU)'"
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  value =
                      'True'
              }
          )

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              $executionParameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_RAL_FILE_PATH'

                  value = (
                      Convert-ToEcuTestPathExpression `
                          -Path $env:RAL_FILE_LOCATION
                  )
              }
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              $executionParameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                  value = (
                      Convert-ToEcuTestPathExpression `
                          -Path $env:FLASH_ARCHIVE_LOCATION
                  )
              }
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $executeUrl = (
              "$env:ONECX_URL/api/v2/execution/playbook/" +
              "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&checkLastExecution=true"
          )

          $requestBody = @{
              parameters =
                  $executionParameters
          } |
              ConvertTo-Json -Depth 20

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'EXECUTING PLAYBOOK'
          Write-Host '========================================'
          Write-Host "Category : [$env:CATEGORY_INPUT]"
          Write-Host "Playbook : [$env:TESTGUIDE_PLAYBOOK_ID]"
          Write-Host "Project  : [$env:PROJECT_RELATIVE_PATH]"
          Write-Host '========================================'

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $executeUrl `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $requestBody `
                  -ErrorAction Stop

          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          -Path $env:ARTIFACT_ROOT `
                          -ChildPath 'execute-response.json'
                  ) `
                  -Encoding utf8

          Write-Host (
              $response |
                  ConvertTo-Json -Depth 30
          )

          $taskId =
              $null

          if ($response.taskIds) {
              $taskId =
                  @($response.taskIds)[0]
          }
          elseif ($response.taskId) {
              $taskId =
                  $response.taskId
          }
          elseif ($response.id) {
              $taskId =
                  $response.id
          }
          elseif (
              $response.data -and
              $response.data.taskIds
          ) {
              $taskId =
                  @($response.data.taskIds)[0]
          }
          elseif (
              $response.data -and
              $response.data.taskId
          ) {
              $taskId =
                  $response.data.taskId
          }

          if (-not $taskId) {
              throw (
                  'Execute TestGuide API returned ' +
                  'no task ID.'
              )
          }

          "TESTGUIDE_TASK_ID=$taskId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Task ID: $taskId"

      # ============================================================
      # 7. POLL EVERY 15 SECONDS
      # ============================================================

      - name: Wait for TestGuide terminal state
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $taskUrl = (
              "$env:ONECX_URL/api/v2/execution/task/" +
              "$env:TESTGUIDE_TASK_ID" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&fields=taskId" +
              "&fields=name" +
              "&fields=startDate" +
              "&fields=endDate" +
              "&fields=state" +
              "&fields=stateInfo" +
              "&fields=aggregatedVerdict" +
              "&fields=abortedByUser"
          )

          $completedStates = @(
              'FINISHED',
              'COMPLETED',
              'COMPLETE',
              'SUCCESS',
              'SUCCEEDED',
              'DONE',
              'ENDED'
          )

          $abortedStates = @(
              'ABORTED',
              'ABORT'
          )

          $failedStates = @(
              'ERROR',
              'FAILED',
              'FAILURE'
          )

          $cancelledStates = @(
              'CANCELLED',
              'CANCELED'
          )

          $pollDeadline =
              (Get-Date).AddMinutes(180)

          $attempt =
              0

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TESTGUIDE EXECUTION POLLING'
          Write-Host '========================================'
          Write-Host "Task ID       : [$env:TESTGUIDE_TASK_ID]"
          Write-Host 'Poll interval : 15 seconds'
          Write-Host '========================================'

          while ((Get-Date) -lt $pollDeadline) {
              $attempt++

              $task =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $taskUrl `
                      -Headers $headers `
                      -ErrorAction Stop

              $state =
                  "$($task.state)".
                      Trim().
                      ToUpperInvariant()

              $verdict =
                  "$($task.aggregatedVerdict)".
                      Trim()

              $stateInfo =
                  "$($task.stateInfo)".
                      Trim()

              $startDate =
                  "$($task.startDate)".
                      Trim()

              $endDate =
                  "$($task.endDate)".
                      Trim()

              $abortedBy =
                  "$($task.abortedByUser)".
                      Trim()

              Write-Host (
                  "Attempt $attempt | " +
                  "State=[$state] | " +
                  "Verdict=[$verdict] | " +
                  "StateInfo=[$stateInfo] | " +
                  "EndDate=[$endDate]"
              )

              $task |
                  ConvertTo-Json -Depth 30 |
                  Set-Content `
                      -LiteralPath (
                          Join-Path `
                              -Path $env:ARTIFACT_ROOT `
                              -ChildPath 'task-latest.json'
                      ) `
                      -Encoding utf8

              $isCompleted =
                  $state -in $completedStates

              $isAborted =
                  $state -in $abortedStates

              $isFailed =
                  $state -in $failedStates

              $isCancelled =
                  $state -in $cancelledStates

              $hasEndDate =
                  [bool]$endDate

              $isTerminal = (
                  $isCompleted -or
                  $isAborted -or
                  $isFailed -or
                  $isCancelled -or
                  $hasEndDate
              )

              if ($isTerminal) {
                  $safeStateInfo =
                      (
                          $stateInfo -replace
                          '[\r\n]+',
                          ' '
                      ).Trim()

                  if (-not $state) {
                      $state =
                          'ENDED'
                  }

                  if (-not $endDate) {
                      $endDate =
                          Get-Date -Format 'o'
                  }

                  "TASK_START_DATE=$startDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TASK_END_DATE=$endDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_STATE=$state" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_VERDICT=$verdict" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_MESSAGE=$safeStateInfo" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  $task |
                      ConvertTo-Json -Depth 30 |
                      Set-Content `
                          -LiteralPath (
                              Join-Path `
                                  -Path $env:ARTIFACT_ROOT `
                                  -ChildPath 'task-result.json'
                          ) `
                          -Encoding utf8

                  Write-Host ''
                  Write-Host '========================================'
                  Write-Host 'TESTGUIDE EXECUTION ENDED'
                  Write-Host '========================================'
                  Write-Host "Attempts  : [$attempt]"
                  Write-Host "State     : [$state]"
                  Write-Host "Verdict   : [$verdict]"
                  Write-Host "StateInfo : [$safeStateInfo]"
                  Write-Host "StartDate : [$startDate]"
                  Write-Host "EndDate   : [$endDate]"

                  if ($abortedBy) {
                      Write-Host "AbortedBy : [$abortedBy]"
                  }

                  Write-Host '========================================'

                  if (
                      $isCompleted -or
                      (
                          $hasEndDate -and
                          -not $isAborted -and
                          -not $isFailed -and
                          -not $isCancelled
                      )
                  ) {
                      Write-Host 'Moving to ATX download.'

                      exit 0
                  }

                  if (-not $safeStateInfo) {
                      if ($isAborted) {
                          $safeStateInfo =
                              'TestGuide execution was aborted.'
                      }
                      elseif ($isCancelled) {
                          $safeStateInfo =
                              'TestGuide execution was cancelled.'
                      }
                      else {
                          $safeStateInfo =
                              'TestGuide execution failed.'
                      }
                  }

                  $errorMessage = (
                      "TestGuide execution ended. " +
                      "State=$state; " +
                      "Task=$env:TESTGUIDE_TASK_ID; " +
                      "Verdict=$verdict; " +
                      "Message=$safeStateInfo"
                  )

                  if ($abortedBy) {
                      $errorMessage += (
                          "; AbortedBy=$abortedBy"
                      )
                  }

                  $errorMessage |
                      Set-Content `
                          -LiteralPath (
                              Join-Path `
                                  -Path $env:ARTIFACT_ROOT `
                                  -ChildPath 'testguide-error.txt'
                          ) `
                          -Encoding utf8

                  throw $errorMessage
              }

              Write-Host (
                  'Task is still active. ' +
                  'Polling again in 15 seconds...'
              )

              Start-Sleep -Seconds 15
          }

          throw (
              'Polling exceeded 180 minutes. ' +
              "Task=$env:TESTGUIDE_TASK_ID"
          )

      # ============================================================
      # 8. DOWNLOAD ATX REPORT
      # ============================================================

      - name: Download ATX report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          if (-not $env:TASK_START_DATE) {
              throw 'TASK_START_DATE is missing.'
          }

          if (-not $env:TASK_END_DATE) {
              throw 'TASK_END_DATE is missing.'
          }

          $depositoriesResponse =
              Invoke-RestMethod `
                  -Method Get `
                  -Uri (
                      "$env:ONECX_URL/api/artifact/depositories" +
                      "?projectId=$env:ONECX_PROJECT_ID" +
                      "&shared=false"
                  ) `
                  -Headers $headers `
                  -ErrorAction Stop

          if ($depositoriesResponse.items) {
              $depositories =
                  @($depositoriesResponse.items)
          }
          else {
              $depositories =
                  @($depositoriesResponse)
          }

          $from =
              (
                  Get-Date $env:TASK_START_DATE
              ).
                  AddMinutes(-2).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ'
                  )

          $to =
              (
                  Get-Date $env:TASK_END_DATE
              ).
                  AddMinutes(15).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ'
                  )

          $downloadCount =
              0

          foreach ($depository in $depositories) {
              $depositoryId =
                  "$($depository.id)"

              if (-not $depositoryId) {
                  continue
              }

              $artifactsUrl = (
                  "$env:ONECX_URL/api/artifact/artifacts" +
                  "?depositoryId=$depositoryId" +
                  "&startDate=$from" +
                  "&endDate=$to"
              )

              try {
                  $artifactResponse =
                      Invoke-RestMethod `
                          -Method Get `
                          -Uri $artifactsUrl `
                          -Headers $headers `
                          -ErrorAction Stop
              }
              catch {
                  Write-Warning (
                      'Unable to search depository: ' +
                      "$depositoryId"
                  )

                  continue
              }

              if ($artifactResponse.items) {
                  $artifacts =
                      @($artifactResponse.items)
              }
              else {
                  $artifacts =
                      @($artifactResponse)
              }

              foreach ($artifact in $artifacts) {
                  $fileName =
                      "$($artifact.fileName)"

                  $extension =
                      "$($artifact.extension)".
                          TrimStart('.').
                          ToLowerInvariant()

                  if (
                      $extension -ne 'atx' -and
                      $fileName -notmatch '(?i)\.atx$'
                  ) {
                      continue
                  }

                  $artifactId =
                      "$($artifact.id)"

                  if (-not $artifactId) {
                      continue
                  }

                  if (-not $fileName) {
                      $fileName =
                          "$artifactId.atx"
                  }

                  $outputFile =
                      Join-Path `
                          -Path $env:ATX_DIRECTORY `
                          -ChildPath $fileName

                  $downloadUrl = (
                      "$env:ONECX_URL/api/artifact/artifacts/" +
                      "$artifactId/download"
                  )

                  Invoke-WebRequest `
                      -Method Get `
                      -Uri $downloadUrl `
                      -Headers $headers `
                      -OutFile $outputFile `
                      -ErrorAction Stop

                  $downloadedFile =
                      Get-Item `
                          -LiteralPath $outputFile

                  if ($downloadedFile.Length -eq 0) {
                      throw (
                          'Downloaded ATX is empty: ' +
                          "$fileName"
                      )
                  }

                  Write-Host "Downloaded ATX: $fileName"

                  $downloadCount++
              }
          }

          if ($downloadCount -eq 0) {
              throw 'No ATX report was found.'
          }

          Write-Host (
              'Downloaded ATX reports: ' +
              "$downloadCount"
          )

      # ============================================================
      # 9. BUILD JFROG DESTINATION
      # ============================================================

      - name: Build JFrog destination
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          $segments = @(
              $env:CW_RELEASE
              $env:TARGET_ECU
              $env:CATEGORY
              $env:TEST_OR_VALIDATOR
              $env:RUN_TIMESTAMP
          )

          foreach ($segment in $segments) {
              if (
                  $segment -notmatch
                  '^[A-Za-z0-9._-]+$'
              ) {
                  throw (
                      'Unsafe JFrog path segment: ' +
                      "$segment"
                  )
              }
          }

          $targetPath = (
              'L2_Quality_Gate/' +
              ($segments -join '/') +
              '/'
          )

          "JFROG_TARGET_PATH=$targetPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "JFrog target: $targetPath"

      # ============================================================
      # 10. UPLOAD ATX TO JFROG
      # ============================================================

      - name: Upload ATX to JFrog
        shell: pwsh
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:JFROG_TOKEN) {
              throw 'JFROG_TOKEN is missing.'
          }

          $atxFiles =
              Get-ChildItem `
                  -LiteralPath $env:ATX_DIRECTORY `
                  -Filter '*.atx' `
                  -File

          if (-not $atxFiles) {
              throw (
                  'No ATX reports are available ' +
                  'for JFrog upload.'
              )
          }

          foreach ($file in $atxFiles) {
              $uploadUrl = (
                  "$($env:JFROG_URL.TrimEnd('/'))/" +
                  "$env:JFROG_REPOSITORY/" +
                  "$env:JFROG_TARGET_PATH" +
                  "$($file.Name)"
              )

              Write-Host (
                  'Uploading ATX: ' +
                  "$($file.Name)"
              )

              if ($env:JFROG_USER) {
                  curl.exe `
                      --fail-with-body `
                      --silent `
                      --show-error `
                      --request PUT `
                      --user "$($env:JFROG_USER):$($env:JFROG_TOKEN)" `
                      --header 'Content-Type: application/octet-stream' `
                      --upload-file "$($file.FullName)" `
                      "$uploadUrl"
              }
              else {
                  curl.exe `
                      --fail-with-body `
                      --silent `
                      --show-error `
                      --request PUT `
                      --header "Authorization: Bearer $env:JFROG_TOKEN" `
                      --header 'Content-Type: application/octet-stream' `
                      --upload-file "$($file.FullName)" `
                      "$uploadUrl"
              }

              if ($LASTEXITCODE -ne 0) {
                  throw (
                      'JFrog upload failed for ' +
                      "$($file.Name)"
                  )
              }
          }

          $jfrogUrl = (
              "$($env:JFROG_URL.TrimEnd('/'))/" +
              "$env:JFROG_REPOSITORY/" +
              "$env:JFROG_TARGET_PATH"
          )

          "JFROG_REPORT_URL=$jfrogUrl" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "JFrog URL: $jfrogUrl"

      # ============================================================
      # 11. UPLOAD PIPELINE ARTIFACTS
      # ============================================================

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-${{ github.event.client_payload.jira_key }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 12. COMMENT ON JIRA
      # ============================================================

      - name: Comment result on Jira
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

        run: |
          if (
              -not $env:JIRA_KEY -or
              -not $env:JIRA_EMAIL -or
              -not $env:JIRA_API_TOKEN
          ) {
              Write-Warning (
                  'Jira key or credentials are missing. ' +
                  'Skipping Jira comment.'
              )

              exit 0
          }

          if ('${{ job.status }}' -eq 'success') {
              $result =
                  'COMPLETED'
          }
          elseif ($env:TESTGUIDE_STATE) {
              $result =
                  $env:TESTGUIDE_STATE
          }
          else {
              $result =
                  'FAILED'
          }

          $githubRunUrl =
              'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          $commentText = (
              "L2 Quality Gate $result`n`n" +
              "Category: $env:CATEGORY`n" +
              "Test/Validator: $env:TEST_OR_VALIDATOR`n" +
              "CW Release: $env:CW_RELEASE`n" +
              "Target ECU: $env:TARGET_ECU`n" +
              "Test Bench: $env:TEST_BENCH`n" +
              "Project: $env:PROJECT_RELATIVE_PATH`n" +
              "Playbook ID: $env:TESTGUIDE_PLAYBOOK_ID`n" +
              "Task ID: $env:TESTGUIDE_TASK_ID`n" +
              "State: $env:TESTGUIDE_STATE`n" +
              "Verdict: $env:TESTGUIDE_VERDICT"
          )

          if ($env:TESTGUIDE_MESSAGE) {
              $commentText += (
                  "`nMessage: " +
                  "$env:TESTGUIDE_MESSAGE"
              )
          }

          $commentText += (
              "`n`nGitHub Run:`n" +
              "$githubRunUrl"
          )

          if ($env:JFROG_REPORT_URL) {
              $commentText += (
                  "`n`nJFrog Report:`n" +
                  "$env:JFROG_REPORT_URL"
              )
          }

          $commentFile =
              Join-Path `
                  -Path $env:RUNNER_TEMP `
                  -ChildPath 'jira-comment.json'

          @{
              body =
                  $commentText
          } |
              ConvertTo-Json |
              Set-Content `
                  -LiteralPath $commentFile `
                  -Encoding utf8

          curl.exe `
              --fail-with-body `
              --silent `
              --show-error `
              --request POST `
              --user "$($env:JIRA_EMAIL):$($env:JIRA_API_TOKEN)" `
              --header 'Accept: application/json' `
              --header 'Content-Type: application/json' `
              --data-binary "@$commentFile" `
              "$env:JIRA_BASE_URL/rest/api/2/issue/$env:JIRA_KEY/comment"

          if ($LASTEXITCODE -ne 0) {
              Write-Warning 'Jira comment could not be posted.'
          }

      # ============================================================
      # 13. WORKFLOW SUMMARY
      # ============================================================

      - name: Write workflow summary
        if: always()
        shell: pwsh

        run: |
          @"
          ## L2 Quality Gate

          - Jira: $env:JIRA_KEY
          - Selected category: $env:CATEGORY_INPUT
          - Category: $env:CATEGORY
          - Test/Validator: $env:TEST_OR_VALIDATOR
          - CW Release: $env:CW_RELEASE
          - Target ECU: $env:TARGET_ECU
          - Test Bench: $env:TEST_BENCH
          - Project: $env:PROJECT_RELATIVE_PATH
          - Playbook ID: $env:TESTGUIDE_PLAYBOOK_ID
          - Task ID: $env:TESTGUIDE_TASK_ID
          - State: $env:TESTGUIDE_STATE
          - Verdict: $env:TESTGUIDE_VERDICT
          - Message: $env:TESTGUIDE_MESSAGE
          - JFrog: $env:JFROG_REPORT_URL
          "@ |
              Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY `
                  -Append `
                  -Encoding utf8
