name: L2 Quality Gate - Jira Execution

on:
  repository_dispatch:
    types:
      - l2_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

jobs:
  l2-quality-gate:
    name: L2 Quality Gate

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: l2-quality-gate-${{ github.event.client_payload.test_bench }}
      cancel-in-progress: false

    steps:
      # ============================================================
      # 1. PARSE JIRA INPUTS
      # ============================================================

      - name: Parse Jira inputs
        shell: pwsh
        env:
          JIRA_KEY_RAW: ${{ github.event.client_payload.jira_key }}
          CATEGORY_RAW: ${{ github.event.client_payload.category }}
          CW_RAW: ${{ github.event.client_payload.cw_release }}
          BENCH_RAW: ${{ github.event.client_payload.test_bench }}
          ECU_RAW: ${{ github.event.client_payload.target_ecu }}
          FLASH_RAW: ${{ github.event.client_payload.flash_archive_location }}
          RAL_RAW: ${{ github.event.client_payload.ral_file_location }}
          SUBMODULE_RAW: ${{ github.event.client_payload.git_submodule }}
          TEST_CASES_RAW: ${{ github.event.client_payload.test_cases }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Clean-Value {
              param($Value)

              if ($null -eq $Value) {
                  return ''
              }

              return (
                  "$Value" -replace '[\r\n]+', ' '
              ).Trim()
          }

          function Clean-Path {
              param($Value)

              if ($null -eq $Value) {
                  return ''
              }

              $result = (
                  "$Value" -replace '[\r\n]+', ''
              ).Trim()

              while (
                  $result.Length -ge 2 -and
                  $result.StartsWith('"') -and
                  $result.EndsWith('"')
              ) {
                  $result = $result.Substring(
                      1,
                      $result.Length - 2
                  ).Trim()
              }

              return $result
          }

          function Set-GitHubEnvironmentValue {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Name,

                  [AllowEmptyString()]
                  [string]$Value
              )

              "$Name=$Value" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          $jiraKey =
              Clean-Value $env:JIRA_KEY_RAW

          $categoryInput =
              Clean-Value $env:CATEGORY_RAW

          $cwRelease =
              (
                  Clean-Value $env:CW_RAW
              ).ToUpperInvariant()

          $testBench =
              (
                  Clean-Value $env:BENCH_RAW
              ).ToLowerInvariant()

          $targetEcu =
              Clean-Value $env:ECU_RAW

          $flashArchive =
              Clean-Path $env:FLASH_RAW

          $ralFile =
              Clean-Path $env:RAL_RAW

          $gitSubmodule =
              Clean-Value $env:SUBMODULE_RAW

          $testCases =
              Clean-Value $env:TEST_CASES_RAW

          if (-not $jiraKey) {
              throw 'jira_key is missing.'
          }

          if (-not $categoryInput) {
              throw 'category is missing.'
          }

          if (-not $cwRelease) {
              throw 'cw_release is missing.'
          }

          if (-not $testBench) {
              throw 'test_bench is missing.'
          }

          if (-not $targetEcu) {
              throw 'target_ecu is missing.'
          }

          if ($cwRelease -notmatch '^CW[0-9]{2}$') {
              throw "Invalid CW release: $cwRelease"
          }

          if (
              $testBench -notin @(
                  'syshil1',
                  'syshil2'
              )
          ) {
              throw "Unsupported Test Bench: $testBench"
          }

          switch ($categoryInput.ToLowerInvariant()) {
              'network_test' {
                  $categoryInput =
                      'Network_Test'
              }

              'network_testing' {
                  $categoryInput =
                      'Network_Test'
              }

              'diagnostic_test' {
                  $categoryInput =
                      'Diagnostic_Test'
              }

              'diagnostic_testing' {
                  $categoryInput =
                      'Diagnostic_Test'
              }

              'bootloader_compliance_test' {
                  $categoryInput =
                      'Bootloader_Compliance_Test'
              }

              default {
                  throw (
                      "Unsupported Jira category: " +
                      "$categoryInput"
                  )
              }
          }

          if (
              $categoryInput -eq 'Diagnostic_Test' -and
              -not $ralFile
          ) {
              throw (
                  'Diagnostic_Test requires ' +
                  'RAL File Location.'
              )
          }

          if (
              $categoryInput -eq
                  'Bootloader_Compliance_Test' -and
              -not $flashArchive
          ) {
              throw (
                  'Bootloader_Compliance_Test requires ' +
                  'Flash Archieve Location.'
              )
          }

          Set-GitHubEnvironmentValue `
              -Name 'JIRA_KEY' `
              -Value $jiraKey

          Set-GitHubEnvironmentValue `
              -Name 'CATEGORY_INPUT' `
              -Value $categoryInput

          Set-GitHubEnvironmentValue `
              -Name 'CW_RELEASE' `
              -Value $cwRelease

          Set-GitHubEnvironmentValue `
              -Name 'TEST_BENCH' `
              -Value $testBench

          Set-GitHubEnvironmentValue `
              -Name 'TARGET_ECU' `
              -Value $targetEcu

          Set-GitHubEnvironmentValue `
              -Name 'FLASH_ARCHIVE_LOCATION' `
              -Value $flashArchive

          Set-GitHubEnvironmentValue `
              -Name 'RAL_FILE_LOCATION' `
              -Value $ralFile

          Set-GitHubEnvironmentValue `
              -Name 'GIT_SUBMODULE' `
              -Value $gitSubmodule

          Set-GitHubEnvironmentValue `
              -Name 'TEST_CASES' `
              -Value $testCases

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PARSED JIRA INPUTS'
          Write-Host '========================================'
          Write-Host "Jira Key      : [$jiraKey]"
          Write-Host "Category      : [$categoryInput]"
          Write-Host "CW Release    : [$cwRelease]"
          Write-Host "Test Bench    : [$testBench]"
          Write-Host "Target ECU    : [$targetEcu]"
          Write-Host "Flash parsed  : [$flashArchive]"
          Write-Host "RAL parsed    : [$ralFile]"
          Write-Host "Git Submodule : [$gitSubmodule]"
          Write-Host "Test Cases    : [$testCases]"
          Write-Host '========================================'

      # ============================================================
      # 2. CHECKOUT
      # ============================================================

      - name: Checkout pipeline repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout L2 Quality Gate
        uses: actions/checkout@v4
        with:
          repository: scout-motors/eeint-L2-Quality-Gate
          token: ${{ secrets.HIL_REPO_PAT }}
          path: source-l2
          fetch-depth: 1
          submodules: recursive

      # ============================================================
      # 3. ROUTE CATEGORY AND PREPARE WORKSPACE
      # ============================================================

      - name: Route category and prepare workspace
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          switch ($env:CATEGORY_INPUT) {
              'Network_Test' {
                  $category =
                      'network-testing'

                  $testName =
                      'NetworkTest'

                  $playbookName =
                      'L2-network-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Network-Test\NetworkTest.prj'
              }

              'Diagnostic_Test' {
                  $category =
                      'diagnostic-testing'

                  $testName =
                      'DiagnosticTest'

                  $playbookName =
                      'L2-Diagnostic-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Diagnostic-Test\DiagnosticTest.prj'
              }

              'Bootloader_Compliance_Test' {
                  $category =
                      'bootloader-compliance'

                  $testName =
                      'BootloaderComplianceTest'

                  $playbookName =
                      'L2-Bootloader-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Bootloader-Compliance-Test\BootloaderComplianceTest.prj'
              }

              default {
                  throw (
                      "Unsupported category: " +
                      "$env:CATEGORY_INPUT"
                  )
              }
          }

          switch ($env:TEST_BENCH) {
              'syshil1' {
                  $resource =
                      'syshil1-labtest1'

                  $configurationFolder =
                      'SUBSYS1'
              }

              'syshil2' {
                  $resource =
                      'syshil2-labtest2'

                  $configurationFolder =
                      'SUBSYS1'
              }

              default {
                  throw (
                      "Unsupported bench: " +
                      "$env:TEST_BENCH"
                  )
              }
          }

          $workspace =
              'C:\HIL\Testing\eeint-Test-Automation'

          $sourceRepository =
              Join-Path `
                  -Path $env:GITHUB_WORKSPACE `
                  -ChildPath 'source-l2'

          $destinationRepository =
              Join-Path `
                  -Path $workspace `
                  -ChildPath 'Packages\L2-Quality-Gate'

          $sourceExists =
              Test-Path `
                  -LiteralPath $sourceRepository `
                  -PathType Container

          if (-not $sourceExists) {
              throw (
                  "Source repository is missing: " +
                  "$sourceRepository"
              )
          }

          New-Item `
              -ItemType Directory `
              -Path $destinationRepository `
              -Force |
              Out-Null

          Copy-Item `
              -Path (
                  Join-Path `
                      -Path $sourceRepository `
                      -ChildPath '*'
              ) `
              -Destination $destinationRepository `
              -Recurse `
              -Force

          $fullProjectPath =
              Join-Path `
                  -Path $workspace `
                  -ChildPath $projectRelativePath

          $projectExists =
              Test-Path `
                  -LiteralPath $fullProjectPath `
                  -PathType Leaf

          Write-Host "Project path   : [$fullProjectPath]"
          Write-Host "Project exists : [$projectExists]"

          if (-not $projectExists) {
              throw (
                  "Project does not exist: " +
                  "$fullProjectPath"
              )
          }

          $tbcRelativePath = (
              "Configurations\" +
              "$configurationFolder\" +
              "${configurationFolder}_TestBenchConfig.tbc"
          )

          $tcfRelativePath = (
              "Configurations\" +
              "$configurationFolder\" +
              "${configurationFolder}_TestConfig.tcf"
          )

          $fullTbcPath =
              Join-Path `
                  -Path $workspace `
                  -ChildPath $tbcRelativePath

          $fullTcfPath =
              Join-Path `
                  -Path $workspace `
                  -ChildPath $tcfRelativePath

          $tbcExists =
              Test-Path `
                  -LiteralPath $fullTbcPath `
                  -PathType Leaf

          $tcfExists =
              Test-Path `
                  -LiteralPath $fullTcfPath `
                  -PathType Leaf

          if (-not $tbcExists) {
              throw "TBC is missing: $fullTbcPath"
          }

          if (-not $tcfExists) {
              throw "TCF is missing: $fullTcfPath"
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              $ralExists =
                  Test-Path `
                      -LiteralPath $env:RAL_FILE_LOCATION `
                      -PathType Leaf

              Write-Host (
                  "RAL path   : [$env:RAL_FILE_LOCATION]"
              )

              Write-Host (
                  "RAL exists : [$ralExists]"
              )

              if (-not $ralExists) {
                  throw (
                      "RAL file does not exist: " +
                      "$env:RAL_FILE_LOCATION"
                  )
              }
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              $flashExists =
                  Test-Path `
                      -LiteralPath $env:FLASH_ARCHIVE_LOCATION `
                      -PathType Leaf

              Write-Host (
                  "Flash path   : [$env:FLASH_ARCHIVE_LOCATION]"
              )

              Write-Host (
                  "Flash exists : [$flashExists]"
              )

              if (-not $flashExists) {
                  throw (
                      "Bootloader file does not exist: " +
                      "$env:FLASH_ARCHIVE_LOCATION"
                  )
              }
          }

          $artifactRoot =
              Join-Path `
                  -Path $env:RUNNER_TEMP `
                  -ChildPath 'l2-artifacts'

          $atxDirectory =
              Join-Path `
                  -Path $artifactRoot `
                  -ChildPath 'atx'

          New-Item `
              -ItemType Directory `
              -Path $atxDirectory `
              -Force |
              Out-Null

          $runTimestamp =
              Get-Date `
                  -Format 'yyyy-MM-dd_HHmmss'

          $resolvedValues = [ordered]@{
              CATEGORY =
                  $category

              TEST_OR_VALIDATOR =
                  $testName

              PLAYBOOK_NAME =
                  $playbookName

              PROJECT_RELATIVE_PATH =
                  $projectRelativePath

              RESOURCE_NAME =
                  $resource

              TESTGUIDE_WORKSPACE =
                  $workspace

              TBC_RELATIVE_PATH =
                  $tbcRelativePath

              TCF_RELATIVE_PATH =
                  $tcfRelativePath

              XIL_IDENTIFIER =
                  "novi_hq/1stfloor/ee_lab_novi/$resource/ControlComputer"

              ARTIFACT_ROOT =
                  $artifactRoot

              ATX_DIRECTORY =
                  $atxDirectory

              RUN_TIMESTAMP =
                  $runTimestamp
          }

          foreach (
              $item in
              $resolvedValues.GetEnumerator()
          ) {
              "$($item.Key)=$($item.Value)" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'SELECTED EXECUTION'
          Write-Host '========================================'
          Write-Host "Playbook : [$playbookName]"
          Write-Host "Project  : [$projectRelativePath]"
          Write-Host "Resource : [$resource]"
          Write-Host "TBC      : [$tbcRelativePath]"
          Write-Host "TCF      : [$tcfRelativePath]"
          Write-Host '========================================'

      # ============================================================
      # 4. GENERATE SELECTED PLAYBOOK
      # ============================================================

      - name: Generate selected TestGuide playbook
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToEcuTestPathExpression {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path
              )

              $cleanPath =
                  $Path.Trim().Trim('"')

              $escapedPath =
                  $cleanPath.Replace(
                      '\',
                      '\\'
                  )

              return (
                  '"' +
                  $escapedPath +
                  '"'
              )
          }

          $targetEcuExpression = (
              "'" +
              $env:TARGET_ECU +
              "'"
          )

          $constants = @(
              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  value =
                      $targetEcuExpression
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  value =
                      'True'
              }
          )

          $parameters = @(
              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  defaultValue =
                      $targetEcuExpression

                  required =
                      $false
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  defaultValue =
                      'True'

                  required =
                      $false
              }
          )

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              $ralExpression =
                  Convert-ToEcuTestPathExpression `
                      -Path $env:RAL_FILE_LOCATION

              $constants += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_RAL_FILE_PATH'

                  value =
                      $ralExpression
              }

              $parameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_RAL_FILE_PATH'

                  defaultValue =
                      $ralExpression

                  required =
                      $false
              }

              Write-Host (
                  "RAL expression: [$ralExpression]"
              )
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              $hexExpression =
                  Convert-ToEcuTestPathExpression `
                      -Path $env:FLASH_ARCHIVE_LOCATION

              $constants += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                  value =
                      $hexExpression
              }

              $parameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                  defaultValue =
                      $hexExpression

                  required =
                      $false
              }

              Write-Host (
                  "HEX expression: [$hexExpression]"
              )
          }

          $playbook = [ordered]@{
              metadata = [ordered]@{
                  name = (
                      "$env:PLAYBOOK_NAME-" +
                      "$env:JIRA_KEY-" +
                      "$env:RUN_TIMESTAMP"
                  )

                  taskNameTemplate =
                      '${playbook_name} (${playbook_datetime}) ${distribution_count}'

                  labels =
                      @()
              }

              workspace = [ordered]@{
                  source = [ordered]@{
                      path =
                          $env:TESTGUIDE_WORKSPACE

                      sourceType =
                          'location'
                  }

                  dependencies =
                      @()
              }

              setup = [ordered]@{
                  steps = @(
                      [ordered]@{
                          reuse =
                              'always'

                          keepConfiguration =
                              $false

                          waitMinutesForLicense =
                              0

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'ecuTestStart'
                      },

                      [ordered]@{
                          tbcPath =
                              $env:TBC_RELATIVE_PATH

                          tcfPath =
                              $env:TCF_RELATIVE_PATH

                          stepName =
                              'Test Configuration Selection'

                          type =
                              'configuration'
                      }
                  )
              }

              execution = [ordered]@{
                  testcases = @(
                      [ordered]@{
                          relativePath =
                              $env:PROJECT_RELATIVE_PATH

                          constants =
                              $constants

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'project'
                      }
                  )
              }

              teardown = [ordered]@{
                  steps = @(
                      [ordered]@{
                          type =
                              'ecuTestStop'
                      }
                  )
              }

              xilConfigRequirements = @(
                  [ordered]@{
                      label =
                          'Identifier'

                      category =
                          'XIL'

                      value =
                          $env:XIL_IDENTIFIER

                      type =
                          'configuration'
                  }
              )

              parameters =
                  $parameters
          }

          $playbookFile =
              Join-Path `
                  -Path $env:ARTIFACT_ROOT `
                  -ChildPath 'playbook.json'

          $playbook |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath $playbookFile `
                  -Encoding utf8

          "PLAYBOOK_FILE=$playbookFile" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Playbook file: [$playbookFile]"

      # ============================================================
      # 5. CREATE TESTGUIDE PLAYBOOK
      # ============================================================

      - name: Create TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ONECX_AUTH_KEY) {
              throw 'ONECX_AUTH_KEY is missing.'
          }

          if (-not $env:ONECX_PROJECT_ID) {
              throw 'ONECX_PROJECT_ID is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $createUrl = (
              "$env:ONECX_URL/api/v2/execution/playbook" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&folder=%2F"
          )

          $requestBody =
              Get-Content `
                  -LiteralPath $env:PLAYBOOK_FILE `
                  -Raw

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $createUrl `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $requestBody `
                  -ErrorAction Stop

          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          -Path $env:ARTIFACT_ROOT `
                          -ChildPath 'create-response.json'
                  ) `
                  -Encoding utf8

          $playbookId =
              $null

          if ($response.playbookId) {
              $playbookId =
                  $response.playbookId
          }
          elseif ($response.id) {
              $playbookId =
                  $response.id
          }
          elseif ($response.data) {
              $playbookId =
                  $response.data.id
          }

          if (-not $playbookId) {
              Write-Host (
                  $response |
                      ConvertTo-Json -Depth 30
              )

              throw (
                  'Create TestGuide API returned ' +
                  'no playbook ID.'
              )
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Playbook ID: [$playbookId]"

      # ============================================================
      # 6. EXECUTE TESTGUIDE PLAYBOOK
      # ============================================================

      - name: Execute selected TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToEcuTestPathExpression {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path
              )

              $cleanPath =
                  $Path.Trim().Trim('"')

              return (
                  '"' +
                  $cleanPath.Replace('\', '\\') +
                  '"'
              )
          }

          $executionParameters = @(
              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  value =
                      "'$($env:TARGET_ECU)'"
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  value =
                      'True'
              }
          )

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              $executionParameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_RAL_FILE_PATH'

                  value = (
                      Convert-ToEcuTestPathExpression `
                          -Path $env:RAL_FILE_LOCATION
                  )
              }
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              $executionParameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                  value = (
                      Convert-ToEcuTestPathExpression `
                          -Path $env:FLASH_ARCHIVE_LOCATION
                  )
              }
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $executeUrl = (
              "$env:ONECX_URL/api/v2/execution/playbook/" +
              "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&checkLastExecution=true"
          )

          $requestBody = @{
              parameters =
                  $executionParameters
          } |
              ConvertTo-Json -Depth 20

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $executeUrl `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $requestBody `
                  -ErrorAction Stop

          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          -Path $env:ARTIFACT_ROOT `
                          -ChildPath 'execute-response.json'
                  ) `
                  -Encoding utf8

          Write-Host (
              $response |
                  ConvertTo-Json -Depth 30
          )

          $taskId =
              $null

          if ($response.taskIds) {
              $taskId =
                  @($response.taskIds)[0]
          }
          elseif ($response.taskId) {
              $taskId =
                  $response.taskId
          }
          elseif ($response.id) {
              $taskId =
                  $response.id
          }
          elseif (
              $response.data -and
              $response.data.taskIds
          ) {
              $taskId =
                  @($response.data.taskIds)[0]
          }
          elseif (
              $response.data -and
              $response.data.taskId
          ) {
              $taskId =
                  $response.data.taskId
          }

          if (-not $taskId) {
              throw (
                  'Execute TestGuide API returned ' +
                  'no task ID.'
              )
          }

          "TESTGUIDE_TASK_ID=$taskId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Task ID: [$taskId]"

      # ============================================================
      # 7. POLL EVERY 15 SECONDS
      # ============================================================

      - name: Wait for TestGuide execution
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ONECX_AUTH_KEY) {
              throw 'ONECX_AUTH_KEY is missing.'
          }

          if (-not $env:TESTGUIDE_TASK_ID) {
              throw 'TESTGUIDE_TASK_ID is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $taskUrl = (
              "$env:ONECX_URL/api/v2/execution/task/" +
              "$env:TESTGUIDE_TASK_ID" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&fields=taskId" +
              "&fields=startDate" +
              "&fields=endDate" +
              "&fields=state" +
              "&fields=stateInfo" +
              "&fields=aggregatedVerdict" +
              "&fields=abortedByUser"
          )

          $completedStates = @(
              'FINISHED',
              'COMPLETED',
              'COMPLETE',
              'SUCCESS',
              'SUCCEEDED',
              'DONE',
              'ENDED'
          )

          $failedStates = @(
              'ABORTED',
              'ABORT',
              'ERROR',
              'FAILED',
              'FAILURE',
              'CANCELLED',
              'CANCELED'
          )

          $attempt =
              0

          $emptyStateAttempts =
              0

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TESTGUIDE EXECUTION POLLING'
          Write-Host '========================================'
          Write-Host "Playbook ID   : [$env:TESTGUIDE_PLAYBOOK_ID]"
          Write-Host "Task ID       : [$env:TESTGUIDE_TASK_ID]"
          Write-Host 'Poll interval : 15 seconds'
          Write-Host '========================================'

          while ($true) {
              $attempt++

              $response =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $taskUrl `
                      -Headers $headers `
                      -ErrorAction Stop

              # Resolve the actual task from different possible
              # TestGuide response shapes.
              $task =
                  $null

              if ($null -ne $response.items) {
                  $task =
                      @($response.items) |
                          Where-Object {
                              "$($_.taskId)" -eq
                              "$env:TESTGUIDE_TASK_ID"
                          } |
                          Select-Object -First 1

                  if ($null -eq $task) {
                      $task =
                          @($response.items) |
                              Select-Object -First 1
                  }
              }
              elseif ($null -ne $response.tasks) {
                  $task =
                      @($response.tasks) |
                          Where-Object {
                              "$($_.taskId)" -eq
                              "$env:TESTGUIDE_TASK_ID"
                          } |
                          Select-Object -First 1

                  if ($null -eq $task) {
                      $task =
                          @($response.tasks) |
                              Select-Object -First 1
                  }
              }
              elseif (
                  $null -ne $response.data -and
                  $null -ne $response.data.items
              ) {
                  $task =
                      @($response.data.items) |
                          Where-Object {
                              "$($_.taskId)" -eq
                              "$env:TESTGUIDE_TASK_ID"
                          } |
                          Select-Object -First 1

                  if ($null -eq $task) {
                      $task =
                          @($response.data.items) |
                              Select-Object -First 1
                  }
              }
              elseif ($null -ne $response.data) {
                  $task =
                      $response.data
              }
              elseif ($response -is [System.Array]) {
                  $task =
                      @($response) |
                          Where-Object {
                              "$($_.taskId)" -eq
                              "$env:TESTGUIDE_TASK_ID"
                          } |
                          Select-Object -First 1

                  if ($null -eq $task) {
                      $task =
                          @($response) |
                              Select-Object -First 1
                  }
              }
              else {
                  $task =
                      $response
              }

              if ($null -eq $task) {
                  throw (
                      'TestGuide returned no task object. ' +
                      "Task ID=$env:TESTGUIDE_TASK_ID"
                  )
              }

              $state =
                  "$($task.state)".Trim()

              if (
                  -not $state -and
                  $null -ne $task.status
              ) {
                  if ($task.status -is [string]) {
                      $state =
                          "$($task.status)".Trim()
                  }
                  elseif (
                      $null -ne
                      $task.status.state
                  ) {
                      $state =
                          "$($task.status.state)".Trim()
                  }
              }

              if (
                  -not $state -and
                  $null -ne $task.executionState
              ) {
                  $state =
                      "$($task.executionState)".Trim()
              }

              $state =
                  $state.ToUpperInvariant()

              $verdict =
                  "$($task.aggregatedVerdict)".Trim()

              if (
                  -not $verdict -and
                  $null -ne $task.verdict
              ) {
                  $verdict =
                      "$($task.verdict)".Trim()
              }

              if (
                  -not $verdict -and
                  $null -ne $task.result
              ) {
                  if ($task.result -is [string]) {
                      $verdict =
                          "$($task.result)".Trim()
                  }
                  elseif (
                      $null -ne
                      $task.result.aggregatedVerdict
                  ) {
                      $verdict =
                          "$($task.result.aggregatedVerdict)".Trim()
                  }
                  elseif (
                      $null -ne
                      $task.result.verdict
                  ) {
                      $verdict =
                          "$($task.result.verdict)".Trim()
                  }
              }

              $verdict =
                  $verdict.ToUpperInvariant()

              $stateInfo =
                  "$($task.stateInfo)".Trim()

              if (
                  -not $stateInfo -and
                  $null -ne $task.message
              ) {
                  $stateInfo =
                      "$($task.message)".Trim()
              }

              if (
                  -not $stateInfo -and
                  $null -ne $task.errorMessage
              ) {
                  $stateInfo =
                      "$($task.errorMessage)".Trim()
              }

              $startDate =
                  "$($task.startDate)".Trim()

              if (
                  -not $startDate -and
                  $null -ne $task.startedAt
              ) {
                  $startDate =
                      "$($task.startedAt)".Trim()
              }

              $endDate =
                  "$($task.endDate)".Trim()

              if (
                  -not $endDate -and
                  $null -ne $task.finishedAt
              ) {
                  $endDate =
                      "$($task.finishedAt)".Trim()
              }

              # CT-style output.
              Write-Host (
                  "Attempt=$attempt " +
                  "State=$state " +
                  "Verdict=$verdict"
              )

              if ($stateInfo) {
                  Write-Host (
                      "StateInfo=$stateInfo"
                  )
              }

              $response |
                  ConvertTo-Json -Depth 30 |
                  Set-Content `
                      -LiteralPath (
                          Join-Path `
                              -Path $env:ARTIFACT_ROOT `
                              -ChildPath 'task-latest.json'
                      ) `
                      -Encoding utf8

              # Empty state protection.
              if (-not $state) {
                  $emptyStateAttempts++

                  Write-Warning (
                      'TestGuide returned an empty task state. ' +
                      "Empty attempt=$emptyStateAttempts."
                  )

                  if ($emptyStateAttempts -eq 1) {
                      Write-Host ''
                      Write-Host 'Raw TestGuide response:'

                      Write-Host (
                          $response |
                              ConvertTo-Json -Depth 30
                      )

                      Write-Host ''
                  }

                  if ($emptyStateAttempts -ge 3) {
                      throw (
                          'TestGuide returned an empty task state ' +
                          'three consecutive times. Inspect ' +
                          'task-latest.json and the raw response. ' +
                          "Task ID=$env:TESTGUIDE_TASK_ID"
                      )
                  }

                  Start-Sleep -Seconds 15

                  continue
              }

              $emptyStateAttempts =
                  0

              # Failure must be checked before endDate because
              # failed/aborted tasks can also have an endDate.
              if ($state -in $failedStates) {
                  $safeStateInfo =
                      (
                          $stateInfo -replace
                          '[\r\n]+',
                          ' '
                      ).Trim()

                  if (-not $safeStateInfo) {
                      $safeStateInfo =
                          "TestGuide ended with state $state."
                  }

                  "TASK_START_DATE=$startDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TASK_END_DATE=$endDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_STATE=$state" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_VERDICT=$verdict" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_MESSAGE=$safeStateInfo" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_EXECUTION_COMPLETE=false" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  $task |
                      ConvertTo-Json -Depth 30 |
                      Set-Content `
                          -LiteralPath (
                              Join-Path `
                                  -Path $env:ARTIFACT_ROOT `
                                  -ChildPath 'task-result.json'
                          ) `
                          -Encoding utf8

                  Write-Host ''
                  Write-Host '========================================'
                  Write-Host 'TESTGUIDE EXECUTION ENDED'
                  Write-Host '========================================'
                  Write-Host "Attempt=$attempt"
                  Write-Host "State=$state"
                  Write-Host "Verdict=$verdict"
                  Write-Host "StateInfo=$safeStateInfo"
                  Write-Host '========================================'

                  throw (
                      "TestGuide execution ended. " +
                      "State=$state; " +
                      "Message=$safeStateInfo"
                  )
              }

              if (
                  ($state -in $completedStates) -or
                  $endDate
              ) {
                  $safeStateInfo =
                      (
                          $stateInfo -replace
                          '[\r\n]+',
                          ' '
                      ).Trim()

                  if (-not $endDate) {
                      $endDate =
                          Get-Date -Format 'o'
                  }

                  "TASK_START_DATE=$startDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TASK_END_DATE=$endDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_STATE=$state" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_VERDICT=$verdict" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_MESSAGE=$safeStateInfo" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_EXECUTION_COMPLETE=true" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  $task |
                      ConvertTo-Json -Depth 30 |
                      Set-Content `
                          -LiteralPath (
                              Join-Path `
                                  -Path $env:ARTIFACT_ROOT `
                                  -ChildPath 'task-result.json'
                          ) `
                          -Encoding utf8

                  Write-Host ''
                  Write-Host '========================================'
                  Write-Host 'TESTGUIDE EXECUTION COMPLETE'
                  Write-Host '========================================'
                  Write-Host "Attempt=$attempt"
                  Write-Host "State=$state"
                  Write-Host "Verdict=$verdict"
                  Write-Host "StartDate=$startDate"
                  Write-Host "EndDate=$endDate"
                  Write-Host '========================================'

                  exit 0
              }

              Start-Sleep -Seconds 15
          }

      # ============================================================
      # 8. DISPLAY FINAL STATE
      # ============================================================

      - name: Display final TestGuide state
        if: always()
        shell: pwsh

        run: |
          Write-Host ''
          Write-Host '========================================'
          Write-Host 'FINAL TESTGUIDE STATE'
          Write-Host '========================================'
          Write-Host "Playbook ID : $env:TESTGUIDE_PLAYBOOK_ID"
          Write-Host "Task ID     : $env:TESTGUIDE_TASK_ID"
          Write-Host "State       : $env:TESTGUIDE_STATE"
          Write-Host "Verdict     : $env:TESTGUIDE_VERDICT"
          Write-Host "Message     : $env:TESTGUIDE_MESSAGE"
          Write-Host "Completed   : $env:TESTGUIDE_EXECUTION_COMPLETE"
          Write-Host '========================================'

      # ============================================================
      # 9. DOWNLOAD ATX ONLY AFTER NORMAL COMPLETION
      # ============================================================

      - name: Download ATX report
        if: env.TESTGUIDE_EXECUTION_COMPLETE == 'true'
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:TASK_START_DATE) {
              throw 'TASK_START_DATE is missing.'
          }

          if (-not $env:TASK_END_DATE) {
              throw 'TASK_END_DATE is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $depositoryResponse =
              Invoke-RestMethod `
                  -Method Get `
                  -Uri (
                      "$env:ONECX_URL/api/artifact/depositories" +
                      "?projectId=$env:ONECX_PROJECT_ID" +
                      "&shared=false"
                  ) `
                  -Headers $headers `
                  -ErrorAction Stop

          if ($depositoryResponse.items) {
              $depositories =
                  @($depositoryResponse.items)
          }
          else {
              $depositories =
                  @($depositoryResponse)
          }

          $from =
              (
                  Get-Date $env:TASK_START_DATE
              ).
                  AddMinutes(-2).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ'
                  )

          $to =
              (
                  Get-Date $env:TASK_END_DATE
              ).
                  AddMinutes(15).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ'
                  )

          $downloadCount =
              0

          foreach ($depository in $depositories) {
              $depositoryId =
                  "$($depository.id)"

              if (-not $depositoryId) {
                  continue
              }

              $artifactUrl = (
                  "$env:ONECX_URL/api/artifact/artifacts" +
                  "?depositoryId=$depositoryId" +
                  "&startDate=$from" +
                  "&endDate=$to"
              )

              try {
                  $artifactResponse =
                      Invoke-RestMethod `
                          -Method Get `
                          -Uri $artifactUrl `
                          -Headers $headers `
                          -ErrorAction Stop
              }
              catch {
                  Write-Warning (
                      "Could not search depository: " +
                      "$depositoryId"
                  )

                  continue
              }

              if ($artifactResponse.items) {
                  $artifacts =
                      @($artifactResponse.items)
              }
              else {
                  $artifacts =
                      @($artifactResponse)
              }

              foreach ($artifact in $artifacts) {
                  $fileName =
                      "$($artifact.fileName)"

                  $extension =
                      "$($artifact.extension)".
                          TrimStart('.').
                          ToLowerInvariant()

                  if (
                      $extension -ne 'atx' -and
                      $fileName -notmatch '(?i)\.atx$'
                  ) {
                      continue
                  }

                  $artifactId =
                      "$($artifact.id)"

                  if (-not $artifactId) {
                      continue
                  }

                  if (-not $fileName) {
                      $fileName =
                          "$artifactId.atx"
                  }

                  $destination =
                      Join-Path `
                          -Path $env:ATX_DIRECTORY `
                          -ChildPath $fileName

                  Invoke-WebRequest `
                      -Method Get `
                      -Uri (
                          "$env:ONECX_URL/api/artifact/artifacts/" +
                          "$artifactId/download"
                      ) `
                      -Headers $headers `
                      -OutFile $destination `
                      -ErrorAction Stop

                  $downloadedFile =
                      Get-Item `
                          -LiteralPath $destination

                  if ($downloadedFile.Length -eq 0) {
                      throw (
                          "Downloaded ATX is empty: " +
                          "$fileName"
                      )
                  }

                  Write-Host (
                      "ATX downloaded: " +
                      "$destination"
                  )

                  $downloadCount++
              }
          }

          if ($downloadCount -eq 0) {
              throw (
                  'Execution completed, but no ATX ' +
                  'report was found.'
              )
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'ATX DOWNLOAD COMPLETE'
          Write-Host '========================================'
          Write-Host "Files    : $downloadCount"
          Write-Host "Location : $env:ATX_DIRECTORY"
          Write-Host '========================================'
