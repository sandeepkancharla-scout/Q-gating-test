name: L2 Quality Gate - Jira Execution

on:
  repository_dispatch:
    types: [l2_execution]

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}
  TESTGUIDE_WORKSPACE: C:\HIL\Testing\eeint-Test-Automation
  JFROG_URL: https://artifactory.sctmtrs.xyz/artifactory
  JFROG_REPOSITORY: eeint-report-files
  JIRA_BASE_URL: https://scoutmotors.atlassian.net

jobs:
  l2-quality-gate:
    name: L2 Quality Gate
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    concurrency:
      group: l2-quality-gate-${{ github.event.client_payload.test_bench }}
      cancel-in-progress: false

    steps:
      - name: Parse Jira inputs
        shell: pwsh
        env:
          JIRA_KEY_RAW: ${{ github.event.client_payload.jira_key }}
          CATEGORY_RAW: ${{ github.event.client_payload.category }}
          CW_RELEASE_RAW: ${{ github.event.client_payload.cw_release }}
          TEST_BENCH_RAW: ${{ github.event.client_payload.test_bench }}
          TARGET_ECU_RAW: ${{ github.event.client_payload.target_ecu }}
          FLASH_ARCHIVE_RAW: ${{ github.event.client_payload.flash_archive_location }}
          RAL_FILE_RAW: ${{ github.event.client_payload.ral_file_location }}
          GIT_SUBMODULE_RAW: ${{ github.event.client_payload.git_submodule }}
          TEST_CASES_RAW: ${{ github.event.client_payload.test_cases }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Clean-Value([object]$Value) {
            if ($null -eq $Value) { return '' }
            return (([string]$Value -replace '[\r\n]+', ' ').Trim())
          }
          function Clean-Path([object]$Value) {
            if ($null -eq $Value) { return '' }
            $result = (([string]$Value -replace '[\r\n]+', '').Trim())
            while ($result.Length -ge 2 -and $result.StartsWith('"') -and $result.EndsWith('"')) {
              $result = $result.Substring(1, $result.Length - 2).Trim()
            }
            return $result
          }
          function Set-Env([string]$Name, [AllowEmptyString()][string]$Value) {
            "$Name=$Value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          $jiraKey = Clean-Value $env:JIRA_KEY_RAW
          $categoryInput = Clean-Value $env:CATEGORY_RAW
          $cwRelease = (Clean-Value $env:CW_RELEASE_RAW).ToUpperInvariant()
          $testBench = (Clean-Value $env:TEST_BENCH_RAW).ToLowerInvariant()
          $targetEcu = Clean-Value $env:TARGET_ECU_RAW
          $flashArchiveLocation = Clean-Path $env:FLASH_ARCHIVE_RAW
          $ralFileLocation = Clean-Path $env:RAL_FILE_RAW
          $gitSubmodule = Clean-Value $env:GIT_SUBMODULE_RAW
          $testCases = Clean-Value $env:TEST_CASES_RAW

          if (-not $jiraKey) { throw 'jira_key is missing.' }
          if (-not $categoryInput) { throw 'category is missing.' }
          if (-not $cwRelease) { throw 'cw_release is missing.' }
          if (-not $testBench) { throw 'test_bench is missing.' }
          if (-not $targetEcu) { throw 'target_ecu is missing.' }
          if ($cwRelease -notmatch '^CW[0-9]{2}$') { throw "Invalid CW release [$cwRelease]. Expected CW45 format." }
          if ($testBench -notin @('syshil1','syshil2')) { throw "Unsupported test bench [$testBench]." }

          switch ($categoryInput.ToLowerInvariant()) {
            'network_test' { $categoryInput = 'Network_Test' }
            'network_testing' { $categoryInput = 'Network_Test' }
            'diagnostic_test' { $categoryInput = 'Diagnostic_Test' }
            'diagnostic_testing' { $categoryInput = 'Diagnostic_Test' }
            'bootloader_compliance_test' { $categoryInput = 'Bootloader_Compliance_Test' }
            default { throw "Unsupported Jira category [$categoryInput]." }
          }

          if ($categoryInput -eq 'Diagnostic_Test' -and -not $ralFileLocation) { throw 'Diagnostic_Test requires ral_file_location.' }
          if ($categoryInput -eq 'Bootloader_Compliance_Test' -and -not $flashArchiveLocation) { throw 'Bootloader_Compliance_Test requires flash_archive_location.' }

          Set-Env 'JIRA_KEY' $jiraKey
          Set-Env 'CATEGORY_INPUT' $categoryInput
          Set-Env 'CW_RELEASE' $cwRelease
          Set-Env 'TEST_BENCH' $testBench
          Set-Env 'TARGET_ECU' $targetEcu
          Set-Env 'FLASH_ARCHIVE_LOCATION' $flashArchiveLocation
          Set-Env 'RAL_FILE_LOCATION' $ralFileLocation
          Set-Env 'GIT_SUBMODULE' $gitSubmodule
          Set-Env 'TEST_CASES' $testCases

          Write-Host "Jira=$jiraKey Category=$categoryInput CW=$cwRelease Bench=$testBench ECU=$targetEcu"
          Write-Host "Flash=$flashArchiveLocation"
          Write-Host "RAL=$ralFileLocation"

      - name: Route category and prepare playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          switch ($env:CATEGORY_INPUT) {
            'Network_Test' {
              $category = 'network-testing'; $testPlanName = 'NetworkTest'; $playbookBaseName = 'L2-network-testing'
              $projectRelativePath = 'Packages\L2-Quality-Gate\ProjectGenerator\Network-Test\NetworkTest.prj'
            }
            'Diagnostic_Test' {
              $category = 'diagnostic-testing'; $testPlanName = 'DiagnosticTest'; $playbookBaseName = 'L2-Diagnostic-testing'
              $projectRelativePath = 'Packages\L2-Quality-Gate\ProjectGenerator\Diagnostic-Test\DiagnosticTest.prj'
            }
            'Bootloader_Compliance_Test' {
              $category = 'bootloader-compliance'; $testPlanName = 'BootloaderComplianceTest'; $playbookBaseName = 'L2-Bootloader-testing'
              $projectRelativePath = 'Packages\L2-Quality-Gate\ProjectGenerator\Bootloader-Compliance-Test\BootloaderComplianceTest.prj'
            }
            default { throw "Unsupported category [$env:CATEGORY_INPUT]." }
          }
          switch ($env:TEST_BENCH) {
            'syshil1' { $resource = 'syshil1-labtest1'; $configurationFolder = 'SUBSYS1' }
            'syshil2' { $resource = 'syshil2-labtest2'; $configurationFolder = 'SUBSYS1' }
            default { throw "Unsupported test bench [$env:TEST_BENCH]." }
          }

          $workspace = $env:TESTGUIDE_WORKSPACE
          if (-not (Test-Path -LiteralPath $workspace -PathType Container)) { throw "Workspace does not exist: [$workspace]" }
          $fullProjectPath = Join-Path $workspace $projectRelativePath
          if (-not (Test-Path -LiteralPath $fullProjectPath -PathType Leaf)) { throw "Project does not exist: [$fullProjectPath]" }
          $tbcRelativePath = "Configurations\$configurationFolder\${configurationFolder}_TestBenchConfig.tbc"
          $tcfRelativePath = "Configurations\$configurationFolder\${configurationFolder}_TestConfig.tcf"
          if (-not (Test-Path -LiteralPath (Join-Path $workspace $tbcRelativePath) -PathType Leaf)) { throw "TBC does not exist: [$tbcRelativePath]" }
          if (-not (Test-Path -LiteralPath (Join-Path $workspace $tcfRelativePath) -PathType Leaf)) { throw "TCF does not exist: [$tcfRelativePath]" }

          $artifactRoot = Join-Path $env:RUNNER_TEMP 'l2-artifacts'
          $atxDirectory = Join-Path $artifactRoot 'atx'
          New-Item -ItemType Directory -Path $atxDirectory -Force | Out-Null
          $runTimestamp = Get-Date -Format 'yyyy-MM-dd_HHmmss'
          $playbookName = "$playbookBaseName-$env:JIRA_KEY-$runTimestamp"
          $values = [ordered]@{
            CATEGORY=$category; TEST_PLAN_NAME=$testPlanName; PLAYBOOK_BASE_NAME=$playbookBaseName; PLAYBOOK_NAME=$playbookName
            PROJECT_RELATIVE_PATH=$projectRelativePath; RESOURCE_NAME=$resource; TBC_RELATIVE_PATH=$tbcRelativePath
            TCF_RELATIVE_PATH=$tcfRelativePath; XIL_IDENTIFIER="novi_hq/1stfloor/ee_lab_novi/$resource/ControlComputer"
            ARTIFACT_ROOT=$artifactRoot; ATX_DIRECTORY=$atxDirectory; RUN_TIMESTAMP=$runTimestamp
          }
          foreach ($item in $values.GetEnumerator()) { "$($item.Key)=$($item.Value)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          Write-Host "TestPlan=$testPlanName Playbook=$playbookName Project=$projectRelativePath Resource=$resource"

      - name: Generate new TestGuide playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Path-Expression([string]$Path) { return '"' + $Path.Trim().Trim('"').Replace('\','\\') + '"' }
          $target = "'$env:TARGET_ECU'"
          $constants = @(
            [ordered]@{label='PROJECT_GENERATOR_TARGETECU';value=$target},
            [ordered]@{label='PROJECT_GENERATOR_CT';value='True'}
          )
          $parameters = @(
            [ordered]@{label='PROJECT_GENERATOR_TARGETECU';defaultValue=$target;required=$false},
            [ordered]@{label='PROJECT_GENERATOR_CT';defaultValue='True';required=$false}
          )
          if ($env:CATEGORY_INPUT -eq 'Diagnostic_Test') {
            $value = Path-Expression $env:RAL_FILE_LOCATION
            $constants += [ordered]@{label='PROJECT_GENERATOR_RAL_FILE_PATH';value=$value}
            $parameters += [ordered]@{label='PROJECT_GENERATOR_RAL_FILE_PATH';defaultValue=$value;required=$false}
          }
          if ($env:CATEGORY_INPUT -eq 'Bootloader_Compliance_Test') {
            $value = Path-Expression $env:FLASH_ARCHIVE_LOCATION
            $constants += [ordered]@{label='PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH';value=$value}
            $parameters += [ordered]@{label='PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH';defaultValue=$value;required=$false}
          }
          $playbook = [ordered]@{
            metadata=[ordered]@{name=$env:PLAYBOOK_NAME;taskNameTemplate='${playbook_name} (${playbook_datetime}) ${distribution_count}';labels=@()}
            workspace=[ordered]@{source=[ordered]@{path=$env:TESTGUIDE_WORKSPACE;sourceType='location'};dependencies=@()}
            setup=[ordered]@{steps=@(
              [ordered]@{reuse='always';keepConfiguration=$false;waitMinutesForLicense=0;stepName="ecu.test $env:RESOURCE_NAME Start";type='ecuTestStart'},
              [ordered]@{tbcPath=$env:TBC_RELATIVE_PATH;tcfPath=$env:TCF_RELATIVE_PATH;stepName='Test Configuration Selection';type='configuration'}
            )}
            execution=[ordered]@{testcases=@([ordered]@{relativePath=$env:PROJECT_RELATIVE_PATH;constants=$constants;stepName="ecu.test $env:RESOURCE_NAME Start";type='project'})}
            teardown=[ordered]@{steps=@([ordered]@{type='ecuTestStop'})}
            xilConfigRequirements=@([ordered]@{label='Identifier';category='XIL';value=$env:XIL_IDENTIFIER;type='configuration'})
            parameters=$parameters
          }
          $file = Join-Path $env:ARTIFACT_ROOT 'playbook.json'
          $playbook | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $file -Encoding utf8
          "PLAYBOOK_FILE=$file" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Playbook JSON=$file"

      - name: Create new TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ONECX_AUTH_KEY) { throw 'ONECX_AUTH_KEY is missing.' }
          if (-not $env:ONECX_PROJECT_ID) { throw 'ONECX_PROJECT_ID is missing.' }
          $headers = @{'TestGuide-AuthKey'=$env:ONECX_AUTH_KEY;Accept='application/json'}
          $url = "$env:ONECX_URL/api/v2/execution/playbook?projectId=$env:ONECX_PROJECT_ID&folder=%2F"
          $body = Get-Content -LiteralPath $env:PLAYBOOK_FILE -Raw
          $response = Invoke-RestMethod -Method Post -Uri $url -Headers $headers -ContentType 'application/json' -Body $body
          $response | ConvertTo-Json -Depth 30 | Set-Content (Join-Path $env:ARTIFACT_ROOT 'create-response.json') -Encoding utf8
          $id = if ($response.playbookId) {$response.playbookId} elseif ($response.id) {$response.id} elseif ($response.data.playbookId) {$response.data.playbookId} else {$response.data.id}
          if (-not $id) { throw "Create API returned no playbook ID. Response=$($response | ConvertTo-Json -Compress -Depth 30)" }
          "TESTGUIDE_PLAYBOOK_ID=$id" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Playbook ID=$id"

      - name: Execute newly created TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Path-Expression([string]$Path) { return '"' + $Path.Trim().Trim('"').Replace('\','\\') + '"' }
          $parameters = @(
            [ordered]@{label='PROJECT_GENERATOR_TARGETECU';value="'$env:TARGET_ECU'"},
            [ordered]@{label='PROJECT_GENERATOR_CT';value='True'}
          )
          if ($env:CATEGORY_INPUT -eq 'Diagnostic_Test') { $parameters += [ordered]@{label='PROJECT_GENERATOR_RAL_FILE_PATH';value=(Path-Expression $env:RAL_FILE_LOCATION)} }
          if ($env:CATEGORY_INPUT -eq 'Bootloader_Compliance_Test') { $parameters += [ordered]@{label='PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH';value=(Path-Expression $env:FLASH_ARCHIVE_LOCATION)} }
          $headers = @{'TestGuide-AuthKey'=$env:ONECX_AUTH_KEY;Accept='application/json'}
          $url = "$env:ONECX_URL/api/v2/execution/playbook/$env:TESTGUIDE_PLAYBOOK_ID/execute?projectId=$env:ONECX_PROJECT_ID&checkLastExecution=true"
          $body = @{parameters=$parameters} | ConvertTo-Json -Depth 20
          $response = Invoke-RestMethod -Method Post -Uri $url -Headers $headers -ContentType 'application/json' -Body $body
          $response | ConvertTo-Json -Depth 30 | Set-Content (Join-Path $env:ARTIFACT_ROOT 'execute-response.json') -Encoding utf8
          $id = if ($response.taskIds) {@($response.taskIds)[0]} elseif ($response.taskId) {$response.taskId} elseif ($response.id) {$response.id} elseif ($response.data.taskIds) {@($response.data.taskIds)[0]} else {$response.data.taskId}
          if (-not $id) { throw "Execute API returned no task ID. Response=$($response | ConvertTo-Json -Compress -Depth 30)" }
          "TESTGUIDE_TASK_ID=$id" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Execution Task ID=$id"

      - name: Wait for new playbook execution task
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{'TestGuide-AuthKey'=$env:ONECX_AUTH_KEY;Accept='application/json'}
          $url = "$env:ONECX_URL/api/v2/execution/task/$env:TESTGUIDE_TASK_ID?projectId=$env:ONECX_PROJECT_ID"
          $complete = @('FINISHED','COMPLETED','COMPLETE','SUCCESS','SUCCEEDED','DONE','ENDED')
          $failure = @('ABORTED','ABORT','ERROR','FAILED','FAILURE','CANCELLED','CANCELED')
          $deadline = (Get-Date).AddMinutes(180)
          $attempt = 0
          while ((Get-Date) -lt $deadline) {
            $attempt++
            $task = Invoke-RestMethod -Method Get -Uri $url -Headers $headers
            $state = ([string]$task.state).Trim().ToUpperInvariant()
            $verdict = ([string]$task.aggregatedVerdict).Trim().ToUpperInvariant()
            $startDate = ([string]$task.startDate).Trim()
            $endDate = ([string]$task.endDate).Trim()
            Write-Host "Attempt=$attempt State=$state Verdict=$verdict"
            $task | ConvertTo-Json -Depth 30 | Set-Content (Join-Path $env:ARTIFACT_ROOT 'execution-task-latest.json') -Encoding utf8
            if (-not $state) { throw 'Execution task returned no state.' }
            if ($state -in $failure) { throw "Execution ended. State=$state Message=$($task.stateInfo)" }
            if ($state -in $complete -or $endDate) {
              if (-not $startDate) { $startDate = (Get-Date).AddMinutes(-30).ToUniversalTime().ToString('o') }
              if (-not $endDate) { $endDate = (Get-Date).ToUniversalTime().ToString('o') }
              "TASK_START_DATE=$startDate" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
              "TASK_END_DATE=$endDate" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
              "TESTGUIDE_STATE=$state" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
              "TESTGUIDE_VERDICT=$verdict" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
              exit 0
            }
            Start-Sleep -Seconds 15
          }
          throw 'Execution polling exceeded 180 minutes.'

      - name: Find TestGuide report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:TASK_START_DATE) { throw 'TASK_START_DATE is missing.' }
          $headers = @{'TestGuide-AuthKey'=$env:ONECX_AUTH_KEY;Accept='application/json'}
          try { $executionStart = (Get-Date -Date $env:TASK_START_DATE -ErrorAction Stop).ToUniversalTime() }
          catch { throw "Unable to parse TASK_START_DATE [$env:TASK_START_DATE]. $($_.Exception.Message)" }
          $dayStart = Get-Date -Date ($executionStart.ToString('yyyy-MM-ddT00:00:00Z'))
          $dayEnd = $dayStart.AddDays(1)
          $historyStart = $dayStart.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $historyEnd = $dayEnd.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $url = "$env:ONECX_URL/api/report/reports/history?projectId=$env:ONECX_PROJECT_ID&startDate=$([uri]::EscapeDataString($historyStart))&endDate=$([uri]::EscapeDataString($historyEnd))&offset=0&limit=100"
          Write-Host "Test Plan=$env:TEST_PLAN_NAME Start=$historyStart End=$historyEnd URL=$url"
          $selectedReport = $null
          for ($attempt=1; $attempt -le 20; $attempt++) {
            $response = Invoke-RestMethod -Method Get -Uri $url -Headers $headers
            if ($null -eq $response) { $all=@() }
            elseif ($response.PSObject.Properties['content']) { $all=@($response.content) }
            elseif ($response.PSObject.Properties['reports']) { $all=@($response.reports) }
            elseif ($response.PSObject.Properties['data']) { $all=@($response.data) }
            else { $all=@($response) }
            $matching = @($all | Where-Object { ([string]$_.status).Trim().ToUpperInvariant() -eq 'COMPLETE' -and ([string]$_.testPlanName).Trim() -eq $env:TEST_PLAN_NAME })
            Write-Host "Report lookup attempt=$attempt Total=$($all.Count) Matching=$($matching.Count)"
            if ($matching.Count -gt 0) {
              $ranked = foreach ($report in $matching) {
                $difference = 999999999999999
                $upload = Get-Date -Date '1900-01-01T00:00:00Z'
                if ($report.executionDate) { try { $rd=(Get-Date -Date ([string]$report.executionDate) -ErrorAction Stop).ToUniversalTime(); $difference=[math]::Abs(($rd-$executionStart).TotalSeconds) } catch {} }
                if ($report.uploadDate) { try { $upload=Get-Date -Date ([string]$report.uploadDate) -ErrorAction Stop } catch {} }
                [pscustomobject]@{Report=$report;Difference=$difference;Upload=$upload}
              }
              $selected = $ranked | Sort-Object @{Expression='Difference';Ascending=$true},@{Expression='Upload';Descending=$true} | Select-Object -First 1
              if ($selected) { $selectedReport=$selected.Report; Write-Host "Selected difference=$($selected.Difference)"; break }
            }
            if ($attempt -lt 20) { Start-Sleep -Seconds 15 }
          }
          if ($null -eq $selectedReport) { throw "No COMPLETE report found for [$env:TEST_PLAN_NAME] between [$historyStart] and [$historyEnd]." }
          $reportId = ([string]$selectedReport.reportId).Trim()
          if (-not $reportId) { throw "Selected report has no reportId. $($selectedReport | ConvertTo-Json -Compress -Depth 30)" }
          "TESTGUIDE_REPORT_ID=$reportId" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Report ID=$reportId Plan=$($selectedReport.testPlanName) ExecutionDate=$($selectedReport.executionDate)"

      - name: Start ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{'TestGuide-AuthKey'=$env:ONECX_AUTH_KEY;Accept='application/json'}
          $url = "$env:ONECX_URL/api/report/export/atx/$env:TESTGUIDE_REPORT_ID?projectId=$env:ONECX_PROJECT_ID"
          $response = Invoke-RestMethod -Method Post -Uri $url -Headers $headers -ContentType 'application/json'
          $id = if ($response -is [string] -or $response -is [int] -or $response -is [long]) {([string]$response).Trim()} elseif ($response.taskId) {$response.taskId} elseif ($response.id) {$response.id} elseif ($response.data.taskId) {$response.data.taskId} else {$response.data.id}
          if (-not $id) { throw "ATX export response has no task ID. $($response | ConvertTo-Json -Compress -Depth 20)" }
          "ATX_EXPORT_TASK_ID=$id" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ATX Export Task ID=$id"

      - name: Wait for ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{'TestGuide-AuthKey'=$env:ONECX_AUTH_KEY;Accept='application/json'}
          $url = "$env:ONECX_URL/api/report/export/atx/$env:ATX_EXPORT_TASK_ID/status?projectId=$env:ONECX_PROJECT_ID"
          $success=@('FINISHED','COMPLETE','COMPLETED','SUCCESS','SUCCEEDED','DONE')
          $failure=@('FAILED','FAILURE','ERROR','ABORTED','CANCELLED','CANCELED')
          $deadline=(Get-Date).AddMinutes(30); $attempt=0
          while ((Get-Date) -lt $deadline) {
            $attempt++
            $response=Invoke-RestMethod -Method Get -Uri $url -Headers $headers
            $json=if ($response -is [string]) {[string]$response} else {$response | ConvertTo-Json -Compress -Depth 20}
            Write-Host "ATX attempt=$attempt Response=$json"
            $doneProperty=if ($response -isnot [string]) {$response.PSObject.Properties['done']} else {$null}
            if ($null -ne $doneProperty) {
              $done=([string]$doneProperty.Value).Trim().ToLowerInvariant()
              if ($done -eq 'true') { Write-Host 'ATX EXPORT COMPLETE'; exit 0 }
              if ($done -eq 'false') { Start-Sleep -Seconds 5; continue }
              throw "Invalid ATX done value [$done]. Response=$json"
            }
            $state=if ($response -is [string]) {([string]$response).Trim().ToUpperInvariant()} elseif ($response.state) {([string]$response.state).Trim().ToUpperInvariant()} elseif ($response.status) {([string]$response.status).Trim().ToUpperInvariant()} else {''}
            if ($state -in $success) { exit 0 }
            if ($state -in $failure) { throw "ATX export failed. State=$state Response=$json" }
            if ($state) { Start-Sleep -Seconds 5; continue }
            throw "Unable to determine ATX export state. Response=$json"
          }
          throw 'ATX export polling exceeded 30 minutes.'

      - name: Download generated ATX
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers=@{'TestGuide-AuthKey'=$env:ONECX_AUTH_KEY;Accept='application/octet-stream'}
          $url="$env:ONECX_URL/api/report/export/atx/$env:ATX_EXPORT_TASK_ID/download?projectId=$env:ONECX_PROJECT_ID"
          $safeEcu=$env:TARGET_ECU -replace '[\\/:*?"<>|]','_'
          $name="$env:TEST_PLAN_NAME`_$safeEcu`_$env:RUN_TIMESTAMP.atx"
          $destination=Join-Path $env:ATX_DIRECTORY $name
          Invoke-WebRequest -Method Get -Uri $url -Headers $headers -OutFile $destination
          $file=Get-Item -LiteralPath $destination
          if ($file.Length -le 0) { throw 'Downloaded ATX file is empty.' }
          "ATX_FILE_PATH=$destination" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ATX_FILE_NAME=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Downloaded=$destination Size=$($file.Length)"

      - name: Build JFrog destination
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Safe([string]$Value) { $s=$Value.Trim() -replace '[\\/:*?"<>|]','_' -replace '\s+','_'; $s=$s.Trim('.'); if(-not $s){throw "Invalid segment [$Value]"}; return $s }
          $target='L2_Quality_Gate/'+(Safe $env:CW_RELEASE)+'/'+(Safe $env:TARGET_ECU)+'/'+(Safe $env:CATEGORY)+'/'+(Safe $env:TEST_PLAN_NAME)+'/'+(Safe $env:RUN_TIMESTAMP)+'/'
          "JFROG_TARGET_PATH=$target" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "JFrog target=$target"

      - name: Upload generated ATX to JFrog
        shell: pwsh
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:JFROG_TOKEN) { throw 'JFROG_TOKEN is missing.' }
          $file=Get-Item -LiteralPath $env:ATX_FILE_PATH
          $encodedTarget=(($env:JFROG_TARGET_PATH.Trim('/').Split('/') | ForEach-Object {[uri]::EscapeDataString($_)}) -join '/')
          $uploadUrl="$($env:JFROG_URL.TrimEnd('/'))/$env:JFROG_REPOSITORY/$encodedTarget/$([uri]::EscapeDataString($file.Name))"
          if ($env:JFROG_USER) { curl.exe --fail-with-body --silent --show-error --request PUT --user "$($env:JFROG_USER):$($env:JFROG_TOKEN)" --header 'Content-Type: application/octet-stream' --upload-file "$($file.FullName)" "$uploadUrl" }
          else { curl.exe --fail-with-body --silent --show-error --request PUT --header "Authorization: Bearer $env:JFROG_TOKEN" --header 'Content-Type: application/octet-stream' --upload-file "$($file.FullName)" "$uploadUrl" }
          if ($LASTEXITCODE -ne 0) { throw "JFrog upload failed. Curl exit code=$LASTEXITCODE" }
          $folderUrl="$($env:JFROG_URL.TrimEnd('/'))/$env:JFROG_REPOSITORY/$encodedTarget/"
          "JFROG_FILE_URL=$uploadUrl" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "JFROG_FOLDER_URL=$folderUrl" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "JFrog ATX URL=$uploadUrl"

      - name: Add ATX location to Jira
        shell: pwsh
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:JIRA_KEY) { throw 'JIRA_KEY is missing.' }
          if (-not $env:JIRA_EMAIL) { throw 'JIRA_EMAIL is missing.' }
          if (-not $env:JIRA_API_TOKEN) { throw 'JIRA_API_TOKEN is missing.' }
          $runUrl='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          $text="L2 Quality Gate execution completed.`n`nCategory: $env:CATEGORY`nTest Plan: $env:TEST_PLAN_NAME`nCW Release: $env:CW_RELEASE`nTarget ECU: $env:TARGET_ECU`nTest Bench: $env:TEST_BENCH`n`nNew Playbook ID: $env:TESTGUIDE_PLAYBOOK_ID`nExecution Task ID: $env:TESTGUIDE_TASK_ID`nExecution State: $env:TESTGUIDE_STATE`nExecution Verdict: $env:TESTGUIDE_VERDICT`nReport ID: $env:TESTGUIDE_REPORT_ID`nATX Export Task ID: $env:ATX_EXPORT_TASK_ID`n`nJFrog ATX file:`n$env:JFROG_FILE_URL`n`nJFrog folder:`n$env:JFROG_FOLDER_URL`n`nGitHub run:`n$runUrl"
          $file=Join-Path $env:RUNNER_TEMP 'jira-atx-comment.json'
          @{body=$text} | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $file -Encoding utf8
          $url="$($env:JIRA_BASE_URL.TrimEnd('/'))/rest/api/2/issue/$env:JIRA_KEY/comment"
          curl.exe --fail-with-body --silent --show-error --request POST --user "$($env:JIRA_EMAIL):$($env:JIRA_API_TOKEN)" --header 'Accept: application/json' --header 'Content-Type: application/json' --data-binary "@$file" "$url"
          if ($LASTEXITCODE -ne 0) { throw "Jira comment failed. Curl exit code=$LASTEXITCODE" }
          Write-Host "Jira comment added to $env:JIRA_KEY"

      - name: Upload ATX and diagnostics to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-atx-${{ github.event.client_payload.jira_key }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: 30
