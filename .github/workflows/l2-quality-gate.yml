name: L2 Quality Gate - Jira Execution

on:
  repository_dispatch:
    types:
      - l2_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

  JFROG_URL: https://artifactory.sctmtrs.xyz/artifactory
  JFROG_REPOSITORY: eeint-report-files

  JIRA_BASE_URL: https://scoutmotors.atlassian.net

jobs:
  l2-quality-gate:
    name: L2 Quality Gate

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: l2-quality-gate-${{ github.event.client_payload.test_bench }}
      cancel-in-progress: false

    steps:
      # ============================================================
      # 1. PARSE JIRA PAYLOAD
      # ============================================================

      - name: Parse and validate Jira inputs
        shell: pwsh
        env:
          JIRA_KEY_RAW: ${{ github.event.client_payload.jira_key }}
          CATEGORY_RAW: ${{ github.event.client_payload.category }}
          CW_RELEASE_RAW: ${{ github.event.client_payload.cw_release }}
          TEST_BENCH_RAW: ${{ github.event.client_payload.test_bench }}
          TARGET_ECU_RAW: ${{ github.event.client_payload.target_ecu }}
          FLASH_ARCHIVE_RAW: ${{ github.event.client_payload.flash_archive_location }}
          RAL_FILE_RAW: ${{ github.event.client_payload.ral_file_location }}
          GIT_SUBMODULE_RAW: ${{ github.event.client_payload.git_submodule }}
          TEST_CASES_RAW: ${{ github.event.client_payload.test_cases }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Clean-JiraValue {
              param($Value)

              if ($null -eq $Value) {
                  return ''
              }

              $clean = "$Value".Trim()
              $clean = $clean -replace '[\r\n]+', ''

              return $clean.Trim()
          }

          function Clean-JiraPath {
              param($Value)

              $clean = Clean-JiraValue $Value

              # Jira may send paths surrounded by one or more quotes.
              while (
                  $clean.Length -ge 2 -and
                  $clean.StartsWith('"') -and
                  $clean.EndsWith('"')
              ) {
                  $clean = $clean.Substring(
                      1,
                      $clean.Length - 2
                  ).Trim()
              }

              return $clean
          }

          $jiraKey =
              Clean-JiraValue $env:JIRA_KEY_RAW

          $categoryInput =
              Clean-JiraValue $env:CATEGORY_RAW

          $cwRelease =
              (
                  Clean-JiraValue $env:CW_RELEASE_RAW
              ).ToUpperInvariant()

          $testBench =
              (
                  Clean-JiraValue $env:TEST_BENCH_RAW
              ).ToLowerInvariant()

          $targetEcu =
              Clean-JiraValue $env:TARGET_ECU_RAW

          $flashArchive =
              Clean-JiraPath $env:FLASH_ARCHIVE_RAW

          $ralFile =
              Clean-JiraPath $env:RAL_FILE_RAW

          $gitSubmodule =
              Clean-JiraValue $env:GIT_SUBMODULE_RAW

          $testCases =
              Clean-JiraValue $env:TEST_CASES_RAW

          if (-not $jiraKey) {
              throw 'jira_key is missing from the Jira payload.'
          }

          if (-not $categoryInput) {
              throw 'category is missing from the Jira payload.'
          }

          if (-not $cwRelease) {
              throw 'cw_release is missing from the Jira payload.'
          }

          if (-not $testBench) {
              throw 'test_bench is missing from the Jira payload.'
          }

          if (-not $targetEcu) {
              throw 'target_ecu is missing from the Jira payload.'
          }

          if ($cwRelease -notmatch '^CW[0-9]{2}$') {
              throw (
                  "Invalid CW Release '$cwRelease'. " +
                  "Expected a value such as CW45."
              )
          }

          switch ($categoryInput.ToLowerInvariant()) {
              'network_test' {
                  $categoryInput = 'Network_Test'
              }

              'network_testing' {
                  $categoryInput = 'Network_Test'
              }

              'diagnostic_test' {
                  $categoryInput = 'Diagnostic_Test'
              }

              'diagnostic_testing' {
                  $categoryInput = 'Diagnostic_Test'
              }

              'bootloader_compliance_test' {
                  $categoryInput =
                      'Bootloader_Compliance_Test'
              }

              default {
                  throw (
                      "Unsupported Jira category: " +
                      "'$categoryInput'"
                  )
              }
          }

          if (
              $testBench -notin @(
                  'syshil1',
                  'syshil2'
              )
          ) {
              throw "Unsupported Test Bench '$testBench'."
          }

          if (
              $categoryInput -eq 'Diagnostic_Test' -and
              -not $ralFile
          ) {
              throw (
                  'Diagnostic_Test requires ' +
                  'ral_file_location.'
              )
          }

          if (
              $categoryInput -eq
                  'Bootloader_Compliance_Test' -and
              -not $flashArchive
          ) {
              throw (
                  'Bootloader_Compliance_Test requires ' +
                  'flash_archive_location.'
              )
          }

          $values = [ordered]@{
              JIRA_KEY =
                  $jiraKey

              CATEGORY_INPUT =
                  $categoryInput

              CW_RELEASE =
                  $cwRelease

              TEST_BENCH =
                  $testBench

              TARGET_ECU =
                  $targetEcu

              FLASH_ARCHIVE_LOCATION =
                  $flashArchive

              RAL_FILE_LOCATION =
                  $ralFile

              GIT_SUBMODULE =
                  $gitSubmodule

              TEST_CASES =
                  $testCases
          }

          foreach ($item in $values.GetEnumerator()) {
              "$($item.Key)=$($item.Value)" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'JIRA INPUTS'
          Write-Host '========================================'
          Write-Host "Jira Key      : $jiraKey"
          Write-Host "Category      : $categoryInput"
          Write-Host "CW Release    : $cwRelease"
          Write-Host "Test Bench    : $testBench"
          Write-Host "Target ECU    : $targetEcu"
          Write-Host "Flash Archive : $flashArchive"
          Write-Host "RAL File      : $ralFile"
          Write-Host "Git Submodule : $gitSubmodule"
          Write-Host "Test Cases    : $testCases"
          Write-Host '========================================'

      # ============================================================
      # 2. CHECKOUT
      # ============================================================

      - name: Checkout Q-gating-test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout L2 Quality Gate
        uses: actions/checkout@v4
        with:
          repository: scout-motors/eeint-L2-Quality-Gate
          token: ${{ secrets.HIL_REPO_PAT }}
          path: source-l2
          fetch-depth: 1
          submodules: recursive

      # ============================================================
      # 3. ROUTE CATEGORY
      # ============================================================

      - name: Route category and prepare workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          switch ($env:CATEGORY_INPUT) {
              'Network_Test' {
                  $category =
                      'network-testing'

                  $testOrValidator =
                      'NetworkTest'

                  $playbookName =
                      'L2-network-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Network-Test\NetworkTest.prj'
              }

              'Diagnostic_Test' {
                  $category =
                      'diagnostic-testing'

                  $testOrValidator =
                      'DiagnosticTest'

                  $playbookName =
                      'L2-Diagnostic-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Diagnostic-Test\DiagnosticTest.prj'
              }

              'Bootloader_Compliance_Test' {
                  $category =
                      'bootloader-compliance'

                  $testOrValidator =
                      'BootloaderComplianceTest'

                  $playbookName =
                      'L2-Bootloader-testing'

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Bootloader-Compliance-Test\BootloaderComplianceTest.prj'
              }

              default {
                  throw (
                      "Unsupported category: " +
                      "$env:CATEGORY_INPUT"
                  )
              }
          }

          # Project relativePath must be a plain path.
          # Do not put expression quotes around the .prj path.
          $projectRelativePath =
              $projectRelativePath.Trim().Trim('"')

          if ($projectRelativePath.Contains('"')) {
              throw (
                  "Illegal quote in project path: " +
                  "$projectRelativePath"
              )
          }

          if (
              -not $projectRelativePath.EndsWith(
                  '.prj'
              )
          ) {
              throw (
                  "Invalid project path: " +
                  "$projectRelativePath"
              )
          }

          switch ($env:TEST_BENCH) {
              'syshil1' {
                  $resource =
                      'syshil1-labtest1'

                  $workspace =
                      'C:\HIL\Testing\eeint-Test-Automation'

                  $configurationFolder =
                      'SUBSYS1'
              }

              'syshil2' {
                  $resource =
                      'syshil2-labtest2'

                  $workspace =
                      'C:\HIL\Testing\eeint-Test-Automation'

                  # Change this only if SYSHIL2 uses another
                  # TBC/TCF configuration directory.
                  $configurationFolder =
                      'SUBSYS1'
              }

              default {
                  throw (
                      "Unsupported Test Bench: " +
                      "$env:TEST_BENCH"
                  )
              }
          }

          $sourceL2 =
              Join-Path `
                  $env:GITHUB_WORKSPACE `
                  'source-l2'

          $packagesRoot =
              Join-Path `
                  $workspace `
                  'Packages'

          $destinationL2 =
              Join-Path `
                  $packagesRoot `
                  'L2-Quality-Gate'

          New-Item `
              -ItemType Directory `
              -Path $destinationL2 `
              -Force |
              Out-Null

          # Copy the complete L2 repository so project-generator
          # dependencies and submodules stay available.
          Copy-Item `
              -Path (
                  Join-Path `
                      $sourceL2 `
                      '*'
              ) `
              -Destination $destinationL2 `
              -Recurse `
              -Force

          $fullProjectPath =
              Join-Path `
                  $workspace `
                  $projectRelativePath

          if (
              -not (
                  Test-Path `
                      -LiteralPath $fullProjectPath `
                      -PathType Leaf
              )
          ) {
              throw (
                  "Selected project does not exist: " +
                  "$fullProjectPath"
              )
          }

          $tbcRelativePath = (
              "Configurations\" +
              "$configurationFolder\" +
              "${configurationFolder}_TestBenchConfig.tbc"
          )

          $tcfRelativePath = (
              "Configurations\" +
              "$configurationFolder\" +
              "${configurationFolder}_TestConfig.tcf"
          )

          $fullTbcPath =
              Join-Path `
                  $workspace `
                  $tbcRelativePath

          $fullTcfPath =
              Join-Path `
                  $workspace `
                  $tcfRelativePath

          if (
              -not (
                  Test-Path `
                      -LiteralPath $fullTbcPath `
                      -PathType Leaf
              )
          ) {
              throw "TBC file is missing: $fullTbcPath"
          }

          if (
              -not (
                  Test-Path `
                      -LiteralPath $fullTcfPath `
                      -PathType Leaf
              )
          ) {
              throw "TCF file is missing: $fullTcfPath"
          }

          if (
              $env:CATEGORY_INPUT -eq
                  'Diagnostic_Test' -and
              -not (
                  Test-Path `
                      -LiteralPath $env:RAL_FILE_LOCATION `
                      -PathType Leaf
              )
          ) {
              throw (
                  "Diagnostic RAL file does not exist: " +
                  "$env:RAL_FILE_LOCATION"
              )
          }

          if (
              $env:CATEGORY_INPUT -eq
                  'Bootloader_Compliance_Test' -and
              -not (
                  Test-Path `
                      -LiteralPath $env:FLASH_ARCHIVE_LOCATION `
                      -PathType Leaf
              )
          ) {
              throw (
                  "Bootloader file does not exist: " +
                  "$env:FLASH_ARCHIVE_LOCATION"
              )
          }

          $artifactRoot =
              Join-Path `
                  $env:RUNNER_TEMP `
                  'l2-artifacts'

          $atxDirectory =
              Join-Path `
                  $artifactRoot `
                  'atx'

          New-Item `
              -ItemType Directory `
              -Path $atxDirectory `
              -Force |
              Out-Null

          $timestamp =
              Get-Date `
                  -Format 'yyyy-MM-dd_HHmmss'

          $values = [ordered]@{
              CATEGORY =
                  $category

              TEST_OR_VALIDATOR =
                  $testOrValidator

              PLAYBOOK_NAME =
                  $playbookName

              PROJECT_RELATIVE_PATH =
                  $projectRelativePath

              RESOURCE_NAME =
                  $resource

              TESTGUIDE_WORKSPACE =
                  $workspace

              TBC_RELATIVE_PATH =
                  $tbcRelativePath

              TCF_RELATIVE_PATH =
                  $tcfRelativePath

              XIL_IDENTIFIER =
                  "novi_hq/1stfloor/ee_lab_novi/$resource/ControlComputer"

              ARTIFACT_ROOT =
                  $artifactRoot

              ATX_DIRECTORY =
                  $atxDirectory

              RUN_TIMESTAMP =
                  $timestamp
          }

          foreach ($item in $values.GetEnumerator()) {
              "$($item.Key)=$($item.Value)" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'SELECTED EXECUTION'
          Write-Host '========================================'
          Write-Host "Jira Category : $env:CATEGORY_INPUT"
          Write-Host "Playbook      : $playbookName"
          Write-Host "Project       : [$projectRelativePath]"
          Write-Host "Full Project  : $fullProjectPath"
          Write-Host "TBC           : $tbcRelativePath"
          Write-Host "TCF           : $tcfRelativePath"
          Write-Host "Resource      : $resource"
          Write-Host '========================================'

      # ============================================================
      # 4. GENERATE ONE CATEGORY-SPECIFIC PLAYBOOK
      # ============================================================

      - name: Generate selected TestGuide playbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToEcuTestPathExpression {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path
              )

              $cleanPath =
                  $Path.Trim()

              while (
                  $cleanPath.Length -ge 2 -and
                  $cleanPath.StartsWith('"') -and
                  $cleanPath.EndsWith('"')
              ) {
                  $cleanPath =
                      $cleanPath.Substring(
                          1,
                          $cleanPath.Length - 2
                      ).Trim()
              }

              # ECU-TEST evaluates this as a Python-style string
              # expression. Escape each Windows backslash.
              $escapedPath =
                  $cleanPath.Replace(
                      '\',
                      '\\'
                  )

              # Add exactly one pair of expression quotes.
              return (
                  '"' +
                  $escapedPath +
                  '"'
              )
          }

          $targetEcuExpression =
              "'" +
              $env:TARGET_ECU +
              "'"

          $constants = @(
              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  value =
                      $targetEcuExpression
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  value =
                      'True'
              }
          )

          $parameters = @(
              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  defaultValue =
                      $targetEcuExpression

                  required =
                      $false
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  defaultValue =
                      'True'

                  required =
                      $false
              }
          )

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              $ralExpression =
                  Convert-ToEcuTestPathExpression `
                      -Path $env:RAL_FILE_LOCATION

              $constants += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_RAL_FILE_PATH'

                  value =
                      $ralExpression
              }

              $parameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_RAL_FILE_PATH'

                  defaultValue =
                      $ralExpression

                  required =
                      $false
              }

              Write-Host (
                  "Diagnostic RAL expression: " +
                  "$ralExpression"
              )
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              $hexExpression =
                  Convert-ToEcuTestPathExpression `
                      -Path $env:FLASH_ARCHIVE_LOCATION

              $constants += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                  value =
                      $hexExpression
              }

              $parameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                  defaultValue =
                      $hexExpression

                  required =
                      $false
              }

              Write-Host (
                  "Bootloader file expression: " +
                  "$hexExpression"
              )
          }

          $playbook = [ordered]@{
              metadata = [ordered]@{
                  name = (
                      "$env:PLAYBOOK_NAME-" +
                      "$env:JIRA_KEY-" +
                      "$env:RUN_TIMESTAMP"
                  )

                  taskNameTemplate =
                      '${playbook_name} (${playbook_datetime}) ${distribution_count}'

                  labels =
                      @()
              }

              workspace = [ordered]@{
                  source = [ordered]@{
                      path =
                          $env:TESTGUIDE_WORKSPACE

                      sourceType =
                          'location'
                  }

                  dependencies =
                      @()
              }

              setup = [ordered]@{
                  steps = @(
                      [ordered]@{
                          reuse =
                              'always'

                          keepConfiguration =
                              $false

                          waitMinutesForLicense =
                              0

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'ecuTestStart'
                      },

                      [ordered]@{
                          tbcPath =
                              $env:TBC_RELATIVE_PATH

                          tcfPath =
                              $env:TCF_RELATIVE_PATH

                          stepName =
                              'Test Configuration Selection'

                          type =
                              'configuration'
                      }
                  )
              }

              execution = [ordered]@{
                  testcases = @(
                      [ordered]@{
                          # Plain path with no embedded quotes.
                          relativePath =
                              $env:PROJECT_RELATIVE_PATH

                          constants =
                              $constants

                          stepName =
                              "ecu.test $env:RESOURCE_NAME Start"

                          type =
                              'project'
                      }
                  )
              }

              teardown = [ordered]@{
                  steps = @(
                      [ordered]@{
                          type =
                              'ecuTestStop'
                      }
                  )
              }

              xilConfigRequirements = @(
                  [ordered]@{
                      label =
                          'Identifier'

                      category =
                          'XIL'

                      value =
                          $env:XIL_IDENTIFIER

                      type =
                          'configuration'
                  }
              )

              parameters =
                  $parameters
          }

          $playbookFile =
              Join-Path `
                  $env:ARTIFACT_ROOT `
                  'playbook.json'

          $playbook |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath $playbookFile `
                  -Encoding utf8

          $generatedPlaybook =
              Get-Content `
                  -LiteralPath $playbookFile `
                  -Raw |
              ConvertFrom-Json

          $generatedProjectPath =
              "$($generatedPlaybook.execution.testcases[0].relativePath)"

          if (
              $generatedProjectPath.Contains('"')
          ) {
              throw (
                  "Generated relativePath contains an illegal quote: " +
                  "$generatedProjectPath"
              )
          }

          "PLAYBOOK_FILE=$playbookFile" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PLAYBOOK GENERATED'
          Write-Host '========================================'
          Write-Host "File    : $playbookFile"
          Write-Host "Name    : $($playbook.metadata.name)"
          Write-Host "Project : [$generatedProjectPath]"
          Write-Host '========================================'

      # ============================================================
      # 5. CREATE PLAYBOOK
      # ============================================================

      - name: Create TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ONECX_AUTH_KEY) {
              throw 'ONECX_AUTH_KEY is missing.'
          }

          if (-not $env:ONECX_PROJECT_ID) {
              throw 'ONECX_PROJECT_ID is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $url = (
              "$env:ONECX_URL/api/v2/execution/playbook" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&folder=%2F"
          )

          $body =
              Get-Content `
                  -LiteralPath $env:PLAYBOOK_FILE `
                  -Raw

          try {
              $response =
                  Invoke-RestMethod `
                      -Method Post `
                      -Uri $url `
                      -Headers $headers `
                      -ContentType 'application/json' `
                      -Body $body `
                      -ErrorAction Stop
          }
          catch {
              Write-Host 'Create playbook request failed.'
              Write-Host $_.Exception.Message

              if ($_.ErrorDetails) {
                  Write-Host $_.ErrorDetails.Message
              }

              throw
          }

          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          $env:ARTIFACT_ROOT `
                          'playbook-create-response.json'
                  ) `
                  -Encoding utf8

          $playbookId =
              $null

          if ($response.playbookId) {
              $playbookId =
                  $response.playbookId
          }
          elseif ($response.id) {
              $playbookId =
                  $response.id
          }
          elseif ($response.data) {
              $playbookId =
                  $response.data.id
          }

          if (-not $playbookId) {
              Write-Host (
                  $response |
                      ConvertTo-Json -Depth 30
              )

              throw (
                  'Create TestGuide API returned ' +
                  'no playbook ID.'
              )
          }

          "TESTGUIDE_PLAYBOOK_ID=$playbookId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Playbook ID: $playbookId"

      # ============================================================
      # 6. EXECUTE THE SELECTED PLAYBOOK
      # ============================================================

      - name: Execute selected TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToEcuTestPathExpression {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path
              )

              $cleanPath =
                  $Path.Trim()

              while (
                  $cleanPath.Length -ge 2 -and
                  $cleanPath.StartsWith('"') -and
                  $cleanPath.EndsWith('"')
              ) {
                  $cleanPath =
                      $cleanPath.Substring(
                          1,
                          $cleanPath.Length - 2
                      ).Trim()
              }

              $escapedPath =
                  $cleanPath.Replace(
                      '\',
                      '\\'
                  )

              return (
                  '"' +
                  $escapedPath +
                  '"'
              )
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $targetEcuExpression =
              "'" +
              $env:TARGET_ECU +
              "'"

          $executeParameters = @(
              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  value =
                      $targetEcuExpression
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  value =
                      'True'
              }
          )

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              $executeParameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_RAL_FILE_PATH'

                  value = (
                      Convert-ToEcuTestPathExpression `
                          -Path $env:RAL_FILE_LOCATION
                  )
              }
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              $executeParameters += [ordered]@{
                  label =
                      'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                  value = (
                      Convert-ToEcuTestPathExpression `
                          -Path $env:FLASH_ARCHIVE_LOCATION
                  )
              }
          }

          $url = (
              "$env:ONECX_URL/api/v2/execution/playbook/" +
              "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&checkLastExecution=true"
          )

          $requestBody = @{
              parameters =
                  $executeParameters
          } |
              ConvertTo-Json -Depth 20

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'EXECUTING ONE SELECTED PLAYBOOK'
          Write-Host '========================================'
          Write-Host "Jira Category : $env:CATEGORY_INPUT"
          Write-Host "Playbook ID   : $env:TESTGUIDE_PLAYBOOK_ID"
          Write-Host "Project       : [$env:PROJECT_RELATIVE_PATH]"
          Write-Host '========================================'

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $url `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $requestBody `
                  -ErrorAction Stop

          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          $env:ARTIFACT_ROOT `
                          'playbook-execute-response.json'
                  ) `
                  -Encoding utf8

          Write-Host (
              $response |
                  ConvertTo-Json -Depth 30
          )

          $taskId =
              $null

          if ($response.taskIds) {
              $taskId =
                  @($response.taskIds)[0]
          }
          elseif ($response.taskId) {
              $taskId =
                  $response.taskId
          }
          elseif ($response.id) {
              $taskId =
                  $response.id
          }
          elseif (
              $response.data -and
              $response.data.taskIds
          ) {
              $taskId =
                  @($response.data.taskIds)[0]
          }
          elseif (
              $response.data -and
              $response.data.taskId
          ) {
              $taskId =
                  $response.data.taskId
          }

          if (-not $taskId) {
              throw (
                  'Execute TestGuide API returned ' +
                  'no task ID.'
              )
          }

          "TESTGUIDE_TASK_ID=$taskId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Task ID: $taskId"

      # ============================================================
      # 7. POLL EXECUTION
      # ============================================================

      - name: Wait for TestGuide execution
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $url = (
              "$env:ONECX_URL/api/v2/execution/task/" +
              "$env:TESTGUIDE_TASK_ID" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&fields=taskId" +
              "&fields=startDate" +
              "&fields=endDate" +
              "&fields=state" +
              "&fields=stateInfo" +
              "&fields=aggregatedVerdict"
          )

          $deadline =
              (Get-Date).AddMinutes(170)

          $blockedSince =
              $null

          while (
              (Get-Date) -lt
              $deadline
          ) {
              $task =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $url `
                      -Headers $headers `
                      -ErrorAction Stop

              $state =
                  "$($task.state)"

              $verdict =
                  "$($task.aggregatedVerdict)"

              Write-Host (
                  "Task=$env:TESTGUIDE_TASK_ID " +
                  "State=$state " +
                  "Verdict=$verdict"
              )

              if (
                  $state -in @(
                      'FINISHED',
                      'COMPLETED',
                      'SUCCESS',
                      'SUCCEEDED'
                  )
              ) {
                  "TASK_START_DATE=$($task.startDate)" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TASK_END_DATE=$($task.endDate)" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_VERDICT=$verdict" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  $task |
                      ConvertTo-Json -Depth 30 |
                      Set-Content `
                          -LiteralPath (
                              Join-Path `
                                  $env:ARTIFACT_ROOT `
                                  'task-result.json'
                          ) `
                          -Encoding utf8

                  exit 0
              }

              if (
                  $state -in @(
                      'ERROR',
                      'FAILED',
                      'ABORTED',
                      'CANCELLED',
                      'CANCELED'
                  )
              ) {
                  $stateInfo =
                      "$($task.stateInfo)"

                  if (-not $stateInfo) {
                      $stateInfo =
                          'TestGuide returned no stateInfo.'
                  }

                  $errorMessage = (
                      "TestGuide execution failed. " +
                      "Category=$env:CATEGORY_INPUT; " +
                      "Playbook=$env:TESTGUIDE_PLAYBOOK_ID; " +
                      "Task=$env:TESTGUIDE_TASK_ID; " +
                      "Project=$env:PROJECT_RELATIVE_PATH; " +
                      "State=$state; " +
                      "Message=$stateInfo"
                  )

                  $errorMessage |
                      Set-Content `
                          -LiteralPath (
                              Join-Path `
                                  $env:ARTIFACT_ROOT `
                                  'testguide-error.txt'
                          ) `
                          -Encoding utf8

                  throw $errorMessage
              }

              if ($state -eq 'BLOCKED') {
                  if (-not $blockedSince) {
                      $blockedSince =
                          Get-Date
                  }

                  if (
                      (
                          (Get-Date) -
                          $blockedSince
                      ).TotalMinutes -ge 5
                  ) {
                      throw (
                          "TestGuide task remained BLOCKED. " +
                          "Message=$($task.stateInfo)"
                      )
                  }
              }
              else {
                  $blockedSince =
                      $null
              }

              Start-Sleep -Seconds 10
          }

          throw (
              "TestGuide execution timed out. " +
              "Task=$env:TESTGUIDE_TASK_ID"
          )

      # ============================================================
      # 8. DOWNLOAD ATX
      # ============================================================

      - name: Download ATX report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $depositoriesUrl = (
              "$env:ONECX_URL/api/artifact/depositories" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&shared=false"
          )

          $response =
              Invoke-RestMethod `
                  -Method Get `
                  -Uri $depositoriesUrl `
                  -Headers $headers `
                  -ErrorAction Stop

          if ($response.items) {
              $depositories =
                  @($response.items)
          }
          else {
              $depositories =
                  @($response)
          }

          if (-not $env:TASK_START_DATE) {
              throw 'TASK_START_DATE is missing.'
          }

          if (-not $env:TASK_END_DATE) {
              throw 'TASK_END_DATE is missing.'
          }

          $startDate =
              Get-Date `
                  $env:TASK_START_DATE

          $endDate =
              Get-Date `
                  $env:TASK_END_DATE

          $from =
              $startDate.
                  AddMinutes(-2).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ'
                  )

          $to =
              $endDate.
                  AddMinutes(15).
                  ToUniversalTime().
                  ToString(
                      'yyyy-MM-ddTHH:mm:ss.fffZ'
                  )

          $downloadCount =
              0

          foreach (
              $depository in
              $depositories
          ) {
              $depositoryId =
                  "$($depository.id)"

              if (-not $depositoryId) {
                  continue
              }

              $artifactsUrl = (
                  "$env:ONECX_URL/api/artifact/artifacts" +
                  "?depositoryId=$depositoryId" +
                  "&startDate=$from" +
                  "&endDate=$to"
              )

              try {
                  $artifactResponse =
                      Invoke-RestMethod `
                          -Method Get `
                          -Uri $artifactsUrl `
                          -Headers $headers `
                          -ErrorAction Stop
              }
              catch {
                  Write-Warning (
                      "Skipping artifact depository: " +
                      "$depositoryId"
                  )

                  continue
              }

              if ($artifactResponse.items) {
                  $artifacts =
                      @($artifactResponse.items)
              }
              else {
                  $artifacts =
                      @($artifactResponse)
              }

              foreach (
                  $artifact in
                  $artifacts
              ) {
                  $fileName =
                      "$($artifact.fileName)"

                  $extension =
                      "$($artifact.extension)".
                          TrimStart('.').
                          ToLowerInvariant()

                  if (
                      ($extension -ne 'atx') -and
                      ($fileName -notmatch '(?i)\.atx$')
                  ) {
                      continue
                  }

                  $artifactId =
                      "$($artifact.id)"

                  if (-not $artifactId) {
                      continue
                  }

                  if (-not $fileName) {
                      $fileName =
                          "$artifactId.atx"
                  }

                  $downloadUrl = (
                      "$env:ONECX_URL/api/artifact/artifacts/" +
                      "$artifactId/download"
                  )

                  $destination =
                      Join-Path `
                          $env:ATX_DIRECTORY `
                          $fileName

                  Invoke-WebRequest `
                      -Method Get `
                      -Uri $downloadUrl `
                      -Headers $headers `
                      -OutFile $destination `
                      -ErrorAction Stop

                  $downloadedFile =
                      Get-Item `
                          -LiteralPath $destination

                  if (
                      $downloadedFile.Length -eq 0
                  ) {
                      throw (
                          "Downloaded ATX is empty: " +
                          "$fileName"
                      )
                  }

                  Write-Host "Downloaded ATX: $fileName"

                  $downloadCount++
              }
          }

          if ($downloadCount -eq 0) {
              throw (
                  'No ATX report was found for ' +
                  'the current execution.'
              )
          }

          Write-Host (
              "Downloaded ATX reports: " +
              "$downloadCount"
          )

      # ============================================================
      # 9. BUILD JFROG PATH
      # ============================================================

      - name: Build JFrog destination
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $pathSegments = @(
              $env:CW_RELEASE
              $env:TARGET_ECU
              $env:CATEGORY
              $env:TEST_OR_VALIDATOR
              $env:RUN_TIMESTAMP
          )

          foreach ($segment in $pathSegments) {
              if (
                  $segment -notmatch
                  '^[A-Za-z0-9._-]+$'
              ) {
                  throw (
                      "Unsafe JFrog path segment: " +
                      "'$segment'"
                  )
              }
          }

          $targetPath = (
              'L2_Quality_Gate/' +
              ($pathSegments -join '/') +
              '/'
          )

          "JFROG_TARGET_PATH=$targetPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "JFrog target: $targetPath"

      # ============================================================
      # 10. UPLOAD ATX TO JFROG
      # ============================================================

      - name: Upload ATX report to JFrog
        shell: pwsh
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:JFROG_TOKEN) {
              throw 'JFROG_TOKEN is missing.'
          }

          $files =
              Get-ChildItem `
                  -LiteralPath $env:ATX_DIRECTORY `
                  -Filter '*.atx' `
                  -File

          if (-not $files) {
              throw (
                  'No ATX report is available ' +
                  'for JFrog upload.'
              )
          }

          foreach ($file in $files) {
              $uploadUrl = (
                  "$($env:JFROG_URL.TrimEnd('/'))/" +
                  "$env:JFROG_REPOSITORY/" +
                  "$env:JFROG_TARGET_PATH" +
                  "$($file.Name)"
              )

              Write-Host (
                  "Uploading to JFrog: " +
                  "$uploadUrl"
              )

              if ($env:JFROG_USER) {
                  curl.exe `
                      --fail-with-body `
                      --silent `
                      --show-error `
                      --request PUT `
                      --user "$($env:JFROG_USER):$($env:JFROG_TOKEN)" `
                      --header 'Content-Type: application/octet-stream' `
                      --upload-file "$($file.FullName)" `
                      "$uploadUrl"
              }
              else {
                  curl.exe `
                      --fail-with-body `
                      --silent `
                      --show-error `
                      --request PUT `
                      --header "Authorization: Bearer $env:JFROG_TOKEN" `
                      --header 'Content-Type: application/octet-stream' `
                      --upload-file "$($file.FullName)" `
                      "$uploadUrl"
              }

              if ($LASTEXITCODE -ne 0) {
                  throw (
                      "JFrog upload failed for " +
                      "$($file.Name)."
                  )
              }
          }

          $jfrogUrl = (
              "$($env:JFROG_URL.TrimEnd('/'))/" +
              "$env:JFROG_REPOSITORY/" +
              "$env:JFROG_TARGET_PATH"
          )

          "JFROG_REPORT_URL=$jfrogUrl" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "JFrog folder: $jfrogUrl"

      # ============================================================
      # 11. UPLOAD PIPELINE DIAGNOSTICS
      # ============================================================

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-${{ github.event.client_payload.jira_key }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 12. COMMENT ON JIRA
      # ============================================================

      - name: Comment result on Jira
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

        run: |
          if (
              (-not $env:JIRA_KEY) -or
              (-not $env:JIRA_EMAIL) -or
              (-not $env:JIRA_API_TOKEN)
          ) {
              Write-Warning (
                  'Jira key or credentials missing. ' +
                  'Skipping Jira comment.'
              )

              exit 0
          }

          if (
              '${{ job.status }}' -eq
              'success'
          ) {
              $status =
                  'COMPLETED'
          }
          else {
              $status =
                  'FAILED'
          }

          $githubRunUrl =
              'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          $commentText = (
              "L2 Quality Gate $status`n`n" +
              "Category: $env:CATEGORY`n" +
              "Test/Validator: $env:TEST_OR_VALIDATOR`n" +
              "CW Release: $env:CW_RELEASE`n" +
              "Target ECU: $env:TARGET_ECU`n" +
              "Test Bench: $env:TEST_BENCH`n" +
              "Project: $env:PROJECT_RELATIVE_PATH`n" +
              "Playbook ID: $env:TESTGUIDE_PLAYBOOK_ID`n" +
              "Task ID: $env:TESTGUIDE_TASK_ID`n" +
              "Verdict: $env:TESTGUIDE_VERDICT`n`n" +
              "GitHub Run:`n$githubRunUrl"
          )

          if ($env:JFROG_REPORT_URL) {
              $commentText += (
                  "`n`nJFrog Report:`n" +
                  "$env:JFROG_REPORT_URL"
              )
          }
          else {
              $commentText += (
                  "`n`nJFrog Report: " +
                  'Not uploaded because the execution failed.'
              )
          }

          $commentFile =
              Join-Path `
                  $env:RUNNER_TEMP `
                  'jira-comment.json'

          @{
              body =
                  $commentText
          } |
              ConvertTo-Json |
              Set-Content `
                  -LiteralPath $commentFile `
                  -Encoding utf8

          curl.exe `
              --fail-with-body `
              --silent `
              --show-error `
              --request POST `
              --user "$($env:JIRA_EMAIL):$($env:JIRA_API_TOKEN)" `
              --header 'Accept: application/json' `
              --header 'Content-Type: application/json' `
              --data-binary "@$commentFile" `
              "$env:JIRA_BASE_URL/rest/api/2/issue/$env:JIRA_KEY/comment"

          if ($LASTEXITCODE -ne 0) {
              Write-Warning 'Jira comment could not be posted.'
          }

      # ============================================================
      # 13. SUMMARY
      # ============================================================

      - name: Write execution summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## L2 Quality Gate

          - Jira: $env:JIRA_KEY
          - Selected Jira category: $env:CATEGORY_INPUT
          - Category: $env:CATEGORY
          - Test/Validator: $env:TEST_OR_VALIDATOR
          - CW Release: $env:CW_RELEASE
          - Target ECU: $env:TARGET_ECU
          - Test Bench: $env:TEST_BENCH
          - Project: $env:PROJECT_RELATIVE_PATH
          - Playbook ID: $env:TESTGUIDE_PLAYBOOK_ID
          - Task ID: $env:TESTGUIDE_TASK_ID
          - Verdict: $env:TESTGUIDE_VERDICT
          - JFrog path: $env:JFROG_TARGET_PATH
          - JFrog URL: $env:JFROG_REPORT_URL
          "@ |
              Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY `
                  -Append `
                  -Encoding utf8
