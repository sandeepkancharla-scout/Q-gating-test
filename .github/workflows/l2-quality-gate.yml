name: L2 Quality Gate - Jira Execution

on:
  repository_dispatch:
    types:
      - l2_execution

permissions:
  contents: read

env:
  ONECX_URL: https://testguide-ssp.onecx.vwgroup.com
  ONECX_PROJECT_ID: ${{ vars.ONECX_PROJECT_ID }}

  NETWORK_PLAYBOOK_ID: ${{ vars.NETWORK_PLAYBOOK_ID }}
  DIAGNOSTIC_PLAYBOOK_ID: ${{ vars.DIAGNOSTIC_PLAYBOOK_ID }}
  BOOTLOADER_PLAYBOOK_ID: ${{ vars.BOOTLOADER_PLAYBOOK_ID }}

  TESTGUIDE_WORKSPACE: C:\HIL\Testing\eeint-Test-Automation

  JFROG_URL: https://artifactory.sctmtrs.xyz/artifactory
  JFROG_REPOSITORY: eeint-report-files

  JIRA_BASE_URL: https://scoutmotors.atlassian.net

jobs:
  l2-quality-gate:
    name: L2 Quality Gate

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    concurrency:
      group: l2-quality-gate-${{ github.event.client_payload.test_bench }}
      cancel-in-progress: false

    steps:
      # ============================================================
      # 1. PARSE JIRA INPUTS
      # ============================================================

      - name: Parse Jira inputs
        shell: pwsh
        env:
          JIRA_KEY_RAW: ${{ github.event.client_payload.jira_key }}
          CATEGORY_RAW: ${{ github.event.client_payload.category }}
          CW_RELEASE_RAW: ${{ github.event.client_payload.cw_release }}
          TEST_BENCH_RAW: ${{ github.event.client_payload.test_bench }}
          TARGET_ECU_RAW: ${{ github.event.client_payload.target_ecu }}
          FLASH_ARCHIVE_RAW: ${{ github.event.client_payload.flash_archive_location }}
          RAL_FILE_RAW: ${{ github.event.client_payload.ral_file_location }}
          GIT_SUBMODULE_RAW: ${{ github.event.client_payload.git_submodule }}
          TEST_CASES_RAW: ${{ github.event.client_payload.test_cases }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Clean-Value {
              param($Value)

              if ($null -eq $Value) {
                  return ''
              }

              return (
                  "$Value" -replace '[\r\n]+', ' '
              ).Trim()
          }

          function Clean-Path {
              param($Value)

              if ($null -eq $Value) {
                  return ''
              }

              $result = (
                  "$Value" -replace '[\r\n]+', ''
              ).Trim()

              while (
                  $result.Length -ge 2 -and
                  $result.StartsWith('"') -and
                  $result.EndsWith('"')
              ) {
                  $result =
                      $result.Substring(
                          1,
                          $result.Length - 2
                      ).Trim()
              }

              return $result
          }

          function Set-WorkflowEnvironment {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Name,

                  [AllowEmptyString()]
                  [string]$Value
              )

              "$Name=$Value" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          $jiraKey =
              Clean-Value $env:JIRA_KEY_RAW

          $category =
              Clean-Value $env:CATEGORY_RAW

          $cwRelease =
              (
                  Clean-Value $env:CW_RELEASE_RAW
              ).ToUpperInvariant()

          $testBench =
              (
                  Clean-Value $env:TEST_BENCH_RAW
              ).ToLowerInvariant()

          $targetEcu =
              Clean-Value $env:TARGET_ECU_RAW

          $flashArchiveLocation =
              Clean-Path $env:FLASH_ARCHIVE_RAW

          $ralFileLocation =
              Clean-Path $env:RAL_FILE_RAW

          $gitSubmodule =
              Clean-Value $env:GIT_SUBMODULE_RAW

          $testCases =
              Clean-Value $env:TEST_CASES_RAW

          if (-not $jiraKey) {
              throw 'jira_key is missing.'
          }

          if (-not $category) {
              throw 'category is missing.'
          }

          if (-not $cwRelease) {
              throw 'cw_release is missing.'
          }

          if (-not $testBench) {
              throw 'test_bench is missing.'
          }

          if (-not $targetEcu) {
              throw 'target_ecu is missing.'
          }

          if ($cwRelease -notmatch '^CW[0-9]{2}$') {
              throw (
                  "Invalid CW release [$cwRelease]. " +
                  'Expected a value such as CW45.'
              )
          }

          if (
              $testBench -notin @(
                  'syshil1',
                  'syshil2'
              )
          ) {
              throw "Unsupported Test Bench [$testBench]."
          }

          switch ($category.ToLowerInvariant()) {
              'network_test' {
                  $category =
                      'Network_Test'
              }

              'network_testing' {
                  $category =
                      'Network_Test'
              }

              'diagnostic_test' {
                  $category =
                      'Diagnostic_Test'
              }

              'diagnostic_testing' {
                  $category =
                      'Diagnostic_Test'
              }

              'bootloader_compliance_test' {
                  $category =
                      'Bootloader_Compliance_Test'
              }

              default {
                  throw (
                      "Unsupported Jira category [$category]."
                  )
              }
          }

          if (
              $category -eq 'Diagnostic_Test' -and
              -not $ralFileLocation
          ) {
              throw (
                  'Diagnostic_Test requires ' +
                  'ral_file_location.'
              )
          }

          if (
              $category -eq
                  'Bootloader_Compliance_Test' -and
              -not $flashArchiveLocation
          ) {
              throw (
                  'Bootloader_Compliance_Test requires ' +
                  'flash_archive_location.'
              )
          }

          Set-WorkflowEnvironment `
              -Name 'JIRA_KEY' `
              -Value $jiraKey

          Set-WorkflowEnvironment `
              -Name 'CATEGORY_INPUT' `
              -Value $category

          Set-WorkflowEnvironment `
              -Name 'CW_RELEASE' `
              -Value $cwRelease

          Set-WorkflowEnvironment `
              -Name 'TEST_BENCH' `
              -Value $testBench

          Set-WorkflowEnvironment `
              -Name 'TARGET_ECU' `
              -Value $targetEcu

          Set-WorkflowEnvironment `
              -Name 'FLASH_ARCHIVE_LOCATION' `
              -Value $flashArchiveLocation

          Set-WorkflowEnvironment `
              -Name 'RAL_FILE_LOCATION' `
              -Value $ralFileLocation

          Set-WorkflowEnvironment `
              -Name 'GIT_SUBMODULE' `
              -Value $gitSubmodule

          Set-WorkflowEnvironment `
              -Name 'TEST_CASES' `
              -Value $testCases

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PARSED JIRA INPUTS'
          Write-Host '========================================'
          Write-Host "Jira Key      : $jiraKey"
          Write-Host "Category      : $category"
          Write-Host "CW Release    : $cwRelease"
          Write-Host "Test Bench    : $testBench"
          Write-Host "Target ECU    : $targetEcu"
          Write-Host "Flash Path    : $flashArchiveLocation"
          Write-Host "RAL Path      : $ralFileLocation"
          Write-Host "Git Submodule : $gitSubmodule"
          Write-Host "Test Cases    : $testCases"
          Write-Host '========================================'

      # ============================================================
      # 2. SELECT EXISTING PLAYBOOK
      #
      # The input paths are not validated or transferred.
      # They are passed as strings to TestGuide during execution.
      # ============================================================

      - name: Select existing TestGuide playbook
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          switch ($env:CATEGORY_INPUT) {
              'Network_Test' {
                  $category =
                      'network-testing'

                  $testPlanName =
                      'NetworkTest'

                  $playbookId =
                      $env:NETWORK_PLAYBOOK_ID

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Network-Test\NetworkTest.prj'
              }

              'Diagnostic_Test' {
                  $category =
                      'diagnostic-testing'

                  $testPlanName =
                      'DiagnosticTest'

                  $playbookId =
                      $env:DIAGNOSTIC_PLAYBOOK_ID

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Diagnostic-Test\DiagnosticTest.prj'
              }

              'Bootloader_Compliance_Test' {
                  $category =
                      'bootloader-compliance'

                  $testPlanName =
                      'BootloaderComplianceTest'

                  $playbookId =
                      $env:BOOTLOADER_PLAYBOOK_ID

                  $projectRelativePath =
                      'Packages\L2-Quality-Gate\ProjectGenerator\Bootloader-Compliance-Test\BootloaderComplianceTest.prj'
              }

              default {
                  throw (
                      "Unsupported category " +
                      "[$env:CATEGORY_INPUT]."
                  )
              }
          }

          if (-not $playbookId) {
              throw (
                  'Playbook ID is empty for category ' +
                  "[$env:CATEGORY_INPUT]."
              )
          }

          switch ($env:TEST_BENCH) {
              'syshil1' {
                  $resource =
                      'syshil1-labtest1'
              }

              'syshil2' {
                  $resource =
                      'syshil2-labtest2'
              }

              default {
                  throw (
                      "Unsupported test bench " +
                      "[$env:TEST_BENCH]."
                  )
              }
          }

          $workspace =
              $env:TESTGUIDE_WORKSPACE

          if (
              -not (
                  Test-Path `
                      -LiteralPath $workspace `
                      -PathType Container
              )
          ) {
              throw (
                  "TestGuide workspace does not exist: " +
                  "[$workspace]"
              )
          }

          $projectPath =
              Join-Path `
                  -Path $workspace `
                  -ChildPath $projectRelativePath

          if (
              -not (
                  Test-Path `
                      -LiteralPath $projectPath `
                      -PathType Leaf
              )
          ) {
              throw (
                  "Project does not exist: [$projectPath]"
              )
          }

          # IMPORTANT:
          # Do not use Test-Path, Get-Item, Get-Content, Copy-Item
          # or upload operations on RAL_FILE_LOCATION or
          # FLASH_ARCHIVE_LOCATION.
          #
          # Those values remain path strings only.

          $artifactRoot =
              Join-Path `
                  -Path $env:RUNNER_TEMP `
                  -ChildPath 'l2-artifacts'

          $atxDirectory =
              Join-Path `
                  -Path $artifactRoot `
                  -ChildPath 'atx'

          New-Item `
              -ItemType Directory `
              -Path $atxDirectory `
              -Force |
              Out-Null

          $runTimestamp =
              Get-Date `
                  -Format 'yyyy-MM-dd_HHmmss'

          $values = [ordered]@{
              CATEGORY =
                  $category

              TEST_PLAN_NAME =
                  $testPlanName

              TESTGUIDE_PLAYBOOK_ID =
                  "$playbookId"

              PROJECT_RELATIVE_PATH =
                  $projectRelativePath

              RESOURCE_NAME =
                  $resource

              ARTIFACT_ROOT =
                  $artifactRoot

              ATX_DIRECTORY =
                  $atxDirectory

              RUN_TIMESTAMP =
                  $runTimestamp
          }

          foreach ($item in $values.GetEnumerator()) {
              "$($item.Key)=$($item.Value)" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'SELECTED EXISTING PLAYBOOK'
          Write-Host '========================================'
          Write-Host "Category    : $category"
          Write-Host "Test Plan   : $testPlanName"
          Write-Host "Playbook ID : $playbookId"
          Write-Host "Target ECU  : $env:TARGET_ECU"

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              Write-Host (
                  'RAL path will be passed as a constant: ' +
                  "$env:RAL_FILE_LOCATION"
              )
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              Write-Host (
                  'Flash path will be passed as a constant: ' +
                  "$env:FLASH_ARCHIVE_LOCATION"
              )
          }

          Write-Host '========================================'

      # ============================================================
      # 3. EXECUTE EXISTING PLAYBOOK
      #
      # Only string constants are passed.
      # No RAL/HEX files are sent from the runner.
      # ============================================================

      - name: Execute selected TestGuide playbook
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToEcuTestPathExpression {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path
              )

              $cleanPath =
                  $Path.Trim().Trim('"')

              $escapedPath =
                  $cleanPath.Replace(
                      '\',
                      '\\'
                  )

              return (
                  '"' +
                  $escapedPath +
                  '"'
              )
          }

          if (-not $env:ONECX_AUTH_KEY) {
              throw 'ONECX_AUTH_KEY is missing.'
          }

          if (-not $env:ONECX_PROJECT_ID) {
              throw 'ONECX_PROJECT_ID is missing.'
          }

          if (-not $env:TESTGUIDE_PLAYBOOK_ID) {
              throw 'TESTGUIDE_PLAYBOOK_ID is missing.'
          }

          $executionParameters = @(
              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_TARGETECU'

                  value =
                      "'$($env:TARGET_ECU)'"
              },

              [ordered]@{
                  label =
                      'PROJECT_GENERATOR_CT'

                  value =
                      'True'
              }
          )

          if (
              $env:CATEGORY_INPUT -eq
              'Diagnostic_Test'
          ) {
              $ralExpression =
                  Convert-ToEcuTestPathExpression `
                      -Path $env:RAL_FILE_LOCATION

              $executionParameters +=
                  [ordered]@{
                      label =
                          'PROJECT_GENERATOR_RAL_FILE_PATH'

                      value =
                          $ralExpression
                  }
          }

          if (
              $env:CATEGORY_INPUT -eq
              'Bootloader_Compliance_Test'
          ) {
              $flashExpression =
                  Convert-ToEcuTestPathExpression `
                      -Path $env:FLASH_ARCHIVE_LOCATION

              $executionParameters +=
                  [ordered]@{
                      label =
                          'PROJECT_GENERATOR_BL_COMPLIANCE_FILE_PATH'

                      value =
                          $flashExpression
                  }
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $executeUrl = (
              "$env:ONECX_URL/api/v2/execution/playbook/" +
              "$env:TESTGUIDE_PLAYBOOK_ID/execute" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&checkLastExecution=true"
          )

          $body = @{
              parameters =
                  $executionParameters
          } |
              ConvertTo-Json -Depth 20

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TESTGUIDE EXECUTION INPUT'
          Write-Host '========================================'
          Write-Host "Playbook ID : $env:TESTGUIDE_PLAYBOOK_ID"
          Write-Host "Category    : $env:CATEGORY_INPUT"
          Write-Host "Target ECU  : $env:TARGET_ECU"
          Write-Host 'Constants:'

          Write-Host (
              $executionParameters |
                  ConvertTo-Json -Depth 20
          )

          Write-Host '========================================'

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $executeUrl `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $body `
                  -ErrorAction Stop

          $response |
              ConvertTo-Json -Depth 30 |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          -Path $env:ARTIFACT_ROOT `
                          -ChildPath 'execute-response.json'
                  ) `
                  -Encoding utf8

          $taskId =
              $null

          if ($response.taskIds) {
              $taskId =
                  @($response.taskIds)[0]
          }
          elseif ($response.taskId) {
              $taskId =
                  $response.taskId
          }
          elseif ($response.id) {
              $taskId =
                  $response.id
          }
          elseif (
              $response.data -and
              $response.data.taskIds
          ) {
              $taskId =
                  @($response.data.taskIds)[0]
          }
          elseif (
              $response.data -and
              $response.data.taskId
          ) {
              $taskId =
                  $response.data.taskId
          }

          if (-not $taskId) {
              throw (
                  'Execute API returned no execution task ID.'
              )
          }

          "TESTGUIDE_TASK_ID=$taskId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Execution task ID: $taskId"

      # ============================================================
      # 4. POLL EXECUTION TASK
      # ============================================================

      - name: Wait for TestGuide execution task
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $taskUrl = (
              "$env:ONECX_URL/api/v2/execution/task/" +
              "$env:TESTGUIDE_TASK_ID" +
              "?projectId=$env:ONECX_PROJECT_ID"
          )

          $completeStates = @(
              'FINISHED',
              'COMPLETED',
              'COMPLETE',
              'SUCCESS',
              'SUCCEEDED',
              'DONE',
              'ENDED'
          )

          $failureStates = @(
              'ABORTED',
              'ABORT',
              'ERROR',
              'FAILED',
              'FAILURE',
              'CANCELLED',
              'CANCELED'
          )

          $deadline =
              (Get-Date).AddMinutes(180)

          $attempt =
              0

          while ((Get-Date) -lt $deadline) {
              $attempt++

              $task =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $taskUrl `
                      -Headers $headers `
                      -ErrorAction Stop

              $state =
                  "$($task.state)".
                      Trim().
                      ToUpperInvariant()

              $verdict =
                  "$($task.aggregatedVerdict)".
                      Trim().
                      ToUpperInvariant()

              $stateInfo =
                  "$($task.stateInfo)".Trim()

              $startDate =
                  "$($task.startDate)".Trim()

              $endDate =
                  "$($task.endDate)".Trim()

              Write-Host (
                  "Attempt=$attempt " +
                  "State=$state " +
                  "Verdict=$verdict"
              )

              $task |
                  ConvertTo-Json -Depth 30 |
                  Set-Content `
                      -LiteralPath (
                          Join-Path `
                              -Path $env:ARTIFACT_ROOT `
                              -ChildPath 'execution-task-latest.json'
                      ) `
                      -Encoding utf8

              if (-not $state) {
                  Write-Host (
                      $task |
                          ConvertTo-Json -Depth 30
                  )

                  throw (
                      'Execution-task API returned no state. ' +
                      "Task=$env:TESTGUIDE_TASK_ID"
                  )
              }

              if ($state -in $failureStates) {
                  $safeStateInfo =
                      (
                          $stateInfo -replace
                          '[\r\n]+',
                          ' '
                      ).Trim()

                  "TESTGUIDE_STATE=$state" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_VERDICT=$verdict" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_MESSAGE=$safeStateInfo" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  throw (
                      "Execution ended. State=$state; " +
                      "Message=$safeStateInfo"
                  )
              }

              if (
                  ($state -in $completeStates) -or
                  $endDate
              ) {
                  if (-not $startDate) {
                      $startDate =
                          (Get-Date).
                              AddMinutes(-30).
                              ToUniversalTime().
                              ToString('o')
                  }

                  if (-not $endDate) {
                      $endDate =
                          (Get-Date).
                              ToUniversalTime().
                              ToString('o')
                  }

                  "TASK_START_DATE=$startDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TASK_END_DATE=$endDate" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_STATE=$state" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  "TESTGUIDE_VERDICT=$verdict" |
                      Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                  Write-Host ''
                  Write-Host '========================================'
                  Write-Host 'EXECUTION COMPLETE'
                  Write-Host '========================================'
                  Write-Host "State   : $state"
                  Write-Host "Verdict : $verdict"
                  Write-Host "Start   : $startDate"
                  Write-Host "End     : $endDate"
                  Write-Host '========================================'

                  exit 0
              }

              Start-Sleep -Seconds 15
          }

          throw (
              'Execution polling exceeded 180 minutes.'
          )

      # ============================================================
      # 5. FIND REPORT FOR THE FULL UTC DAY
      #
      # Confirmed endpoint:
      # /api/report/reports/history
      # ============================================================

      - name: Find TestGuide report
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:TASK_START_DATE) {
              throw 'TASK_START_DATE is missing.'
          }

          if (-not $env:TASK_END_DATE) {
              throw 'TASK_END_DATE is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PARSING EXECUTION DATES'
          Write-Host '========================================'
          Write-Host "Raw Start : $env:TASK_START_DATE"
          Write-Host "Raw End   : $env:TASK_END_DATE"
          Write-Host '========================================'

          try {
              $executionStart =
                  [System.DateTimeOffset]::Parse(
                      $env:TASK_START_DATE,
                      [System.Globalization.CultureInfo]::InvariantCulture,
                      [System.Globalization.DateTimeStyles]::AssumeUniversal
                  )
          }
          catch {
              throw (
                  'Unable to parse execution start date. ' +
                  "Value=[$env:TASK_START_DATE]; " +
                  "Error=$($_.Exception.Message)"
              )
          }

          $executionUtc =
              $executionStart.ToUniversalTime()

          $dayStart =
              [System.DateTimeOffset]::new(
                  $executionUtc.Year,
                  $executionUtc.Month,
                  $executionUtc.Day,
                  0,
                  0,
                  0,
                  [System.TimeSpan]::Zero
              )

          $dayEnd =
              $dayStart.AddDays(1)

          $historyStart =
              $dayStart.ToString(
                  'yyyy-MM-ddTHH:mm:ssZ',
                  [System.Globalization.CultureInfo]::InvariantCulture
              )

          $historyEnd =
              $dayEnd.ToString(
                  'yyyy-MM-ddTHH:mm:ssZ',
                  [System.Globalization.CultureInfo]::InvariantCulture
              )

          $encodedStart =
              [System.Uri]::EscapeDataString(
                  $historyStart
              )

          $encodedEnd =
              [System.Uri]::EscapeDataString(
                  $historyEnd
              )

          $historyUrl = (
              "$env:ONECX_URL/api/report/reports/history" +
              "?projectId=$env:ONECX_PROJECT_ID" +
              "&startDate=$encodedStart" +
              "&endDate=$encodedEnd" +
              "&offset=0" +
              "&limit=100"
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'FULL-DAY REPORT HISTORY LOOKUP'
          Write-Host '========================================'
          Write-Host "Test Plan : $env:TEST_PLAN_NAME"
          Write-Host "Start     : $historyStart"
          Write-Host "End       : $historyEnd"
          Write-Host "URL       : $historyUrl"
          Write-Host '========================================'

          $selectedReport =
              $null

          for (
              $attempt = 1;
              $attempt -le 20;
              $attempt++
          ) {
              $reports =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $historyUrl `
                      -Headers $headers `
                      -ErrorAction Stop

              $matchingReports =
                  @(
                      @($reports) |
                          Where-Object {
                              "$($_.status)".
                                  Trim().
                                  ToUpperInvariant() -eq
                                      'COMPLETE' -and

                              "$($_.testPlanName)".
                                  Trim() -eq
                                      "$env:TEST_PLAN_NAME"
                          }
                  )

              Write-Host (
                  "Report lookup attempt=$attempt " +
                  "Matching=$($matchingReports.Count)"
              )

              $rankedReports =
                  foreach ($report in $matchingReports) {
                      $reportExecutionDate =
                          [System.DateTimeOffset]::MinValue

                      $reportUploadDate =
                          [System.DateTimeOffset]::MinValue

                      if ($report.executionDate) {
                          $temporaryExecutionDate =
                              [System.DateTimeOffset]::MinValue

                          $executionParsed =
                              [System.DateTimeOffset]::TryParse(
                                  "$($report.executionDate)",
                                  [System.Globalization.CultureInfo]::InvariantCulture,
                                  [System.Globalization.DateTimeStyles]::AssumeUniversal,
                                  [ref]$temporaryExecutionDate
                              )

                          if ($executionParsed) {
                              $reportExecutionDate =
                                  $temporaryExecutionDate
                          }
                      }

                      if ($report.uploadDate) {
                          $temporaryUploadDate =
                              [System.DateTimeOffset]::MinValue

                          $uploadParsed =
                              [System.DateTimeOffset]::TryParse(
                                  "$($report.uploadDate)",
                                  [System.Globalization.CultureInfo]::InvariantCulture,
                                  [System.Globalization.DateTimeStyles]::AssumeUniversal,
                                  [ref]$temporaryUploadDate
                              )

                          if ($uploadParsed) {
                              $reportUploadDate =
                                  $temporaryUploadDate
                          }
                      }

                      $differenceSeconds =
                          :MaxValue

                      if (
                          $reportExecutionDate -ne
                          [System.DateTimeOffset]::MinValue
                      ) {
                          $differenceSeconds =
                              [System.Math]::Abs(
                                  (
                                      $reportExecutionDate -
                                      $executionStart
                                  ).TotalSeconds
                              )
                      }

                      [PSCustomObject]@{
                          Report =
                              $report

                          DifferenceSeconds =
                              $differenceSeconds

                          UploadDate =
                              $reportUploadDate
                      }
                  }

              $selectedWrapper =
                  $rankedReports |
                      Sort-Object `
                          -Property @(
                              @{
                                  Expression =
                                      'DifferenceSeconds'

                                  Ascending =
                                      $true
                              },
                              @{
                                  Expression =
                                      'UploadDate'

                                  Descending =
                                      $true
                              }
                          ) |
                      Select-Object -First 1

              if ($null -ne $selectedWrapper) {
                  $selectedReport =
                      $selectedWrapper.Report

                  Write-Host (
                      'Selected report difference: ' +
                      "$($selectedWrapper.DifferenceSeconds) seconds"
                  )

                  break
              }

              Start-Sleep -Seconds 15
          }

          if ($null -eq $selectedReport) {
              throw (
                  'No COMPLETE report found for ' +
                  "[$env:TEST_PLAN_NAME] on the execution day."
              )
          }

          $reportId =
              "$($selectedReport.reportId)".Trim()

          if (-not $reportId) {
              throw 'Selected report contains no reportId.'
          }

          "TESTGUIDE_REPORT_ID=$reportId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'REPORT FOUND'
          Write-Host '========================================'
          Write-Host "Report ID      : $reportId"
          Write-Host "Test Plan      : $($selectedReport.testPlanName)"
          Write-Host "Status         : $($selectedReport.status)"
          Write-Host "Execution Date : $($selectedReport.executionDate)"
          Write-Host "Upload Date    : $($selectedReport.uploadDate)"
          Write-Host "File Size      : $($selectedReport.fileSize)"
          Write-Host '========================================'

      # ============================================================
      # 6. START ATX EXPORT
      # ============================================================

      - name: Start ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:TESTGUIDE_REPORT_ID) {
              throw 'TESTGUIDE_REPORT_ID is missing.'
          }

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $exportUrl = (
              "$env:ONECX_URL/api/report/export/atx/" +
              "$env:TESTGUIDE_REPORT_ID" +
              "?projectId=$env:ONECX_PROJECT_ID"
          )

          $response =
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $exportUrl `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -ErrorAction Stop

          Write-Host (
              $response |
                  ConvertTo-Json -Depth 20
          )

          $exportTaskId =
              $null

          if (
              $response -is [string] -or
              $response -is [int] -or
              $response -is [long]
          ) {
              $exportTaskId =
                  "$response".Trim()
          }
          elseif ($response.taskId) {
              $exportTaskId =
                  "$($response.taskId)"
          }
          elseif ($response.id) {
              $exportTaskId =
                  "$($response.id)"
          }
          elseif (
              $response.data -and
              $response.data.taskId
          ) {
              $exportTaskId =
                  "$($response.data.taskId)"
          }
          elseif (
              $response.data -and
              $response.data.id
          ) {
              $exportTaskId =
                  "$($response.data.id)"
          }

          if (-not $exportTaskId) {
              throw (
                  'ATX export response contains no task ID.'
              )
          }

          "ATX_EXPORT_TASK_ID=$exportTaskId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "ATX export task ID: $exportTaskId"

      # ============================================================
      # 7. POLL ATX EXPORT
      # ============================================================

      - name: Wait for ATX export
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/json'
          }

          $statusUrl = (
              "$env:ONECX_URL/api/report/export/atx/" +
              "$env:ATX_EXPORT_TASK_ID/status" +
              "?projectId=$env:ONECX_PROJECT_ID"
          )

          $deadline =
              (Get-Date).AddMinutes(30)

          $attempt =
              0

          while ((Get-Date) -lt $deadline) {
              $attempt++

              $response =
                  Invoke-RestMethod `
                      -Method Get `
                      -Uri $statusUrl `
                      -Headers $headers `
                      -ErrorAction Stop

              if ($response -is [string]) {
                  $state =
                      "$response".
                          Trim().
                          ToUpperInvariant()
              }
              elseif ($response.state) {
                  $state =
                      "$($response.state)".
                          Trim().
                          ToUpperInvariant()
              }
              elseif ($response.status) {
                  $state =
                      "$($response.status)".
                          Trim().
                          ToUpperInvariant()
              }
              else {
                  $state =
                      ''
              }

              Write-Host (
                  "ATX Attempt=$attempt State=$state"
              )

              if (
                  $state -in @(
                      'FINISHED',
                      'COMPLETE',
                      'COMPLETED',
                      'SUCCESS',
                      'SUCCEEDED',
                      'DONE'
                  )
              ) {
                  exit 0
              }

              if (
                  $state -in @(
                      'FAILED',
                      'FAILURE',
                      'ERROR',
                      'ABORTED',
                      'CANCELLED',
                      'CANCELED'
                  )
              ) {
                  throw "ATX export failed. State=$state"
              }

              if (-not $state) {
                  throw (
                      'Unable to determine ATX export state. ' +
                      (
                          $response |
                              ConvertTo-Json `
                                  -Compress `
                                  -Depth 20
                      )
                  )
              }

              Start-Sleep -Seconds 5
          }

          throw 'ATX export polling exceeded 30 minutes.'

      # ============================================================
      # 8. DOWNLOAD GENERATED ATX
      # ============================================================

      - name: Download generated ATX
        shell: pwsh
        env:
          ONECX_AUTH_KEY: ${{ secrets.ONECX_AUTH_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
              'TestGuide-AuthKey' =
                  $env:ONECX_AUTH_KEY

              Accept =
                  'application/octet-stream'
          }

          $downloadUrl = (
              "$env:ONECX_URL/api/report/export/atx/" +
              "$env:ATX_EXPORT_TASK_ID/download" +
              "?projectId=$env:ONECX_PROJECT_ID"
          )

          $fileName = (
              "$env:TEST_PLAN_NAME" +
              "_" +
              "$env:TARGET_ECU" +
              "_" +
              "$env:RUN_TIMESTAMP" +
              ".atx"
          )

          $destination =
              Join-Path `
                  -Path $env:ATX_DIRECTORY `
                  -ChildPath $fileName

          Invoke-WebRequest `
              -Method Get `
              -Uri $downloadUrl `
              -Headers $headers `
              -OutFile $destination `
              -ErrorAction Stop

          $file =
              Get-Item `
                  -LiteralPath $destination

          if ($file.Length -eq 0) {
              throw 'Downloaded ATX file is empty.'
          }

          "ATX_FILE_PATH=$destination" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          "ATX_FILE_NAME=$fileName" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Downloaded ATX: $destination"

      # ============================================================
      # 9. BUILD JFROG DESTINATION
      # ============================================================

      - name: Build JFrog destination
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          function Convert-ToSafeSegment {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Value
              )

              $safe =
                  $Value.Trim()

              $safe =
                  $safe -replace '[\\/:*?"<>|]', '_'

              $safe =
                  $safe -replace '\s+', '_'

              $safe =
                  $safe.Trim('.')

              if (-not $safe) {
                  throw "Invalid JFrog segment: [$Value]"
              }

              return $safe
          }

          $targetPath = (
              'L2_Quality_Gate/' +
              (
                  Convert-ToSafeSegment `
                      -Value $env:CW_RELEASE
              ) +
              '/' +
              (
                  Convert-ToSafeSegment `
                      -Value $env:TARGET_ECU
              ) +
              '/' +
              (
                  Convert-ToSafeSegment `
                      -Value $env:CATEGORY
              ) +
              '/' +
              (
                  Convert-ToSafeSegment `
                      -Value $env:TEST_PLAN_NAME
              ) +
              '/' +
              (
                  Convert-ToSafeSegment `
                      -Value $env:RUN_TIMESTAMP
              ) +
              '/'
          )

          "JFROG_TARGET_PATH=$targetPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "JFrog target: $targetPath"

      # ============================================================
      # 10. UPLOAD ONLY THE GENERATED ATX TO JFROG
      # ============================================================

      - name: Upload generated ATX to JFrog
        shell: pwsh
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:JFROG_TOKEN) {
              throw 'JFROG_TOKEN is missing.'
          }

          $file =
              Get-Item `
                  -LiteralPath $env:ATX_FILE_PATH `
                  -ErrorAction Stop

          $segments =
              $env:JFROG_TARGET_PATH.
                  Trim('/').
                  Split('/') |
                  ForEach-Object {
                      [System.Uri]::EscapeDataString(
                          $_
                      )
                  }

          $encodedTarget =
              $segments -join '/'

          $encodedFileName =
              [System.Uri]::EscapeDataString(
                  $file.Name
              )

          $uploadUrl = (
              "$($env:JFROG_URL.TrimEnd('/'))/" +
              "$env:JFROG_REPOSITORY/" +
              "$encodedTarget/" +
              "$encodedFileName"
          )

          if ($env:JFROG_USER) {
              curl.exe `
                  --fail-with-body `
                  --silent `
                  --show-error `
                  --request PUT `
                  --user "$($env:JFROG_USER):$($env:JFROG_TOKEN)" `
                  --header 'Content-Type: application/octet-stream' `
                  --upload-file "$($file.FullName)" `
                  "$uploadUrl"
          }
          else {
              curl.exe `
                  --fail-with-body `
                  --silent `
                  --show-error `
                  --request PUT `
                  --header "Authorization: Bearer $env:JFROG_TOKEN" `
                  --header 'Content-Type: application/octet-stream' `
                  --upload-file "$($file.FullName)" `
                  "$uploadUrl"
          }

          if ($LASTEXITCODE -ne 0) {
              throw (
                  'JFrog upload failed. ' +
                  "Curl exit code=$LASTEXITCODE"
              )
          }

          $folderUrl = (
              "$($env:JFROG_URL.TrimEnd('/'))/" +
              "$env:JFROG_REPOSITORY/" +
              "$encodedTarget/"
          )

          "JFROG_FILE_URL=$uploadUrl" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          "JFROG_FOLDER_URL=$folderUrl" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "JFrog ATX URL: $uploadUrl"

      # ============================================================
      # 11. ADD JFROG ATX LOCATION TO JIRA
      # ============================================================

      - name: Add ATX location to Jira
        shell: pwsh
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:JIRA_KEY) {
              throw 'JIRA_KEY is missing.'
          }

          if (-not $env:JIRA_EMAIL) {
              throw 'JIRA_EMAIL is missing.'
          }

          if (-not $env:JIRA_API_TOKEN) {
              throw 'JIRA_API_TOKEN is missing.'
          }

          if (-not $env:JFROG_FILE_URL) {
              throw 'JFROG_FILE_URL is missing.'
          }

          $runUrl =
              'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          $commentText = (
              "L2 Quality Gate execution completed.`n`n" +
              "Category: $env:CATEGORY`n" +
              "Test Plan: $env:TEST_PLAN_NAME`n" +
              "CW Release: $env:CW_RELEASE`n" +
              "Target ECU: $env:TARGET_ECU`n" +
              "Test Bench: $env:TEST_BENCH`n`n" +
              "Playbook ID: $env:TESTGUIDE_PLAYBOOK_ID`n" +
              "Execution Task ID: $env:TESTGUIDE_TASK_ID`n" +
              "Execution State: $env:TESTGUIDE_STATE`n" +
              "Execution Verdict: $env:TESTGUIDE_VERDICT`n" +
              "Report ID: $env:TESTGUIDE_REPORT_ID`n" +
              "ATX Export Task ID: $env:ATX_EXPORT_TASK_ID`n`n" +
              "JFrog ATX file:`n" +
              "$env:JFROG_FILE_URL`n`n" +
              "JFrog folder:`n" +
              "$env:JFROG_FOLDER_URL`n`n" +
              "GitHub run:`n" +
              "$runUrl"
          )

          $commentFile =
              Join-Path `
                  -Path $env:RUNNER_TEMP `
                  -ChildPath 'jira-atx-comment.json'

          @{
              body =
                  $commentText
          } |
              ConvertTo-Json -Depth 10 |
              Set-Content `
                  -LiteralPath $commentFile `
                  -Encoding utf8

          $jiraUrl = (
              "$($env:JIRA_BASE_URL.TrimEnd('/'))/" +
              "rest/api/2/issue/" +
              "$env:JIRA_KEY/comment"
          )

          curl.exe `
              --fail-with-body `
              --silent `
              --show-error `
              --request POST `
              --user "$($env:JIRA_EMAIL):$($env:JIRA_API_TOKEN)" `
              --header 'Accept: application/json' `
              --header 'Content-Type: application/json' `
              --data-binary "@$commentFile" `
              "$jiraUrl"

          if ($LASTEXITCODE -ne 0) {
              throw (
                  'Jira comment failed. ' +
                  "Curl exit code=$LASTEXITCODE"
              )
          }

          Write-Host "Jira comment added to $env:JIRA_KEY."

      # ============================================================
      # 12. RETAIN GENERATED ATX AND API RESPONSES
      # ============================================================

      - name: Upload ATX and diagnostics to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-atx-${{ github.event.client_payload.jira_key }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: 30
